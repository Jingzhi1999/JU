<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JU 我的局 R2 · 十个艺术指导方向</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style id="ju-fonts">/*@fonts*/</style>
<style>/*@shell-css*/</style>
<script>/*@preact*/</script>
<script>/*@runtime*/</script>
<script>/*@data*/</script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-ju">JU</span><span class="brand-t">我的局 R2 · 十个艺术指导方向</span></div>
  <nav class="tabs" aria-label="评审视图">
    <button type="button" class="tab on" data-view="overview">总览</button>
    <button type="button" class="tab" data-view="concept">方案</button>
    <button type="button" class="tab" data-view="compare">比较</button>
    <button type="button" class="tab" data-view="appendix">附录</button>
  </nav>
  <div class="top-right"><span class="hint">同一位用户 · 同一组活动与状态 · 每套数据独立 · 评审控件都在手机画面外</span></div>
</header>
<main>
  <section class="view view-overview on" id="v-overview">
    <p class="scope" id="scope"></p>
    <p class="lead">十套方案的真实画面，按同一业务状态渲染四台：参加者默认首屏 · 局主默认首屏 · 一个普通局内详情（已出票待撕）· 一个关键管理状态（出席记录）。点击任意一套进入原尺寸操作（评审面板在手机外）。</p>
    <div class="ov-grid" id="ov-grid"></div>
  </section>
  <section class="view view-concept" id="v-concept">
    <aside class="rail" id="rail"></aside>
    <div class="stage-wrap" id="stage-wrap"><p class="lead stage-empty" id="stage-empty">（本次构建不含任何方案源文件）</p></div>
  </section>
  <section class="view view-compare" id="v-compare">
    <div class="cmp-bar">
      <label>范围 <select id="cmp-scope"><option value="pick">挑选 2–3 套</option><option value="all">全部十套</option></select></label>
      <label class="pick">A <select id="cmp-a"></select></label>
      <label class="pick">B <select id="cmp-b"></select></label>
      <label class="pick">C <select id="cmp-c"><option value="">（无）</option></select></label>
      <label>同一状态 <select id="cmp-state"></select></label>
      <button type="button" class="btn" id="cmp-apply">同时跳转</button>
      <label>同步点击 <input type="text" id="cmp-act" placeholder='data-act（如 tear）或选择器' spellcheck="false"></label>
      <button type="button" class="btn" id="cmp-click">点击全部舞台</button>
      <button type="button" class="btn" id="cmp-reset">全部重置</button>
      <span class="sep"></span>
      <label>尺寸 <select id="cmp-size"><option value="390,844">390×844</option><option value="360,780">360×780</option><option value="375,812">375×812</option><option value="430,932">430×932</option></select></label>
      <button type="button" class="btn" id="cmp-speed1">1×</button>
      <button type="button" class="btn" id="cmp-speed05">0.5×</button>
      <label class="chk"><input type="checkbox" id="cmp-anon" checked> 匿名（隐去方案名 / 说明）</label>
      <label class="chk"><input type="checkbox" id="cmp-gray"> 灰度检查</label>
      <label class="chk"><input type="checkbox" id="cmp-rm"> 减少动态</label>
      <label class="chk"><input type="checkbox" id="cmp-panels"> 显示各套面板</label>
    </div>
    <p class="lead cmp-lead">差异三道检查：同尺寸、同数据、匿名并排；临时灰度确认差异不只来自颜色；用「同一状态」切到同一段流程比较空间与编排，再用「同步点击」对所有舞台做同一真实动作看正常速度的运动。切换组合时离开的实例被卸载（定时器清零、动画取消）。</p>
    <p class="cmp-log" id="cmp-log"></p>
    <div class="cmp-stages" id="cmp-stages"></div>
  </section>
  <section class="view view-appendix" id="v-appendix">
    <nav class="apx-nav" id="apx-nav"></nav>
    <article class="apx-doc" id="apx-doc"></article>
  </section>
</main>
<script>/*@shell-js*/</script>
</body>
</html>
