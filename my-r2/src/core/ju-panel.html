<aside class="ju-panel" aria-label="评审面板">
  <div class="ju-panel-head"><span class="ju-panel-code">{{panel.code}}</span><span class="ju-panel-name">{{panel.name}}</span></div>
  <p class="ju-panel-line">{{panel.line}}</p>
  <div class="ju-panel-sec">动效</div>
  <div class="ju-panel-row">
    <button type="button" class="ju-btn {{panel.speed1}}" onClick="{{panel.setSpeed1}}">1×</button>
    <button type="button" class="ju-btn {{panel.speedHalf}}" onClick="{{panel.setSpeedHalf}}">0.5×</button>
    <button type="button" class="ju-btn {{panel.pausedOn}}" onClick="{{panel.togglePause}}">暂停</button>
    <button type="button" class="ju-btn {{panel.rmOn}}" onClick="{{panel.toggleRM}}">减少动态</button>
    <button type="button" class="ju-btn ju-btn-replay {{panel.replayCls}}" onClick="{{panel.replay}}">重播上一动效</button>
  </div>
  <label class="ju-scrub"><span>关键帧</span><input type="range" min="0" max="100" value="{{panel.scrub}}" onPointerDown="{{panel.onScrub}}" onInput="{{panel.onScrub}}" onChange="{{panel.onScrub}}"><button type="button" class="ju-btn ju-btn-mini" onClick="{{panel.endScrub}}">释放</button></label>
  <p class="ju-panel-notes">{{panel.rmSysLine}}</p>
  <div class="ju-panel-sec">尺寸</div>
  <div class="ju-panel-row">
    <sc-for list="{{panel.sizes}}" as="z" hint-placeholder-count="4"><button type="button" class="ju-btn {{z.cls}}" onClick="{{z.go}}">{{z.label}}</button></sc-for>
    <button type="button" class="ju-btn {{panel.wFit}}" onClick="{{panel.setFit}}" title="手机高度跟随浏览器窗口（真实重排，不缩放），用于较矮的屏幕">适应窗口高度{{panel.fitLabel}}</button>
    <button type="button" class="ju-btn {{panel.kbOn}}" onClick="{{panel.toggleKb}}">键盘 300px</button>
    <button type="button" class="ju-btn {{panel.safeOn}}" onClick="{{panel.toggleSafe}}">安全区</button>
    <button type="button" class="ju-btn {{panel.zoomOn}}" onClick="{{panel.toggleZoom}}">文字 115%</button>
  </div>
  <div class="ju-panel-sec">环境</div>
  <div class="ju-panel-row">
    <sc-for list="{{panel.skins}}" as="v" hint-placeholder-count="3"><button type="button" class="ju-btn {{v.cls}}" onClick="{{v.go}}">{{v.label}}</button></sc-for>
  </div>
  <div class="ju-panel-sec">状态索引</div>
  <sc-for list="{{panel.groups}}" as="g" hint-placeholder-count="3">
    <div class="ju-idx-group">
      <div class="ju-idx-title">{{g.title}}</div>
      <div class="ju-idx-list">
        <sc-for list="{{g.items}}" as="e" hint-placeholder-count="4"><button type="button" class="ju-idx {{e.cls}}" onClick="{{e.go}}">{{e.label}}</button></sc-for>
      </div>
    </div>
  </sc-for>
  <div class="ju-panel-sec">演示数据</div>
  <div class="ju-panel-row">
    <sc-for list="{{panel.variants}}" as="v" hint-placeholder-count="4"><button type="button" class="ju-btn {{v.cls}}" onClick="{{v.go}}">{{v.label}}</button></sc-for>
    <button type="button" class="ju-btn ju-btn-reset" onClick="{{panel.reset}}">重置本套</button>
    <button type="button" class="ju-btn {{panel.failArmed}}" onClick="{{panel.armFail}}">下一次写入失败</button>
    <button type="button" class="ju-btn {{panel.copyFailArmed}}" onClick="{{panel.armCopyFail}}">下一次复制失败</button>
  </div>
  <div class="ju-panel-sec">时钟</div>
  <div class="ju-panel-row">
    <button type="button" class="ju-btn" onClick="{{panel.advance5}}">+5 分钟</button>
    <button type="button" class="ju-btn" onClick="{{panel.advance60}}">+1 小时</button>
    <button type="button" class="ju-btn {{panel.nextCls}}" onClick="{{panel.advanceNext}}">到最近到期</button>
    <button type="button" class="ju-btn" onClick="{{panel.advance24}}">+24 小时</button>
    <button type="button" class="ju-btn ju-btn-mini" onClick="{{panel.resetClock}}">回到演示时刻</button>
  </div>
  <p class="ju-panel-notes ju-clock-line">{{panel.clockLine}}
{{panel.nextLine}}
{{panel.clockNote}}</p>
  <div class="ju-panel-sec">三个核心动作</div>
  <ol class="ju-motions"><sc-for list="{{panel.motions}}" as="m" hint-placeholder-count="3"><li>{{m}}</li></sc-for></ol>
  <p class="ju-panel-notes ju-motion-notes">{{panel.notes}}</p>
</aside>
