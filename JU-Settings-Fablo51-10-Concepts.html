<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JU 设置 · 十套视觉动效方案</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>:root{--bg:#ececef;--ink:#141416;--muted:#6b6b72;--line:rgba(0,0,0,.1);--paper:#fff;--accent:#4a5ad6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:24px;padding:10px 20px;background:rgba(236,236,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-ju{font:700 20px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.06em}
.brand-t{font-weight:500}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.06);padding:3px;border-radius:10px}
.tab{appearance:none;border:0;background:transparent;padding:6px 14px;border-radius:8px;font:inherit;cursor:pointer;color:var(--muted)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.top-right{margin-left:auto;color:var(--muted);font-size:12px}
main{min-height:calc(100vh - 54px)}
.view{display:none}.view.on{display:block}
.lead{margin:0;padding:18px 24px 6px;color:var(--muted);max-width:1100px}
/* overview */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:18px;padding:16px 24px 40px}
.ov-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s}
.ov-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px -18px rgba(0,0,0,.4)}
.ov-head{display:flex;align-items:baseline;gap:10px}
.ov-code{font:500 11px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--muted)}
.ov-name{font-size:17px;font-weight:600}
.ov-line{color:var(--muted);font-size:12.5px;margin:0}
.ov-phones{display:flex;gap:12px;justify-content:center}
.ov-ph{position:relative;width:195px;height:422px;overflow:hidden;border-radius:19px;background:#000;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.ov-ph .ph-host{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.ov-ph .ph-label{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px;pointer-events:none}
.ov-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.ov-foot .btn{padding:6px 12px}
/* concept view */
.view-concept{display:none;grid-template-columns:200px 1fr}
.view-concept.on{display:grid}
.rail{position:sticky;top:54px;align-self:start;height:calc(100vh - 54px);overflow:auto;padding:14px 10px;border-right:1px solid var(--line);background:rgba(255,255,255,.5)}
.rail button{display:block;width:100%;text-align:left;appearance:none;border:0;background:transparent;padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;color:var(--ink)}
.rail button .c{font:500 10px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--muted);display:block;margin-bottom:2px}
.rail button.on{background:var(--ink);color:#fff}.rail button.on .c{color:#bbb}
.stage-wrap{padding:16px 20px 40px;overflow:auto}
.stage-host{display:none}.stage-host.on{display:block}
/* compare */
.cmp-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.5)}
.cmp-bar label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.cmp-bar select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;max-width:260px}
.sep{width:1px;height:22px;background:var(--line)}
.btn{appearance:none;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cmp-stages{display:flex;gap:20px;padding:20px 24px 40px;overflow:auto;align-items:flex-start}
.cmp-host{flex:0 0 auto}
.cmp-host.nopanel{width:430px;overflow:hidden}
/* appendix */
.apx-nav{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px;border-bottom:1px solid var(--line)}
.apx-tab{appearance:none;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
.apx-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.apx-doc{max-width:1400px;padding:20px 24px 60px;font-size:13.5px}
.apx-doc h1{font-size:22px;margin:18px 0 10px}.apx-doc h2{font-size:18px;margin:26px 0 8px}.apx-doc h3{font-size:15px;margin:20px 0 6px}.apx-doc h4{font-size:14px;margin:16px 0 4px}
.apx-doc table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:12.5px;background:#fff}
.apx-doc th,.apx-doc td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.apx-doc th{background:#f3f3f5}
.apx-doc code{font-family:"DM Mono",ui-monospace,monospace;font-size:12px;background:rgba(0,0,0,.05);padding:1px 4px;border-radius:4px}
.apx-doc pre{background:#fff;border:1px solid var(--line);padding:10px;border-radius:8px;overflow:auto;font-size:12px}
.apx-doc a{color:var(--accent)}
.apx-doc p{margin:6px 0}
@media (max-width:900px){.view-concept.on{display:block}.rail{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}.rail button{width:auto}.top{gap:10px;flex-wrap:wrap}.top-right{display:none}}
</style>

<script>window.__JUS_SOURCES={"SC05":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>SC05 冰箱门\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Long+Cang&display=swap\">\n\u003cstyle>\nbody{margin:0}\n/* shared review panel — lives outside the phone frame, never inside the product UI */\n.ju-stage{display:flex;align-items:flex-start;gap:28px;padding:20px;box-sizing:border-box;background:#e9e9ec;font-family:\"Noto Sans SC\",-apple-system,\"PingFang SC\",sans-serif;width:780px;min-height:884px}\n.ju-phone{width:390px;height:844px;flex:0 0 390px;position:relative;overflow:hidden;border-radius:38px;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 20px 50px -24px rgba(0,0,0,.45);background:#000;contain:layout paint}\n.ju-panel{flex:1 1 auto;min-width:0;max-height:844px;overflow:auto;background:#f6f6f7;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:14px 14px 18px;color:#1c1c1e;font-size:12px;line-height:1.5;box-sizing:border-box}\n.ju-panel-head{display:flex;align-items:baseline;gap:8px}\n.ju-panel-code{font:600 11px/1 \"DM Mono\",ui-monospace,monospace;letter-spacing:.08em;color:#6b6b70}\n.ju-panel-name{font-size:15px;font-weight:600}\n.ju-panel-line{margin:4px 0 10px;color:#55555a}\n.ju-panel-sec{font:600 10px/1 \"DM Mono\",ui-monospace,monospace;letter-spacing:.12em;color:#8a8a90;margin:14px 0 6px;text-transform:uppercase}\n.ju-panel-row{display:flex;flex-wrap:wrap;gap:6px}\n.ju-btn{appearance:none;border:1px solid rgba(0,0,0,.14);background:#fff;color:#1c1c1e;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;line-height:1.2;cursor:pointer;min-height:30px}\n.ju-btn.on{background:#1c1c1e;color:#fff;border-color:#1c1c1e}\n.ju-btn-mini{padding:4px 8px;min-height:24px}\n.ju-btn-replay{border-style:dashed}\n.ju-btn-reset{border-color:#c2364c;color:#c2364c}\n.ju-scrub{display:flex;align-items:center;gap:8px;margin-top:8px;color:#55555a}\n.ju-scrub input{flex:1 1 auto;min-width:0}\n.ju-idx-group{margin-bottom:8px}\n.ju-idx-title{font-size:11px;color:#8a8a90;margin-bottom:4px}\n.ju-idx-list{display:flex;flex-wrap:wrap;gap:4px}\n.ju-idx{appearance:none;border:1px solid rgba(0,0,0,.1);background:#fff;border-radius:6px;padding:4px 8px;font:inherit;font-size:11.5px;line-height:1.3;cursor:pointer;color:#2c2c30;min-height:26px}\n.ju-idx.on{background:#4a5ad6;border-color:#4a5ad6;color:#fff}\n.ju-motions{margin:0;padding-left:18px;color:#2c2c30}\n.ju-motions li{margin-bottom:4px}\n.ju-panel-notes{margin:10px 0 0;color:#55555a;white-space:pre-line}\n/* standalone-only hooks (never match inside the Design canvas, where there is no shadow host) */\n:host(.preview) .ju-stage{padding:0;background:transparent;width:390px;min-height:844px;gap:0}\n:host(.preview) .ju-phone{border-radius:0;box-shadow:none}\n:host(.nopanel) .ju-stage{width:430px;padding:20px}\n\n.ju-panel-tag{font-size:11px;color:#8a8a90;align-self:center;margin-right:2px}\n\n/* ju-fx.css — shared effect primitives. Concepts override colours, edges, durations and composition.\n   All durations multiply by --k (1 = normal, 2 = 0.5× speed); .scrub holds animations at --frame (0..1). */\n@property --fx-r { syntax: '\u003cpercentage>'; inherits: false; initial-value: 0%; }\n@property --fx-ink { syntax: '\u003cpercentage>'; inherits: false; initial-value: 0%; }\n/* ---- burn (v2): the face is masked by an SVG hole whose edge is roughened by feTurbulence (text stays crisp);\n   an SVG overlay strokes the ember ring just outside the hole. Markup pattern (ids must be unique per ticket):\n   \u003cdiv class=\"fx-burn burning\" style=\"--fx-mask:url(#hole-ID)\"> …face…\n     \u003csvg class=\"fx-burn-svg\" viewBox=\"0 0 W H\" preserveAspectRatio=\"none\">\u003cdefs>\u003cmask id=\"hole-ID\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"W\" height=\"H\">\u003crect width=\"W\" height=\"H\" fill=\"#fff\"/>\u003ccircle class=\"fx-hole\" cx=\"X\" cy=\"Y\" r=\"0\" fill=\"#000\" filter=\"url(#fx-rough-strong)\"/>\u003c/mask>\u003c/defs>\n       \u003ccircle class=\"fx-ember\" cx=\"X\" cy=\"Y\" r=\"0\" fill=\"none\" stroke=\"url(#fx-ember-grad)\" filter=\"url(#fx-rough-strong)\"/>\u003c/svg>\u003c/div>\n   W/H in px of the face; --fx-reach = the radius that clears the whole face (≈ diagonal). ---- */\n.fx-burn{position:relative;--fx-dur:2600ms;--fx-reach:520px}\n.fx-burn .fx-burn-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}\n/* anything INSIDE the masked element is masked too: put ash / fragments in a sibling layer, not inside .fx-burn */\n.fx-burn .fx-hole,.fx-burn .fx-ember{r:0}\n.fx-burn.burning{-webkit-mask:var(--fx-mask);mask:var(--fx-mask)}\n.fx-burn.burning .fx-hole{animation:fx-hole calc(var(--fx-dur) * var(--k,1)) cubic-bezier(.3,.05,.55,1) forwards}\n.fx-burn.burning .fx-ember{stroke-width:14px;animation:fx-hole calc(var(--fx-dur) * var(--k,1)) cubic-bezier(.3,.05,.55,1) forwards,fx-ember-fade calc(var(--fx-dur) * var(--k,1)) linear forwards}\n.fx-burn.burnt{opacity:0;visibility:hidden}\n@keyframes fx-hole{0%{r:0}10%{r:calc(var(--fx-reach) * .05)}100%{r:var(--fx-reach)}}\n@keyframes fx-ember-fade{0%{opacity:1}85%{opacity:1}100%{opacity:0}}\n.scrub .fx-burn.burning .fx-hole,.scrub .fx-burn.burning .fx-ember{animation-play-state:paused!important;animation-delay:calc(-1 * var(--frame,0) * var(--fx-dur) * var(--k,1))!important}\n/* ---- print: paper emerges from a slot in roller steps; ink is revealed slightly behind the leading edge ---- */\n.fx-printer{position:relative;overflow:hidden}\n.fx-print-paper{--fx-dur:2000ms;transform:translateY(-102%);animation:fx-print calc(var(--fx-dur) * var(--k,1)) linear forwards;-webkit-mask:linear-gradient(#000 var(--fx-ink),transparent calc(var(--fx-ink) + 8%));mask:linear-gradient(#000 var(--fx-ink),transparent calc(var(--fx-ink) + 8%))}\n@keyframes fx-print{0%{transform:translateY(-102%);--fx-ink:0%}14%{transform:translateY(-86%);--fx-ink:12%}22%{transform:translateY(-84%);--fx-ink:16%}40%{transform:translateY(-52%);--fx-ink:46%}48%{transform:translateY(-50%);--fx-ink:50%}70%{transform:translateY(-12%);--fx-ink:84%}78%{transform:translateY(-10%);--fx-ink:88%}92%{transform:translateY(1.5%);--fx-ink:100%}100%{transform:translateY(0);--fx-ink:110%}}\n.scrub .fx-print-paper{animation-play-state:paused!important;animation-delay:calc(-1 * var(--frame,0) * var(--fx-dur) * var(--k,1))!important}\n/* ---- stamp: ink lands from above with a small overshoot; a bleed blur settles ---- */\n.fx-stamp{--fx-dur:520ms;animation:fx-stamp calc(var(--fx-dur) * var(--k,1)) cubic-bezier(.2,1.2,.3,1) both;transform-origin:50% 50%}\n@keyframes fx-stamp{0%{transform:scale(1.8) rotate(-8deg);opacity:0;filter:blur(2px)}55%{transform:scale(.96) rotate(1deg);opacity:1;filter:blur(0)}100%{transform:scale(1) rotate(0)}}\n/* ---- tear: two copies of the same face, each clipped by the seam polygon; the stub pivots on its attached end ---- */\n.fx-tear{position:relative}\n.fx-tear .fx-side{position:absolute;inset:0;will-change:clip-path,transform}\n.fx-tear .fx-side.stub{transform-origin:100% 0}\n.fx-tear .fx-edge{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:.9;filter:blur(.4px)}\n.fx-tear .fx-side.stub.off{transition:transform calc(700ms * var(--k,1)) cubic-bezier(.4,0,.8,.4),opacity calc(500ms * var(--k,1)) ease-in calc(250ms * var(--k,1));transform:translate(-36px,140px) rotate(-28deg);opacity:0}\n/* ---- ash / fragments ---- */\n.fx-ash{position:absolute;width:6px;height:6px;border-radius:40% 60% 50% 50%;background:#3b2a20;opacity:0;pointer-events:none}\n.fx-ash.fall{animation:fx-ash calc(1400ms * var(--k,1)) ease-in forwards}\n@keyframes fx-ash{0%{opacity:.9;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx,0),var(--dy,80px)) rotate(var(--rot,90deg))}}\n/* ---- global review states ---- */\n.rm *,.rm *::before,.rm *::after{transition-duration:1ms!important;animation-duration:1ms!important;animation-delay:0ms!important}\n.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}\n\n/* ============ SC05 冰箱门 · enamel door, paper, magnets ============ */\n.app{position:absolute;inset:0;overflow:hidden;font-family:\"Noto Sans SC\",-apple-system,\"PingFang SC\",sans-serif;color:#1d1a16;--k:1;\n  --door:#f1ece4;--door2:#e8e2d8;--seal:#d4cbbd;--ink:#1d1a16;--mute:#6f685d;--line:rgba(60,45,25,.14);--paper:#fffdf8;--cream:#fbf5ea;--sky:#e8eef7;--mint:#e6f0e8;\n  --mag-red:#d2573a;--mag-blue:#3c5fbf;--mag-green:#4f8a5b;--mag-yellow:#e7b63a;--mag-grey:#8d877e;--sticky:#f5e27c;--shadow:60,40,20;--accent:#3c5fbf;\n  -webkit-font-smoothing:antialiased}\n.app.rm *,.app.rm *::before,.app.rm *::after,.app.rm-user *,.app.rm-user *::before,.app.rm-user *::after{transition-duration:1ms!important;animation-duration:1ms!important;animation-delay:0ms!important}\n/* skins = enamel tint of the door; the three R3 backgrounds rendered as this concept's material */\n.app[data-skin=\"cotton\"]{--door:#f1ece4;--door2:#eae3d9;--glow:radial-gradient(120% 60% at 20% 0%,rgba(248,214,226,.55),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(211,237,243,.5),transparent 60%)}\n.app[data-skin=\"halo\"]{--door:#f6efe2;--door2:#ecE3d3;--glow:radial-gradient(70% 45% at 80% 8%,rgba(255,120,40,.26),transparent 62%),radial-gradient(60% 40% at 10% 100%,rgba(208,188,225,.35),transparent 60%)}\n.app[data-skin=\"sunset\"]{--door:#f3e8dc;--door2:#e9dccb;--glow:linear-gradient(180deg,rgba(255,122,51,.16) 0%,rgba(255,197,61,.10) 45%,rgba(51,160,255,.16) 100%)}\n.door{position:absolute;inset:0;background:var(--door);transition:background calc(650ms * var(--k,1)) cubic-bezier(.22,1,.36,1),transform calc(420ms * var(--k,1)) cubic-bezier(.2,.8,.2,1),filter calc(420ms * var(--k,1)) ease}\n.door::before{content:\"\";position:absolute;inset:0;background:var(--glow);opacity:1;transition:opacity calc(650ms * var(--k,1)) ease;pointer-events:none}\n.door::after{content:\"\";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 18%,rgba(0,0,0,0) 82%,rgba(0,0,0,.06) 100%);pointer-events:none}\n.seal{position:absolute;top:0;bottom:0;right:0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.06),rgba(0,0,0,.14) 40%,var(--seal) 41%,#e9e2d7 100%);box-shadow:inset 1px 0 0 rgba(255,255,255,.5)}\n.handle{position:absolute;left:10px;top:120px;width:10px;height:260px;border-radius:6px;background:linear-gradient(90deg,#cfc7b9,#f4efe6 45%,#b9b0a1);box-shadow:0 6px 10px -4px rgba(var(--shadow),.35),inset 0 0 0 1px rgba(0,0,0,.08)}\n.door.lifted{transform:scale(.975);filter:brightness(.88) saturate(.9)}\n/* ---- magnets ---- */\n.mag{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,rgba(255,255,255,.55) 14%,var(--c) 32%,var(--c) 100%);box-shadow:0 2px 2px rgba(var(--shadow),.28),0 6px 10px -4px rgba(var(--shadow),.35),inset 0 -2px 3px rgba(0,0,0,.18);--c:var(--mag-red);z-index:3;transform-origin:50% 50%}\n.mag.blue{--c:var(--mag-blue)}.mag.green{--c:var(--mag-green)}.mag.yellow{--c:var(--mag-yellow)}.mag.grey{--c:var(--mag-grey)}\n.mag.snap{animation:sc05-snap calc(520ms * var(--k,1)) cubic-bezier(.18,1.5,.36,1) both}\n@keyframes sc05-snap{0%{transform:translateY(-10px) scale(1.25);box-shadow:0 12px 16px -6px rgba(var(--shadow),.45)}55%{transform:translateY(1px) scale(.96)}100%{transform:translateY(0) scale(1)}}\n.mag-word{position:absolute;height:40px;padding:0 14px;border-radius:9px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:#fff;letter-spacing:.04em;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 50%),var(--c);box-shadow:0 2px 0 rgba(0,0,0,.12),0 6px 12px -5px rgba(var(--shadow),.45),inset 0 1px 0 rgba(255,255,255,.35);border:0;font-family:inherit;--c:var(--mag-blue);cursor:pointer;z-index:3}\n.mag-word.red{--c:var(--mag-red)}.mag-word.green{--c:var(--mag-green)}.mag-word.yellow{--c:#c99a1d}.mag-word.grey{--c:var(--mag-grey)}\n.mag-word:active{transform:translateY(1px) scale(.97)}\n.mag-word .n{font:500 12px/1 Fraunces,serif;opacity:.9}\n/* ---- paper things ---- */\n.paper{position:absolute;background:var(--paper);box-shadow:0 1px 1px rgba(var(--shadow),.08),0 10px 16px -10px rgba(var(--shadow),.5);border-radius:2px;transform-origin:50% 0;transition:transform calc(380ms * var(--k,1)) cubic-bezier(.2,.9,.3,1.04),box-shadow calc(380ms * var(--k,1)) ease,opacity calc(300ms * var(--k,1)) ease}\n.paper::after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 30%,rgba(0,0,0,0) 85%,rgba(0,0,0,.035));pointer-events:none;border-radius:inherit}\n.paper.ghost{opacity:0;pointer-events:none}\n.item-btn{appearance:none;border:0;padding:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}\n/* name card */\n.namecard{left:30px;top:58px;width:330px;height:124px;transform:rotate(-1.2deg);padding:18px 20px 14px;box-sizing:border-box;background:linear-gradient(180deg,#fffdf9,#fbf6ec);border-radius:4px}\n.namecard .who{font-size:27px;font-weight:600;letter-spacing:.01em;line-height:1.2;color:var(--ink);max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.namecard .who.long{font-size:21px;white-space:normal;line-height:1.25;max-height:52px}\n.namecard .lines{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute)}\n.namecard .lines b{font-weight:500;color:var(--ink);display:inline-block;max-width:178px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}\n.namecard .tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;background:rgba(60,95,191,.1);color:var(--accent);margin-left:6px;vertical-align:1px}\n.namecard .tag.off{background:rgba(0,0,0,.06);color:var(--mute)}\n.namecard .corner{position:absolute;right:14px;bottom:10px;font-size:11px;color:var(--mute);letter-spacing:.06em}\n.namecard .mono{font-family:Fraunces,serif;font-weight:500}\n/* flyers */\n.flyer{width:176px;height:134px;padding:12px 12px 10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;background:var(--pp,var(--paper));border-radius:3px}\n.flyer .t{font-size:14px;font-weight:700;line-height:1.35;letter-spacing:.005em;max-height:57px;overflow:hidden;padding-right:4px;text-wrap:balance}\n.flyer .m{font-size:11px;color:var(--mute);line-height:1.5}\n.flyer .st{position:absolute;right:8px;bottom:8px;font-size:10px;padding:2px 6px;border-radius:3px;background:var(--mint);color:#2f6a3c;transform:rotate(-4deg);box-shadow:0 1px 1px rgba(0,0,0,.08)}\n.flyer .st.off{background:#eee9e0;color:#7a7266}\n.flyer.pack-invite{--pp:#fff8ee}.flyer.pack-grain{--pp:#f3efe6}.flyer.pack-mono{--pp:#f6f6f4}.flyer.pack-riso{--pp:#fdeef0}.flyer.pack-acid{--pp:#f0f7e4}.flyer.pack-street{--pp:#eef2f9}\n.stack{position:absolute;left:24px;top:208px;width:200px;height:176px}\n.stack .flyer{position:absolute}\n.stack .f0{left:22px;top:30px;transform:rotate(3.4deg)}.stack .f1{left:12px;top:15px;transform:rotate(-2.2deg)}.stack .f2{left:0;top:0;transform:rotate(.6deg)}\n.stack .cnt{left:74px;top:-12px;width:30px;height:30px;font:600 13px/30px Fraunces,serif;color:#fff;text-align:center;--c:var(--mag-red)}\n.stack .empty{left:0;top:0;width:184px;height:134px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mute);font-size:12.5px;border:1px dashed rgba(60,45,25,.25);background:transparent;box-shadow:none}\n.stack .empty b{font-size:14px;color:var(--ink);font-weight:500}\n/* whiteboard */\n.board{left:226px;top:202px;width:140px;height:182px;transform:rotate(1deg);background:#fcfcfa;border utton>\u003c/div>\n              \u003cp class=\"note\">截图 ≤6 张 · 本范围不演示上传，只记录文件名。\u003c/p>\n              \u003csc-if value=\"{{rs.fail}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"alert\">{{rs.failMsg}}\u003c/div>\u003c/sc-if>\n              \u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" class=\"btn ghost\" data-act=\"cancel\" onClick=\"{{rs.cancel}}\">取消\u003c/button>\u003cbutton type=\"button\" class=\"btn\" data-act=\"save\" onClick=\"{{rs.submit}}\" disabled=\"{{rs.saving}}\">\u003csc-if value=\"{{rs.saving}}\" hint-placeholder-val=\"{{false}}\">\u003cspan class=\"busy\">\u003c/span>\u003c/sc-if>提交补充\u003c/button>\u003c/div>\n            \u003c/sc-if>\n\n            \u003csc-if value=\"{{page.isHelp}}\" hint-placeholder-val=\"{{false}}\">\n              \u003cp class=\"lead\">常见问题按「参加约定」整理；遇到具体活动的问题去「我的举报」，对产品的意见用下面的反馈。\u003c/p>\n              \u003csc-for list=\"{{help.qas}}\" as=\"q\" hint-placeholder-count=\"5\">\u003cdetails class=\"qa\">\u003csummary>{{q.q}}\u003c/summary>\u003cp>{{q.a}}\u003c/p>\u003c/details>\u003c/sc-for>\n              \u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" class=\"btn ghost\" data-act=\"open\" data-rid=\"rules\" onClick=\"{{help.openRules}}\">规则全文\u003c/button>\u003cbutton type=\"button\" class=\"btn ghost\" data-act=\"open\" data-rid=\"reports\" onClick=\"{{help.openReports}}\">我的举报\u003c/button>\u003cbutton type=\"button\" class=\"btn\" data-act=\"feedback\" onClick=\"{{help.openFeedback}}\">写反馈\u003c/button>\u003c/div>\n              \u003csc-if value=\"{{help.hasFeedback}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"grp\" style=\"margin-top:18px\">\u003ch4>我的反馈 · {{help.feedbackCount}}\u003c/h4>\u003csc-for list=\"{{help.feedback}}\" as=\"f\" hint-placeholder-count=\"1\">\u003cdiv class=\"fbrow\">{{f.text}}\u003csmall>{{f.localNo}} · {{f.atText}} · {{f.statusLabel}}\u003c/small>\u003c/div>\u003c/sc-for>\u003c/div>\u003c/sc-if>\n            \u003c/sc-if>\n\n            \u003csc-if value=\"{{page.isFeedback}}\" hint-placeholder-val=\"{{false}}\">\n              \u003cp class=\"lead\">对产品的建议或问题。针对某个局或某个人的事，请在局内「举报」，不在这里。\u003c/p>\n              \u003cdiv class=\"inp {{fb.errCls}}\">\u003clabel for=\"sc05-fb\">反馈内容\u003c/label>\u003ctextarea id=\"sc05-fb\" data-field=\"text\" value=\"{{fb.text}}\" onInput=\"{{fb.setText}}\" placeholder=\"比如：希望「找局」可以按周末筛选。\">\u003c/textarea>\u003cspan class=\"e\">{{fb.err}}\u003c/span>\u003c/div>\n              \u003csc-if value=\"{{fb.fail}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"alert\">{{fb.failMsg}}\u003c/div>\u003c/sc-if>\n              \u003csc-if value=\"{{fb.done}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"ok\">已提交 · {{fb.doneNo}} · 本地保存\u003c/div>\u003c/sc-if>\n              \u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" class=\"btn ghost\" data-act=\"cancel\" onClick=\"{{fb.cancel}}\">取消\u003c/button>\u003cbutton type=\"button\" class=\"btn\" data-act=\"save\" onClick=\"{{fb.submit}}\" disabled=\"{{fb.saving}}\">提交反馈\u003c/button>\u003c/div>\n            \u003c/sc-if>\n\n            \u003csc-if value=\"{{page.isPrivacy}}\" hint-placeholder-val=\"{{false}}\">\n              \u003cp class=\"lead\">{{priv.lead}}\u003c/p>\n              \u003cdiv class=\"grp\">\u003ch4>规则\u003c/h4>\u003csc-for list=\"{{priv.general}}\" as=\"g\" hint-placeholder-count=\"4\">\u003cdiv class=\"fbrow\">{{g}}\u003c/div>\u003c/sc-for>\u003c/div>\n              \u003cdiv class=\"grp\">\u003ch4>你现在的局\u003c/h4>\u003csc-for list=\"{{priv.facts}}\" as=\"f\" hint-placeholder-count=\"4\">\u003cdiv class=\"fbrow\">\u003cb style=\"font-weight:500\">{{f.title}}\u003c/b> · {{f.role}}\u003csmall>{{f.rule}}\u003c/small>\u003c/div>\u003c/sc-for>\u003c/div>\n              \u003cp class=\"note\">{{priv.noToggles}}\u003c/p>\n            \u003c/sc-if>\n\n            \u003csc-if value=\"{{page.isAccount}}\" hint-placeholder-val=\"{{false}}\">\n              \u003csc-if value=\"{{acc.live}}\" hint-placeholder-val=\"{{true}}\">\n                \u003cdiv class=\"notice\">\u003cdiv class=\"st\">\u003cspan class=\"led on\">\u003c/span>{{acc.sessionLabel}}\u003c/div>\u003cp>{{acc.sessionBody}}\u003c/p>\u003c/div>\n                \u003cdiv class=\"grp\">\u003ch4>本机数据\u003c/h4>\u003cdiv class=\"fbrow\">这套方案的收藏、资料、偏好与记录保存在本机浏览器的一个命名空间里（{{acc.storageKey}}）。\u003csmall>重置演示数据在评审面板，不在产品里。\u003c/small>\u003c/div>\u003c/div>\n                \u003cdiv class=\"grp\">\u003ch4>没有的能力\u003c/h4>\u003cdiv class=\"fbrow\">真实工程里没有登录、绑定、改密码或注销；这里不发明它们。\u003csmall>下面的「退出登录」只结束本机的演示会话。\u003c/small>\u003c/div>\u003c/div>\n                \u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" class=\"btn red\" data-act=\"danger\" onClick=\"{{acc.askEnd}}\">退出登录（本地演示）\u003c/button>\u003c/div>\n              \u003c/sc-if>\n              \u003csc-if value=\"{{acc.ended}}\" hint-placeholder-val=\"{{false}}\">\n                \u003cdiv class=\"empty\">\u003cb>演示会话已结束\u003c/b>\u003cspan>已提交的记录、举报与资料都还在本机；重新开始会回到这扇门。\u003c/span>\u003cbutton type=\"button\" class=\"btn\" data-act=\"restart\" onClick=\"{{acc.restart}}\">重新开始\u003c/button>\u003c/div>\n              \u003c/sc-if>\n            \u003c/sc-if>\n\n            \u003csc-if value=\"{{page.isAbout}}\" hint-placeholder-val=\"{{false}}\">\n              \u003cdiv class=\"field\">\u003cspan class=\"l\">版本\u003c/span>\u003cspan class=\"v sm\">{{about.version}}\u003c/span>\u003c/div>\n              \u003cdiv class=\"field\">\u003cspan class=\"l\">约定版本\u003c/span>\u003cspan class=\"v sm\">{{about.rulesVersion}}\u003c/span>\u003c/div>\n              \u003cdiv class=\"field\">\u003cspan class=\"l\">构建\u003c/span>\u003cspan class=\"v sm\">{{about.built}}\u003c/span>\u003c/div>\n              \u003cdiv class=\"field\">\u003cspan class=\"l\">城市\u003c/span>\u003cspan class=\"v sm\">{{about.cities}} 座（纽约 · 波士顿 · 洛杉矶 · 旧金山 · 西雅图 · 芝加哥）\u003c/span>\u003c/div>\n              \u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" class=\"btn\" data-act=\"open\" data-rid=\"rules\" onClick=\"{{about.openRules}}\">规则全文\u003c/button>\u003c/div>\n              \u003cp class=\"note\">{{about.policyNote}}\u003c/p>\n              \u003cp class=\"note\">{{about.demo}} · 没有正式服务条款，这里不伪造。\u003c/p>\n            \u003c/sc-if>\n\n            \u003csc-if value=\"{{page.isRules}}\" hint-placeholder-val=\"{{false}}\">\n              \u003cp class=\"lead\">参加约定 {{about.rulesVersion}} · 三类十八条。只有源码里逐字给出的条目有正文，其余只列标题。\u003c/p>\n              \u003csc-for list=\"{{rules.groups}}\" as=\"g\" hint-placeholder-count=\"3\">\n                \u003cdiv class=\"rulesec\">\u003ch4>{{g.name}}\u003c/h4>\u003cdiv class=\"ln\">{{g.line}}\u003c/div>\u003col>\u003csc-for list=\"{{g.items}}\" as=\"r\" hint-placeholder-count=\"6\">\u003cli class=\"{{r.cls}}\">\u003cb>{{r.n}} {{r.title}}\u003c/b>{{r.body}}\u003c/li>\u003c/sc-for>\u003c/ol>\u003c/div>\n              \u003c/sc-for>\n            \u003c/sc-if>\n\n            \u003csc-if value=\"{{page.isSeamDetail}}\" hint-placeholder-val=\"{{false}}\">\n              \u003cdiv class=\"bigflyer {{det.packCls}}\">\u003cdiv class=\"mag {{det.magCls}}\">\u003c/div>\u003ch3>{{det.title}}\u003c/h3>\n                \u003cdiv class=\"kv\">\u003cspan>时间\u003c/span>\u003cb>{{det.when}}\u003c/b>\u003cspan>地点\u003c/span>\u003cb>{{det.placeFull}}\u003c/b>\u003cspan>局主\u003c/span>\u003cb>{{det.host}}\u003c/b>\u003cspan>人数\u003c/span>\u003cb>{{det.cap}}\u003c/b>\u003cspan>加入方式\u003c/span>\u003cb>{{det.joinMode}}\u003c/b>\u003c/div>\n                \u003cspan class=\"st {{det.stCls}}\">{{det.st}}\u003c/span>\u003csc-if value=\"{{det.rel}}\" hint-placeholder-val=\"{{false}}\">\u003cspan class=\"st rel\">{{det.rel}}\u003c/span>\u003c/sc-if>\n              \u003c/div>\n              \u003cdiv class=\"rule\">\u003cb>局主微信\u003c/b> · {{det.contactLine}}\u003c/div>\n              \u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" class=\"btn ghost\" data-act=\"{{det.favAct}}\" onClick=\"{{det.toggleFav}}\">{{det.favLabel}}\u003c/butto act=\"remove-material\" onClick=\"{{m.remove}}\" aria-label=\"移除附件\">×\u003c/button>\u003c/span>\u003c/sc-for>\u003cbutton type=\"button\" class=\"chip\" data-act=\"add-material\" onClick=\"{{sr.addMat}}\">＋ 加截图\u003c/button>\u003cspan class=\"note\" style=\"margin:0;align-self:center\">可不加\u003c/span>\u003c/div>\n                \u003csc-if value=\"{{sr.fail}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"alert\">{{sr.failMsg}}\u003c/div>\u003c/sc-if>\n                \u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" class=\"btn ghost\" data-act=\"cancel\" onClick=\"{{goBack}}\">取消\u003c/button>\u003cbutton type=\"button\" class=\"btn\" data-act=\"save\" onClick=\"{{sr.submit}}\" disabled=\"{{sr.saving}}\">\u003csc-if value=\"{{sr.saving}}\" hint-placeholder-val=\"{{false}}\">\u003cspan class=\"busy\">\u003c/span>\u003c/sc-if>{{sr.cta}}\u003c/button>\u003c/div>\n              \u003c/sc-if>\n            \u003c/sc-if>\n\n          \u003c/div>\u003c/div>\n        \u003c/div>\n      \u003c/sc-if>\n\n      \u003csc-if value=\"{{confirm.on}}\" hint-placeholder-val=\"{{false}}\">\n        \u003cdiv class=\"lift-back in\" style=\"z-index:20\" onClick=\"{{confirm.keep}}\">\u003c/div>\n        \u003cdiv class=\"paper sticky sc05-over\" style=\"position:absolute;left:34px;right:34px;top:300px;z-index:21;padding:16px 16px 14px;transform:rotate(-1deg);animation:sc05-up calc(300ms * var(--k,1)) ease both\">\u003cspan class=\"hand\">{{confirm.title}}\u003c/span>{{confirm.body}}\n          \u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" class=\"btn ghost\" data-act=\"keep-editing\" onClick=\"{{confirm.keep}}\">{{confirm.keepLabel}}\u003c/button>\u003cbutton type=\"button\" class=\"btn {{confirm.dangerCls}}\" data-act=\"discard\" onClick=\"{{confirm.discard}}\">{{confirm.discardLabel}}\u003c/button>\u003c/div>\n        \u003c/div>\n      \u003c/sc-if>\n\n      \u003cdiv class=\"kick\">\n        \u003cbutton type=\"button\" class=\"{{nav.findOn}}\" data-act=\" >\n\u003cp>方向不是预先按「风格」分配的；每套都从一个设置的产品问题出发（见「回答的产品问题」列）。\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>编号\u003c/th>\u003cth>名称\u003c/th>\u003cth>一句话\u003c/th>\u003cth>回答的产品问题\u003c/th>\u003cth>来源类型\u003c/th>\u003cth>信息组织\u003c/th>\u003cth>展开方式\u003c/th>\u003cth>开关形态\u003c/th>\u003cth>记录形态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SC01\u003c/td>\u003ctd>登记表\u003c/td>\u003ctd>一张印好框线的登记表：字段、当前值、状态章各在各的格里\u003c/td>\u003ctd>当前值 + 状态 + 说明如何同时清楚而不靠灰字\u003c/td>\u003ctd>印刷表单\u003c/td>\u003ctd>单页表格，粗线分组\u003c/td>\u003ctd>该行下方展开附表\u003c/td>\u003ctd>格内盖章\u003c/td>\u003ctd>附表编号条目\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC02\u003c/td>\u003ctd>面板\u003c/td>\u003ctd>奶白搪瓷面板上的拨杆、旋钮、读数与指示灯\u003c/td>\u003ctd>偏好 / 系统权限 / 提醒服务三态必须分开且准确\u003c/td>\u003ctd>暖硬件（Braun / TE）\u003c/td>\u003ctd>模块化面板\u003c/td>\u003ctd>模块抬起成全屏\u003c/td>\u003ctd>拨杆 + LED\u003c/td>\u003ctd>LCD 日志\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC03\u003c/td>\u003ctd>文件袋\u003c/td>\u003ctd>一叠半透明磨砂 PP 文件袋，索引标签露在外面\u003c/td>\u003ctd>常用项易找、低频内容合理展开、内容可预览\u003c/td>\u003ctd>文具材质\u003c/td>\u003ctd>叠 + 横向索引标签\u003c/td>\u003ctd>袋子从叠中抽出\u003c/td>\u003ctd>按扣\u003c/td>\u003ctd>袋内纸片\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC04\u003c/td>\u003ctd>手册\u003c/td>\u003ctd>一本关于你的小手册：身份页、拇指索引、按日期的事实\u003c/td>\u003ctd>记录 / 申诉要保留对象、历史与材料\u003c/td>\u003ctd>证件式印刷品\u003c/td>\u003ctd>分章翻页\u003c/td>\u003ctd>翻页 + 夹页\u003c/td>\u003ctd>页上实心 / 空心圆\u003c/td>\u003ctd>日期条目 + 小方章\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC05\u003c/td>\u003ctd>冰箱门\u003c/td>\u003ctd>自家冰箱门：名片、传单、白板勾选都用磁贴吸着\u003c/td>\u003ctd>「这是我在 JU 的资料、收藏、偏好和记录」的归属感\u003c/td>\u003ctd>生活空间\u003c/td>\u003ctd>自由排布的门面\u003c/td>\u003ctd>物件取下拿到眼前\u003c/td>\u003ctd>磁贴翻面\u003c/td>\u003ctd>便签叠\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC06\u003c/td>\u003ctd>内衬\u003c/td>\u003ctd>一件外套翻开的里侧：织唛是你，内袋是分组，洗标排着提醒\u003c/td>\u003ctd>哪些资料对外可见、哪些收在里面（隐私层级）\u003c/td>\u003ctd>设计师作品方法\u003c/td>\u003ctd>口袋 + 标签\u003c/td>\u003ctd>拉链拉开袋口\u003c/td>\u003ctd>按扣\u003c/td>\u003ctd>袋内卡片\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC07\u003c/td>\u003ctd>墨水屏\u003c/td>\u003ctd>电子纸：灰白底、黑字、局部刷新\u003c/td>\u003ctd>长中文（帮助 / 规则）阅读与减少动态下的完整性\u003c/td>\u003ctd>显示介质\u003c/td>\u003ctd>高密度单栏\u003c/td>\u003ctd>局部刷新切页\u003c/td>\u003ctd>实心 / 空心方块\u003c/td>\u003ctd>清单页\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC08\u003c/td>\u003ctd>门厅\u003c/td>\u003ctd>大楼门厅：导览板字牌、黄铜信箱格、门铃面板\u003c/td>\u003ctd>通知偏好（信箱）/ 系统权限（钥匙）/ 投递（信差）/ 谁能联系你（门铃）\u003c/td>\u003ctd>建筑物件\u003c/td>\u003ctd>分区：板 / 信箱 / 门铃\u003c/td>\u003ctd>板上拉出面板、格门打开\u003c/td>\u003ctd>信箱格门\u003c/td>\u003ctd>门卫登记簿\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC09\u003c/td>\u003ctd>软体\u003c/td>\u003ctd>柔软的数字物体：越重要越大，点一下就膨胀开\u003c/td>\u003ctd>高频开关要利落，仪式感动作只留给合适场景\u003c/td>\u003ctd>原生数字（弹性）\u003c/td>\u003ctd>大小 = 重要度的软体群\u003c/td>\u003ctd>软体膨胀成全屏\u003c/td>\u003ctd>滚动的软球\u003c/td>\u003ctd>软体堆叠\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC10\u003c/td>\u003ctd>吊牌\u003c/td>\u003ctd>挂杆上一排吊牌：分区名竖排，当前值横排\u003c/td>\u003ctd>收藏的加入 / 让位 / 最后一张移除与空态\u003c/td>\u003ctd>卡纸物件\u003c/td>\u003ctd>多层挂杆\u003c/td>\u003ctd>拉下吊牌放大\u003c/td>\u003ctd>打孔 / 补孔贴\u003c/td>\u003ctd>一串小吊牌\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>宽度核对：精确比例成立的（SC01 登记表、SC02 面板、SC07 墨水屏）；表达更鲜明的（SC05 冰箱门、SC08 门厅、SC09 软体、SC10 吊牌）；材料启发（SC03 文件袋、SC04 手册、SC06 内衬）；原生数字（SC09 软体、SC07 墨水屏）。不是十套白卡列表，不是十套纸票，不是十套冷感时装站。\u003c/p>\n\u003cp>---\u003c/p>\n\u003ch2>SC01 登记表 Form Sheet\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>首页构图与信息组织\u003c/strong>：整屏是一张登记表。表头：「JU 设置登记表」小字 + 编号 + 填表人（称呼大字，约 30px）；表体每行三格：字段名 ｜ 当前值 ｜ 状态章；粗线分六组：个人资料 / 收藏与城市 / 通知 / 外观 / 我的记录与举报 / 帮助与账户。第一眼：称呼与各行右侧的朱红状态章；第二眼：当前值。收藏是「收藏的局 · 3」一行，展开成附表。\u003c/li>\n\u003cli>\u003cstrong>中文排版与比例\u003c/strong>：字段名 Noto Serif SC 400 12px 灰墨；当前值 Noto Sans SC 500 16px 黑墨；数字 IBM Plex Mono；行高 52px 节奏，长值在格内折行撑高该行而不缩字；表线 1px #1b1a17；章用朱红 #b8322a 半透明。\u003c/li>\n\u003cli>\u003cstrong>控件与编辑器构造\u003c/strong>：开关 = 方格内盖「开」/ 划线 + 盖「关」；单选 = 一排小格勾选；文本编辑 = 该格放大成填写区（上方浮出填写说明、下方校验行）；记录 = 附表（序号 / 日期 / 事实 / 状态）；危险操作 = 表尾红框区「撕角处」，需沿虚线拖开才生效。\u003c/li>\n\u003cli>\u003cstrong>材质与空间层级\u003c/strong>：米白表格纸 #f3efe4 + 极淡网格底纹；黑墨印刷线；章有轻微晕染（fx-ink 滤镜）；纸只有边缘一条阴影；没有卡片、没有圆角容器。\u003c/li>\n\u003cli>\u003cstrong>空间过渡与运动\u003c/strong>：二级 = 该行下方展开附表（行高增长，其他行让位）；返回 = 收回到该行；编辑 = 格 FLIP 放大；键盘出现时表格整体上移并保留当前行可见。\u003c/li>\n\u003cli>\u003cstrong>三个代表性动作\u003c/strong>：① 盖章开关；② 填表保存（墨由浅到深 + 「已更新」小章）；③ 附表展开与划线删除（取消收藏）。\u003c/li>\n\u003c/ol>\n\u003ch2>SC02 面板 Hardware Panel\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：奶白搪瓷面板，顶部黑色铭牌刻着称呼（大）与微信 / 邮箱（小刻字，验证状态为一枚绿 / 灰 LED）。下方模块化：每个模块一块略凹入的面板，带拨杆（开关）、旋钮（城市 / 外观）、LED（权限 / 服务）、小 LCD 读数（当前值）。收藏是「卡槽」模块显示数量与最近一张。第一眼：铭牌与亮着的 LED；第二眼：各模块读数。\u003c/li>\n\u003cli>\u003cstrong>排版\u003c/strong>：刻字 Noto Sans SC 500；标签 Space Grotesk 大写 + 中文并置，字距 .08em；LCD 读数 DM Mono；字号偏小但对比高。\u003c/li>\n\u003cli>\u003cstrong>控件\u003c/strong>：拨杆（有行程与回弹）；旋钮（刻度 detent）；LCD 行输入（光标闪）；记录 = 可滚动的 LCD 日志；危险操作 = 带透明保护盖的红色按钮（先翻盖再按）。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：搪瓷 / 磨砂塑料面板，左上单一光源，凹槽内阴影；黑色铭牌有细微反光；橙色点缀；LED 有小范围发光晕。\u003c/li>\n\u003cli>\u003cstrong>过渡\u003c/strong>：模块被点击后抬起到前面成全屏面板（其余模块暗下退后）；返回 = 落回凹槽。\u003c/li>\n\u003cli>\u003cstrong>动作\u003c/strong>：① 拨杆开关；② 旋钮选城市（detent + 读数滚动）；③ 保护盖红钮（退出登录 / 清除演示数据，只作用隔离数据）。\u003c/li>\n\u003c/ol>\n\u003ch2>SC03 文件袋 PP Folders\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：一叠半透明磨砂 PP 文件袋，右侧边缘露出彩色索引标签（资料 / 收藏 / 偏好 / 记录 / 帮助）；最前面的袋子透出称呼大字与收藏数。第一眼：索引色块 + 透出的大字；第二眼：标签上的小字当前值。\u003c/li>\n\u003cli>\u003cstrong>排版\u003c/strong>：透出的大字 Noto Sans SC 700 28px（被雾化柔化）；标签字 12px 黑；数值 DM Mono。\u003c/li>\n\u003cli>\u003cstrong>控件\u003c/strong>：按扣开关（扣合 / 弹开）；彩色索引夹 = 分组选择；纸片抽出 = 文本编辑；记录 = 袋内多张纸；危险操作 = 封口贴，撕开才能按。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：磨砂半透明塑料（backdrop blur + 白雾层 + 边缘高光 + 轻微塑料纹）；纸片有叠压与颤动；标签是哑光彩色贴纸。\u003c/li>\n\u003cli>\u003cstrong>过渡\u003c/strong>：点标签 → 该袋从叠中抽出到最前（其余后退、更模糊）；纸片从袋口抽出成全屏；返回插回。\u003c/li>\n\u003cli>\u003cstrong>动作\u003c/strong>：① 抽袋；② 按扣开关；③ 抽纸编辑保存。\u003c/li>\n\u003c/ol>\n\u003ch2>SC04 手册 Booklet\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：手册翻开到身份页：称呼大字（Noto Serif SC 600 34px）、微信、邮箱与验证小方章；右侧页边是拇指索引（资料 / 收藏 / 偏好 / 记录 / 帮助 / 关于），当前章节的索引块更深。第一眼：身份页的名字与章；第二眼：索引。\u003c/li>\n\u003cli>\u003cstrong>排版\u003c/strong>：正文 Noto Sans SC 400 14px；页码 Cormorant Garamond；版心严格、外边距大；记录条目「日期 ｜ 事实 ｜ 状态」用细线表格。\u003c/li>\n\u003cli>\u003cstrong>控件\u003c/strong>：开关 = 页上的实心 / 空心圆（● ○）；选择 = 勾选格；文本 = 页上横线填写；记录 = 按日期的条目 + 小方章（待核实 / 已核实 / 已补充）；补充 / 申诉 = 夹页；危险操作 = 封底撕下页角。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：压纹卡纸封面、薄内页（背面透印）、书脊阴影、翻页弯曲；章为朱红或靛蓝。\u003c/li>\n\u003cli>\u003cstrong>过渡\u003c/strong>：翻页（书脊为轴）；二级 = 翻到对应章节；编辑 = 拉出夹页。\u003c/li>\n\u003cli>\u003cstrong>动作\u003c/strong>：① 翻页到章节；② 补充夹页；③ 书签收藏（取消时书签滑出飘落）。\u003c/li>\n\u003c/ol>\n\u003ch2>SC05 冰箱门 Fridge Door\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：竖向冰箱门（奶白搪瓷，右侧一条门封）。上面用磁贴固定：顶部「我的名片」（称呼 / 微信 / 邮箱），中部收藏的局传单（2–3 张可见 + 数量磁贴），白板贴纸列着通知偏好与城市，门把手旁小磁贴是帮助 / 关于 / 账户；记录是一个磁性小盒。物件 ≤3° 小角度错落，文字保持水平。第一眼：名片与最大的传单；第二眼：白板勾选。\u003c/li>\n\u003cli>\u003cstrong>排版\u003c/strong>：Noto Sans SC 500 为主；数字 Fraunces；便签上的小批注 Long Cang（仅批注，不用于正文）。\u003c/li>\n\u003cli>\u003cstrong>控件\u003c/strong>：磁贴翻面 = 开关；字母磁贴排出当前值 = 选择；换便签 = 文本编辑；便签叠 = 记录；危险 = 取下磁贴后出现确认纸条。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：搪瓷门面（微反光 + 门封阴影）、纸（厚度 / 边卷 / 阴影）、磁贴（塑料高光 + 下方小阴影）。\u003c/li>\n\u003cli>\u003cstrong>过渡\u003c/strong>：点一张纸 → 从门上「取下」拿到眼前（放大、阴影加深、旋正）；返回 = 贴回原位，磁贴吸住（snap）。\u003c/li>\n\u003cli>\u003cstrong>动作\u003c/strong>：① 磁吸贴回 / 取下（收藏 / 取消收藏）；② 翻面开关；③ 换便签（资料编辑保存）。\u003c/li>\n\u003c/ol>\n\u003ch2>SC06 内衬 Garment Inside\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：外套翻开的里侧：顶部一枚织唛印着称呼与账号（四针白线缝住的标 = 「我」），下方 4–5 个内袋（拉链袋 / 贴袋），袋口织带标签写分组名与当前值；洗标（care label）排着通知与外观的符号行；记录缝在最里层的口袋里。第一眼：织唛；第二眼：袋口标签。\u003c/li>\n\u003cli>\u003cstrong>排版\u003c/strong>：织唛 Noto Sans SC 500 小字密排 + Archivo Narrow 大写拉丁；洗标符号 + 10px 小字；里布上不放长文。\u003c/li>\n\u003cli>\u003cstrong>控件\u003c/strong>：按扣 / 拉链头 = 开关；织带上的分段标（S / M / L 式）= 选择；吊牌 / 手写洗标 = 文本编辑；袋内卡片 = 记录；剪标线 = 危险操作。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：里布（细斜纹织纹）、织唛（纤维边缘、织字锯齿）、金属拉链牙与拉片、缝线与四针白线。\u003c/li>\n\u003cli>\u003cstrong>过渡\u003c/strong>：拉开拉链 → 袋口张开露出内容（二级从袋口展开）；返回 = 拉合。\u003c/li>\n\u003cli>\u003cstrong>动作\u003c/strong>：① 拉链展开；② 按扣开关；③ 重织织唛（资料保存）。\u003c/li>\n\u003c/ol>\n\u003ch2>SC07 墨水屏 E-ink\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：电子纸灰白底、纯黑字；顶部称呼大字；分组用黑底白字组头 + 粗横线；每行「项目名 … 当前值」靠引导点对齐；信息密度高、秩序严格；屏角一枚指示灯色（唯一彩色）用于「需要处理」。第一眼：黑组头与大字；第二眼：引导点对齐的值。\u003c/li>\n\u003cli>\u003cstrong>排版\u003c/strong>：Noto Serif SC 大字 + Noto Sans SC 正文；4 级灰；无阴影、无圆角渐变。\u003c/li>\n\u003cli>\u003cstrong>控件\u003c/strong>：实心 / 空心方块 = 开关；黑底反白选项 = 选择；下划线输入 + 慢闪光标 = 文本编辑；记录 = 清单页；危险 = 全屏确认页。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：电子纸（无光、纸质灰白、文字边缘微颤）；屏四周薄框；按钮边缘硬。\u003c/li>\n\u003cli>\u003cstrong>过渡\u003c/strong>：切页 = 局部刷新（区域反相一闪 → 新内容 → 残影 300ms 清除）；减少动态下刷新本身即结果。\u003c/li>\n\u003cli>\u003cstrong>动作\u003c/strong>：① 刷新翻页；② 方块开关；③ 反相落定（保存）。\u003c/li>\n\u003c/ol>\n\u003ch2>SC08 门厅 Lobby\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：深色门厅。顶部黑色导览板，白字牌逐行列出分区与当前值（你的名字在第一行）；中部黄铜信箱格阵列 = 通知偏好（每格一类，格门开 / 关，格上刻名牌）；下方门铃面板 = 隐私与联系（谁能联系你，按现有规则显示）；侧面小牌 = 帮助 / 关于 / 账户；记录 = 门卫登记簿。第一眼：导览板与黄铜格；第二眼：格门状态与门铃灯。\u003c/li>\n\u003cli>\u003cstrong>排版\u003c/strong>：导览板 Noto Sans SC 500 白字 + DM Mono 字母牌；黄铜名牌刻字（深色凹字）。\u003c/li>\n\u003cli>\u003cstrong>控件\u003c/strong>：信箱格门 = 开关；滑动字牌 = 选择；名牌更换 = 文本编辑；登记簿翻页 = 记录；换锁 = 危险操作。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：黑漆板（细微反光）、黄铜（氧化 + 一条反光带）、磨砂玻璃门。\u003c/li>\n\u003cli>\u003cstrong>过渡\u003c/strong>：点导览板一行 → 牌面像抽屉从板中拉出成面板；格门沿铰链打开（透视）。\u003c/li>\n\u003cli>\u003cstrong>动作\u003c/strong>：① 字牌滑入；② 信箱门开关；③ 门铃灯（谁能联系你）。\u003c/li>\n\u003c/ol>\n\u003ch2>SC09 软体 Soft Bodies\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：浅暖底；首屏是大小不等的软体（胶囊 / 圆角块）：最大的一团是「我」（称呼 / 微信 / 邮箱），其余按重要度排列（收藏、通知、城市、外观、记录、帮助），每团显示名称 + 当前值。第一眼：最大的一团；第二眼：其他团的值。\u003c/li>\n\u003cli>\u003cstrong>排版\u003c/strong>：Noto Sans SC 600 + Manrope 数字；字号差异明显；容器变形时文字 reflow，不拉伸。\u003c/li>\n\u003cli>\u003cstrong>控件\u003c/strong>：胶囊内滚动的软球 = 开关；分段胶囊（选中段膨胀）= 选择；软体放大成输入面 = 文本编辑；软体堆叠 = 记录；变红 + 长按压缩 = 危险操作。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：哑光软体（内阴影 + 高光），低饱和有活力的色（鼠尾草绿 / 杏 / 灰蓝）；无玻璃、无渐变背景。\u003c/li>\n\u003cli>\u003cstrong>过渡\u003c/strong>：点一团 → 弹性膨胀成全屏（其余被挤开缩小）；返回收缩回原位。\u003c/li>\n\u003cli>\u003cstrong>动作\u003c/strong>：① 膨胀进入；② 软球开关；③ 保存脉冲。\u003c/li>\n\u003c/ol>\n\u003ch2>SC10 吊牌 Hang Tags\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：顶部一根挂杆，下面吊着一排吊牌（分区名竖排，当前值横排），第一张最大是「我」的吊牌；第二根杆挂着收藏的局（每局一张小吊牌）；第三根杆挂偏好；底部杆挂帮助 / 关于 / 账户。第一眼：最大的吊牌与收藏杆；第二眼：各牌的值。\u003c/li>\n\u003cli>\u003cstrong>排版\u003c/strong>：Noto Serif SC 500（竖排分区名）+ Instrument Serif 数字；值横排 Noto Sans SC 14px；吊牌比例 2:3。\u003c/li>\n\u003cli>\u003cstrong>控件\u003c/strong>：打孔 = 开关（打孔机打孔表示开；关闭 = 补孔贴）；多张小吊牌挂一张 = 选择；牌面重印 = 文本编辑；一串小吊牌 = 记录；剪绳 = 危险操作。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：卡纸吊牌（厚度边缘）、棉绳（略松弛的曲线）、金属孔眼；只在交互时摆动。\u003c/li>\n\u003cli>\u003cstrong>过渡\u003c/strong>：拉下吊牌 → 放大到眼前（绳跟着拉长）；松手 → 回弹悬挂。\u003c/li>\n\u003cli>\u003cstrong>动作\u003c/strong>：① 拉牌；② 挂牌收藏 / 剪绳取消（邻牌让位，空杆空态）；③ 打孔开关。\u003c/li>\n\u003c/ol>\n\u003cp>---\u003c/p>\n\u003ch2>差异矩阵核对（任意两套 ≥4 维）\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>构图 / 信息组织\u003c/th>\u003cth>排版比例\u003c/th>\u003cth>控件构造\u003c/th>\u003cth>材质\u003c/th>\u003cth>过渡\u003c/th>\u003cth>核心动作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SC01 登记表\u003c/td>\u003ctd>单页表格\u003c/td>\u003ctd>衬线字段名 + 等宽数字\u003c/td>\u003ctd>盖章 / 格内编辑\u003c/td>\u003ctd>表格纸 + 墨 + 章\u003c/td>\u003ctd>行下展开\u003c/td>\u003ctd>盖章 / 印值 / 划线\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC02 面板\u003c/td>\u003ctd>模块面板\u003c/td>\u003ctd>刻字 + LCD\u003c/td>\u003ctd>拨杆 / 旋钮 / 保护盖\u003c/td>\u003ctd>搪瓷 + 塑料 + LED\u003c/td>\u003ctd>模块抬起\u003c/td>\u003ctd>拨杆 / 旋钮 / 红钮\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC03 文件袋\u003c/td>\u003ctd>叠 + 侧标签\u003c/td>\u003ctd>雾化大字\u003c/td>\u003ctd>按扣 / 抽纸\u003c/td>\u003ctd>磨砂 PP + 纸\u003c/td>\u003ctd>抽袋\u003c/td>\u003ctd>抽袋 / 按扣 / 抽纸\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC04 手册\u003c/td>\u003ctd>分章翻页\u003c/td>\u003ctd>衬线大标题 + 版心\u003c/td>\u003ctd>圆点 / 夹页\u003c/td>\u003ctd>卡纸 + 薄页 + 章\u003c/td>\u003ctd>翻页\u003c/td>\u003ctd>翻页 / 夹页 / 书签\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC05 冰箱门\u003c/td>\u003ctd>自由门面\u003c/td>\u003ctd>名片 + 便签\u003c/td>\u003ctd>磁贴翻面 / 换便签\u003c/td>\u003ctd>搪瓷 + 纸 + 磁贴\u003c/td>\u003ctd>取下拿近\u003c/td>\u003ctd>磁吸 / 翻面 / 换便签\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC06 内衬\u003c/td>\u003ctd>口袋 + 标签\u003c/td>\u003ctd>织唛密排\u003c/td>\u003ctd>拉链 / 按扣 / 分段标\u003c/td>\u003ctd>里布 + 织唛 + 金属\u003c/td>\u003ctd>拉链张开\u003c/td>\u003ctd>拉链 / 按扣 / 重织\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC07 墨水屏\u003c/td>\u003ctd>高密度单栏\u003c/td>\u003ctd>引导点对齐\u003c/td>\u003ctd>方块 / 反白\u003c/td>\u003ctd>电子纸\u003c/td>\u003ctd>局部刷新\u003c/td>\u003ctd>刷新 / 方块 / 反相\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC08 门厅\u003c/td>\u003ctd>板 / 信箱 / 门铃\u003c/td>\u003ctd>字牌 + 刻字\u003c/td>\u003ctd>格门 / 字牌 / 门铃\u003c/td>\u003ctd>黑漆 + 黄铜\u003c/td>\u003ctd>抽屉拉出 / 门开\u003c/td>\u003ctd>字牌 / 格门 / 门铃\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC09 软体\u003c/td>\u003ctd>大小 = 重要度\u003c/td>\u003ctd>大字差 + reflow\u003c/td>\u003ctd>软球 / 分段胶囊\u003c/td>\u003ctd>哑光软体\u003c/td>\u003ctd>膨胀\u003c/td>\u003ctd>膨胀 / 软球 / 脉冲\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SC10 吊牌\u003c/td>\u003ctd>多层挂杆\u003c/td>\u003ctd>竖排名 + 横排值\u003c/td>\u003ctd>打孔 / 剪绳\u003c/td>\u003ctd>卡纸 + 绳 + 孔眼\u003c/td>\u003ctd>拉下放大\u003c/td>\u003ctd>拉牌 / 挂牌 / 打孔\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>淘汰的候选方向及理由：地图 / 街区（只对城市与收藏成立，对通知与资料不成立）；存折（与手册同为纸册，构造重叠）；黑板（可擦材质与「记录是事实」语义冲突）；售票机界面（与上一轮站牌同属交通机器）；便当收纳格（与上一轮格盘重叠）；拨号盘导航（必要功能被旋转隐藏）；霓虹招牌（过于主题化）。\u003c/p>","motions":"\u003cp>（本次构建未包含）\u003c/p>","coverage":"\u003cp>（本次构建未包含）\u003c/p>","contract":"\u003ch1>「设置」跨模块状态契约（设置 · 入局 01 接缝 · 我的局接缝）\u003c/h1>\n\u003cp>&gt; 实现以 \u003ccode>settings/src/core/jus-data.js\u003c/code> 为准；本文解释每个对象的归属、作用域、保存模型与边界，并记录源码冲突的处理决定。依据分级：\u003cstrong>①\u003c/strong> 用户明确要求 \u003cstrong>②\u003c/strong> 当前源码可核实的既有能力 \u003cstrong>③\u003c/strong> 旧稿有明确产品意图但仍是占位或错误实现 \u003cstrong>④\u003c/strong> 本轮为完善设置提出的设计建议（可逆的本地默认方案） \u003cstrong>⑤\u003c/strong> 信息缺失、冲突或尚待核实。④⑤ 不是已确定的产品规则。\u003c/p>\n\u003ch2>0. 原则\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>同一方案内状态互通，不同方案之间隔离\u003c/strong>：每套方案一个命名空间 \u003ccode>jus:&lt;SCNN&gt;:v1\u003c/code>（\u003ccode>JUS.store\u003c/code>），设置、入局接缝、我的局接缝读写同一份 \u003ccode>data\u003c/code>；「重置本套」只清这一个键，从不触碰 V27（\u003ccode>JU_V26_EVENTS_1\u003c/code>、\u003ccode>JU_MINE27_1\u003c/code>、\u003ccode>demo:mine27:*\u003c/code>）、R3（\u003ccode>ju-visual-motion-r1\u003c/code>、\u003ccode>ju-create-v19-ultra-r2\u003c/code>、\u003ccode>ju-background-skin-v1\u003c/code>）或上一轮「我的局」的任何键。①②\u003c/li>\n\u003cli>\u003cstrong>稳定身份\u003c/strong>：活动的唯一身份是 \u003ccode>eventId\u003c/code>（与 \u003ccode>src/core/ju-data.js\u003c/code> 的 id 相同：\u003ccode>brunch\u003c/code>、\u003ccode>livehouse\u003c/code>…）。收藏、记录、举报、快照都以 \u003ccode>you.id + eventId\u003c/code> 关联；标题、城市文案、数组位置、DOM class 都不是身份。改标题不是新活动；同名不同城市是两个活动。①\u003c/li>\n\u003cli>\u003cstrong>结果出现在动作发生处\u003c/strong>，保存结果与数据修改时机一致（引擎写入成功才显示成功；失败保留输入）。①\u003c/li>\n\u003cli>\u003cstrong>本地演示\u003c/strong>：没有真实账户、验证邮件、通知服务、审核服务或后端。产品界面里只写用户理解当前操作、后果与真实状态所需的话；演示控制（变体、权限模拟、失败模拟、重置）全部在画面外的评审面板。①\u003c/li>\n\u003c/ol>\n\u003ch2>1. 稳定 ID 与跨文件映射\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>来源\u003c/th>\u003cth>该来源的「身份」\u003c/th>\u003cth>处理决定\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>我的局（\u003ccode>src/core/ju-data.js\u003c/code>）\u003c/td>\u003ctd>\u003ccode>event.id\u003c/code>（无前缀：\u003ccode>brunch\u003c/code>…）；成员 \u003ccode>m-N\u003c/code>；草稿 \u003ccode>draft-*\u003c/code>\u003c/td>\u003ctd>\u003cstrong>采用为本契约的 canonical id\u003c/strong>。②\u003c/td>\u003c/tr>\u003ctr>\u003ctd>V27 入局\u003c/td>\u003ctd>事件 id = `city\u003c/td>\u003ctd>pack\u003c/td>\u003ctd>title\u003ccode>（\u003c/code>buildFeed\u003ccode>）；收藏键 \u003c/code>favKeyAt\u003ccode> = \u003c/code>city\u003c/td>\u003ctd>title\u003ccode>（无 pack，会话级内存，无持久化）；账本 \u003c/code>JuLedger\u003ccode> 按事件 id 存记录（\u003c/code>JU_V26_EVENTS_1`）；76 条 feed 行\u003c/td>\u003ctd>入局接缝的活动直接取自 V27 FEED_ROWS（NYC 12 条 + BOS / LA 各 1 条），`JUS.IDMAP.v27[canonical] = city\u003c/td>\u003ctd>pack\u003c/td>\u003ctd>title\u003ccode>、\u003c/code>JUS.IDMAP.v27FavKey[canonical] = city\u003c/td>\u003ctd>title`；\u003cstrong>标题不再作为键\u003c/strong>。②④\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R3 开局\u003c/td>\u003ctd>\u003ccode>H.state.favorites\u003c/code> 键 = \u003ccode>城市:feedRow 下标\u003c/code>（如 \u003ccode>NYC:0\u003c/code>），取消写 \u003ccode>false\u003c/code> 而非删除；活动 id \u003ccode>draft-&lt;base36&gt;-&lt;8 位&gt;\u003c/code>、\u003ccode>demo-host-hotpot\u003c/code>、\u003ccode>demo-history-0..4\u003c/code>\u003c/td>\u003ctd>下标键无法稳定映射到活动；接缝不继承 R3 的键格式。R3 样例活动 \u003ccode>demo-host-hotpot\u003c/code>（深夜救急火锅局）与本契约 \u003ccode>hotpot\u003c/code>（冬至火锅）\u003cstrong>不是同一活动\u003c/strong>，不合并。③\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>映射规则：不同文件的活动只有在 \u003cstrong>id 明确对应\u003c/strong> 时才视为同一活动；仅标题相似不合并（例：我的局 \u003ccode>vintage\u003c/code> 古着淘货 · 下东区三家店 与 V27 \u003ccode>NYC|invite|Vintage 淘货 Citywalk\u003c/code>（canonical \u003ccode>vintagewalk\u003c/code>）是两个活动）。我的局的 19 个事件在 V27 的 76 条 feed 中\u003cstrong>没有同 id 对应\u003c/strong>（它们来自 v3 画布的 \u003ccode>demo:mine27:*\u003c/code> fixture 层），因此 \u003ccode>JUS.IDMAP.myju\u003c/code> 只记 canonical id；R3 的 \u003ccode>demo-host-hotpot\u003c/code>（深夜救急火锅局）与 V27 \u003ccode>NYC|invite|深夜救急火锅局\u003c/code> 标题相同但 id 体系不同，本契约取 V27 的 feed 行为 \u003ccode>hotpot\u003c/code> 的来源，R3 不映射。\u003c/p>\n\u003ch2>2. 对象模型与作用域\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>对象（\u003ccode>data.*\u003c/code>）\u003c/th>\u003cth>内容\u003c/th>\u003cth>作用域\u003c/th>\u003cth>保存模型\u003c/th>\u003cth>修改后同步到\u003c/th>\u003cth>不受影响\u003c/th>\u003cth>本地 / 真实\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>you\u003c/code>\u003c/td>\u003ctd>\u003ccode>name\u003c/code> 称呼、\u003ccode>wx\u003c/code> 微信、\u003ccode>email\u003c/code>、\u003ccode>emailVerified\u003c/code>、\u003ccode>emailDomain\u003c/code>、\u003ccode>emailKind\u003c/code>（school / work）\u003c/td>\u003ctd>账户级默认值\u003c/td>\u003ctd>\u003cstrong>显式保存\u003c/strong>（编辑 → 校验 → 保存；取消恢复原值；未保存返回要确认）\u003c/td>\u003ctd>设置首页、资料页、隐私页、接缝里「你」的称呼；\u003cstrong>之后的新报名默认填入新值\u003c/strong>\u003c/td>\u003ctd>已提交的报名快照 \u003ccode>joined[].snapshot\u003c/code>（报名时填写的称呼 / 微信）、已发布活动、历史记录\u003c/td>\u003ctd>本地；邮箱改动后 \u003ccode>emailVerified=false\u003c/code>，验证邮件未接入（产品内写明「未验证」，不冒充已发送）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>favorites[]\u003c/code>\u003c/td>\u003ctd>\u003ccode>{eventId, at}\u003c/code>，无重复\u003c/td>\u003ctd>账户级\u003c/td>\u003ctd>\u003cstrong>即时\u003c/strong>（引擎幂等：重复收藏返回 \u003ccode>already\u003c/code>，不加条目）\u003c/td>\u003ctd>设置 › 收藏、入局接缝标记与「只看收藏」计数、我的局接缝标记\u003c/td>\u003ctd>\u003ccode>joined[]\u003c/code>（报名 / 预留 / 候补 / 票根 / 历史）、\u003ccode>hosted[]\u003c/code>、\u003ccode>records[]\u003c/code>\u003c/td>\u003ctd>本地\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>prefs.city\u003c/code>\u003c/td>\u003ctd>默认浏览城市 key（R3 六城之一）\u003c/td>\u003ctd>\u003cstrong>本次浏览偏好 → 本轮提升为账户级默认值\u003c/strong>（R3 中不持久化，每次重置 NYC；③→④）\u003c/td>\u003ctd>即时\u003c/td>\u003ctd>入局接缝列表按此城市筛选；设置首页当前值\u003c/td>\u003ctd>已创建 / 已参加活动的 \u003ccode>event.city\u003c/code>、地点、时区、历史时间（\u003ccode>setCity\u003c/code> 只写 \u003ccode>prefs.city\u003c/code>）\u003c/td>\u003ctd>本地\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>notify.prefs\u003c/code>\u003c/td>\u003ctd>六类提醒开关（邀请 / 预留到期前 / 候补轮到 / 改期 / 活动变化 / 我发起的局）\u003c/td>\u003ctd>账户级\u003c/td>\u003ctd>即时\u003c/td>\u003ctd>通知页、首页计数\u003c/td>\u003ctd>报名、席位、待办事实（关闭提醒不撤回任何事）\u003c/td>\u003ctd>本地（类别来自现有事件：邀请 / 预留 / 候补 / 改期 / 活动变化 ②；「我发起的局」为 ④）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>notify.permission\u003c/code>\u003c/td>\u003ctd>\u003ccode>default\u003c/code> 未请求 / \u003ccode>requesting\u003c/code> / \u003ccode>granted\u003c/code> / \u003ccode>denied\u003c/code> / \u003ccode>unsupported\u003c/code>\u003c/td>\u003ctd>系统层（浏览器 / 系统）\u003c/td>\u003ctd>只能通过「申请系统权限」改变 `default → requesting → granted\u003c/td>\u003ctd>denied\u003ccode>；\u003c/code>denied\u003ccode> / \u003c/code>unsupported` 在产品内不可改\u003c/td>\u003ctd>通知页三态说明、首页当前值\u003c/td>\u003ctd>偏好开关本身仍可保存\u003c/td>\u003ctd>本地模拟：评审面板「系统权限」按钮决定系统的回答；V27 \u003ccode>notificationStatus22 / requestNotification22\u003c/code> 的状态与文案为参照（待抽取核对）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>notify.serviceConnected\u003c/code>\u003c/td>\u003ctd>提醒服务是否连接\u003c/td>\u003ctd>服务层\u003c/td>\u003ctd>产品内不可改（只展示）\u003c/td>\u003ctd>通知页「能否送达」\u003c/td>\u003ctd>—\u003c/td>\u003ctd>本地：默认未连接（真实提醒未接入），面板可切换\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>appearance.skin\u003c/code>\u003c/td>\u003ctd>\u003ccode>cotton 棉糖 / halo 光晕 / sunset 落日\u003c/code>（R3 三套，色值见 \u003ccode>JUS.SKINS[].tokens\u003c/code>）\u003c/td>\u003ctd>账户级\u003c/td>\u003ctd>\u003cstrong>预览 → 应用 / 取消\u003c/strong>（预览是方案内视图态，不写数据；应用才写；取消恢复）\u003c/td>\u003ctd>全方案背景材质（每套用自己的材料表达三种背景；\u003cstrong>方案切换 ≠ 换肤\u003c/strong>）\u003c/td>\u003ctd>—\u003c/td>\u003ctd>本地（R3 用 \u003ccode>H.commit\u003c/code> 持久化到 \u003ccode>ju-visual-motion-r1\u003c/code>；本轮写各自命名空间）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>appearance.reduceMotion\u003c/code>\u003c/td>\u003ctd>减少动态\u003c/td>\u003ctd>账户级\u003c/td>\u003ctd>即时\u003c/td>\u003ctd>全方案动效时长（与评审面板的「减少动态」独立：面板是评审开关，产品内开关是用户偏好）\u003c/td>\u003ctd>—\u003c/td>\u003ctd>本地（R3 只有系统媒体查询，无应用内开关 ③→④）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>records[]\u003c/code>\u003c/td>\u003ctd>账户级事实：\u003ccode>attendance\u003c/code>（出席 / 未出席 · 待核实）、\u003ccode>exit\u003c/code>（主动退出 · 占年度机会）、\u003ccode>change\u003c/code>（预留到期 / 放弃预留 / 退候补 / 拒绝改期 / 局主取消 / 撤回申请 · 不占机会）；每条 \u003ccode>{id, eventId, kind, value?, text, at, status, quota, supplements[], dispute?, appeal?}\u003c/code>\u003c/td>\u003ctd>账户级历史快照（\u003cstrong>只读事实\u003c/strong>）\u003c/td>\u003ctd>事实文本不可改；只能\u003cstrong>追加\u003c/strong> \u003ccode>supplements[]\u003c/code>、\u003ccode>dispute\u003c/code>（仅未出席）、\u003ccode>appeal\u003c/code>（仅主动退出）；状态 \u003ccode>recorded → supplemented / disputed / appealed\u003c/code>；\u003ccode>pending_review\u003c/code> 由演示场景设定\u003c/td>\u003ctd>记录页、详情、首页计数\u003c/td>\u003ctd>事实本身、活动、票根、我的局历史\u003c/td>\u003ctd>本地；真实核实流程未接入（状态只到「已提出」）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>reports[]\u003c/code>\u003c/td>\u003ctd>举报对象：\u003ccode>{id, eventId, text, who[], materials[], at, status, localNo, timeline[], supplements[]}\u003c/code>；状态 \u003ccode>saved / submitted / received / needs_more / closed\u003c/code>\u003c/td>\u003ctd>账户级\u003c/td>\u003ctd>新建 \u003ccode>fileReport\u003c/code>（接缝）；补充 \u003ccode>supplementReport\u003c/code>（\u003ccode>needs_more → submitted\u003c/code> 并追加时间线）；\u003cstrong>用户保存从不自动推进到「已受理 / 已处理」\u003c/strong>，这些只来自演示场景数据\u003c/td>\u003ctd>举报列表、详情、首页计数、我的局接缝回执\u003c/td>\u003ctd>活动与记录\u003c/td>\u003ctd>本地；编号 \u003ccode>R-MMDD-NN\u003c/code> 为本地编号（产品内标「本地编号」）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>feedback[]\u003c/code>\u003c/td>\u003ctd>普通产品反馈 \u003ccode>{id, text, at, status, localNo}\u003c/code>\u003c/td>\u003ctd>账户级\u003c/td>\u003ctd>提交即保存\u003c/td>\u003ctd>帮助页列表\u003c/td>\u003ctd>—\u003c/td>\u003ctd>本地；与举报分开（不同对象）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>session\u003c/code>\u003c/td>\u003ctd>`{kind: demo\u003c/td>\u003ctd>ended, startedAt, device}`\u003c/td>\u003ctd>本机\u003c/td>\u003ctd>「退出登录（本地演示）」结束演示会话；「重新开始」恢复；只作用于本命名空间\u003c/td>\u003ctd>账户页\u003c/td>\u003ctd>已提交记录、举报、资料（结束会话不删除它们）\u003c/td>\u003ctd>本地；真实工程没有登录 / 解绑 / 注销能力（V27、R3 均无，待 V27 抽取最终核对 ⑤）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>flags\u003c/code>\u003c/td>\u003ctd>\u003ccode>failNext\u003c/code>、\u003ccode>copyFailNext\u003c/code>\u003c/td>\u003ctd>评审\u003c/td>\u003ctd>面板设置；引擎下一次写入 / 复制消费\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>评审用\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>3. 五条链路\u003c/h2>\n\u003ch3>3.1 收藏\u003c/h3>\n\u003cul>\n\u003cli>读取：\u003ccode>JUS.derive.favorites(d)\u003c/code>（设置）、\u003ccode>derive.feed(d, 'all'|'fav')\u003c/code>（入局接缝）、\u003ccode>derive.mine(d)\u003c/code>（我的局接缝，每行 \u003ccode>fav\u003c/code>）。\u003c/li>\n\u003cli>修改：\u003ccode>engine.favorite / unfavorite / toggleFavorite\u003c/code>（任一入口）。幂等；效果 \u003ccode>{favorited|unfavorited, eventId, count, first?, last?, already?}\u003c/code>。\u003c/li>\n\u003cli>手势契约（接缝）＝ V27 \u003ccode>favMove / favEnd\u003c/code> + \u003ccode>ju-paper-film\u003c/code> 逐字继承（\u003ccode>JUS.FAV\u003c/code>）：轴判定在移动 ≥6px 后，\u003ccode>|dx| &gt; |dy|×1.25\u003c/code> 为横向；\u003cstrong>右滑 &gt; 82px 且未收藏 = 收进收藏（★），左滑 &lt; −82px 且已收藏 = 拿出收藏（☆）\u003c/strong>；未过阈值或取消（pointercancel / 失焦 / 离屏）回弹无变化，释放回弹 \u003ccode>.5s cubic-bezier(.2,.9,.3,1.04)\u003c/code>；正确方向位移夹到 ±190px；错误方向（右滑已收藏 / 左滑未收藏）位移阻尼 ×0.26 + 灰色洗层 + 文案「已经收着了 / 还没收藏」，释放无变化；拖动中卡片平移并旋转 \u003ccode>dx × 0.012°\u003c/code>；键盘 → / ← 同义。R3 的「任一方向 70px 切换」\u003cstrong>不继承\u003c/strong>（记录为差异，不改原文件）。②\u003c/li>\n\u003cli>不受影响：报名 / 预留 / 候补 / 票根 / 历史 / 席位；取消收藏已报名活动不触发退出。\u003c/li>\n\u003cli>活动改期 / 取消 / 结束：收藏保留，列表分「可报名」与「已结束 / 已取消」归档区；信息随 \u003ccode>events[id]\u003c/code> 最新状态显示。④\u003c/li>\n\u003cli>返回 / 刷新：命名空间持久化（\u003ccode>store.save\u003c/code> 在每次成功写入后）；重置清空。\u003c/li>\n\u003cli>验收：见 §5 表。\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 资料\u003c/h3>\n\u003cul>\n\u003cli>读取：\u003ccode>d.you\u003c/code>；接缝 \u003ccode>derive.mine\u003c/code> 每行 \u003ccode>snapshotLabel\u003c/code>（报名时填写的资料）。\u003c/li>\n\u003cli>校验 = V27 \u003ccode>card3Ok / cardError26 / sendCode\u003c/code> 逐字：称呼必填、≤10 个字（grapheme 计数）「请填写称呼 / 称呼最多10个字」；微信号必填、\u003ccode>/^[A-Za-z0-9_-]+$/\u003c/code>「请填写微信号 / 微信号仅填写字母、数字、下划线或短横线」；邮箱可空，格式「邮箱格式不正确」，免费邮箱黑名单（gmail / qq / 163 / 126 / outlook / hotmail / yahoo / icloud / foxmail / me / live / sina）「请使用工作或学校邮箱」。\u003c/li>\n\u003cli>邮箱验证 = V27 本机测试码流程：\u003ccode>requestEmailCode\u003c/code>（6 位码 = \u003ccode>String(246809 + generation).padStart(6,'0')\u003c/code>，59s 重发倒计时，5 分钟过期；测试码只显示在评审面板）→ \u003ccode>verifyEmailCode\u003c/code>（错「验证码不正确」/ 过期「验证码已过期，请重新发送」）→ 保存。\u003cstrong>改了邮箱而未验证不能保存\u003c/strong>（「请完成邮箱验证，或清空后跳过」），这是 V27 的规则；清空邮箱可直接保存。\u003c/li>\n\u003cli>修改：\u003ccode>engine.saveProfile({name, wx, email})\u003c/code>：校验不通过返回 \u003ccode>{type:'invalid', errors}\u003c/code> \u003cstrong>不写入\u003c/strong>；通过则写入，邮箱改动时 \u003ccode>emailVerified = true\u003c/code>（已验证）并记录域名。\u003c/li>\n\u003cli>取消 = 丢弃编辑态；未保存返回 → 确认（\u003ccode>COPY.unsaved\u003c/code>）；失败 → 保留输入 + 重试（\u003ccode>failNext\u003c/code>）。\u003c/li>\n\u003cli>快照：\u003ccode>joined[].snapshot\u003c/code> 不变；资料页与接缝提示 \u003ccode>COPY.snapshotNote\u003c/code>。\u003c/li>\n\u003cli>三件不同的事：自己的微信（\u003ccode>you.wx\u003c/code>，可编辑）/ 别人能否看见你的微信（隐私页按活动与角色派生，不可开关）/ 你能否看见局主微信（接缝详情按 \u003ccode>canSeeHostWx\u003c/code> = 撕开有效票且联系未关闭）。\u003c/li>\n\u003c/ul>\n\u003ch3>3.3 城市\u003c/h3>\n\u003cul>\n\u003cli>读取：\u003ccode>derive.city(d)\u003c/code>、\u003ccode>derive.feed\u003c/code> 按 \u003ccode>prefs.city\u003c/code>。修改：\u003ccode>engine.setCity({city})\u003c/code> 即时。搜索：方案内按名称 / 拼音代码过滤六城；无结果文案 \u003ccode>CITY_COPY.noResult / retry\u003c/code>。\u003c/li>\n\u003cli>不改：\u003ccode>events[].city / loc / iso\u003c/code>；跨城市收藏在列表上标城市与「当地时间」（\u003ccode>crossCity\u003c/code>）。\u003c/li>\n\u003cli>R3 的草稿 \u003ccode>cityPatch\u003c/code>（清空地点、重映射时区）\u003cstrong>不套用到全局偏好\u003c/strong>。②\u003c/li>\n\u003c/ul>\n\u003ch3>3.4 通知\u003c/h3>\n\u003cul>\n\u003cli>三层分开呈现：偏好（\u003ccode>prefs\u003c/code>，可改）/ 系统权限（\u003ccode>permission\u003c/code>，只能申请一次）/ 服务连接（\u003ccode>serviceConnected\u003c/code>，只展示）。\u003ccode>derive.notify(d).deliverLabel\u003c/code> 给出综合结论（能否送达）。\u003c/li>\n\u003cli>文案 = V27 \u003ccode>notificationLabel22 / notificationCopy22\u003c/code> 逐字（\u003ccode>JUS.COPY.permission\u003c/code>）：按钮「开启提醒 / 请求中 / 已允许通知 / 已拒绝 / 暂不支持」，说明「可允许系统通知；消息提醒暂未开通，请在“我的局”查看邀请。」等；V27 把它放在报名表第 5 步「别错过邀请」，设置是\u003cstrong>本轮新增的账户级落点\u003c/strong>（④）。\u003c/li>\n\u003cli>申请流程：\u003ccode>requestPermission\u003c/code>（→ \u003ccode>requesting\u003c/code>）→ 方案动画「系统弹窗」→ \u003ccode>resolvePermission()\u003c/code>：系统回答来自评审面板预设 \u003ccode>flags.permissionAnswer\u003c/code>（默认允许，可预设拒绝）。\u003ccode>denied\u003c/code> / \u003ccode>unsupported\u003c/code> 下开关可存但页面明确「不会显示提醒」；\u003ccode>denied\u003c/code> 后产品内不能再申请（只能提示去浏览器设置），与 V27 一致。\u003c/li>\n\u003cli>不可关闭类别：现有规则没有 → 全部可关（不自行添加）。①\u003c/li>\n\u003cli>不编造已发送 / 已送达。\u003c/li>\n\u003c/ul>\n\u003ch3>3.5 记录 · 举报 · 申诉 · 反馈\u003c/h3>\n\u003cul>\n\u003cli>记录对象 = V27 \u003ccode>creditEvents\u003c/code> 事实（\u003ccode>type ∈ active_withdrawal / reservation_released / reservation_expired / queue_left / host_reschedule_declined / host_cancelled / absence_reported\u003c/code> + 我的局的 \u003ccode>attended\u003c/code>；\u003ccode>status ∈ recorded / pending_review / corrected / dismissed / verified\u003c/code>；\u003ccode>penalty:null\u003c/code>；\u003ccode>eligible\u003c/code>）。标签与状态字逐字用 V27 \u003ccode>creditLabel / creditStatus\u003c/code>（\u003ccode>JUS.creditLabel / creditStatus\u003c/code>）：「主动告知退出 · 已记录」「未出席记录 · 待核实 · 未处罚」「已拒绝局主改期 · 已记录 · 不占主动退出机会」等。页顶说明 = \u003ccode>JuRules26.copy.creditRecord + creditBoundary\u003c/code>（\u003ccode>COPY.creditSettings\u003c/code>）。\u003c/li>\n\u003cli>补充与申诉：\u003ccode>derive.records\u003c/code> → 详情 \u003ccode>derive.record(id)\u003c/code> → \u003ccode>addSupplement\u003c/code>（任何记录，追加 \u003ccode>supplements[]\u003c/code>）/ \u003ccode>fileDispute\u003c/code>（仅 \u003ccode>absence_reported\u003c/code>，一次，\u003ccode>appeals[].kind='dispute'\u003c/code>）/ \u003ccode>fileAppeal\u003c/code>（仅 \u003ccode>active_withdrawal\u003c/code>，一次，\u003ccode>kind='appeal'\u003c/code>）；三者都是 V27 的「补充与申诉 → 补充事实或申诉说明 → 保存说明」，结果状态只有 \u003ccode>pending_review\u003c/code>，成功文案「申诉说明已保存本机，尚未提交审核服务。」，失败「申诉未保存，内容已保留，请重试。」（V27 逐字）。输入 ≥4 字；重试不重复（引擎拒绝第二次异议 / 申诉）。\u003c/li>\n\u003cli>举报对象 = V27 \u003ccode>report\u003c/code>（\u003ccode>id 'DEMO-&lt;base36&gt;-&lt;n&gt;'\u003c/code>、\u003ccode>text / who / whoName / shots[] / status / createdAt / updatedAt / timeline[] / supplements[]\u003c/code>），状态字 \u003ccode>JUS.REPORT_LABELS\u003c/code>（已受理 / 处理中 / 需补充 / 已处理 / 提交失败 + 本轮增加的「已提交」）。\u003ccode>derive.reports\u003c/code> → 详情（状态、活动、举报对象、原文、截图、受理编号、更新时间、时间线、已提交补充）→ 仅 \u003ccode>needs_info\u003c/code> 时「补充材料 / 提交补充」（\u003ccode>supplementReport\u003c/code> → \u003ccode>processing\u003c/code>，V27 规则）；失败「补充未提交，内容已保留，请重试。」。接缝的我的局历史行可 \u003ccode>fileReport\u003c/code>（≥4 字；必须选对象；新举报状态 \u003ccode>submitted\u003c/code>，\u003cstrong>不自动变成已受理\u003c/strong>，这是对 V27 mock 行为的有意修正 ④）。\u003c/li>\n\u003cli>反馈：\u003ccode>submitFeedback\u003c/code>，与举报分开（V27 帮助与反馈页只有「我的举报」一行，反馈表单为本轮新增 ④）。\u003c/li>\n\u003cli>多对象切换时草稿不串：方案内编辑态以 \u003ccode>[kind, eventId, key]\u003c/code>（V27 \u003ccode>objectKey26\u003c/code>）或 \u003ccode>recordId / reportId\u003c/code> 为键保存草稿文本；草稿保存失败文案「草稿未保存，当前内容仍保留，请重试。」。\u003c/li>\n\u003c/ul>\n\u003ch2>4. 保存 / 失败 / 返回 / 重复 / 刷新 / 隔离（全方案统一）\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>情形\u003c/th>\u003cth>规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>即时型（开关、城市、减少动态、收藏）\u003c/td>\u003ctd>点击即写入；写入失败 → 控件回到原态 + 失败提示 + 重试（面板「下一次保存失败」可演示）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>显式保存型（资料、补充、异议、申诉、举报补充、反馈）\u003c/td>\u003ctd>编辑中 → 校验 → 保存中（≥ 300ms 可见）→ 成功落定（结果在原位）/ 失败保留输入 + 重试；重试不产生第二条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>预览型（外观）\u003c/td>\u003ctd>预览不写数据；应用写；取消 / 返回恢复原值\u003c/td>\u003c/tr>\u003ctr>\u003ctd>未保存返回\u003c/td>\u003ctd>有改动时弹确认：继续编辑 / 放弃修改\u003c/td>\u003c/tr>\u003ctr>\u003ctd>快速重复点击 / 滑动\u003c/td>\u003ctd>引擎幂等；UI 在处理中禁用触发器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>刷新 / 重新进入\u003c/td>\u003ctd>从命名空间恢复（标准画布）；预览与对比视图不持久化\u003c/td>\u003c/tr>\u003ctr>\u003ctd>切换方案 / 重置\u003c/td>\u003ctd>不污染其他方案；重置只清当前键并回到标准示例\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>5. 收藏接缝验收表（每套都要实际验证）\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>场景\u003c/th>\u003cth>引擎 / 派生保证\u003c/th>\u003cth>验证方法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>入局接缝收藏未报名活动 A（如 \u003ccode>hotpot\u003c/code>）\u003c/td>\u003ctd>\u003ccode>favorite\u003c/code> 加入 → \u003ccode>favorites\u003c/code> 出现 A；\u003ccode>joinedRow(A)\u003c/code> 仍为 null\u003c/td>\u003ctd>capture：拖动 → 跳 \u003ccode>s-fav\u003c/code> 截图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>收藏管理取消 A，回到来源\u003c/td>\u003ctd>\u003ccode>unfavorite\u003c/code> → 接缝标记消失、计数减一\u003c/td>\u003ctd>跳 \u003ccode>s-fav\u003c/code> 取消 → 跳 \u003ccode>s-seam-feed\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>入局取消 A，回收藏管理\u003c/td>\u003ctd>同上反向\u003c/td>\u003ctd>同上\u003c/td>\u003c/tr>\u003ctr>\u003ctd>我的局接缝操作同一活动（如 \u003ccode>sketch\u003c/code>）的收藏\u003c/td>\u003ctd>三处读同一 \u003ccode>favorites\u003c/code>；\u003ccode>joined[sketch].stage\u003c/code> 不变\u003c/td>\u003ctd>\u003ccode>s-seam-mine\u003c/code> 切换 → \u003ccode>s-fav\u003c/code> → \u003ccode>s-seam-feed\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>重复点击 / 滑动\u003c/td>\u003ctd>\u003ccode>already\u003c/code> 不加条目\u003c/td>\u003ctd>连续两次拖动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>取消最后一个\u003c/td>\u003ctd>\u003ccode>last:true\u003c/code> → 空态\u003c/td>\u003ctd>\u003ccode>empty\u003c/code> 变体收藏一个再取消\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已报名 / 已出票 / 历史的 A 取消收藏\u003c/td>\u003ctd>只改 \u003ccode>favorites\u003c/code>\u003c/td>\u003ctd>\u003ccode>theater\u003c/code>（going，已撕票）取消收藏后 \u003ccode>ticket.torn\u003c/code> 仍 true\u003c/td>\u003c/tr>\u003ctr>\u003ctd>改期 / 取消 / 结束\u003c/td>\u003ctd>列表显示最新状态并归档\u003c/td>\u003ctd>\u003ccode>many\u003c/code> 变体含 \u003ccode>coffee\u003c/code>（可报名）与历史活动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>从收藏打开详情\u003c/td>\u003ctd>权限同来源：未撕票看不到局主微信\u003c/td>\u003ctd>\u003ccode>s-fav-detail\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同名 / 跨城市 / 改标题\u003c/td>\u003ctd>id 身份；\u003ccode>vintage\u003c/code> vs \u003ccode>thrift\u003c/code>；\u003ccode>lanight\u003c/code>（LA）\u003ccode>bosdim\u003c/code>（BOS）\u003c/td>\u003ctd>\u003ccode>many\u003c/code> 变体\u003c/td>\u003c/tr>\u003ctr>\u003ctd>保存失败后重试\u003c/td>\u003ctd>\u003ccode>failNext\u003c/code> 消费一次；图标 / 计数与数据一致\u003c/td>\u003ctd>面板武装失败 → 操作 → 重试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>返回 / 重进 / 刷新\u003c/td>\u003ctd>命名空间恢复\u003c/td>\u003ctd>刷新独立画布\u003c/td>\u003c/tr>\u003ctr>\u003ctd>切换方案 / 重置\u003c/td>\u003ctd>键隔离\u003c/td>\u003ctd>两套各自操作后互查\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>6. 源码冲突与处理决定\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>冲突\u003c/th>\u003cth>决定\u003c/th>\u003cth>依据\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>收藏键：V27 `city\u003c/td>\u003ctd>title\u003ccode> / R3 \u003c/code>城市:下标` / 我的局无\u003c/td>\u003ctd>canonical \u003ccode>eventId\u003c/code>；映射表 \u003ccode>JUS.IDMAP\u003c/code>（V27 可映射，R3 不可）\u003c/td>\u003ctd>①②\u003c/td>\u003c/tr>\u003ctr>\u003ctd>手势：V27 方向性 82px / R3 任一方向 70px 切换\u003c/td>\u003ctd>方向性（V27 全部参数与文案逐字）\u003c/td>\u003ctd>①（简报指定）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>V27 收藏无持久化（会话级）\u003c/td>\u003ctd>设置提升为账户级持久化（命名空间键）\u003c/td>\u003ctd>④\u003c/td>\u003c/tr>\u003ctr>\u003ctd>V27 设置首页只有「信用记录 / 帮助与反馈」两行；无资料 / 通知 / 外观 / 关于 / 账户\u003c/td>\u003ctd>两项职责逐字承接；其余为本轮新增的账户级设计（函数归属表注明 ④）\u003c/td>\u003ctd>②④\u003c/td>\u003c/tr>\u003ctr>\u003ctd>V27 资料按活动草稿存（\u003ccode>r.draft\u003c/code> / \u003ccode>submittedProfile\u003c/code>），无账户级\u003c/td>\u003ctd>新建账户级 \u003ccode>you\u003c/code>；报名快照保留\u003c/td>\u003ctd>③→④\u003c/td>\u003c/tr>\u003ctr>\u003ctd>V27 举报创建即 \u003ccode>accepted\u003c/code>（isolated mock）\u003c/td>\u003ctd>用户新举报为 \u003ccode>submitted\u003c/code>；受理 / 处理中 / 需补充 / 已处理只由演示数据产生\u003c/td>\u003ctd>①（简报 §08A）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>V27 「撕券后 8 小时内联系」只是文案，\u003ccode>canContact\u003c/code> 只实现散场 24h 关闭\u003c/td>\u003ctd>隐私页与接缝沿用 24h 实现；8h 只作提示文字，不加计时器\u003c/td>\u003ctd>②\u003c/td>\u003c/tr>\u003ctr>\u003ctd>V27 微信可见性方向：文案「仅局主可见你的微信」，实现是「成员撕券后看局主」\u003c/td>\u003ctd>隐私页两条都写明：成员看局主（已实现条件）与局主看成员（规则文案）\u003c/td>\u003ctd>②⑤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>V27 设置子屏无 URL / history，切 tab 不重置子屏\u003c/td>\u003ctd>方案内自管返回栈；来自接缝时记录来源并原路返回\u003c/td>\u003ctd>④\u003c/td>\u003c/tr>\u003ctr>\u003ctd>取消收藏：R3 写 \u003ccode>false\u003c/code>\u003c/td>\u003ctd>删除条目\u003c/td>\u003ctd>④\u003c/td>\u003c/tr>\u003ctr>\u003ctd>皮肤真值双源（\u003ccode>ju-visual-motion-r1\u003c/code> vs \u003ccode>ju-background-skin-v1\u003c/code>）\u003c/td>\u003ctd>设置只写自己命名空间；记录双源问题，不迁移旧键\u003c/td>\u003ctd>②\u003c/td>\u003c/tr>\u003ctr>\u003ctd>棉糖调色两套（R3 three.js vs v17 兜底）\u003c/td>\u003ctd>以 R3 \u003ccode>cotton-bg\u003c/code> 通道色为准（\u003ccode>JUS.SKINS[0].tokens.bg\u003c/code>）\u003c/td>\u003ctd>②\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复制反馈：我的局十套假成功；R3 「正在复制…/已复制/复制失败 · 点击重试」；V27 成功 toast「微信号已复制」、失败 toast「未能复制，请长按微信号手动复制」/ 行内「复制失败，请长按账号复制」\u003c/td>\u003ctd>真实 clipboard 结果决定反馈（V27 文案逐字）；失败时给可手动复制的内容；面板「下一次复制失败」可模拟\u003c/td>\u003ctd>②③\u003c/td>\u003c/tr>\u003ctr>\u003ctd>举报对象：我的局各套只存句子\u003c/td>\u003ctd>设置自有 \u003ccode>reports[]\u003c/code> 结构化对象；我的局接缝回执读同一对象\u003c/td>\u003ctd>③→④\u003c/td>\u003c/tr>\u003ctr>\u003ctd>浏览城市不持久化（R3）\u003c/td>\u003ctd>提升为账户级默认值\u003c/td>\u003ctd>④\u003c/td>\u003c/tr>\u003ctr>\u003ctd>减少动态只有系统媒体查询（R3）\u003c/td>\u003ctd>增加应用内偏好\u003c/td>\u003ctd>①（简报要求考虑减少动态）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>年度退出次数计数\u003c/td>\u003ctd>只列事实与规则文字，不算「还剩 N 次」\u003c/td>\u003ctd>①（简报 §08E）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>账户 / 登录能力\u003c/td>\u003ctd>无依据 → 「退出登录（本地演示）」「本机演示数据」标明本地演示；不发明密码 / 绑定\u003c/td>\u003ctd>①⑤\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>7. 评审面板的模拟能力（画面外）\u003c/h2>\n\u003cp>变体（标准 / 全空 / 较多 / 长文本 / 已拒绝 / 不支持 / 已连接 / 新用户）· 下一次保存失败 · 下一次复制失败 · 系统权限（未请求 / 请求中 / 已允许 / 已拒绝 / 不支持）· 系统回答预设（允许 / 拒绝）· 提醒服务连接 · 本机测试验证码显示 · 速度 1× / 0.5× · 暂停 · 关键帧 · 减少动态（评审开关）· 重播 · 重置本套。\u003c/p>","functions":"\u003ch1>「设置」功能归属表（共同台账）\u003c/h1>\n\u003cp>列：功能／对象 → 依据与状态（①用户要求 ②源码既有 ③旧稿意图但占位或错误 ④本轮设计建议 ⑤待核实）→ 原始入口 → 本轮归属 → 操作者 → 读取位置 → 修改位置 → 数据源与稳定 ID → 操作结果 → 不应受影响的状态 → 保存、失败、返回规则 → 代码位置 → 十套覆盖情况（由 \u003ccode>settings/spec/coverage.md\u003c/code> 在实现后生成）。\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>功能／对象\u003c/th>\u003cth>依据与状态\u003c/th>\u003cth>原始入口\u003c/th>\u003cth>本轮归属\u003c/th>\u003cth>操作者\u003c/th>\u003cth>读取位置\u003c/th>\u003cth>修改位置\u003c/th>\u003cth>数据源 / ID\u003c/th>\u003cth>操作结果\u003c/th>\u003cth>不应受影响\u003c/th>\u003cth>保存 / 失败 / 返回\u003c/th>\u003cth>代码位置\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>设置首页与导航\u003c/td>\u003ctd>① + ② V27 \u003ccode>rootTabs18 / settings19\u003c/code>（底部导航「找局 / 开局 / 我的局 / 设置」；V27 设置首页只有「信用记录 ›」「帮助与反馈 ›」两行，子屏 home / help / reports / detail / credit，返回链 detail→reports→help→home、credit→home，无 URL）；其余分组为 ④ 新增\u003c/td>\u003ctd>V27 底部导航（#s01 \u003ccode>.ju-main-nav\u003c/code>）；我的局十套静态「设置」字\u003c/td>\u003ctd>设置首页：分组、当前值、身份、需要处理的计数；二级进入与返回原位\u003c/td>\u003ctd>用户\u003c/td>\u003ctd>\u003ccode>derive.summary\u003c/code>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>进入二级、返回原位置；来自接缝时回到来源\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>\u003ccode>jus-data.js derive.summary\u003c/code>；各方案 \u003ccode>applyJump\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>个人资料（称呼 / 微信 / 邮箱 + 验证状态）\u003c/td>\u003ctd>② V27 报名表 s03 五张卡：怎么称呼（≤10 字）/ 微信号（字母数字下划线短横线）/ 捎句话（每局，不进账户）/ 工作／学校邮箱（免费邮箱黑名单 + 本机 6 位测试码、59s 重发）——\u003cstrong>按活动存草稿，无账户级\u003c/strong> → ④ 本轮新建账户级 \u003ccode>you\u003c/code> 并沿用同一套校验与验证流程\u003c/td>\u003ctd>V27 报名表 s03；局主审核中的「nyu.edu 邮箱已验证 / 未验证邮箱」\u003c/td>\u003ctd>查看、编辑、校验、保存、取消、失败恢复；区分默认资料与报名快照\u003c/td>\u003ctd>用户\u003c/td>\u003ctd>\u003ccode>d.you\u003c/code>；接缝 \u003ccode>mine[].snapshotLabel\u003c/code>\u003c/td>\u003ctd>\u003ccode>engine.saveProfile\u003c/code>\u003c/td>\u003ctd>\u003ccode>you.id\u003c/code>\u003c/td>\u003ctd>保存成功原位更新 + 「已保存」；邮箱改动 → 未验证\u003c/td>\u003ctd>\u003ccode>joined[].snapshot\u003c/code>、历史、已发布活动\u003c/td>\u003ctd>显式保存；失败保留输入；未保存返回确认\u003c/td>\u003ctd>\u003ccode>jus-data.js validate / engine.saveProfile\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>收藏的局\u003c/td>\u003ctd>① 必做接缝；② V27 \u003ccode>favKeyAt/favMove/favEnd/filteredFeed\u003c/code>（键 `city\u003c/td>\u003ctd>title\u003ccode>，右滑 82px 收进 / 左滑拿出，会话级无持久化，「收藏」pill 筛选）；② R3 \u003c/code>H.state.favorites\u003ccode>（\u003c/code>城市:下标`，任一方向 70px 切换）；③ 我的局无\u003c/td>\u003ctd>V27 入局 01 卡轮横滑 / 方向键；R3 首页横滑\u003c/td>\u003ctd>设置 › 收藏管理（列表、状态识别、详情、取消、恢复、空态、归档） 3c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>\u003ccode>jus-panel.html\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>钱包 / 支付 / 会员 / 积分 / 排行榜 / 黑名单 / 改密码 / 手机号登录\u003c/td>\u003ctd>① 不扩张；⑤ 无依据\u003c/td>\u003ctd>—\u003c/td>\u003ctd>\u003cstrong>不做\u003c/strong>（列为核查项，无证据）\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","mapping":"\u003ch1>「设置」十套 · 参考映射（每套 5–8 例，跨 ≥3 类，写出具体转译）\u003c/h1>\n\u003cp>编号：REFnn = 上一轮继承案例（\u003ccode>research/ledger.md\u003c/code>，证据 \u003ccode>research/evidence/\u003c/code>）；SUnn / SEnn / SDnn / SMnn = 本轮新增（\u003ccode>settings/research/ledger.md\u003c/code>）。类别：ui / motion / editorial / designer / award。「转译」写的是该案例的哪一个可见事实被用在本套的哪个组件上；不是形容词。动效类案例以「已看动效」为准。SM（设置相关动效新增）到位后补入对应套。\u003c/p>\n\u003ch2>SC01 登记表\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>案例\u003c/th>\u003cth>类别\u003c/th>\u003cth>转译到本套\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SU01 Android Settings 模式\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>「行尾当前值 / 标签下一行摘要 / 行尾开关」三种行式 → 登记表三格：字段名 ｜ 当前值 ｜ 状态章；Dependency（父开关关闭子项置灰并在组脚写明）→ 通知附表里「系统已拒绝」时整组开关格划淡线并在表脚印原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU03 HIG Lists and tables\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>组头 / 组脚解剖与「Title Detail ›」→ 表格粗线分组 + 组脚一行说明；只解释不跳转的行用 ⓘ → 表里用「注」小字格而非箭头；长值中段省略 → 长邮箱在格内折行不省略（中文表格可撑高）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU04 M3 Switch\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>开关即时生效、不配保存钮 → 盖章开关点即盖、不进入编辑态；&gt;2 互斥用单选 → 外观三选一用一排勾选格\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE04 《字誌》目录\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>「▌ / 【】 / [ ]」三种记号区分层级而不缩进 → 表内一级分组用粗线 + ▌，二级用【】，插入说明用 [注]；「展開 / 收合」放段末 → 规则长文在表尾展开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE02 Emigre #64 版权页与目录\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>版权页十行（版本 / 印次 / 编辑 / 地址 / ISBN）→ 关于页的「登记表尾页」：版本、构建号、本地演示说明；目录「页码左 / 标题 / 作者斜体缩进」→ 记录附表「序号 / 事实 / 来源与时间」三段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD01 Margiela AW97 空白标 + 四针\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>身份靠固定方式不靠文字 → 记录附表每行左端四个针点 = 「已记录（不可改）」，补充 / 异议用夹带的小纸条另加；布边循环织字 → 表格页边印「JU · 设置 · 阿禾 · 2026」循环小字\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF45 FigJam 印章工具（Rive）\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>章落在点击位置、后盖压先盖、略带随机倾斜 → 盖章开关的章落点在该格中心、每次角度 ±3° 随机、关态斜线划掉后再盖「关」压在上面\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF94 My Japan Railway 数字站章\u003c/td>\u003ctd>award\u003c/td>\u003ctd>单色粗糙边章 + 汉字 + 日期 → 状态章「已验证 / 未验证 / 已更新 / 待核实」的形制：朱红单色、粗糙边、汉字 + 四位日期\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM05 Telegram Android 左滑归档\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>动作区「色条 → 图标 → 文字」三步渐进露出、到阈值图标涟漪 + 整区换色 → 接缝列表行滑动收藏：表格行右滑时右侧依次露出朱红色条 → ☆ → 「收进收藏」，到 82px 时整区换色\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>SC02 面板\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>案例\u003c/th>\u003cth>类别\u003c/th>\u003cth>转译到本套\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SU05 飞书通知设置三层\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>应用内偏好 → 系统权限状态卡（标题 + 状态 + 去设置）→ 诊断入口 → 面板上三件硬件：拨杆（偏好）/ 权限 LED + 铭牌文字（系统）/ 投递 LED（服务）；「收不到通知？」= 面板底部一行 LCD 诊断读数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU02 HIG Toggles\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>状态差异不只靠颜色 → 拨杆用位置（上 / 下）+ LED 亮灭 + 刻字「开 / 关」三重表达；关态轮廓可辨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU07 Telegram 退群确认\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>问句标题 + 加粗关键名词的后果 + 唯一填色红钮放最后 → 保护盖红钮：翻盖后 LCD 显示后果（「只结束本机演示会话，已提交记录不删除」），红钮是面板上唯一的红\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD03 Helmut Lang SS03\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>强调色只出现在闭合 / 连接件 → 橙色只用于拨杆头、旋钮指示线、LED；禁用 = 局部透明（袖子上半截换薄纱）而不是整模块灰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD05 Rick Owens SS18 硬件\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>抽绳结 = 可调、D 环弹簧钩 = 可挂接、拉链 = 开合 → 旋钮（城市 / 外观可调）、卡槽（收藏可挂）、拨杆（开合）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF28 Family-style dialog\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>按钮本身长成确认卡、位置连续 → 红钮按下后不弹层：按钮所在模块就地升起成确认面板，取消从旁分裂\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF88 Gentler Streak\u003c/td>\u003ctd>award\u003c/td>\u003ctd>「顶栏状态胶囊 + 图标 + 标题 + 一句说明 + 唯一控件」四段式 → 每个模块面板的解剖：铭牌（标题）+ 状态 LED + 一行 LCD 说明 + 一个控件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF20 iOS Menu（paco.me）\u003c/td>\u003ctd>ui（已看动效）\u003c/td>\u003ctd>二级操作原位向下展开、上层压暗 → 模块抬起成全屏时其余模块暗下 20% 并退后\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM01 M3 Switch 动效\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>「颜色先走、柄后到、图标最后」≤100ms，开态 1–2px 过冲 → 拨杆：LED 先亮、杆后到位、刻字最后显示；只在开态落点过冲\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM03 M3 Transition patterns（iOS 推入）\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>新页右入 + 父页左退 1/3 并压暗 → 模块抬起成全屏时面板其余部分向后退并暗下，返回时从 −1/3 亮起\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>SC03 文件袋\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>案例\u003c/th>\u003cth>类别\u003c/th>\u003cth>转译到本套\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SE03 Eye「Issues」索引\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>每格六段固定结构 + 状态只有三个词 + 不做年份分组 → 收藏袋里的纸片：局名 / 日期 / 城市 / 三行要点 / 状态词（可报名 · 已结束 · 已取消）只给状态词上色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU11 Creliq 设置 shot\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>身份块 + 分组行；表单「标签在上 + 框内图标」+ 底部「关闭 / 保存」等宽双钮 → 抽出的纸片上的资料表单\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU08 Signal 资料编辑\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>组脚写明「谁能看见」；「取消 ｜ 字段名 ｜ 完成」→ 纸片编辑时袋口标签写「仅同局成员可见」；纸片顶栏三段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD04 Craig Green AW18\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>袋子用绳吊在框上、闭合全是系带 → 文件袋挂在横向索引轨上；所有可操作件统一为按扣一种形态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD02 Yohji SS99 层层露出\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>每层本身完整；收起时露一条里层的边 → 后面的袋子露出 8px 上缘与标签色，前袋半透明透出内容第一行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF17 Vaul 抽屉\u003c/td>\u003ctd>ui（已看动效）\u003c/td>\u003ctd>背景同步缩小约 3% 并压暗 → 抽出一个袋时整叠后退 3% 并加雾\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF43 Card Shuffle（Rive）\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>以角为支点扇开约 12° → 拉标签时袋子以左下角为支点先扇出 6° 再平移到最前\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF40 Card Stack Effects\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>顶卡滑出半透明化、下一张顶上 → 插回时袋子滑入叠中，后袋顶上\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM02 M3 Bottom sheets 拖拽预览\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>拖拽中用「下一状态才有的控件淡入」预览结果；过阈值 ≤200ms 离场；取消 = 控件淡出 + 回位不弹跳 → 抽袋：拉动标签时袋口先露出「里面的第一张纸」作为预览，过阈值袋子 200ms 内到前\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM06 Telegram 多选 + 摘要行\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>选中即实心勾 + 顶部摘要逐项追加；保存 = 模态下滑 250ms 且父页先显示新值 → 通知类别纸片：勾选即填实，袋面标签摘要同步追加\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>SC04 手册\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>案例\u003c/th>\u003cth>类别\u003c/th>\u003cth>转译到本套\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SE01 IDEA No.400 目录\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>「Chapter 标签 → 章题 → 条目 → 署名」四级 + 左栏档案侧块（大数字 + 日期 + 两枚按钮 + 相关列表）→ 身份页：大号「加入第 N 天」数字 + 日期 + 两枚按钮（编辑 / 分享）+ 相关（收藏 / 记录）；每条设置的署名行写「谁能看见 · 上次修改」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE02 Emigre 版权页\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>版权页十行 → 封底「关于」页；目录三段式 → 章节目录页\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD01 Margiela 空白标 + 四针\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>四角钉点 = 已固定 → 记录页每条事实左侧四针点；边缘织字 → 页边「JU ✕ 阿禾 ✕ 2026」循环\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU06 Telegram 资料字段\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>小标签在上、值在下、右端动作（二维码 / 复制）→ 身份页字段行；默认项长按就地设置 → 城市页长按「设为默认」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU12 Notion 账户偏好\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>外观三项单选；邮箱改动需重新验证 → 外观页三枚单选圆；邮箱页「改动后标未验证」说明行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF38 Folding the DOM\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>翻折先露半透明背面薄片、越过水平线才显内容 → 翻页：背面透印 25% 灰、过中线后内容显现\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF39 BookBlock\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>中缝立起的渐变页边 → 书脊轴翻页的页边渐变与阴影\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF94 My Japan Railway 站章\u003c/td>\u003ctd>award\u003c/td>\u003ctd>单色章密网格 + 「计数 → GET! → 章 → 名 → 时间戳」五段 → 记录页小方章（待核实 / 已核实 / 已补充）与保存落定的「章 → 事实 → 时间」三段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM03 M3 Transition patterns\u003c/
