td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>返回 200–300ms 不长于推入；父页滚动位置与高亮行保持 → 翻回目录时落在原条目，翻回时长 ≤ 翻入\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>SC05 冰箱门\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>案例\u003c/th>\u003cth>类别\u003c/th>\u003cth>转译到本套\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>REF92 Thomas Gertenbach 石膏桌拍立得\u003c/td>\u003ctd>award（已看动效）\u003c/td>\u003ctd>带白边随机轻旋的拍立得 + 手写名 + 拿走留投影 → 门上传单 / 名片 ≤3° 错落；取下时门上留淡影；拉远成网格 = 「全部收藏」视图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU11 Creliq 设置 shot\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>头像 + 称呼 + 邮箱身份块、头像角上编辑徽标 → 门顶「名片」磁贴压角；编辑徽标 = 角上的小磁铁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU01 Android Dependency\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>父开关关闭时子项置灰并写原因 → 白板上「允许通知」勾选关闭时下面各行用干擦笔划淡 + 一行小字原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF45 FigJam 印章工具\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>章落在点击位置并互相压叠 → 磁贴吸在松手处，后贴压先贴，位移回弹 4px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF41 Tearable Cloth\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>牵引点先动、下摆滞后回摆 → 拿起传单时顶边先动、底边拖尾回摆一次\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD04 Craig Green AW18\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>所有闭合用同一种系带 → 门上所有可操作件都是同一种圆磁贴（翻面 = 开关、取下 = 删除、吸上 = 收藏）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE03 Eye 索引状态三词\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>状态只用三个词、只给状态词上色 → 传单右下角一枚小贴纸「可报名 / 已结束 / 已取消」，整张纸不变色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF46 Receipt Animation（Lottie）\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>票沿对角抽出、抽出后翻到上层 → 便签从门上揭下时从下层翻到上层\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM04 Telegram Select Theme 即时预览\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>点一张卡后景立刻换主题；主按钮只在有未应用更改时出现；应用后面板 150ms 下滑并留一条确认记录；取消回滚 → 外观：点一枚色样磁贴整扇门立刻换色，「贴上」按钮只在有未应用更改时出现\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM07 Jakub Krehel 列表行拖拽\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>44 / 88px 两级露出、58px 提交阈值、动作钮 scale .75→1 淡入、未过阈值 2–3px 过冲回弹 → 传单拖动：露出的「收藏 / 取下」磁贴按 scale .75→1 出现，回弹允许 2–3px 过冲\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>SC06 内衬\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>案例\u003c/th>\u003cth>类别\u003c/th>\u003cth>转译到本套\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SD01 Margiela AW97 空白标 + 四针\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>空白织唛 + 四角针脚 = 「我」；布边织字循环 → 顶部织唛（称呼 / 账号）、袋口织带循环印「仅局主可见 ✕ 成局后 ✕ 24h」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD02 Yohji SS99\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>暗门襟、层层都是完整一件、领巾单结一拉就开 → 外层行不露控件（整行可点）、里层袋内是完整面板、「临时关闭某类提醒」用系结一拉即解\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD05 Rick Owens SS18\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>箱形袋用带子挂、拉链 = 开合 → 记录 / 举报是挂在里布上的硬质袋，拉链展开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD03 Helmut Lang SS03\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>强调色只在闭合件 → 橙只用于拉链头与按扣\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU08 Signal 组脚\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>组脚写「这组字段谁能看见」→ 每个口袋的洗标写可见范围\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU09 Strava 双视角\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>「我看到的 vs 对方看到的」对照 → 隐私页 = 外套外侧 / 内侧两张对照：外侧只露织唛，内侧露全部\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF33 Emil clip-path 主题切换\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>新面作为一层叠在原面上、用一条移动的边露出 → 拉链：袋口内容用 clip-path 沿齿线随拉链头露出\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE04 《字誌》段末展开\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>「展開 / 收合」放段末 → 洗标长说明段末「展开」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM04 Telegram Select Theme 即时预览\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>后景即时换主题 + 主按钮随未应用更改出现 → 洗标上的三种里布色样：点即换里布色，「缝上」按钮只在有更改时出现\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>SC07 墨水屏\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>案例\u003c/th>\u003cth>类别\u003c/th>\u003cth>转译到本套\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SU03 HIG Lists\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>「Title … Detail ›」当前值行；组头组脚；ⓘ 只解释 → 引导点对齐的「项目 … 当前值」；黑底组头；说明行用「※」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU04 M3 Switch\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>开关即时；对立二选一用分段 → 实心 / 空心方块即时反相；外观用黑底反白的三段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE02 Emigre 目录\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>页码左、标题常规、作者缩进 → 清单三段式：序号 / 名称 / 缩进说明\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE03 Eye 索引\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>状态三个词、年份写进条目 → 记录页每条自带日期，状态词 3 个（已记录 / 待核实 / 已提出）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF72 Helmut Lang SS98\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>一条白 hairline 组织、窄而长的排版 → 一条黑 hairline 分组、版心收到 86%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF16 Logo Carousel（rauno.me）\u003c/td>\u003ctd>ui（已看动效）\u003c/td>\u003ctd>按列错峰「位移 + 模糊 + 淡出」替换 → 局部刷新后残影按行错峰 60ms 清除\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF94 My Japan Railway 站章\u003c/td>\u003ctd>award\u003c/td>\u003ctd>单色章 → 「已核实」黑章（纯黑、粗糙边）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU05 飞书通知\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>系统权限状态卡 + 去设置 → 通知页第二块黑边框「系统权限」卡，三态文字\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM03 M3 Transition patterns（Android fade-through）\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>父页先淡出、子页轻缩放淡入 ~300ms → 墨水屏翻页：反相一闪后新内容以 fade-through 显现，不做平移\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM08 M3 Segmented button\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>旧段先褪、新段填充与图标变对勾交叉淡入 100–150ms，文字不动 → 黑底反白分段的切换\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>SC08 门厅\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>案例\u003c/th>\u003cth>类别\u003c/th>\u003cth>转译到本套\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SU05 飞书通知三层\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>偏好 / 系统权限 / 诊断 → 信箱格（偏好）/ 钥匙牌（系统权限）/ 投递牌（服务连接）三件物件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU09 Strava 双视角\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>我看到的 vs 对方看到的 → 门铃面板：按门铃看到「访客看到的你」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU10 Diana Larussa 设置 shot\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>序号 + 大写标签 + 行尾短词当前值；退出登录红字独立 → 导览板行「01 资料 ·· 阿禾」；换锁（账户）独立在面板最下一块\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD05 Rick Owens SS18\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>D 环弹簧钩 = 可挂接、拉链 = 开合、抽绳 = 可调 → 黄铜钩（收藏挂件）、格门（开合）、调节螺丝（城市 / 外观）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE03 Eye 四列细线网格\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>1px 细线、无卡片底色、六段固定 → 信箱格阵列：细线分格、每格四段（类别 / 状态 / 名牌 / 门）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF44 Printing（Rive）\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>出纸槽压在票顶边、被遮挡到完整露出 → 字牌从板上的槽口滑入轨道，槽口遮挡层级清楚\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF29 Sheet Modal\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>面板一出现就排好版、250ms 停住、背景只压暗 → 导览板抽屉拉出\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF84 Walter Van Beirendonck\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>「# / 局名 / 人数 / 日期」表格行 43px → 门卫登记簿行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM02 M3 Bottom sheets 拖拽预览\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>面板与附属控件错开 300ms 消失 → 导览板抽屉收回时板上的指示灯晚 300ms 熄灭\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM05 Telegram 左滑归档\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>执行后行高收缩 + 目标分组计数同步更新 + toast → 登记簿行归档\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>SC09 软体\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>案例\u003c/th>\u003cth>类别\u003c/th>\u003cth>转译到本套\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>REF12 M3 Expressive\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>主操作在形状上脱离兄弟；状态芯片只给当前上色 → 最大的软体（我）形状不同；只有需要处理的软体带色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF19 uilabs Elastic Card\u003c/td>\u003ctd>ui（已看动效）\u003c/td>\u003ctd>面板从卡内长出、面板色 = 按钮色 → 软体膨胀为编辑面，材质不变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF28 Family-style dialog\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>按钮长成确认卡、位置连续 → 危险软体长按压缩后膨胀成确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF15 Exclusion Tabs\u003c/td>\u003ctd>ui（已看动效）\u003c/td>\u003ctd>滑动胶囊承载选中、文字按覆盖像素反白、100–150ms → 分段胶囊（外观三选一 / 接缝筛选）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF08 Family 网格错峰 + 跳字\u003c/td>\u003ctd>ui（已看动效）\u003c/td>\u003ctd>错峰进场、数字原地跳 → 收藏数 / 记录数在软体内跳字\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU04 M3 Switch\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>开态圆钮加勾号 → 软球滚到另一端后浮出勾\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF69 Junya Watanabe Techno Couture\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>从中心充气膨胀、头部固定 → 软体膨胀时标题固定在顶端\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF65 System Magazine 目录\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>单一字体只靠字号与居中堆叠 → 软体内只用一字族、两档字号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM01 M3 Switch 动效\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>颜色先走、柄后到、图标最后；开态过冲 → 软球：胶囊先变色、球后滚到位、勾最后浮出；只在开态过冲\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM08 M3 Segmented button\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>新旧段交叉淡入 100–150ms，涟漪独立 250ms → 分段胶囊的选中膨胀与按压涟漪分离\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM07 Jakub Krehel 列表行拖拽\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>吸附点 + 提交阈值 + 过冲 → 软体列表行滑动的吸附与回弹\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>SC10 吊牌\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>案例\u003c/th>\u003cth>类别\u003c/th>\u003cth>转译到本套\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SD04 Craig Green AW18\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>布袋用绳吊在木框上、闭合全是系绳 → 吊牌用棉绳挂在横杆；操作件只有打孔 / 剪绳两种\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD01 Margiela 布边织字\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>边缘循环小字 → 吊牌边缘印「JU ✕ 2026 ✕ NYC」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF86 COMME des GARÇONS《Six》\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>标题小而置角、纵向数字导航 → 吊牌上分区名竖排、序号竖排小字\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF41 Tearable Cloth\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>沿虚线逐格判断断开、碎片下落、主体回弹 → 剪绳：绳断处两端分离，牌落下，杆回弹\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF37 Ammo.js 软体布\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>牵引点先动、再传到下摆、回摆一次 → 拉牌：孔眼先动，牌底拖尾，松手回摆两次静止\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU06 Telegram 资料字段\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>标签在上、值在下 → 牌面：竖排分区名 + 横排值\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU02 HIG Toggles\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>状态差异不只靠颜色 → 打孔（透光）vs 补孔贴（覆盖）两种形状\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF63 VERSE 封面系统\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>竖排 / 横排按气质切换；多项用空格并排 → 牌上「纽约 波士顿」并排\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF94 My Japan Railway 站章\u003c/td>\u003ctd>award\u003c/td>\u003ctd>密网格的局章 → 收藏杆上密排的小吊牌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM05 Telegram 左滑归档\u003c/td>\u003ctd>motion（已看动效）\u003c/td>\u003ctd>到阈值整区换色作为「松手即执行」信号 → 拉牌过阈值时绳子变色、剪刀出现\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","ledger":"\u003ch1>JU「设置」· 研究台账（继承 + 设置专项新增）\u003c/h1>\n\u003cul>\n\u003cli>生成：2026-10-17 18:42 UTC；由 \u003ccode>settings/tools/build-ledger.py\u003c/code> 从 \u003ccode>research/ledger.json\u003c/code>（上一轮 94 例）与 \u003ccode>settings/research/draft-*.md\u003c/code>（本轮新增）合并。\u003c/li>\n\u003cli>合计 \u003cstrong>123\u003c/strong> 例（每例只计一个主类别）：专业 UI/UX、独立设计师与工作室项目 38、有动态证据的交互／数字体验案例 29、时尚杂志、独立出版物与编辑设计 22、设计师品牌／设计师具体作品 26、获奖项目原始案例 8。其中继承 94（已看动效 30），本轮新增 29（专业 UI/UX、独立设计师与工作室项目 12、有动态证据的交互／数字体验案例 8、时尚杂志、独立出版物与编辑设计 4、设计师品牌／设计师具体作品 5；已看动效 8）。\u003c/li>\n\u003cli>简报最低构成核对：UI ≥16 → 38；动态 ≥12 → 29；编辑设计 ≥8 → 22；设计师作品 ≥10 → 26；获奖 ≥4 → 8；合计 ≥50 → 123。\u003c/li>\n\u003cli>设置专项核对：UI 类中与设置 / 偏好 / 个人信息 / 内容管理 / 多层编辑相关 ≥8 → 本轮新增 SU01–SU12 共 12 例全部满足；动态类中有真实移动端界面或移动端操作演示证据 ≥6 → 本轮新增 SM02–SM06（5 例真实手机界面录像）+ SM01 / SM08（手机组件规范视频）+ 继承 REF27 / 28 / 29 / 30 / 31 / 32 / 36 / 42 / 44 / 46 / 47。\u003c/li>\n\u003cli>继承案例的「对设置的转译」列：已映射到具体方案的写明转译与方案编号；未映射的保留上一轮原转译并标「继承 · 本轮未映射」。每套的映射见 \u003ccode>settings/spec/concept-refs.md\u003c/code>。\u003c/li>\n\u003cli>证据根目录：\u003ccode>research/evidence/\u003c/code>（新增案例的 slug 在表内）。新增案例的证据文件已由主负责人脚本核对存在（见 \u003ccode>JU-SETTINGS-PROJECT-RECORD.md\u003c/code> §D）。\u003c/li>\n\u003c/ul>\n\u003ch2>一、本轮新增（设置专项）\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>编号\u003c/th>\u003cth>作品名\u003c/th>\u003cth>创作者 · 年份／系列\u003c/th>\u003cth>类别\u003c/th>\u003cth>采用状态\u003c/th>\u003cth>原始来源\u003c/th>\u003cth>实际查看位置\u003c/th>\u003cth>证据路径（相对 research/evidence/）\u003c/th>\u003cth>具体观察\u003c/th>\u003cth>可用于设置的结论\u003c/th>\u003cth>不适合照搬\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SU01\u003c/td>\u003ctd>Android Developers「Settings」移动端设计模式页（设置总览／子页／依赖／选择控件）\u003c/td>\u003ctd>Google · Android Developers（Design &amp; Plan › UI Design › Mobile › Patterns） · 页脚「Last updated 2025-12-10 UTC」\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://developer.android.com/design/ui/mobile/guides/patterns/settings\" target=\"_blank\" rel=\"noopener\">https://developer.android.com/design/ui/mobile/gui…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽整页截图（页高 12620 CSS px）；裁切 y≈980–1360（Figure 1「A settings screen (left) and quick access to settings (right)」）、y≈6190–7560（Provide an overview / Containment / List subscreen）、y≈7660–8380（Individual switch / Dependency）、y≈8370–9450（Single choice / Multiple choices / Slider / Date and time）\u003c/td>\u003ctd>android-settings-pattern/fig1_overview_quick.jpg; android-settings-pattern/overview_containment_subscreen.jpg; android-settings-pattern/switch_dependency.jpg; android-settings-pattern/choice_slider_date.jpg\u003c/td>\u003ctd>总览屏：返回圆钮下是约正文 2.4 倍的大标题「Settings」，其下每组是一个深色圆角容器，容器顶部一行约 12sp 的灰色组名（Storage / Account / Playback）；行式三种并存——「Storage」行把当前值「1.37 GB used • 10 GB free」以小字右对齐放在同一行尾；「Video playback」行把子页里的多个当前值合写成标签下的一行摘要「Medium quality, auto-play on, PiP」；「Quality」行尾只写一个词「High」；「Screen Awake / Screen will stay on」行尾是开关（关）。子页「Storage」：顶栏返回 + 标题；「Storage space」行下挂一条约 1/4 填充的黄色进度条；「Downloads」组内「Download over WiFi only」开关关、「Audio only / Download audio podcasts only」开关开（黄）、「Quality  High」；「Manage storage」组只有一行「Delete downloads」，行尾是红色方形垃圾桶按钮。Individual switch：「Fish brush」卡片左侧标题 + 两行说明，右侧一枚与卡等高的深绿方形勾选钮。Dependency：「Message\u003c/td>\u003ctd>JU 设置首页按此做「总览 + 子页」：称呼／微信／邮箱、默认城市、通知、外观都在首页直接露出当前值（行尾灰字或标签下一行摘要），进入子页的入口文字与子页标题完全一致；通知子页用 Dependency 模式——「允许通知」父开关关闭时，局提醒／私信／系统消息等子项置灰并在组脚写明原因；外观「减少动态」是二值用开关，背景「棉糖／光晕／落日」&gt;2 项互斥用单选列表；收藏管理的「清空／删除」按「Delete downloads」做成组内单独一行 + 红色图标钮。\u003c/td>\u003ctd>Android 的超大标题与 M3 Expressive 调色容器与 JU 的 iOS 质感不符；Quick Settings 磁贴是系统级能力；对话框式单选（Cancel / Save）在 iOS 上应改成列表勾选即时生效。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU02\u003c/td>\u003ctd>Apple Human Interface Guidelines「Toggles」（列表行内的开关、过滤按钮式 toggle、复选框层级）\u003c/td>\u003ctd>Apple · Human Interface Guidelines（Components › Selection and input） · 2024–2026（HIG 现行版本）\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://developer.apple.com/design/human-interface-guidelines/toggles\" target=\"_blank\" rel=\"noopener\">https://developer.apple.com/design/human-interface…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽整页截图（页高 6490 CSS px）；裁切 y≈0–850（页首与 Label/开关示意）、y≈1740–2450（「Standard switch color / Custom switch color」两张列表行示意 + Phone App「Recents」过滤 toggle 两张）、y≈3500–4175（macOS 复选框层级图与 On / Off / Mixed 三态）\u003c/td>\u003ctd>hig-toggles/page_top_hero.jpg; hig-toggles/switch_rows_phone_filter.jpg; hig-toggles/checkbox_hierarchy_states.jpg\u003c/td>\u003ctd>首图把开关画成「Label ‹标线› 开关」：开态白色圆钮上带一竖线「\u003c/td>\u003ctd>」、关态带一圆圈「○」，即两个状态在形状上也不同，不只靠颜色。iOS 段：「Use the switch toggle style only in a list row」——示意为白色圆角组内两行「Title」，分隔线从文字起点内缩，行尾开关：标准绿（开）/ 灰（关），右图为自定义紫色；「Outside of a list, use a button that behaves like a toggle, not a switch」——Phone 应用「Recents」顶栏：左「Edit」、中「All\u003c/td>\u003ctd>Missed」分段控件、右侧过滤按钮在有筛选时是蓝色实心圆底 + 白图标，回到 Recents 主视图后图标无底色。正文：「Clearly identify the setting, view, or content the toggle affects」靠上下文而非额外标签；「Make sure the visual differences in a toggle's state are obvious… Avoid relying solely on different colors」。macOS 段：「Prefer a switch for settings that you want to empha\u003c/td>\u003ctd>JU 设置里的开关只出现在列表行内，不在标题区或工具栏独立出现；通知组「允许全部」若用父项，父项要有混合态而不是只开/关；在「光晕／落日」深色或彩色主题下保证关态开关的轮廓可辨（HIG 要求状态差异不只靠颜色）；收藏列表的「筛选」按钮用「有筛选=带底色圆钮」的 toggle 形态。\u003c/td>\u003ctd>mini switch 与复选框层级是 macOS 表单形态；Phone 过滤按钮属工具栏场景，不是设置行。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU03\u003c/td>\u003ctd>Apple Human Interface Guidelines「Lists and tables」（iOS grouped 样式的组头／组脚、Detail 值与 ⓘ 按钮）\u003c/td>\u003ctd>Apple · Human Interface Guidelines（Components › Layout and organization） · 2024–2026（HIG 现行版本）\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://developer.apple.com/design/human-interface-guidelines/lists-and-tables\" target=\"_blank\" rel=\"noopener\">https://developer.apple.com/design/human-interface…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽整页截图（页高 5713 CSS px）；裁切 y≈250–730（首图「Grouped Table View Header / Table Row 1–3 / Grouped Table View Footer」）、y≈1900–2325（Style 段文字）、y≈2575–2900（iOS「info button vs disclosure indicator」两张对照图）\u003c/td>\u003ctd>hig-lists-tables/grouped_table_hero.jpg; hig-lists-tables/style_grouped_vs_plain_text.jpg; hig-lists-tables/info_button_vs_disclosure.jpg\u003c/td>\u003ctd>首图是 iOS grouped 列表的解剖：组上方一行小字组头「Grouped Table View Header」，白色圆角容器内三行「Table Row 1 / 2 / 3」，每行右端一枚 chevron「›」，行间分隔线从文字起点内缩，容器下方一行小字组脚「Grouped Table View Footer」；标题字号约为组头的 1.6 倍。Style 段：「In iOS and iPadOS, the grouped style uses headers, footers, and additional space to separate groups of data」；行样式可在前端放小图 + 简短说明。iOS 对照图：左组三行「Title」+ 蓝色 ⓘ（info button，「doesn't support navigation」，只展开说明）；右组三行「Title  Detail ›」——灰色「Detail」值紧贴 chevron 左侧，是「显示当前值并进入下一级」的行式。Best practices：「Let people edit a table when it makes sense」（iOS 需进入编辑模式才能选行）；「Provide appropriate feedback when people select a list item」——导航型列表短暂高\u003c/td>\u003ctd>JU 设置页整体采用 grouped 样式：组头写分组名、组脚承担解释（如「仅同局成员可见你的微信」）；称呼／默认城市／外观等行用「标签 … 灰色当前值 ›」；只需解释不需跳转的行（如「什么是信用记录」）用 ⓘ 而不是 chevron；收藏列表的删除／排序走编辑模式；中文长值（如长邮箱）用中段省略。\u003c/td>\u003ctd>macOS 交替行色与多列表头、watchOS 椭圆列表；拆分视图属 iPad。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU04\u003c/td>\u003ctd>Material Design 3「Switch」Guidelines（开关即时生效、与复选框／单选／分段按钮的分工、设置页堆叠布局）\u003c/td>\u003ctd>Google · Material Design 3 · 2023–2026（M3 现行版本）\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://m3.material.io/components/switch/guidelines\" target=\"_blank\" rel=\"noopener\">https://m3.material.io/components/switch/guideline…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽；页面为内滚容器 \u003ccode>div.page-content\u003c/code>（scrollHeight 9219），解除 overflow 后整页截图；裁切 y≈1728–2064（Usage「Playback」示例）、y≈3096–4320（Alternate selection controls 的两组 Do / Don't）、y≈6000–6888（Label text 的 Privacy 页 Do / Don't）、y≈7104–7644（Placement「General」堆叠示例）\u003c/td>\u003ctd>m3-switch/playback_switch_example.jpg; m3-switch/checkbox_radio_do_dont.jpg; m3-switch/label_text_privacy_do_dont.jpg; m3-switch/placement_general_list.jpg\u003c/td>\u003ctd>首图说明「Switches change settings and other options immediately」。Usage：「Playback」页先一行紫色小字分组名「Notification settings」，再一行「Play over notifications / Keep playing even when other apps, like notifications or navigation, play sounds」+ 行尾开关（开）；对立二选一「List View\u003c/td>\u003ctd>Map View」要用连接式按钮组（Do），不能用开关（Don't）。Alternate selection controls：多选列表（Fitness center / Refundable / Family friendly / Pet friendly / Nice view）用复选框 + 右下「Update」按钮（Do），同一列表换成开关 + Update 是 Don't（「Switches should be immediate. Use checkboxes instead」）；超过两项互斥（Choose your language：English / Chinese (Mandarin) / Spanish）用单选对话框 + Cancel / Continue。Label t\u003c/td>\u003ctd>JU 的开关一律即时生效、不配保存钮；需要一次确认的多选（如通知类型勾选）改用复选框 + 保存；外观背景三选一与「跟随系统／浅／深」用分段按钮或单选，不用开关；开关行标签写「开启后会发生什么」（如「局前 1 小时提醒」），支持文本写当前状态；开态圆钮加勾号图标以免只靠颜色。\u003c/td>\u003ctd>Material 紫色与大圆钮形态；对话框式单选；「Update」浮钮。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU05\u003c/td>\u003ctd>飞书帮助中心「安卓设备收不到新消息通知怎么办？」（「我」侧栏 → 设置 → 通知 → 消息通知设置的全套中文截图）\u003c/td>\u003ctd>飞书 / Lark（字节跳动）帮助中心 · 2021–2026（帮助中心现行版本，页面未显示更新日期）\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.feishu.cn/hc/zh-CN/articles/360025451293\" target=\"_blank\" rel=\"noopener\">https://www.feishu.cn/hc/zh-CN/articles/3600254512…\u003c/a>\u003c/td>\u003ctd>手机 390 宽整页截图（页高 24135 CSS px，共 34 张内嵌图）；另按 \u003ccode>&lt;img&gt;\u003c/code> 原图 URL 直接下载前 6 张应用截图（688×1328 与 1300×2340 px）并两两拼接：图 1+2（「我」侧栏、设置列表，对应页面 y≈975–1755）、图 3+4（通知页上半、消息通知设置页，y≈1775–2745）、图 5+6（通知页下半 y≈2930–3420；华为「电池」系统页位于「华为手机」小节，y≈4700 以后）\u003c/td>\u003ctd>feishu-help-android-notifications/me_page_and_settings_list.jpg; feishu-help-android-notifications/notification_prefs_and_system_permission_card.jpg; feishu-help-android-notifications/notification_preview_sound_and_huawei_battery.jpg\u003c/td>\u003ctd>「我」侧栏：64px 紫色头像右侧一枚「+ 状态」描边胶囊；姓名「Ashley」约 28px 粗体，右侧二维码图标 + 箭头；副行「明日璀璨」+ 绿底「✓ 已认证」胶囊；灰色占位输入框「输入你的个性签名…」；其下六行「左彩色线性图标 + 17px 文字」：我的个人名片 / 钱包 / 收藏 / 帮助与客服 / 登录设备（行尾「3」+ 手机图标计数）/ 设置，行高约 56px。「设置」页：居中标题；三组白色圆角卡——「账号安全中心 / 通用」「通知 / 隐私 / 日历 / 邮箱 / 视频会议 / 任务 / 效率」「个人信息收集清单」，每行无图标、左文字右 chevron，组间约 16px。「通知」页上半：单选组「○ 部分新消息」（副文 13px 灰「加急、@我、@所有人、单聊、星标联系人的消息」+ 行尾铅笔图标可编辑范围）「○ 全部不通知」；「星标联系人消息通知 ›」；开关行「关闭手机通话和会议邀请通知」「开启谷歌 FCM 推送服务」且说明段落放在卡片外的灰字；带图标行「收不到消息通知或通知延迟？›」+ 卡外说明「由于手机系统限制，你可能无法及时收到消息通知，请完成此项设置以解决该问题」；开关行「通话与会议中关闭消息通知」（开）。「消息通知设置」页：顶部一句「为确保飞书能正常推送消息通知，建议开启以下设置」，其下三张状态卡——「常驻通知栏 / 已开启常驻通知栏，并允许自启动」+ 开关（\u003c/td>\u003ctd>JU 通知设置照此分三层：应用内偏好（单选「哪些局消息通知」+ 开关）→「系统通知权限」状态卡（标题 + 一行状态说明 + 行尾「去设置 ›」跳系统）→「收不到通知？」诊断入口；「服务已连接」（如微信绑定）同样写成状态卡；开关带来的可见变化用一枚预览小卡示范（横幅长什么样）；中文行标题用常规字重 17px、说明 13px 灰并放卡外。\u003c/td>\u003ctd>安卓特有的电池优化／自启动条目；「设置 → 通知 → 消息通知设置」三层深度对 JU 过深；全部行无图标略单调。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU06\u003c/td>\u003ctd>Telegram 博客「Music on Profiles, Stickers Mini App, New Profiles, and More」（iOS／Android 新资料页的字段行与默认标签页）\u003c/td>\u003ctd>Telegram · 2025-08-31\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://telegram.org/blog/profile-music-gift-themes\" target=\"_blank\" rel=\"noopener\">https://telegram.org/blog/profile-music-gift-theme…\u003c/a>\u003c/td>\u003ctd>手机 390 宽整页截图（页高 7812 CSS px）；裁切 y≈2740–3125（iOS「Jake Miles」资料页，Default Profile Tab 段）、y≈2065–2460（Android「Ronald Copper」新资料页）、y≈1475–1855（「Stickers」机器人资料页）\u003c/td>\u003ctd>telegram-profiles-2025/jake_profile.jpg; telegram-profiles-2025/android_profile.jpg; telegram-profiles-2025/stickers.jpg\u003c/td>\u003ctd>iOS 资料页：居中 96px 头像 → 姓名约 22px 粗体 + 蓝色认证星 → 「online」蓝色 14px；其下一张白色圆角卡，三行字段均为「小灰标签在上、值在下」：「anonymous number / +888 992 911」（值蓝色）、「username / @jm」+ 行尾二维码图标、「date of birth / 21 Oct」（值黑色）；再下是「Posts\u003c/td>\u003ctd>Gifts 🎁📦🏷\u003c/td>\u003ctd>Archived Posts」页签，选中项蓝字 + 蓝色下划线；说明文字写「Settings &gt; My Profile, hold down on a tab and select Set as Main Tab」——默认标签页是在标签上长按就地设置，不是设置列表里的选项。Android 资料页：紫色头部漂浮表情贴纸；四枚等宽圆角半透明动作瓷砖「Message / Unmute / Call / Video」（图标在上、文字在下）；白卡内字段为「值在上、灰标签在下」：「25 y.o, CS streamer, San Francisco / Bio」「@ronald_copper / Username」+ 二维码；单独一张卡「+ Add to Contacts」蓝字；页签 Posts / Gifts / Media / Files / Links。Stickers 机器人页：\u003c/td>\u003ctd>JU 个人资料页「称呼／微信／邮箱」用「小标签在上 + 值在下」的双行字段行，右端放辅助动作（微信号旁放复制／二维码，邮箱旁放「已验证」或「去验证」）；「默认浏览城市」这类默认项可在城市列表上长按「设为默认」就地完成；资料页顶部动作做成等宽圆角瓷砖。\u003c/td>\u003ctd>漂浮贴纸与礼物装饰；Android 的「值上标签下」与 iOS 相反，JU 只取「标签在上」一种；匿名号码等 Telegram 专有字段。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU07\u003c/td>\u003ctd>Telegram 博客「Android Redesign, Group Ownership Transfer, Gift Crafting, Colored Bot Buttons」（资料页 Edit 入口与退群确认弹层）\u003c/td>\u003ctd>Telegram · 2026-02-09\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://telegram.org/blog/crafting-android-design-and-more\" target=\"_blank\" rel=\"noopener\">https://telegram.org/blog/crafting-android-design-…\u003c/a>\u003c/td>\u003ctd>手机 390 宽整页截图（页高 5812 CSS px）；裁切 y≈565–923（Android 新底栏的聊天列表）、y≈1975–2265（「Leave New Year Super Party 2026?」确认弹层）、y≈2620–2995（「Roxanne」资料页，右上角 Edit）\u003c/td>\u003ctd>telegram-android-redesign-2026/chats_bottom_bar.jpg; telegram-android-redesign-2026/leave_dialog.jpg; telegram-android-redesign-2026/roxanne_profile.jpg\u003c/td>\u003ctd>聊天列表：顶栏左侧三枚叠压头像 + 「Telegram」、右侧「⋮」；搜索框；筛选芯片「All 8 / Groups 6 / WORK 2 / Bots」每枚带蓝色计数圆片；正文说明新底栏「lets you easily jump between your chats, settings, profile and more in just one tap」，并写「You can control interface effects to maximize performance and extend battery life in Settings &gt; Power Saving」。资料页：返回圆钮与右上角「⊕ Edit」玻璃态胶囊同排；头像 → 「Roxanne 🐶」→ 「5 online」；一条深色音乐条；白卡「bio / 23 y.o. pianist from in Vienna.」（标签小灰在上）；胶囊式页签「Gifts 🎁 / Posts / Archived Posts」；再一排芯片「All Gifts / 🔔 Bells / 🐸 Pepe / + Add Collection」。退群确认弹层：浮在被模糊的聊天列表之上的居中圆角卡；顶部两枚 48px 头像用「›」相连（当前群主 → Penelope）；标题「Leave New Year Super Party 2026?\u003c/td>\u003ctd>JU「退出登录／注销账号／转让我发起的局」确认弹层：问句标题 + 加粗关键名词与期限的后果说明 + 「替代方案 / 取消 / 红色破坏性动作」三钮，破坏性钮唯一填色且放最后；资料编辑入口做成页头右上角的「编辑」胶囊；设置页中的「减少动态」可对应 Telegram 把界面特效归入「Power Saving」的归类思路。\u003c/td>\u003ctd>群主转让语义；礼物收藏与芯片；Android 玻璃态底栏。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU08\u003c/td>\u003ctd>Signal 博客「Keep your phone number private with Signal usernames」（Profile 编辑页、用户名编辑模态、二维码／链接分享）\u003c/td>\u003ctd>Signal · 2024-02-20\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://signal.org/blog/phone-number-privacy-usernames/\" target=\"_blank\" rel=\"noopener\">https://signal.org/blog/phone-number-privacy-usern…\u003c/a>\u003c/td>\u003ctd>手机 390 宽整页截图（页高 9683 CSS px）内两张插图为懒加载空白，改按页面 \u003ccode>&lt;img&gt;\u003c/code> 原图 URL 直接下载：usernames-profile.png（1172×1172，alt「…The phone on the right shows where in your profile you can see your username」，页内位置 y≈3250）、usernames-link.png（1172×1172，alt「Two phones next to each other displaying the QR code and custom URLs…」，y≈3900）、usernames-header.png（1548×800，页首）\u003c/td>\u003ctd>signal-usernames-2024/usernames_profile.jpg; signal-usernames-2024/usernames_link.jpg; signal-usernames-2024/usernames_header.jpg\u003c/td>\u003ctd>Profile 页（右机）：「‹ Profile」居中标题；80px 头像下一枚白色胶囊「Edit Photo」；第一组白卡三行「人形图标 Maya Johnson ›」「铅笔 About ›」「徽章 Badges ›」，组脚 12px 灰字「Your profile and changes to it will be visible to people you message, contacts, and groups.」；第二组「@ axolotl.99 ›」「QR code and Link ›」，组脚「Your username, QR code and link aren't visible on your profile. Only share your username with people you trust.」——每组脚注直接说明该组字段「谁能看见」。用户名编辑（左机）：顶栏「Cancel\u003c/td>\u003ctd>Username\u003c/td>\u003ctd>Done」；中央 @ 圆片 + 灰色预览「axolotl.99」；输入框被一条细竖线分成两段「axolotl\u003c/td>\u003ctd>」与「99」（可编辑前缀 + 系统配号）；下方 12px 灰字「Usernames are always paired with a set of numbers. Learn More」；键盘弹起。二维码页：「Done」+ 分段「Code\u003c/td>\u003ctd>JU 资料编辑：字段分组 + 组脚写明可见范围（「微信号仅同局成员可见」）；编辑单个字段用「取消\u003c/td>\u003ctd>字段名\u003c/td>\u003ctd>完成」模态而非底部保存按钮；微信号／邮箱这类带格式校验的字段用分段输入框（前缀可编辑、固定部分灰显）并在框下放一行 12px 校验说明；「分享我的联系方式」做成二维码卡 + 复制链接底部抽屉。\u003c/td>\u003ctd>用户名 + 数字后缀机制；二维码配色自定义。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU09\u003c/td>\u003ctd>Strava Help Center「How Do I Edit My Map Visibility on Strava?」（隐私可见性：我看到的 vs 他人看到的对照截图）\u003c/td>\u003ctd>Strava Support（作者 Marie） · 2026-09-14（文中署期）\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>[\u003ca href=\"https://support.strava.com/hc/en-us/articles/11500…](https://support.strava.com/hc/en-us/articles/115000173384-Privacy-Controls（跳转至\" target=\"_blank\" rel=\"noopener\">https://support.strava.com/hc/en-us/articles/11500…](https://support.strava.com/hc/en-us/articles/115000173384-Privacy-Controls（跳转至\u003c/a> \u003ca href=\"https://support.strava.com/en-us/articles/15402012-how-do-i-edit-my-map-visibility-on-strava）\" target=\"_blank\" rel=\"noopener\">https://support.strava.com/en-us/articles/15402012-how-do-i-edit-my-map-visibility-on-strava）\u003c/a>)\u003c/td>\u003ctd>桌面 1440 宽整页截图（页高 3854 CSS px）：裁切 y≈200–972（标题、署名、正文首三段）与 y≈972–1608（两栏对照表「Visible to you\u003c/td>\u003ctd>Visible to other athletes」）；手机 390 宽整页截图（页高 5019 CSS px）：裁切 y≈1411–2041（同一对照表的左栏）\u003c/td>\u003ctd>strava-map-visibility/article_header_desktop.jpg; strava-map-visibility/visible_to_you_vs_others_desktop.jpg; strava-map-visibility/visible_to_you_mobile.jpg\u003c/td>\u003ctd>对照表左栏（自己视角）：「You」页顶栏右侧头像 / 搜索 / 齿轮（设置入口在「You」标签右上角）；「Progress\u003c/td>\u003ctd>Activities」页签橙色下划线；活动卡：头像 + 姓名 + 「July 28, 2021 at 7:19 PM · San Rafael, California」；标题「Evening Run」；Distance / Pace / Time 三格「标签在上、值在下」；地图左上角一枚白底小标签「Start and end hidden」，被隐藏的起止段用灰色线、可见段用橙色线；卡底一行锁图标 + 11px 说明「Only you can view this activity. It won't appear on segment leaderboards and may not count toward some challenges.」。右栏（他人视角）：同一活动，灰色段完全不绘制，地图无标签，卡底变为「Be the first to give kudos!」+ 点赞／评论。正文：首次上传后默认自动隐藏起止各 200 米；三个选项——按地址隐藏 1 英里半径（适用过去与未来）、隐藏所有活动起止（仅未来）、隐藏整张地图（仅未来）；单条活动可用「Edit Map Visibility」滑杆覆盖默认，覆盖后「the default settings on\u003c/td>\u003ctd>JU 隐私可见性设置（微信／邮箱／参加记录谁可见）给「我看到的 vs 对方看到的」两张对照预览；被隐藏的内容在自己视角保留但灰显 + 小标签「仅自己可见」，在对方视角直接不渲染；默认值要在首次保存后明文写出；单条记录（某一局）可覆盖全局默认并标「已单独设置」。\u003c/td>\u003ctd>地图与运动数据场景；按半径滑杆隐藏；Strava 橙色体系。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU10\u003c/td>\u003ctd>Dribbble shot「Settings Page · Minimal iOS Dark Mode」\u003c/td>\u003ctd>Diana Larussa（独立设计师，Dribbble） · 2025–2026（shot 页未显示具体日期）\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://dribbble.com/shots/27064441-Settings-Page-Minimal-iOS-Dark-Mode\" target=\"_blank\" rel=\"noopener\">https://dribbble.com/shots/27064441-Settings-Page-…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽 shot 页首屏截图（y=0–900，作者「Diana Larussa / Available for work」，说明文字「🌙 Dark mode UI with strong contrast and elegant typography / 🔐 Privacy &amp; security section clearly separated from general settings」）；shot 媒体原图两张（cdn.dribbble.com userupload 46660709 整屏、46660710 局部放大，各取 1600×1200）\u003c/td>\u003ctd>dribbble-larussa-settings/shot_page_s0.jpg; dribbble-larussa-settings/shot1_full_screen.jpg; dribbble-larussa-settings/shot2_closeup.jpg\u003c/td>\u003ctd>藏青近黑的屏幕：页首不是「Settings」而是衬线体用户名「John Doe.」约 34px 作为页面标题；两个分组各由一行字距加宽的 11px 灰色大写组名「SETTINGS」「SUPPORT」标出，组名上下各一条通栏 1px 细线；行式「序号 + 12px 大写标签 + 行尾 chevron」：「1 PERSONAL DATA ›」「2 NOTIFICATIONS  ON ›」（当前值「ON」以大写短词放在 chevron 左侧）「3 PRIVACY &amp; SECURITY ›」「1 HELP CENTER ›」「2 LEGAL ›」，行高约 64px，无图标、无容器；「LOG OUT」为红色大写文字钮，右对齐、独立于分组之外；底部 tab 栏 home / search / chart / gear，gear 为当前项。背景是上橙下蓝的镜像渐变球体。\u003c/td>\u003ctd>当前值用行尾短词（ON / OFF、城市名）而不是开关本身；「退出登录」用红色文字钮放在所有分组之外的末尾；「关于／规则／帮助」这类条目可用序号 + 标签的目录式行；分组用细线 + 小标题而非卡片也是一种可行的轻量写法。\u003c/td>\u003ctd>全大写英文字距在中文里不成立；衬线姓名作标题与 JU 字体系统不符；概念稿无子页与交互。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU11\u003c/td>\u003ctd>Dribbble shot「Mobile Settings, Subscription Paywall and Payment UI」\u003c/td>\u003ctd>Creliq UX/UI Design Agency（工作室，Dribbble） · 2025–2026（shot 页未显示具体日期）\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://dribbble.com/shots/27338870-Mobile-Settings-Subscription-Paywall-and-Payment-UI\" target=\"_blank\" rel=\"noopener\">https://dribbble.com/shots/27338870-Mobile-Setting…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽 shot 页首屏截图（y=0–900，作者「Creliq UX/UI Design Agency」，说明「…covering settings, subscription paywall, and payment flow… structured inputs… from account management to upgrading and adding payment methods」）；shot 媒体原图（cdn.dribbble.com userupload 47596648，1600×1200）\u003c/td>\u003ctd>dribbble-creliq-settings/shot_page_s0.jpg; dribbble-creliq-settings/shot1_three_screens.jpg\u003c/td>\u003ctd>屏 1「Setting」：左上 20px 标题；居中 96px 头像，右下角压一枚绿色小圆徽标（铅笔，编辑头像）；头像下姓名 17px + 邮箱 13px 灰；分组标签「General」13px 左对齐，其下四行白色圆角行（Upgrade Plan / Notification / Payment / Language），每行左侧线性图标 + 文字，无行尾 chevron，行高约 52px、行间 8px；分组「Other」：Help Center / About us。屏 2 付费墙：左上 × 关闭；大标题；四行带图标特性；两张方案卡「Monthly $9.05」「Annual $72.00」（后者顶部「25 % Off」标签 + 右上勾选）；通栏浅绿 CTA「Start 7 day free trial」；两行 11px 法律说明。屏 3「Add Card」：返回 + 标题；卡组织徽标；表单四行「标签在上（Card Holder * 必填星号）+ 输入框内左侧图标 + 值」；底部两枚等宽按钮「Close」（描边）「Save Card」（填色）。\u003c/td>\u003ctd>JU 设置首页头部做成「头像 + 称呼 + 邮箱」身份块，头像角上压编辑徽标；分组标签 + 独立圆角行；资料编辑表单采用「标签在上、必填星号、框内图标」与底部「取消／保存」等宽双钮，保存成功后回到列表并更新当前值。\u003c/td>\u003ctd>付费墙与银行卡支付与 JU 无关；行无 chevron 减弱可点击暗示；浅绿渐变底。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SU12\u003c/td>\u003ctd>Notion Help「Account settings &amp; preferences」（邮箱变更验证流程、外观三选项、Profile discoverability 对照图）\u003c/td>\u003ctd>Notion（Help Center） · 2025–2026（帮助中心现行版本）\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.notion.com/help/account-settings\" target=\"_blank\" rel=\"noopener\">https://www.notion.com/help/account-settings…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽整页截图（页高 9754 CSS px）；裁切 y≈996–1584（「Change your email address」步骤）、y≈3696–4320（「Customize appearance on desktop / on mobile」）、y≈7152–8064（「Profile discoverability」两张「Send invite」对照图）\u003c/td>\u003ctd>notion-account-settings/change_email_flow.jpg; notion-account-settings/appearance_desktop_mobile.jpg; notion-account-settings/profile_discoverability_figures.jpg\u003c/td>\u003ctd>文档按设置项分节：Change your profile photo / name / email address → FAQs → Set, change, or remove your password → two-step verification → Passkeys → Delete your account → Log out of all your devices → Customize appearance on desktop / mobile → High contrast → Open links in desktop app → Change your language → Start your calendar week on Monday → Change your time zone → Desktop app settings → View history → Profile discoverability。邮箱变更六步：Settings → {your name} → Account security → Manage emails → Add email → 「A verification code will be sent to the new address — enter it in Notion to verify it」→ 验证后点新邮\u003c/td>\u003ctd>JU「邮箱 + 验证」不做直接改字段，而是「新增邮箱 → 验证码 → 设为主邮箱 → 移除旧邮箱」的主／备双槽；外观「跟随系统／浅／深」三项用单选；隐私可见性的帮助文案用「对方会看到什么」的两张对照图说明开关效果；「注销」与「退出所有设备」作为独立条目放在账号组末尾。\u003c/td>\u003ctd>桌面路径与企业策略条目；文档以文字为主、无移动端设置页截图，界面细节需另行设计。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM01\u003c/td>\u003ctd>Material 3 Motion —「Switch using the expressive / standard motion scheme」开关切换动效（含 Switch guidelines 页的 4 段开关视频核验）\u003c/td>\u003ctd>Google Material Design（M3 官方规范页） · 2025（M3 Expressive 动效体系「How it works」页；2026-10 访问）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>[\u003ca href=\"https://m3.material.io/styles/motion/overview/how-…](https://m3.material.io/styles/motion/overview/how-it-works\" target=\"_blank\" rel=\"noopener\">https://m3.material.io/styles/motion/overview/how-…](https://m3.material.io/styles/motion/overview/how-it-works\u003c/a> ；对照页 \u003ca href=\"https://m3.material.io/components/switch/guidelines\" target=\"_blank\" rel=\"noopener\">https://m3.material.io/components/switch/guidelines\u003c/a>)\u003c/td>\u003ctd>视频「00_Customization Switch Expressive Export.mp4」（4.02s，656×656，60fps）与「…Switch Standard Export.mp4」：开 1.000 / 1.017 / 1.033 / 1.050 / 1.067 / 1.083 / 1.100 / 1.116 / 1.133s；关 2.500–2.633s 每 16.7ms；标准型同段逐帧对照\u003c/td>\u003ctd>m3-switch-motion/（接触表：sheet；关键帧：f00=1.000s、f01=1.033s、f02=1.067s、f03=1.100s）\u003c/td>\u003ctd>触发：1.000s 关态——浅灰轨道、左侧深灰小圆柄（直径约为轨道高的一半）。发展：1.017s 轨道整体先染成淡紫（颜色先于位移），圆柄放大约 1.6 倍并变成半透明白；1.033s 圆柄滑到轨道中段、内部已出现半透明对勾；1.050s 圆柄抵达右端、轨道饱和为深紫、对勾仍在描画；1.067s 对勾完整、圆柄白色不透明。落定：表现型 1.083–1.100s 圆柄略越过右端再收回（约 1–2px 的弹簧过冲），1.133s 静止；标准型没有过冲，但对勾要到 1.116–1.133s 才完全不透明，整体慢约 2 帧。关闭方向（2.517–2.600s）完全镜像：轨道先褪色、对勾先淡出、圆柄最后缩回小圆。整段位移约 80–100ms，颜色与尺寸变化先行、图标最后落定；全程无阴影变化。\u003c/td>\u003ctd>设置页所有开关统一「颜色先走、柄后到、图标最后」的三层节奏，总时长 ≤ 100ms；开态柄放大并带对勾、关态柄小且无图标，让状态在静帧里也可读；可只在开态落点加 1–2px 过冲作为表现型反馈，关闭方向不加。\u003c/td>\u003ctd>紫色品牌色与 M3 开态柄几乎填满轨道高的比例不必照抄；60fps 规范视频里「颜色先变」只占 1 帧，低端机掉帧会吞掉它，JU 需把这一步做成 ≥ 33ms 的可感知阶段。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM02\u003c/td>\u003ctd>Material 3 Bottom sheets guidelines —「Preview of the result of the gesture, release to commit, fling to commit, and cancel」拖拽预览／提交／甩动／取消\u003c/td>\u003ctd>Google Material Design（M3 官方规范页） · 2024–2025（M3 组件规范页；2026-10 访问）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://m3.material.io/components/bottom-sheets/guidelines\" target=\"_blank\" rel=\"noopener\">https://m3.material.io/components/bottom-sheets/gu…\u003c/a>\u003c/td>\u003ctd>视频「GM3-Components-BottomSheets-Guidelines-2-v01.mp4」（16.0s，1352×2072，60fps）：2.0–3.6s 每 0.2s（上拖预览→松手提交）；5.2–6.8s 每 0.2s（下拖→松手关闭）；9.8–10.6s 每 0.1s（甩动）；13.0–15.4s 每 0.3s（小幅拖动→取消）；关键帧 2.8 / 10.1 / 14.5s\u003c/td>\u003ctd>m3-bottom-sheet-gesture/（接触表：sheet；关键帧：f00=2.8s、f01=10.1s、f02=14.5s）\u003c/td>\u003ctd>照片网格页上一张半高标准面板（顶部 32px 把手、一行 5 个动作图标、Send 头像行、Add to album 缩略图）。①拖拽预览：2.0s 按住把手上拖，2.2–2.8s 面板顶缘只跟手上移约 10px，但 2.8s 右上角淡入一枚圆形「收起」按钮——它是全屏态才有的控件，用来预览「松手将变成全屏」；3.0–3.6s 松手后面板保持展开、按钮留存（release to commit）。②下拖关闭：5.2–6.2s 按住面板下拖，6.2→6.4s 之间（≤ 200ms）面板整张离场、底层网格恢复全亮；6.4–6.8s 那枚收起按钮却仍在原位淡出约 300ms——面板与其附属控件不在同一时刻消失。③甩动：9.9s 触碰、10.0s 按住、10.1s 面板只下移约 30px，10.2s（100ms 内）已完全出屏，收起按钮再留约 300ms 淡出。④取消：13.0–13.9s 小幅上拖，13.9–14.2s 收起按钮淡入（预览），14.5s 松手（未过阈值），14.6–14.8s 按钮淡出、面板回到半高原位，没有回弹过冲。背景在所有阶段只压暗、不缩放。\u003c/td>\u003ctd>设置里的底部面板（选语言／主题／通知方式）：拖拽中用「下一状态才有的控件淡入」预览结果，而不是靠面板高度本身；过阈值或甩动 ≤ 200ms 直接离场；取消 = 控件淡出 + 面板回位、不加弹跳；面板消失与其附属控件的消失可错开约 300ms。\u003c/td>\u003ctd>半高默认位与 32px 把手是照片类内容的比例，设置列表面板通常更矮；视频里拖动约 10px 就触发全屏预览，对手指操作过于敏感，JU 阈值应 ≥ 面板高的 15%。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM03\u003c/td>\u003ctd>Material 3 Transitions —「Android's default forward and backward transition / iOS' default forward and backward transition」列表→详情推入与返回\u003c/td>\u003ctd>Google Material Design（M3 官方规范页） · 2024–2025（M3 动效「Transition patterns」页；2026-10 访问）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://m3.material.io/styles/motion/transitions/transition-patterns\" target=\"_blank\" rel=\"noopener\">https://m3.material.io/styles/motion/transitions/t…\u003c/a>\u003c/td>\u003ctd>视频「GM3-Transitions-TransitionPatterns-4-v01.mp4」（5.68s，1352×1560，60fps；上为 Android、下为 iOS）：推入 0.867–1.133s 每 33ms；返回 3.733–4.000s 每 33ms；关键帧 0.967 / 1.033 / 3.833s\u003c/td>\u003ctd>m3-transition-patterns-nav/（接触表：sheet；关键帧：f00=0.967s、f01=1.033s、f02=3.833s）\u003c/td>\u003ctd>Messages 列表 → 会话页。推入：0.80s 点击列表行（波纹）。Android：0.900–0.967s 列表页原地淡出到近乎空白（文字先于底色消失），1.000s 会话页以约 96% 缩放 + 轻微上移的姿态淡入，1.033–1.100s 放大到 100% 并不透明，1.133s 静止——前后两页不共享位移方向，是约 300ms 的淡出-淡入（fade through）。iOS：0.900s 会话页从右缘滑入、列表页同时向左退约 1/3 屏并被压暗，0.967s 约 40%、1.000s 约 60%、1.033s 约 80%、1.067s 约 95%、1.100s 到位；「&lt; Back」随页面一起滑入，约 250ms、先快后慢。返回：3.5s 点返回。Android 3.700–3.733s 会话页淡出、3.767s 近空白、3.800s 列表页淡入、3.900s 到位，约 200ms（比推入短）。iOS 3.767s 会话页开始右滑出、列表页从 −1/3 处亮起滑回，3.833s 55%、3.900s 80%、3.967s 93%、4.067s 到位，约 300ms、明显缓出。两平台共同点：返回不长于推入；列表页在返回后保持原滚动位置与选中行。\u003c/td>\u003ctd>设置子页的推入／返回：iOS 端沿用「新页右入 + 父页左退 1/3 并压暗」保证层级连续，返回时父页从 −1/3 亮起滑回；Android 端用 fade-through（父页先淡出、子页轻缩放淡入）；返回 200–300ms 且不长于推入；父页滚动位置与高亮行在返回后保持。\u003c/td>\u003ctd>两种平台的过渡不要混用在同一端；Android 淡出到「近空白」的那一帧在深色主题下会闪白，JU 深色模式需让两页交叉处保留底色。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM04\u003c/td>\u003ctd>Telegram iOS「Gift Themes」——「Select Theme」面板的即时预览→应用\u003c/td>\u003ctd>Telegram（官方博客内嵌 App 录屏） · 2025-08-31（博客「Music on Profiles, Stickers Mini App, New Profiles, and More」；2026-10 访问）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>[\u003ca href=\"https://telegram.org/blog/profile-music-gift-theme…](https://telegram.org/blog/profile-music-gift-themes（「Gift\" target=\"_blank\" rel=\"noopener\">https://telegram.org/blog/profile-music-gift-theme…](https://telegram.org/blog/profile-music-gift-themes（「Gift\u003c/a> Themes」一节，第 5 段视频）)\u003c/td>\u003ctd>视频 1920×1920，60fps，9.0s：1.5–1.9s 每 50ms（页面回退 + 面板升起）；2.0–6.0s 每 0.5s（逐张预览）；6.6–7.4s 每 100ms（应用 + 面板离场）；关键帧 1.70 / 3.0 / 7.1s\u003c/td>\u003ctd>telegram-gift-themes-preview/（接触表：sheet；关键帧：f00=1.70s、f01=3.0s、f02=7.1s）\u003c/td>\u003ctd>触发：1.5s 在联系人资料页的「···」菜单点「Change Wallpaper」。发展：1.6s 资料页向右滑出、会话页从左滑入（iOS pop），同时底部「Select Theme」面板已从屏幕底缘升起（1.65s 只露标题条，1.7s 约 60%，1.75s 约 90%，1.8s 落定）——页面回退与面板升起叠在同一 200ms 内。面板：左「Cancel」、中标题、一行横向主题卡（首张「No Theme」带红 ×，其后每张卡是该主题配色的迷你气泡预览），下方是链接「Choose Wallpaper from Photos」。预览：2.5s 点一张卡，面板后面的整个会话壁纸与气泡色立刻换成该主题（蓝），同时面板底部出现实心主按钮「Apply for me and Alicia」（未选主题时此处只有链接）；3.5s、5.0s 再点其它卡，壁纸依次换成黄、紫，切换为直接换色、无过渡遮罩，选中卡带描边。落定：6.7–6.9s 按住 Apply（按钮压暗），7.0s 面板开始下滑，7.1s 面板只剩底部条、会话里同时淡入一张系统卡片「You set Plush Pepe #2352 as a new theme for this chat / View」，7.15s 面板离场、输入栏归位，7.25s 卡片完全显示。Cancel 路径视频未示范。\u003c/td>\u003ctd>外观／主题设置用「底部面板 + 后景即时预览」：点一张卡就把整页换成该主题，不等「应用」；主按钮只在做出选择后才出现，用它的有无表达「有未应用的更改」；应用后面板 150ms 内下滑，并在页面里留下一条可点的确认记录而不是弹 toast；取消 = 面板下滑 + 后景回滚到进入时的主题。\u003c/td>\u003ctd>礼物主题的横向卡片与「为双方应用」的文案是聊天场景特有；整屏换色预览对设置列表页过于激进，JU 可只换页头与示例卡。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM05\u003c/td>\u003ctd>Telegram Android「Archive」——聊天行左滑归档（阈值变色 + 收缩 + toast）\u003c/td>\u003ctd>Telegram（官方博客内嵌 App 录屏） · 2020-03-30（博客「Chat Folders, Archive, Channel Stats and More」；2026-10 访问）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>[\u003ca href=\"https://telegram.org/blog/folders（第\" target=\"_blank\" rel=\"noopener\">https://telegram.org/blog/folders（第\u003c/a> 2 段视频）…](\u003ca href=\"https://telegram.org/blog/folders（第\" target=\"_blank\" rel=\"noopener\">https://telegram.org/blog/folders（第\u003c/a> 2 段视频）)\u003c/td>\u003ctd>视频 540×554，60fps，3.98s：0.95–1.35s 每 50ms（露出动作区）；1.40–1.80s 每 50ms（到阈值）；1.85–2.25s 每 50ms（松手执行）；关键帧 1.15 / 1.70 / 2.10s\u003c/td>\u003ctd>telegram-android-swipe-archive/（接触表：sheet；关键帧：f00=1.15s、f01=1.70s、f02=2.10s）\u003c/td>\u003ctd>触发：0.55s 手指按在「Campus Party 2019」行上，0.95s 开始左拖。发展：1.0s 行内容整体左移，右侧露出蓝色「Archive」区——先是约 20px 色条，1.05s 出现归档图标，1.15s 图标下方出现「Archive」文字；1.2–1.55s 色区随手指线性加宽到约 90px；1.60–1.65s 图标外圈出现一圈浅色涟漪（到达阈值的提示），1.70s 整个色区由蓝变灰（阈值已过、松手即归档），1.75–1.95s 灰区继续随手指加宽到行宽一半以上、文字被推出左缘。落定：2.0s 松手，灰行先清空内容，2.05s 行高收缩到一半，2.10s 行消失、下方「Little Sister」上移补位；同时顶部「Archived Chats」行的预览文字在 2.0–2.15s 交叉淡入新内容、计数 2→3；2.1–2.2s 底部升起深色 toast「Chat archived / You can hide the archive by swiping left on it.」并停留到视频末尾（≥ 1.5s）。阈值约在行宽 55% 处；过阈值前松手的回弹视频未示范。\u003c/td>\u003ctd>列表行左滑收藏／取消收藏：动作区按「色条 → 图标 → 文字」三步渐进露出；到阈值时给图标一次涟漪并把整个动作区换色，作为「松手即执行」的明确信号；执行后行高收缩消失 + 目标分组的计数／预览同步更新 + 底部 toast；未到阈值松手则回弹。\u003c/td>\u003ctd>灰色作为「已确认」色在 JU 的中性色体系里会被误读为禁用，应换成主色加深；Telegram 的 toast 只给提示不给撤销，JU 的收藏／取消收藏应把「撤销」放进 toast。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM06\u003c/td>\u003ctd>Telegram iOS「Chat Folders」——新建文件夹：Include Chats 多选 → Add → Create → Done\u003c/td>\u003ctd>Telegram（官方博客内嵌 App 录屏） · 2020-03-30（博客「Chat Folders, Archive, Channel Stats and More」；2026-10 访问）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>[\u003ca href=\"https://telegram.org/blog/folders（第\" target=\"_blank\" rel=\"noopener\">https://telegram.org/blog/folders（第\u003c/a> 1 段视频）…](\u003ca href=\"https://telegram.org/blog/folders（第\" target=\"_blank\" rel=\"noopener\">https://telegram.org/blog/folders（第\u003c/a> 1 段视频）)\u003c/td>\u003ctd>视频 540×960，60fps，23.3s：12.0–13.9s 每 0.24s（多选）；13.95–14.35s 每 50ms（Add → 模态下滑）；15.35–15.95s 每 75ms（Create → 模态下滑）；关键帧 12.4 / 14.2 / 15.7s\u003c/td>\u003ctd>telegram-ios-chat-folders-flow/（接触表：sheet；关键帧：f00=12.4s、f01=14.2s、f02=15.7s）\u003c/td>\u003ctd>「Include Chats」多选页（顶部 Cancel／标题／Add，每行头像 + 名称 + 右侧空心圆）。触发→发展：12.2s 点「Crypto News」，12.4s 右侧空心圆瞬间填成蓝色实心勾（无缩放过渡），同时页顶出现一行已选摘要「Crypto News」；12.7s、13.2s 再点两项，摘要行逐项追加为「Crypto News, SEC Memes, Trading Hub」并把列表向下顶一行；右上「Add」在有选择后变成可用的蓝色。保存：13.95s 点「Add」，14.1s 该页作为 iOS 模态卡开始下滑（后面的「New Folder」页以缩小的父卡形态露出顶部），14.15s 下滑约 25%、14.2s 45%、14.25s 65%、14.3s 90%、14.35s 离场，约 250ms 缓出；关键在 14.2s 时父页的「INCLUDED CHATS」区已列出这 3 个聊天——数据更新先于面板离场完成。二次保存：15.4s 点「Create」，15.5–15.9s「New Folder」卡同样下滑离场，露出「Folders」列表里新增的「Work · 3」行，15.95s 点 Done 退出。全程没有加载态与成功 toast，「已保存」由父页内容先更新这一事实表达。\u003c/td>\u003ctd>设置里的多选（通知类型、兴趣标签）：选中即填实心勾 + 顶部摘要行逐项追加，让用户不滚动也能核对已选；「保存」= 模态下滑约 250ms，且父页在面板离场过半前就显示新值，用内容更新代替成功提示；二级编辑页按同一节奏层层退回。\u003c/td>\u003ctd>勾选完全无过渡在 60fps 视频里尚可，在 JU 的大尺寸行上会显得生硬，应加约 100ms 缩放；iOS 13 式的父卡缩放背景不适合 Android 端。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM07\u003c/td>\u003ctd>Drag gestures on the web（仿 iOS 26 的可滑动列表行：吸附点、提交阈值、渐进露出的动作钮）\u003c/td>\u003ctd>Jakub Krehel（jakub.kr，Design Engineer） · 2025–2026（页面未标日期；文中自述为「iOS 26-inspired gesture」）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://jakub.kr/work/drag-gesture\" target=\"_blank\" rel=\"noopener\">https://jakub.kr/work/drag-gesture…\u003c/a>\u003c/td>\u003ctd>Playwright 录屏（1280×900 视口，25fps，裁切示范区 680×130）：短拖 5.80–6.12s 每 40ms；回弹 6.56–6.88s 每 40ms；长拖 8.60–8.92s 每 40ms；第二钮 8.96–9.28s 每 40ms；关键帧 6.20 / 6.72 / 8.88 / 9.20s\u003c/td>\u003ctd>jakubkr-drag-gestures-row/（接触表：sheet；关键帧：f00=6.20s、f01=6.72s、f02=8.88s、f03=9.20s）\u003c/td>\u003ctd>示范区是三行邮件式列表（头像、标题、时间、摘要），提示「Drag items to the left or right」。①短拖取消：按下后行先出现浅灰按压底（5.84s），5.88–6.12s 行随指针左移到 −40px（低于页面给出的 58px 提交阈值），右侧没有任何动作露出；6.60s 松手，6.64–6.80s 行以弹簧回到 0（6.72s 略越过中线约 3px 再回），约 200ms，按压底随后淡出。②长拖提交：8.44s 起行左移，头像被容器裁切（overflow-clip）；8.76s 行过 44px 时第一枚橙色圆形动作钮在行右侧以 scale 0.75→1 + 透明度淡入（spring 0.3s、无弹跳），8.84s 到位；9.04s 行过 88px 时第二枚红色「删除」钮以同样方式在更右侧淡入，9.12s 到位；行继续跟手到约 −150px，松手后回弹停在 −116px 的吸附点，两枚按钮保持可见。页面同时给出参数：吸附点 LEFT −116 / CENTER 0 / RIGHT 116，提交阈值 POSITION_THRESHOLD = 58px，按钮出现阈值 44px 与 88px，dragMomentum 关闭保证总停在吸附点。\u003c/td>\u003ctd>列表行滑动的三层阈值：44px 露出第一个动作、88px 露出第二个、58px 决定松手是打开还是回弹；动作钮以 scale 0.75→1 + 淡入逐个出现，而不是整块平移露出；关闭动量，松手一律落在吸附点；未过阈值的回弹允许 2–3px 过冲。\u003c/td>\u003ctd>这是桌面鼠标演示，阈值按 px 写死，JU 需按行宽百分比换算；按钮顺序（先提醒后删除）要按 JU 的「收藏 → 更多」改；三行示例没有展示多行同时打开时的互斥关闭。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SM08\u003c/td>\u003ctd>Material 3 Segmented button guidelines —「Icons become checkmarks when selected in buttons that also use label text」单选分段切换\u003c/td>\u003ctd>Google Material Design（M3 官方规范页） · 2024–2025（M3 组件规范页；2026-10 访问）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://m3.material.io/components/segmented-buttons/guidelines\" target=\"_blank\" rel=\"noopener\">https://m3.material.io/components/segmented-button…\u003c/a>\u003c/td>\u003ctd>视频「GM3 - Buttons - Segmented Buttons - Guidelines 01 - IA - v02.mp4」（5.27s，1352×600，60fps；裁切控件区 700×110）：0.467–0.733s 每 33ms（选 Trending）；2.233–2.500s 每 33ms（选 Saved）；4.233–4.500s 每 33ms（选 Favorites）；关键帧 0.483 / 0.550 / 0.617s\u003c/td>\u003ctd>m3-segmented-buttons-select/（接触表：sheet；关键帧：f00=0.483s、f01=0.550s、f02=0.617s）\u003c/td>\u003ctd>三段单选「Favorites / Trending / Saved」，选中段有淡紫填充 + 前置对勾。触发：0.467s 按下「Trending」，出现深色圆形按压涟漪。发展：0.533s 旧选中段「Favorites」的填充与对勾开始淡出；0.567s「Trending」填充淡入，其趋势图标在原位渐变成一枚小对勾（图标与对勾交叉淡入，不是位移替换）；0.600s 对勾完整、填充饱和；0.633s「Favorites」的对勾已换回星形轮廓图标。落定：0.633–0.733s 涟漪扩散淡出，0.733s 静止；文字全程不动。「Saved」（2.233s）与「Favorites」（4.233s）两次切换完全相同：填充 + 图标约 100–130ms，涟漪约 250ms，两者叠加约 270ms。\u003c/td>\u003ctd>设置里的分段控件（「全部／仅好友」「浅色／深色／跟随系统」）：新旧两段同时变化——旧段先褪、新段填充与「图标变对勾」交叉淡入，100–150ms 内完成；按压涟漪独立于选中态、可持续到 250ms；文字不位移。\u003c/td>\u003ctd>选中态填充很淡（约 10% 主色）在 JU 的浅灰底上对比不足，需加描边或加深；M3 分段没有滑动胶囊，不要与 REF15 的滑动式分段混用在同一页。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE01\u003c/td>\u003ctd>IDEA No. 400「Graphic Design Recollections &amp; Records: Design Archives as a Creative Resource」期号目录页（idea-mag.com）\u003c/td>\u003ctd>IDEA 编辑部（誠文堂新光社，东京）；本期 Direction IDEA，Supervision 佐賀一郎（Ichiro Saga），Design LABORATORIES（加藤賢策、守谷めぐみ） · 2022-12-10（No. 400，创刊 70 周年特大号）\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.idea-mag.com/en/idea_magazine/idea-no-400/\" target=\"_blank\" rel=\"noopener\">https://www.idea-mag.com/en/idea_magazine/idea-no-…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽整页（高 9225px）：0–1180px 期号块与封面；1240–1620px 特辑 credits 块；3380–4760px「Chapter 1」条目区；手机 390 宽（@2x）整页顶部 0–1650px\u003c/td>\u003ctd>idea-400-archives/top.jpg; idea-400-archives/credits.jpg; idea-400-archives/chapters.jpg; idea-400-archives/mobile.jpg\u003c/td>\u003ctd>两栏：左栏约 340px 宽（x≈180–520），第一行小字「IDEA magazine」与日期「2022/12/10」左右分置，其下期号「400」以约 70px 高的衬线数字单独成块；再往下依次是封面缩图、「IDEA No.400 / Published: 2022/12/10 / Price: 定価4,070円／3,700+tax jp yen」三行元数据、两枚橙色小按钮（ORDER / Amazon.co.jp）、灰色小字订购说明、「RelateBooks」列表（每条＝期号小字一行 + 标题一行 + 右缘「›」，条间细线）、「Keyword」列表（poster design / printers flowers / map / Dutch design / printing / indie publishing…每行一条带「›」）。右栏从 x=549 起：标题 29px/37.7px 粗体 Univers 两行，封面大图，再重复一次「Published / Price」+ 两枚黄色按钮（Order here… / The digital version…）。目录正文先是一个 credits 块：「Special Feature:」16px 粗体小标 → 特辑标题（约 22px 粗体）→ 副题（约 18px 粗体）→ 四行署名「Direction by IDEA / Supe\u003c/td>\u003ctd>设置页的「分区标签 → 分区标题 → 条目 → 条目说明行」四级结构可直接借用：「Chapter 1」式小标签对应「账号／偏好／帮助」的分区小字，章标题对应分区名，条目下的多行署名对应每项设置的说明行（谁能看到、上次修改时间）。左栏「期号 + 日期 + 价格 + 两枚按钮 + 相关期号 + 关键词」是一个稳定的档案侧块，可转译为个人区顶部的身份块：大号数字（加入第 N 天／已参加局数）+ 小字日期 + 主次两枚按钮 + 「相关」列表（我的收藏、我的记录）。credits 四行可转译为「关于 JU」里版本、团队、第三方声明的四行小字。\u003c/td>\u003ctd>整页 9225px 的长滚动与跨页大图不适合设置列表；英文衬线 + Univers 的字号梯度需按中文字重重排；页面没有任何可折叠分组，所有条目全部展开。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE02\u003c/td>\u003ctd>Emigre #64「Rant」期号页（版本说明 + 目录）与 Letterform Archive 的印刷版版权页、CONTENTS 页扫描\u003c/td>\u003ctd>Rudy VanderLans（编辑与设计），Emigre Inc.；联合出版 Princeton Architectural Press；印刷 R.R. Donnelley and Sons · 2003（#64；144 页，5.25×8.25 英寸，印数 6,000）\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>[\u003ca href=\"https://www.emigre.com/Magazine/64\" target=\"_blank\" rel=\"noopener\">https://www.emigre.com/Magazine/64\u003c/a> ；扫描页 \u003ca href=\"http://oa.…](https://www.emigre.com/Magazine/64\" target=\"_blank\" rel=\"noopener\">http://oa.…](https://www.emigre.com/Magazine/64\u003c/a> ；扫描页 \u003ca href=\"http://oa.letterformarchive.org/item?workID=lfa_emigre_0064&amp;LFAPics=Yes（由\" target=\"_blank\" rel=\"noopener\">http://oa.letterformarchive.org/item?workID=lfa_emigre_0064&amp;LFAPics=Yes（由\u003c/a> Emigre 页面链接）)\u003c/td>\u003ctd>emigre.com 期号页桌面 1440 宽整页（高 1486px）；Letterform Archive 页首屏，点开底部缩略图第 4 张（版权页）与第 5 张（CONTENTS 页）\u003c/td>\u003ctd>emigre-64-rant/page.jpg; emigre-64-rant/colophon.jpg; emigre-64-rant/colophon-scan.jpg; emigre-64-rant/contents-scan.jpg\u003c/td>\u003ctd>网页两栏：左为封面（红底白字 RANT、黄色 Emigre 盾徽、「No.64」、底部四行撰稿人名用「/」分隔），封面下三枚翻页钮「&lt;&lt; ▦ &gt;&gt;」；右栏自上而下：「Emigre #64」25px（Mr Eaves Mod Heavy）、「Rant (2003)」、「Sold Out」、红色小按钮「Free PDF Download」；空一行后五行版本说明「144 pages, 5.25 x 8.25. / Edition of 6,000. / Co-published by Princeton Architectural Press. / Printed at R.R. Donnelley and Sons, Harrisonburg, VA. / Editor and designer: Rudy VanderLans.」；一行外链「Browse all pages of Emigre #64 in high resolution at Letterform Archive.」；「CONTENTS:」小标后 10 条目录，每条「\u003cstrong>作者粗体\u003c/strong>, *标题斜体* (体裁)」，体裁只有四种：essay / discussion / mail / visual essay；一条点线之后三条评论外链（Eye 2003、Typotheque 2004、Speak Up 2004）。印刷\u003c/td>\u003ctd>「关于」页可照抄版权页的十行结构：版本号 + 构建号对应「印次行 06 05 04 03 / 5 4 3 2 1」；编辑／校对／地址对应团队、联系邮箱、公司地址；ISBN / ISSN 对应 App ID 与备案号。目录页「页码左列、标题常规、作者斜体缩进另起一行」的三段式可转译为设置条目的「序号 / 名称 / 说明行（次级字重）」。网页端「体裁括注只有四种」提示设置项的类型标签也只保留极少几种（开关、选择、跳转、说明）。\u003c/td>\u003ctd>印刷品的衬线斜体与红色品牌色；网页右栏的 Sold Out / Free PDF 电商状态；目录没有分组、只有 10 条，直接套用到几十条设置会过长。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE03\u003c/td>\u003ctd>Eye Magazine「Issues」过刊索引（Issue 110 → Issue 1）与 Issue 110 期号页（Opinion / Features / Reviews 分组）\u003c/td>\u003ctd>Eye Magazine（伦敦；编辑 John L. Walters） · 1990–2026（Issue 110 = Summer 2026）\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>[\u003ca href=\"https://www.eyemagazine.com/issues\" target=\"_blank\" rel=\"noopener\">https://www.eyemagazine.com/issues\u003c/a> ；\u003ca href=\"https://www.ey…](https://www.eyemagazine.com/issues\" target=\"_blank\" rel=\"noopener\">https://www.ey…](https://www.eyemagazine.com/issues\u003c/a> ；\u003ca href=\"https://www.eyemagazine.com/magazine/issue-110\" target=\"_blank\" rel=\"noopener\">https://www.eyemagazine.com/magazine/issue-110\u003c/a>)\u003c/td>\u003ctd>Issues 索引桌面 1440 宽整页（高约 11600px，110 期 4 列 28 行），截取 120–1600px（Issue 110–99）与 2300–3600px（Issue 90–79）；手机 390 宽（@2x）首屏；Issue 110 页桌面 540–2928px（Opinion、Features、Reviews 三段）\u003c/td>\u003ctd>eye-issues-index/index-top.jpg; eye-issues-index/index-mid.jpg; eye-issues-index/index-mobile.jpg; eye-issues-index/issue110.jpg\u003c/td>\u003ctd>索引为 4 列网格：每格封面缩图 140×175px，格间距约 20px，每行高约 395px，格与格之间只用 1px 细线，没有卡片底色。每格固定六段：橙色粗体「Issue 110」（14px Helvetica bold）→ 灰色粗体「Summer 2026」（14px）→ 5–7 行灰色衬线小字「专题／人名」（Samar Maakaroun / Gordon House / Tadanori Yokoo / Truman's Letters / Andy Altmann）→ 状态行只有三种写法：橙色链接「Buy issue」（页内 44 处）、橙色「Low stock」（15 处）、灰色句子「This issue has sold out.」。越旧的期号越靠下，没有年份分组标题——年份只写在每格的「Spring 2014」里。手机版变 2 列，封面放大到约 350px 宽，六段层级不变。Issue 110 页：左侧窄栏灰色小字「Opinion / Features / Reviews」贴在每组首条左边，右栏每条「缩图 + 橙色标题 + 灰色粗体作者 + 一句摘要」；Reviews 组没有缩图与作者，只剩 10 行橙色标题；再右一栏列 27 个「Categories」（Awards madness … Identity），页脚「© Eye, 1990-2026」。\u003c/td>\u003ctd>「我的记录」归档可以照用「同一格子六段固定结构 + 状态只有三个词」的网格：局名／日期／3–5 行要点／状态（已结束 / 待评价 / 已取消），只给状态词上色，不给整卡上色；不做年份分组标题，把时间写进每条本身。Issue 110 页的「左侧窄标签 + 右侧条目」是设置分组的另一种做法：分组名作为侧标签贴在组首条旁而不是单独占一行；Reviews 组「只有标题没有缩图」提示次要分组（法律条款、第三方说明）可退化为纯文字列表。\u003c/td>\u003ctd>110 期一次性全部渲染（约 11600px）没有分页或折叠，手机上要滚 28 屏；橙色链接 + 灰色衬线小字的对比在移动端偏弱；「Low stock / sold out」是电商状态词。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SE04\u003c/td>\u003ctd>《Typography 字誌》Issue 03「嚴選字型401」目錄頁（臉譜出版，城邦讀書花園書籍頁）\u003c/td>\u003ctd>Graphic社編輯部（日本）、卵形／葉忠宜（中文版主編）；臉譜出版（台北，城邦集團） · 2017-06-08（Issue 03；128 頁，18.3×25.7cm，定價 420 元，已絕版）\u003c/td>\u003ctd>editorial\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.cite.com.tw/book?id=72476\" target=\"_blank\" rel=\"noopener\">https://www.cite.com.tw/book?id=72476…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽整页（展开「目錄」后高 6614px）：330–900px 书名块；3600–4740px 目錄区（「目錄」小标 15px 粗体，位于 y≈2002 处的 Tab 之下）；手机 390 宽（@2x）顶部 0–1650px\u003c/td>\u003ctd>typography-zizhi-issue03/top.jpg; typography-zizhi-issue03/toc.jpg; typography-zizhi-issue03/mobile.jpg\u003c/td>\u003ctd>书名块：封面图在左（下带 4 张内页缩图的横向滑条），右侧书名 20px/30px 粗体 LiHei Pro 占 4 行（含赠品说明），其下「作者／出版社／出版日期」三行与「定價：420元」，右上角灰色胶囊「已絕版，無法販售」+ 三枚圆形分享钮。内容区用一条横向 Tab「內容簡介\u003c/td>\u003ctd>目錄\u003c/td>\u003ctd>延伸內容\u003c/td>\u003ctd>作者資料\u003c/td>\u003ctd>基本資料」+ 字号三档「小 中 大」；每段默认折叠、段末「展開 ⌄」，展开后段末变「收合 ⌃」。目錄正文 15px/24px，分五个一级区块，每块以「▌」竖条起头：「▌正受矚目的字體設計和週邊商品 Visual Typography」（4 条）、「▌特別記事：直擊字體設計的職場」（1 条：朝日字體　朝日新聞社 ✕ イワタ）、「▌特輯　設計師都該認識的401款嚴選字型！」、「▌專欄連載　Columns」（8 条，每条「栏目名：Vol.0N 本期题／作者」）。特辑内部用【中文篇】【歐文篇】【日文篇】三个方头括号做二级分组；歐文篇里把「[專欄1]各種類型的Garamond、Caslon、Century」「[專欄2]聰明選購字型」「[專欄3] OpenType Feature」三条插在条目之间，用方括号区别于正文；作者只在部分条目后用圆括号标注「（許瀚文）」「（柯志杰）」。区块之间空一行、不用线。「基本資料」块是七行「键：值」（作者／出版社／書系／出版日期／ISBN／城邦\u003c/td>\u003ctd>中文设置页的三级分组可以直接用这套记号系统：一级「▌分区名」、二级「【子组】」、插入式说明「[专栏 N]」——在同一列表里用三种不同的记号而不是缩进来区分层级。「展開／收合」放在段末而不是标题右侧，适合长说明段（隐私条款、权限说明）。「已絕版」胶囊是状态只用一枚灰色胶囊、不改变整块版式的例子；「基本資料」七行键值对可作「关于 / 账号信息」的格式。\u003c/td>\u003ctd>这是书店商品页，促销横幅、分類排行、同作者书籍等电商模块无关；LiHei Pro 15px 在手机上偏小；一级区块没有锚点，只能滚动。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD01\u003c/td>\u003ctd>Maison Martin Margiela 1997 秋冬 黑色羊毛围裹裙（V&amp;A 馆藏 T.58-2026）：空白布标与四针白线、织物布边作裙边、只缝在后片的腰带\u003c/td>\u003ctd>Martin Margiela / Maison Martin Margiela（巴黎设计，意大利织造与缝制）；辅证 MoMu Antwerp 文章「Martin Margiela」（作者 Romy Cockx） · 1997-98 AW（Margiela 本人任内；V&amp;A 2026 年购藏，Golden Bottle Trust 资助）\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>[\u003ca href=\"https://collections.vam.ac.uk/item/O1819292/\" target=\"_blank\" rel=\"noopener\">https://collections.vam.ac.uk/item/O1819292/\u003c/a> ；馆方 I…](\u003ca href=\"https://collections.vam.ac.uk/item/O1819292/\" target=\"_blank\" rel=\"noopener\">https://collections.vam.ac.uk/item/O1819292/\u003c/a> ；馆方 IIIF 图像 \u003ca href=\"https://framemark.vam.ac.uk/collections/2026PP2429/\" target=\"_blank\" rel=\"noopener\">https://framemark.vam.ac.uk/collections/2026PP2429/\u003c/a> 、\u003ca href=\"https://framemark.vam.ac.uk/collections/2026PP2430/\" target=\"_blank\" rel=\"noopener\">https://framemark.vam.ac.uk/collections/2026PP2430/\u003c/a> ；辅证 \u003ca href=\"https://www.momu.be/en/collection-stories/martin-margiela\" target=\"_blank\" rel=\"noopener\">https://www.momu.be/en/collection-stories/martin-margiela\u003c/a>)\u003c/td>\u003ctd>V&amp;A 物件页桌面 1440 宽（点「Continue without accepting」关掉 cookie 弹窗后）滚动 1400px 处的 Object details 表；馆方图像 2026PP2429（内侧标签特写）与 2026PP2430（裙背面平铺）各取 1800px 版本；MoMu 文章整页（高 22431px）约 18100–18760px 处「Incognito」段的「Martin Margiela, front label」图与说明文\u003c/td>\u003ctd>margiela-aw97-wrap-skirt-vam/label.jpg; margiela-aw97-wrap-skirt-vam/back.jpg; margiela-aw97-wrap-skirt-vam/page.jpg; margiela-aw97-wrap-skirt-vam/momu-label.jpg\u003c/td>\u003ctd>标签特写：一块纯白棉织带矩形（约占画幅宽 45%，宽高比约 2.4:1），没有任何文字，只在四角各一针白线固定，线脚在黑色布面上露出四个小白点；标签紧贴腰部那条深绿黑罗纹带下缘居中。裙背面平铺：腰带只横跨后片，两侧前片不与腰带相连、自由垂下；两条前片外缘用面料布边本身收口，布边上以金色织字循环「MADE IN BIELLA ✕ LANE TASMANIA ✕ SUPER 100'S」（产地 ✕ 原料 ✕ 品质三段，以「✕」分隔）；正面图里这条金字布边从腰到脚贯穿整条裙子右侧。馆方文字确认：腰带以两枚风纪扣在左侧闭合，前片「可任其垂落、可塞入腰带、或如秀场那样别在上衣上」。V&amp;A 页的 Object details 是「大写小标签（13px，左列宽 165px）／值（15px/21px，列宽 416px）」两栏表：ARTIST/MAKER 的值是两枚 28px 高描边胶囊「Maison Margiela」「Martin Margiela」，PLACE OF ORIGIN「Italy」，OBJECT TYPE「Skirt」，MATERIALS「Woven wool.」+ 胶囊「Wool」；长文字段（Physical description、Object history）默认截断并带「Read more ⊕」（共 2 处）；右侧缩略图栏「+3 images」与「Not on displa\u003c/td>\u003ctd>标签系统：空白标 + 四针固定 = 身份不靠文字而靠固定方式——「我的记录」每条可用一枚无字小色块 + 四角钉点表示「已归档」，识别信息（局名、日期）写在旁边；布边织字「产地 ✕ 原料 ✕ 品质」循环是把元数据印在边缘的范式，个人区卡片边缘可印「加入日期 ✕ 城市 ✕ 身份」循环小字。腰带只缝后片、前片三种穿法 = 一个固定锚点 + 可变层：设置里的二级层（折叠说明、偏好面板）只锚定在标题行，其余可收起、可展开、可固定。V&amp;A「大写小标签／值／描边胶囊／Read more」两栏表是最接近设置表单的馆藏信息结构：键 13px 大写、值 15px、可点的值用描边胶囊、长说明截断。\u003c/td>\u003ctd>馆藏页的深色大图首屏与「Order an Object」浮钮；四针线脚是物理缝纫细节，做成像素图标时四个点至少要 2px 否则看不见；布边文字是织入的金色，屏幕上不宜用金色小字。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD02\u003c/td>\u003ctd>Yohji Yamamoto Spring 1999 Ready-to-Wear（婚纱系列：模特一件件脱下、层层露出下一件；Vogue Runway 秀页）\u003c/td>\u003ctd>Yohji Yamamoto · 1998-10 巴黎 SS99（Vogue Runway 存档页标注 August 1, 1998；2026-10 访问）\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.vogue.com/fashion-shows/spring-1999-ready-to-wear/yohji-yamamoto\" target=\"_blank\" rel=\"noopener\">https://www.vogue.com/fashion-shows/spring-1999-re…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽：首屏（标题块、导语、看次 01–03）；滚动 1300px（DETAILS 01–03 上半）；滚动 1900px（DETAILS 01–06 全部，其后即「SUBSCRIBE TO VIEW ALL」）；手机 390 宽滚动 900px 处只见订阅墙\u003c/td>\u003ctd>yohji-yamamoto-ss99-wedding/top.jpg; yohji-yamamoto-ss99-wedding/details-a.jpg; yohji-yamamoto-ss99-wedding/details-b.jpg\u003c/td>\u003ctd>页面导语写明「models removing one dress, only to reveal another, and then another」。看次 01：白色立领上衣 + 直筒长裙 + 短手套，上衣前襟是暗门襟（看不到扣子），领口一圈珍珠；02：白色缎面西装两件套，敞开的前襟内没有衬衫，颈上一条亚麻色领巾打单结，宽檐帽加白纱；03：卡其色军装式短袖上衣（同样暗门襟，只在领口露一粒扣）配同色长裤，头顶大白纱帽，纱从帽檐拖到地面成拖尾。DETAILS 六格：01 珍珠领 + 面纱；02 黑色硬纱大帽下的亚麻领巾结特写，两端一长一短从结下垂到胸口；03 背面：纱拖尾盖住卡其上衣的后背，上衣下摆处露出叠在里面的第二层米色布；04 淡绿外套 + 透纱帽；05 白色抹胸式上衣，胸口一块布向外翻折成一道横向褶，像裙子「卷下来」留下的边；06 卡其长风衣式礼服 + 麦秆色帽。三看次与六细节里每套至少两层（外套／纱／里衣），外层的闭合都是暗门襟或系结，没有外露的纽扣或拉链。\u003c/td>\u003ctd>二级层（linings）的范式：外层（设置主列表）用暗门襟（整行可点、不露控件），点开后露出的里层（偏好面板）本身是完整的一件，再往里还有一层（高级选项）——每层都能单独成立；细节 03「拖尾盖住后背、下摆露出里层」提示折叠面板收起时可露一条里层的边（1 行预览）而不是完全隐藏；领巾单结 = 一拉就开的系结型开关，适合「临时关闭通知」这类可逆操作。\u003c/td>\u003ctd>Vogue 页只开放 3 看次 + 6 细节即遇订阅墙，手机端细节栏被订阅墙顶到两屏之下；白纱、宽檐帽是秀场造型，不构成界面元素；婚纱叙事的情绪不适用于设置页。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD03\u003c/td>\u003ctd>Helmut Lang Spring 2003 Ready-to-Wear（Vogue Runway 秀页，Sarah Mower 评论 2002-10-03）：交叉织带、网纱／皮革拼插、拉链裙\u003c/td>\u003ctd>Helmut Lang · 2002-10 巴黎 SS03（Vogue Runway 存档；2026-10 访问）\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.vogue.com/fashion-shows/spring-2003-ready-to-wear/helmut-lang\" target=\"_blank\" rel=\"noopener\">https://www.vogue.com/fashion-shows/spring-2003-re…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽：首屏（标题块、评论首段、看次 01–03）；滚动 1800px（DETAILS 01–03 与 04–06 上半）；滚动约 2900px（DETAILS 04–06 下半，细节 05 的交叉织带特写）\u003c/td>\u003ctd>helmut-lang-ss03/top.jpg; helmut-lang-ss03/details.jpg; helmut-lang-ss03/detail-05.jpg\u003c/td>\u003ctd>评论原文：「the coats and pants got inserts or sleeves constructed of mesh, chiffon and leather. The T-shirts were often reduced to complex traceries of string… a zippered dress」。看次 01–03 都是黑色长外套 + 窄裤：01 外套袖子上半截换成橙色透明薄纱、袖口回到黑色；02 外套里一件橙色上衣，外套前襟不扣，腰部一条黑色拉链从里衣斜向露出；03 外套里是橙色上衣加一块白色斜向拼片。DETAILS：01 棕色网纱裤脚 + 露趾高跟；02 橙色皮革护腿套在黑色鞋面上；03 一条橙色细带从脚趾间绕过固定凉鞋；04 黑裤脚 + 鞋背一条橙色细带；05（特写）橙色上衣领口：两条约 3cm 宽的橙色织带从两肩交叉压过锁骨，在胸口 V 形交汇处由一粒同色小扣固定，织带与上衣同色、只靠厚度与阴影区分；06 黑色露趾短靴。全场只有黑 + 橙 + 白三色，橙色只出现在「闭合／连接」部件上（织带、拉链、皮革护腿、鞋带）。\u003c/td>\u003ctd>开关（fastenings）的范式：闭合件用一种强调色，其余全部无彩色——设置页里只有「开关的开态、正在编辑的输入框」用品牌色，列表、分组、说明全部无彩；交叉织带 + 一粒扣 = 两条路径汇到一个固定点，可转译为「两个相关开关共用一个总开关」的视觉（两条线汇到一个点）；「袖子上半截换成薄纱」= 同一行里局部降低不透明度表示该段被禁用（灰态不是整行灰，而是局部透明）。\u003c/td>\u003ctd>秀场图在 325×180px 的截图里已接近极限，比例数值只能估计；Vogue 页 3 看次 + 6 细节后即订阅墙；高饱和橙在大面积界面上会过强，只能用于线状元素。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD04\u003c/td>\u003ctd>Craig Green AW18 秀图页（craig-green.com「AW18 IMAGE」，30 看次）：系带前襟、垂绳、木框吊袋、拉绳兜帽\u003c/td>\u003ctd>Craig Green（伦敦） · 2018 AW 男装（2018-01 伦敦发布；官网集合页 2026-10 访问）\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.craig-green.com/collections/aw18-image\" target=\"_blank\" rel=\"noopener\">https://www.craig-green.com/collections/aw18-image…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽（点「Decline」关掉 cookie 条后）：首屏（看次 1–10）、滚动 850px（看次 11–20）、滚动 1700px（看次 21–30）；手机 390 宽（@2x）首屏（2 列，看次 1–6）\u003c/td>\u003ctd>craig-green-aw18/grid-1.jpg; craig-green-aw18/grid-2.jpg; craig-green-aw18/grid-3.jpg; craig-green-aw18/mobile.jpg\u003c/td>\u003ctd>页面是 5 列无间隙网格，每格 288×432px（2:3），30 看次 6 行，页高 2822px；除顶栏「Store / Collections / Project Archive」与圆环 logo 外没有任何文字、看次编号或说明；手机版变 2 列，每格约 390px 宽。看次（按网格顺序自编）：1–2 白／黑衬衫式上衣前襟没有扣子，只在腰侧垂两条黑色细带；3 白衬衫前挂一只黑色硬壳方包，用两条带系在身上；4 黑色外套两侧与袖口各垂 3–4 条到膝盖的黑色细绳；5 卡其工装外套胸前两个贴袋 + 腰部两个大贴袋，袋盖用同色带子系住而不是扣子；6 背木条十字框，框两侧各用白绳吊一只布袋；7 米色拉绳兜帽衫，兜帽、下摆、裤脚共六根白色拉绳垂到小腿；8 浅绿短袖衬衫前挂黑色方包；11 黑色绗缝背心前襟用两根白绳交叉系合；13 绿色绗缝背心 + 腰间两根白绳系结，裤侧挂一只同料小袋；14 灰色上衣胸前一枚圆徽章 + 腰前一个硬质方袋；21–30 彩色条纹长袍，每件的前片、肩、袖挂满 10 根以上白绳穗；24、29 木框两侧各吊一只彩色布袋，框由白绳收束。30 看次没有一个可见的金属扣件，闭合全部是系绳、交叉带或挂袋。\u003c/td>\u003ctd>折叠（pockets）与开关（fastenings）的另一种范式：袋子不缝在衣服上而是用绳吊在框架上——设置里的可折叠区块可以做成挂在分组标题下的独立模块，关闭 = 解绳收起，而不是展开／收起整个列表；一件衣服多根拉绳 = 多个独立开关都用同一种控件形状（绳 + 绳头），不把开关、复选、按钮混用；网格页本身「无文字、无编号、5 列等比格」说明记录归档页可以用纯图像网格做第一层，文字留到详情。\u003c/td>\u003ctd>看次图没有编号与说明，无法按官方编号引用（上面编号是按网格顺序自编）；官网没有秀评文字，无法核对系列名与材质；30 格无间隙网格在手机上 2 列仍要滚 7 屏。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SD05\u003c/td>\u003ctd>Rick Owens Spring 2018 Menswear（Vogue Runway 秀页，Luke Leitch 评论 2017-06-22）：抽绳腰头、箱形皮袋挂腰、肩带 D 环弹簧钩、铆钉袋\u003c/td>\u003ctd>Rick Owens（Owenscorp） · 2017-06 巴黎 SS18 男装（Vogue Runway 存档；2026-10 访问）\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.vogue.com/fashion-shows/spring-2018-menswear/rick-owens\" target=\"_blank\" rel=\"noopener\">https://www.vogue.com/fashion-shows/spring-2018-me…\u003c/a>\u003c/td>\u003ctd>桌面 1440 宽：首屏（标题块、评论前两段、看次 01–03）；滚动 1300px（DETAILS 01–03）；滚动约 2400px（DETAILS 01–06 全部，其后「SUBSCRIBE TO VIEW ALL」）\u003c/td>\u003ctd>rick-owens-ss18-menswear/top.jpg; rick-owens-ss18-menswear/details-a.jpg; rick-owens-ss18-menswear/details-b.jpg\u003c/td>\u003ctd>看次 01：裸上身，深绿色皮短裤，腰头是一条米色抽绳打结后两端垂到大腿，裤腿外侧挂一只同色皮箱形袋；02：灰色半透明无袖上衣，一条黑色宽肩带斜挎一只黑色方包挂在胸前；03：白色不对称无袖长上衣，一只浅灰箱形皮袋以带子挂在腰侧。DETAILS：01 米色抽绳 + 腰带扣 + 绿色皮袋（袋体是两个叠起的长方盒，靠一条带固定在腰上）；02 同一袋子的侧面，两个盒体之间一条拉链缝；03 黑色拖鞋式靴配齿状厚底；04 黑色背包肩带上一枚金属 D 环 + 弹簧钩，包侧一列约 6 枚铆钉；05 浅灰皮袋贴在白色上衣腰侧，袋口一条灰色拉链；06 灰色皮靴套在齿底鞋上。所有「容器」（袋）都是独立硬质箱体，用带子挂在身体或衣服上而不是缝成口袋；闭合只用三种硬件：抽绳结、D 环弹簧钩、拉链。标题块「RICK OWENS / SPRING 2018 MENSWEAR / By Rick Owens」+ 署名「BY LUKE LEITCH JUNE 22, 2017」。\u003c/td>\u003ctd>「口袋 = 外挂箱体」：设置里的可折叠区块可做成挂在列表外侧的独立箱体（卡片有自己的边和阴影），用一条「带子」（标题行）固定在父级；两个盒体叠起 + 中间一条拉链 = 两个子区块共享一条分隔线作为展开／收起的把手；三种硬件对应三种控件语义：抽绳结 = 可调（滑块／步进）、D 环弹簧钩 = 可挂接（关联账号、绑定设备）、拉链 = 开合（折叠）。\u003c/td>\u003ctd>Vogue 页订阅墙后看不到更多看次；铆钉、齿底靴是风格元素；硬件语义是我们的解读，不是设计师的说明。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>二、继承案例（上一轮 94 例；证据与原始观察不变）\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>编号\u003c/th>\u003cth>案例／作品\u003c/th>\u003cth>创作者 · 年份／系列\u003c/th>\u003cth>类别\u003c/th>\u003cth>状态\u003c/th>\u003cth>原始 URL\u003c/th>\u003cth>实际查看位置\u003c/th>\u003cth>证据文件\u003c/th>\u003cth>具体观察（原）\u003c/th>\u003cth>对「设置」的转译\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>REF01\u003c/td>\u003ctd>Partiful 公开活动页（Abbode Sample Sale）与首页邀请卡\u003c/td>\u003ctd>Partiful · 2024–2026\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://partiful.com/e/x82ndPsPYCo1qWGuSMUo\" target=\"_blank\" rel=\"noopener\">https://partiful.com/e/x82ndPsPYCo1qWGuSMUo…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>partiful-event/ev0.png；partiful-event/ev1.png；partiful-event/ev2.png；partiful/sec1.png（可核对 2/4）\u003c/td>\u003ctd>手机版活动页自上而下：居中的灰色胶囊「🌐 Public Event」→ 宽体衬线大标题（约为正文 2 倍）→ 16px 边距内的正方形海报 → 时间写成两行「Sat, Apr 11 · 11:00am —」/「Sun, Apr 12 · 6:00pm」（约正文 1.4 倍）→「Hosted by」每位主办人为 56px 圆头像，右下角压一枚黑色小皇冠徽章 → 地点被替换为链接「Sign in to see location」→「Guest List」标题下一行用中点分隔三个计数「1722 Went · 187 Interested · 62 Maybe」，再一排 5 个相互叠压的 56px 头像加一枚灰色「+1.7k」圆片；再往下的动态流整体高斯模糊，中央浮一张「Restricted Access」卡（锁图标、说明、通栏黑色 Sign in 按钮），页脚才恢复清晰。首页 hero 的邀请卡把 RSVP 做成三枚带 emoji 的\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：名单的角色分层：主办人靠头像角上的皇冠徽章而不是单独分组来区分；局卡/详情的人数行照抄「N 已到 · N 感兴趣 · N 待定」的中点单行写法，历史局用过去式计数；未报名者看详情时把动态区模糊并盖一张门禁卡，而不是整段隐藏；RSVP 三圆钮可直接用于局详情底部。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF02\u003c/td>\u003ctd>Luma 活动页（Friends of the Studio: Home Cafe / Rough Draft / Miles &amp; Mimosas 三种报名状态）\u003c/td>\u003ctd>Luma (luma.com) · 2025–2026\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://luma.com/fotsoct10\" target=\"_blank\" rel=\"noopener\">https://luma.com/fotsoct10…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>luma-event/hc0.png；luma-event/hc1.png；luma-event/rd.png；luma-event/mm0.png（可核对 2/4）\u003c/td>\u003ctd>手机版：正方形海报底部压一条半透明「Featured in New York」缎带；衬线标题约正文 2 倍；主办方为小头像+名字链接；日期用一枚迷你日历片（红色大写「OCT」在上、日数「10」在下）配右侧「Saturday, October 10 / 1:00 PM - 4:00 PM EDT」，地点用同尺寸的定位片配「St. Lydia's ↗ / Brooklyn, NY」；「Get Tickets」卡有灰色标题带，首行是闹钟图标「Limited Spots Remaining」；票种为纵向堆叠的圆角行：售罄行整体变灰并在名称下挂灰色「Sold Out」胶囊，可选行用 1.5px 深色描边 + 左侧实心勾圈 + 「1 Left」胶囊，价格右对齐，「Early Bird Ticket」行写「● Sales ended Sep 30, 11:59 PM EDT」；底部通栏紫色「Get Ticket」。同一张报名卡的另两种状态：R\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：局详情的报名卡与状态文案：满员=候补按钮、售罄=只留说明、名额紧张=闹钟提示行；票种行的「描边+勾圈+N Left」是「已选/待确认」的写法；改期弹层旧→新对照可沿用这枚月份在上、日数在下的日历片做新旧两枚并排。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF03\u003c/td>\u003ctd>Apple Invites — Upcoming 列表的 Hosting 徽标与 Guest List（Apple Newsroom 2025-02-04）\u003c/td>\u003ctd>Apple · 2025\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.apple.com/newsroom/2025/02/introducing-apple-invites-a-new-app-that-brings-people-together/\" target=\"_blank\" rel=\"noopener\">https://www.apple.com/newsroom/2025/02/introducing…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>apple-invites/scroll/f00.png；apple-invites/scroll/f04.png；apple-invites/scroll/f07.png；apple-invites/s0.png（可核对 2/4）\u003c/td>\u003ctd>Upcoming 屏：满幅照片卡的左上角压一枚带皇冠图标的胶囊「Hosting」，顶栏「Upcoming ⌄」右侧是 + 与头像。Guest List 面板：顶部一簇约 12 个大小不一的 memoji 头像（中央一枚约为其他 1.5 倍），其下按「HOST」（单行）和「GOING (9)」两个小写灰标题分组；每行是半透明深色单元，放在活动海报的模糊放大版之上，内容为头像、姓名、以及姓名下方斜体的个人留言（「I'll be there! 🎉」「I'm in!」「❤️❤️❤️❤️」），右端「···」；左上角 ×。编辑态的邀请卡是叠在背景照片上的一列半透明圆角单元：Event Title → Date and Time → Location → Hosted by（头像）+「Add a description.」。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：我发起的局 vs 我参加的局：局卡角上的「Hosting」皇冠胶囊是最直接的区分方式；名单的角色分层照「HOST」单独一组 +「GOING (9)」计数标题；报名留言放在姓名下方斜体一行；局卡→详情的展开可把背景海报模糊放大作为详情底色。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF04\u003c/td>\u003ctd>Apple Wallet 票证设计规范（HIG Wallet 页 + Wallet Overview）\u003c/td>\u003ctd>Apple · 2024–2026\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://developer.apple.com/design/human-interface-guidelines/wallet\" target=\"_blank\" rel=\"noopener\">https://developer.apple.com/design/human-interface…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>apple-wallet/hig_scroll6400.png；apple-wallet/hig_scroll7000.png；apple-wallet/hig_scroll5800.png；apple-wallet/dev_s1.png；apple-wallet/dev_s0.png（可核对 3/5）\u003c/td>\u003ctd>Event ticket 样式（Concert）是竖向圆角矩形，上边缘中央切一个半圆缺口；顶行左侧类别+图标「Concert」，右侧小写字标「ACCESS」+值「VIP」；之后是两层标签/值：EVENT、LOCATION 竖排在左，右侧一枚方形缩略图；再一行 TIME / LEVEL / ROW / SEAT（标签约 9pt 大写加字距，值约 15pt）；下方约 45% 高是模糊的全幅艺术底图，中央放白色条码板。健身卡对照图说明标签对比度：紫底白标 ✓，紫底品红标 ✗。Wallet Overview：钱包视图中票证层叠，每张只露约 40px 的头带；展开后左上 ×、右上分享/···，事件票示例「RICH vs SWE」下方是 VIP / 3 / 12 / 5 的四格小字。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：票根撕票：JU 局票的解剖=顶部缺口 + 头带（左类别右状态）+ 标签/值栅格 + 底部码板；撕票沿缺口所在的水平线撕开；「已报名/候补/已签到」写进头带右槽（对应 ACCESS/VIP）；历史区的层叠按钱包视图只露头带。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF05\u003c/td>\u003ctd>DICE 活动页（Honey Dijon: Day &amp; Night）与候补购票面板\u003c/td>\u003ctd>DICE FM · 2025–2026\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://dice.fm/event/6a7f61d0cd6a6a0001dcea43\" target=\"_blank\" rel=\"noopener\">https://dice.fm/event/6a7f61d0cd6a6a0001dcea43…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>dice-event/honey-dijon_mobile_s0.png；dice-event/honey-dijon_mobile_s1.png；dice/waitlist-sheet_crop.png；dice/frames/f03.png（可核对 2/4）\u003c/td>\u003ctd>手机版活动页：纯黑底；正方形海报右下角叠两枚 56px 黑色圆钮（收藏、分享）；标题约 34px；滚动时底部粘一条「From $58.16 / The price you'll pay. No surprises later.」+ 黑色胶囊按钮；各区块用 1px 细线分隔：Lineup（3 个叠压的 56px 圆形艺人照 + 一枚写「1」的计数圆环）、Venue（名称、地址、带定位图标的灰色「OPEN IN MAPS」胶囊、白色「FOLLOW」胶囊，右侧场馆黑白图形）、「Doors open 3:00 PM EDT」行。dice.fm 首页的 App 截图里，购票面板为白色圆角卡：「General admission / £64.32」旁贴一枚极小的黑底「WAIT LIST」标签；数量步进器的数字落在一个两侧带缺口的黑色票形方块里；通栏黑色「JOIN WAIT LIST」胶囊；活动头部的日期「Fri, 25 Apr, 18:30\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：候补状态的写法：把「候补」做成价格旁的小标签而不是替换整张卡；票根的张数用带缺口的票形数字框；中文局名与时间的比例可参考黑底上白色大标题 + 荧光色时间 + 灰色地点的三级对比；局详情底部的粘性价格/状态条。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF06\u003c/td>\u003ctd>Meetup 活动页：Attendees 卡片的 Host 徽标与候补粘性条\u003c/td>\u003ctd>Meetup · 2025–2026\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.meetup.com/aws-nyc/events/316007124/\" target=\"_blank\" rel=\"noopener\">https://www.meetup.com/aws-nyc/events/316007124/…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>meetup-event/attendees_crop.png；meetup-event/aws-waitlist_desktop_s0.png；meetup-event/fall-walk_mobile_s0.png（可核对 2/3）\u003c/td>\u003ctd>桌面版滚动后出现的粘性条从左到右：日期「Mon, Oct 26 · 8:30 PM UTC」、标题、描边胶囊「Free」、黄色胶囊「0 spots left」、心形、分享圆钮、黑色「Join waitlist」。Attendees 标题旁一枚计数徽章「259」，右侧「See all」；参会者卡是约 120px 的方卡：64px 头像、头像底边压一枚紫色小胶囊「Host」、姓名、再一行灰色角色「Super Organizer / Co-organizer / Member」；第四张卡是 2×2 的空头像圈簇，写「+99 more / 45 on waitlist」。手机版顺序：标题 →「Hosted by Mitch / Super Organizer」+头像 → 组织卡（logo + 4.6 星 + 257 reviews）→ 日历图标的时间行 → 定位图标的地点行 → 地图 → 浮动条「Free」+ 黑色「Attend」。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：名单的角色分层：Host 胶囊压在头像上 + 角色副标题 + 溢出格「+N more / M on waitlist」；局详情的粘性底栏固定携带「日期 · 状态胶囊（0 spots left）· 主按钮」；名单标题旁的计数徽章。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF07\u003c/td>\u003ctd>Flighty — My Flights 列表密度与延误时间线（flighty.com）\u003c/td>\u003ctd>Flighty · 2023–2026\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://flighty.com/\" target=\"_blank\" rel=\"noopener\">https://flighty.com/…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>flighty/video/f08.png；flighty/delay-timeline_crop.png；flighty/s1.png（可核对 2/3）\u003c/td>\u003ctd>My Flights 列表每行三栏：左栏是大号时长数字「1h」上、「38 MINUTES」小写大写字在下；中栏为航司小 logo + 灰色航班号「DL 383」、粗体航线「San Francisco to New York」、再一行两枚带绿点的时间片「SFO 09:10」「JFK 17:25」；状态写在小字行右端：「Departs On Time」绿色、「Departs 43m late」红色。延误卡：红色「RUNNING LATE」徽章 →一句原因「35m delay predicted due to late arriving aircraft」→ 一条竖向时间线，当前航段放飞机图标，每个停靠点（SFO/JFK/SAN）是空心或实心圆，每段右端红色「52m Late」「10m Late」。页面 hero 有通知卡先于手机渐入（f01 仅卡片 → f03 手机出现），但那是营销页进场，不是 App 动效。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：我参加的局列表行密度：左大号日/时、中局名+地点、右状态字（已确认绿/待确认灰/候补橙）；改期弹层旧→新对照可用竖向停靠点时间线，旧时间空心、新时间实心并在右端标「晚 2 小时」。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF08\u003c/td>\u003ctd>Family（family.co）首页特性网格的分步进场与状态计数动效\u003c/td>\u003ctd>Family (family.co) · 2023–2026\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://family.co/\" target=\"_blank\" rel=\"noopener\">https://family.co/…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>family/video/f10.png；family/video/f12.png；family/video/f13.png；family/video/f14.png；family/video/sheet.png（可核对 3/5）\u003c/td>\u003ctd>3×2 的特性网格在约 3 秒内分步填充：f10 六格几乎全空，只剩右下一枚握手 emoji；f12 左格的深色面板已出现 3 行（Send / Swap / Receive），中格出现绿色「✓ Backing Up」胶囊外加一圈浅绿光环，右格出现「Submitted — Pending — Completed」竖向时间线（蓝色勾点由竖线串联，右侧灰色时间戳「Oct 10 2026 · 14:4…」）；f13 面板多出第四行「Purchase (ID Required)」，Receive 的图标正处在过渡中（绿色圆片、箭头尚未出现），「Urgent ~ 20 Secs」费用卡与 emoji 头像行同时出现；f14 全部落定，计数已跳到「~ 21 Secs」。面板每行约 96px，深灰与更深灰交替，左侧 36px 彩色图标圆片 + 标题 + 一行灰色说明。\u003c/td>\u003ctd>错峰进场、数字原地跳 → 软体内计数跳字（SC09）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF09\u003c/td>\u003ctd>Eventbrite Organizer 页：票根堆叠插图与「N friends going」\u003c/td>\u003ctd>Eventbrite · 2025–2026\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.eventbrite.com/organizer/overview/\" target=\"_blank\" rel=\"noopener\">https://www.eventbrite.com/organizer/overview/…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>eventbrite/ticket-stack_crop.png；eventbrite/organizer-overview_s1.png；eventbrite/organizer-overview_s0.png（可核对 1/3）\u003c/td>\u003ctd>三张票以约 12° 的角度依次错开叠放；每张票是白色圆角矩形，上下边缘中央各切一个半圆缺口；左上「Aug 16 / 6pm」（日期粗体、时间常规），右上「4」+ QR 图形（张数 + 码）；标题「Rooftop Tiki Party」约 24px，场馆「The Aster」灰色；中部是照片块；页脚一排 3 枚叠压的 24px 头像 +「3 friends going」。后面两张（「Sep 30 9pm」「Oct 9 11am … Neon …」）被橙色渐变底染色——越靠后越偏暖、越不白。同页 Organizer App 卡「Sunglasses at Night: '80s Dance Party」右上贴黄色「FEW TICKETS LEFT」标签。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：历史区的归档构图：过去的局票按角度错开堆叠，日期左上、张数+码右上，越旧越被底色染暗；局卡页脚的「N 位朋友也去」头像行；「名额紧张」用海报角上的黄色标签。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF10\u003c/td>\u003ctd>Fantastical Scheduling — Proposals 多时段投票网格与 RSVP 信封\u003c/td>\u003ctd>Flexibits · 2024–2026\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://flexibits.com/fantastical/scheduling\" target=\"_blank\" rel=\"noopener\">https://flexibits.com/fantastical/scheduling…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>fantastical-scheduling/scheduling_s2.png；fantastical-scheduling/scheduling_s0.png；fantastical-scheduling/scheduling_s1.png（可核对 1/3）\u003c/td>\u003ctd>Proposals 插图：顶部三枚头像用虚线连到两张卡「Status call 9:00 AM」「Status call 10:00 AM」（浅蓝底蓝字）。网格：行=受邀人（头像+名字），列=候选时段，列头「Monday 9:00 AM / Tuesday 9:00 AM / Tuesday 10:00 AM / Tuesday 2:00 PM」；胜出列整列铺浅蓝带、列头变蓝；单元格是圆圈——实心蓝勾（可以）、灰勾（勉强）、空圈（不行）。RSVP 卡：橙色信封里露出「Miranda &amp; Bob / July 7」（日期蓝色），信封下方挂两枚回应气泡（× / ✓），右下蓝色发送圆钮。Openings 卡：「Piano Lesson / 2 hours / Mon, Thu」模板带头像。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：改期弹层旧→新对照：把候选时间做成列、参与者做成行，选中列整列高亮，单元格用实心勾/灰勾/空圈三态；主办人发起「投票改期」就是这张网格；RSVP 信封的「日期在信封口、回应钮挂在下方」可作邀请卡的回应区。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF11\u003c/td>\u003ctd>Things 3 — Upcoming 按日分组列表与 Headings（culturedcode.com/things/features）\u003c/td>\u003ctd>Cultured Code · 2017–2026\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://culturedcode.com/things/features/\" target=\"_blank\" rel=\"noopener\">https://culturedcode.com/things/features/…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>things3-features/features_s2.png；things3-features/features_s3.png；things3-features/features_s0.png（可核对 2/3）\u003c/td>\u003ctd>Upcoming 列表：每一天是一个分组，组头是大号日数「17」，其右以小号灰字写「Tomorrow / Thursday / Friday」，组间细线；每组先列日历事件（灰色、时间前置，如「10:00 Interview with Lydia」），再列待办（复选框行，待办下方一行浅灰的所属项目名）；「Upcoming」标题下一枚极小的「Important」胶囊。Headings（iOS）：项目内用粗体蓝色标题「Get packed」「Things to do」带「···」把待办分段，正被拖动的标题渲染为带投影的白色卡「Things to buy」。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：我参加的局按日分组：组头大日数 + 小星期；同一天先排固定事件再排待办的双层密度可对应「已确认的局」在前、「待确认」在后；主办人名单的分组标题可拖动（角色分层的 Headings 写法）。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF12\u003c/td>\u003ctd>Material 3 Expressive — 「Start building」博客的 Caution/Do 形状与颜色对照\u003c/td>\u003ctd>Google Material Design · 2025-05-13\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://m3.material.io/blog/building-with-m3-expressive\" target=\"_blank\" rel=\"noopener\">https://m3.material.io/blog/building-with-m3-expre…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>m3-expressive/scroll/f13.png；m3-expressive/scroll/f14.png；m3-expressive/scroll/sheet.png（可核对 1/3）\u003c/td>\u003ctd>形状对照：Caution 图中媒体控制的三枚按钮是同尺寸圆形；Do 图里暂停钮变成约两倍宽的圆角方块，两侧次要钮仍是药丸，下方「Living room / Queue」芯片同时缩小成小胶囊。颜色对照：视频剪辑时间线里，Caution 的播放钮与选中轨「Ambient」都是中性灰；Do 里播放钮改为粉色、选中轨填充紫色、上传钮也染色。每对图下方分别压一条黄色「! Caution」与绿色「✓ Do」色带。\u003c/td>\u003ctd>主操作形状脱离兄弟、只给当前状态上色 → 软体大小与色（SC09）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF13\u003c/td>\u003ctd>飞书日历产品页：会议室时段网格与「新建日程」浮层\u003c/td>\u003ctd>飞书 / Lark（字节跳动） · 2021–2026\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.feishu.cn/product/calendar\" target=\"_blank\" rel=\"noopener\">https://www.feishu.cn/product/calendar…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>feishu-cal/frames/f02.png；feishu-cal/video/sheet.png（可核对 1/2）\u003c/td>\u003ctd>桌面端截图：左侧深色侧栏；「日历 ｜ 会议室」双页签，当前页签蓝色下划线；工具条含日期「2021年10月26日」、楼宇选择「Beijing-ChengjianAI(城建A座)·8层」、「设备」「容纳人数」筛选；主体是行=会议室（F8-12、F8-13 … F11-4，每行副文「16·电视·白板」）、列=小时（11:00–19:00）的网格，已占用时段为灰块，正在拖出的新时段为浅蓝块并标「新日程」；其上浮一张「新建日程」卡（标题输入框、日期 + 13:00–14:00 时间选择、几行灰色占位、右下「更多」「保存」）。章节标题「极速查找空闲会议室」以约 36px 置于右侧。另一屏「订阅公共日历」是带彩色复选框的列表 + 绿色块的月视图。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：改期弹层旧→新对照：用一条时间行网格，新时段是灰色占用块之间的浅蓝块，上方浮出带起止时间的小卡；局的地点选择可按「行=场地、列=时段」排；中文标题约 36px 与 13px 正文的比例可作中文局名与时间的参考。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF14\u003c/td>\u003ctd>Airbnb 2025 Summer Release — Trips 标签的行程时间线与 Profile\u003c/td>\u003ctd>Airbnb · 2025-05-13\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://news.airbnb.com/product-releases/airbnb-2025-summer-release/\" target=\"_blank\" rel=\"noopener\">https://news.airbnb.com/product-releases/airbnb-20…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>airbnb/frames/f08.png；airbnb/frames/f11.png；airbnb/frames/f12.png（可核对 2/3）\u003c/td>\u003ctd>Trips 标签：顶卡「Apartment in Mexico City / May 22 – 26 · Hosted by Anna」+ 地址 + 「Get directions」按钮；其下是竖向时间线，左轨放日期标记——粉色实心圆「Thu 22」（当天）与灰色描边圆「Sat 24」，两者之间一条细灰线；每个条目是白色卡：方形小缩略图 +「Check in after 3:00 PM」；「Local taqueada / 5:00 PM · By Raja」；体验卡更高，带全宽照片与「Get in the ring with a real Mexican luchador / 1:30 PM · Hosted by Retro」；底栏「Trips」高亮为红。Profile 屏：头像旁统计列「24 Trips / 22 Reviews / 8 Years on Airbnb」，下方两枚带「NEW」角标的方块「Past trips\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：我参加的局用左轨日期标记的竖向时间线，当天实心、未来描边；每条局卡以「时间 · Hosted by 谁」一行区分参加/主办；历史区入口做成「Past trips」式叠照片方块；个人页的三格统计可写「发起 N 局 / 参加 N 局 / 第 N 年」。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF15\u003c/td>\u003ctd>Exclusion Tabs (rauno.me/craft)\u003c/td>\u003ctd>Rauno Freiberg · 2023-03\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://rauno.me/craft/exclusion-tabs\" target=\"_blank\" rel=\"noopener\">https://rauno.me/craft/exclusion-tabs…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>rauno-exclusion-tabs/still.png；rauno-exclusion-tabs/frames/f00.png；rauno-exclusion-tabs/frames/sheet.png（可核对 1/3）\u003c/td>\u003ctd>五个文字 tab 等距排在一行，选中态是一枚黑色胶囊（高度约为文字行高的 1.8 倍，左右内边距约 14px）。点击 Press 后胶囊从 Community 滑向 Press：f00 里胶囊停在两者之间，被胶囊盖住的字母（Comm｜unity 的 unity、Pr｜ess 的 Pr）即刻反白、露在外面的部分仍是黑字——文字颜色由胶囊当前覆盖的像素决定，不是整词切换；f01 起胶囊已落在 Press 上，之后 7 帧（每帧 70ms）保持不动，整个滑动在约 100ms 内完成。\u003c/td>\u003ctd>滑动胶囊承载选中、文字按覆盖反白 → 分段胶囊（SC09）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF16\u003c/td>\u003ctd>Logo Carousel (rauno.me/craft)\u003c/td>\u003ctd>Rauno Freiberg · 2024-05\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://rauno.me/craft/logo-carousel\" target=\"_blank\" rel=\"noopener\">https://rauno.me/craft/logo-carousel…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>rauno-logo-carousel/video/sheet.png；rauno-logo-carousel/video/f05.png；rauno-logo-carousel/video/f14.png（可核对 2/3）\u003c/td>\u003ctd>四个 logo 槽位等宽排在浅灰面板上，整组约每 2 秒轮换一次（descript/duolingo/FAIRE/Clearbit → IDEO/Khan Academy/Quizlet/ramp → canopy/Canva/casetext/STRAVA）。换组不是整行同步切换而是逐槽位错峰：f05 中第一槽 IDEO 已清晰，第二槽 duolingo 正向上模糊淡出、Khan Academy 从下方模糊进入，第三槽 Quizlet 还是半透明，第四槽仍停在旧的 Clearbit；f14 再次看到同样的从左到右错峰（descript 进、Canva/duolingo 退、casetext 已稳、STRAVA 未动）。出场元素同时做了位移 + 模糊 + 透明度三件事，入场沿相反方向进入。\u003c/td>\u003ctd>按列错峰「位移 + 模糊 + 淡出」替换 → 残影错峰清除（SC07）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF17\u003c/td>\u003ctd>Vaul — Drawer for React (官方演示)\u003c/td>\u003ctd>Emil Kowalski · 2023–2025\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://vaul.emilkowal.ski\" target=\"_blank\" rel=\"noopener\">https://vaul.emilkowal.ski…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>vaul-drawer/still.png；vaul-drawer/frames/f00.png；vaul-drawer/frames/sheet.png（可核对 1/3）\u003c/td>\u003ctd>点击 Open Drawer 后：f00 抽屉已从底部升到约视口 63% 高（顶部圆角，中央 48×4px 灰色把手），同时底层页面整体缩小（四周露出黑边，宽度约缩到 97%）并罩上深灰半透明层，原标题 Vaul 仍可见在抽屉上方；f01 抽屉升到约 94% 高，底层页面继续缩小、压暗到只剩顶部一条；f02 之后抽屉定格，背景页面只剩顶部约 10px 的深色条。抽屉内容居中列宽约 430px，正文 15px 灰字、标题 15px 黑字。背景的「缩放 + 压暗」与抽屉的「上升」是同步联动的两层。\u003c/td>\u003ctd>背景缩小约 3% 并压暗 → 抽袋时整叠后退加雾（SC03）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF18\u003c/td>\u003ctd>Sonner — toast component (官方演示)\u003c/td>\u003ctd>Emil Kowalski · 2023–2025\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://sonner.emilkowal.ski\" target=\"_blank\" rel=\"noopener\">https://sonner.emilkowal.ski…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>sonner-toast/still2.png；sonner-toast/video/f40.png；sonner-toast/video/f42.png；sonner-toast/video/sheet.png（可核对 2/4）\u003c/td>\u003ctd>首屏标题 Sonner 上方画着三张堆叠的白色卡片轮廓（上层最宽、下层逐层缩窄约 5%，每层露出约 8px 边），是 toast 堆叠的静态隐
