喻。点击 Render a toast 后（视频 4fps）：f40 中 toast 在右下角出现，位置比最终位置低约 25px、整体半透明、文字呈浅灰；f42 升到最终位置并完全不透明，卡片约 356×72px、白底 1px 浅灰边、12px 圆角，内含加粗标题 + 灰色副文两行。进入 = 上移 + 淡入，约 0.5s。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：我的局报名成功 / 撕票完成后的轻提示：白卡从下方上移淡入，副标题用灰字分层；多条提示时按「堆叠卡」隐喻逐层缩窄露边。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF19\u003c/td>\u003ctd>uilabs — Elastic Card\u003c/td>\u003ctd>Mariana Castilho (mrncst) · 2024\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://uilabs.dev\" target=\"_blank\" rel=\"noopener\">https://uilabs.dev…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>uilabs-elastic-card/rest.png；uilabs-elastic-card/frames/f00.png；uilabs-elastic-card/frames/f01.png；uilabs-elastic-card/frames/sheet.png（可核对 2/4）\u003c/td>\u003ctd>静止态（rest.png）：约 300×360px 的粉色卡片，左上角橙色衬线小字「03 / Image Models」，中部是橙色抖动网点的半身像，底部贴边一条深色按钮「Connect multiple image models」（高 40px，圆角与卡片同为约 16px）。触发后（frames f00→f01）：深色底条向上长高成一块覆盖卡片下半部的面板（高度从 40px 变为约 190px），f00 中面板高度过半、内容已出现但底部被裁；f01 定格：标题 + 两行灰色说明 + 一行带头像的深灰内嵌按钮「Logged in as Mariana」+ 粉色主按钮「Authenticate to Enable」。粉色按钮沿用卡片底色，深色面板沿用按钮色，是「按钮扩展成面板」而不是弹出新层。\u003c/td>\u003ctd>面板从卡内长出、同一材质 → 软体膨胀成编辑面（SC09）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF20\u003c/td>\u003ctd>iOS Menu (paco.me/craft)\u003c/td>\u003ctd>Paco Coursey · 2023-05\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://paco.me/craft/ios-menu\" target=\"_blank\" rel=\"noopener\">https://paco.me/craft/ios-menu…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>paco-ios-menu/still.png；paco-ios-menu/frames/f00.png；paco-ios-menu/frames/f01.png；paco-ios-menu/frames/sheet.png（可核对 2/4）\u003c/td>\u003ctd>深灰色菜单约 248px 宽，每行 44px 高、左文字右图标，行间 1px 更深的分隔线。点击带子项的 Focus 后（f00）：子项 Zen Mode、Reader Mode 从 Focus 下方以 clip-path 展开，展开过程中原本的 List 行还透过底部可见（f00 中 Reader Mode 与 List 重叠）；f01 定格：父级行 New Space 整体压暗（文字变灰、背景略浅），Focus 行左侧出现 ⌄ 折角图标，子项两行保持全亮。嵌套展开发生在原位，父层通过「文字比背景压得更暗」的两级变暗退后。\u003c/td>\u003ctd>二级操作原位展开、上层压暗 → 模块抬起时其余暗下（SC02）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF21\u003c/td>\u003ctd>Awwwards Conferences 网站（案例页）\u003c/td>\u003ctd>Locomotive · 2022\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://locomotive.ca/en/work/awwwards-conferences\" target=\"_blank\" rel=\"noopener\">https://locomotive.ca/en/work/awwwards-conferences…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>locomotive-awwwards-conf/s4600.png；locomotive-awwwards-conf/s1400.png；locomotive-awwwards-conf/s3700.png；locomotive-awwwards-conf/full.png（可核对 2/4）\u003c/td>\u003ctd>s4600：会议网站 All Workshops 页截图嵌在观众席照片上。页面为米白底：顶部导航左 logo、中间「Amsterdam +」城市切换、右侧 Speakers/Workshops/Schedule/Venues/News/Get tickets↗；标题 ALL WORKSHOPS 用极窄的超大无衬线（两行，字高约占视口 45%），右上角红色「(05)」数量；红色小段落列在标题右侧，与红色数字同色形成「数字—说明」配对；右下角一块深棕色实色方块「Booking / Get Tickets ↗」（标签小字在上、动作大字在下）；中间一只拟人咖啡杯插画。s1400：案例页自身用黑色大号衬线说明文字 + 手绘箭头开头。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：中文局名与时间的比例：标题压到极大、数量/日期用对比色小字放在角落；「报名/购票」动作做成角落里的实色方块（标签 + 动作两行），而不是通栏按钮。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF22\u003c/td>\u003ctd>Next.js Conf 2024 — 线下体验与网站（showcase）\u003c/td>\u003ctd>basement.studio（for Vercel / Next.js） · 2024\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://basement.studio/showcase/nextjs-conf-raising-the-bar-again\" target=\"_blank\" rel=\"noopener\">https://basement.studio/showcase/nextjs-conf-raisi…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>basement-nextjs-conf/s2650.png；basement-nextjs-conf/s3600.png；basement-nextjs-conf/full.png（可核对 2/3）\u003c/td>\u003ctd>s2650：注册确认页「See you in San Francisco on October 24th」（日期用蓝色强调），右侧一张竖版蓝色挂绳证件票：顶部黑色挂扣 + 条形孔，票面分三段——Next.js 小标 / 大字姓名 Guillermo Rauch / 底部等宽小字 OCTOBER 24TH · SAN FRANCISCO, CA，票与页面同一蓝。s3600：日程列表每行 = 左侧时间（等宽小字）+ 讲题（常规字重）+ 右侧讲者名/公司（更小更淡），Lunch 行无讲者；Speakers 页左列姓名大号 + 蓝色小方块 + 等宽大写职务行，右侧三列蓝色网点肖像，每张左下角黑底白字姓名标签、右上角 ↗ 角标。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：票根撕票 / 局票：票面三段（局名小标 / 持票人大字 / 时间地点等宽小字），颜色与局主题色一致；名单的角色分层：姓名大号 + 角色用等宽大写小字 + 色块标记，不靠头像尺寸区分发起人与参与者。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF23\u003c/td>\u003ctd>Daylight Computer 网站（showcase）\u003c/td>\u003ctd>basement.studio · 2024\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://basement.studio/showcase/daylight-simplicity-in-motion\" target=\"_blank\" rel=\"noopener\">https://basement.studio/showcase/daylight-simplici…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>basement-daylight/s2500.png；basement-daylight/s1500.png；basement-daylight/full.png（可核对 1/3）\u003c/td>\u003ctd>s2500 顶部：横向三段导航 Display / Software / Device 用大号衬线（字高约 60px）配手绘线描图标，当前段全黑，其余两段约 20% 灰且图标同样变淡；s1500：三张手机截图并排，每屏顶部统一「logo + 橙色小按钮 PRE-ORDER NOW」，中屏「With all the apps you need」下是 3×3 圆形图标网格（每格 56px 灰底），右屏黑底金色放射线插画 + 白字段落；Use Cases 区三张等宽卡片 = 产品照片 + 加粗小标题 + 两行灰说明。主色是米白 + 橙色 CTA，深色段落用黑底金色。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：我的局顶部「参加的 / 发起的 / 历史」三段导航可用「大字 + 当前段全黑、其他段 20% 灰」的强弱对比代替下划线；局卡里的报名 CTA 用唯一一个橙色小按钮固定在右上角。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF24\u003c/td>\u003ctd>The Ways We Work (Miro) — 编辑型网站（案例页）\u003c/td>\u003ctd>Obys Agency · 2023\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://obys.agency/work/the-ways-we-work-miro\" target=\"_blank\" rel=\"noopener\">https://obys.agency/work/the-ways-we-work-miro…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>obys-miro/s0.png；obys-miro/s1500.png（可核对 1/2）\u003c/td>\u003ctd>案例页左栏只留三行信息（项目名 / 类别 / 带下划线的 Live Website），右侧黑色画框里是站点首屏：米白底、深蓝大号圆体标题 The Ways We Work 压在左下，拼贴插画（黄圆、蓝色楼体、粉色云）悬在右上。下方两张「报告卡」：上部是蓝色标题（Collaboration is the new watercooler）+ 两栏小字；右卡用四个大号百分比（50 / 44 / 36 / 40）纵向排列、每个数字右上角一个小 %、下方一行灰色说明；每张卡左上角有编号小字和细横线分隔。统计卡呈现「数字大、单位小、说明灰」三层层级。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：历史区的归档构图：按局统计（参加 / 发起 / 到场率）用「大数字 + 小单位 + 灰说明」三层层级做成卡片；卡片标题用品牌色而非黑色，编号小字放在左上角。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF25\u003c/td>\u003ctd>Event card extended view（Dribbble 原作者上传）\u003c/td>\u003ctd>Vladys (Dribbble) · 2025\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://dribbble.com/shots/26731551-Event-card-extended-view\" target=\"_blank\" rel=\"noopener\">https://dribbble.com/shots/26731551-Event-card-ext…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>dribbble-event-card-extended/video/f10.png；dribbble-event-card-extended/video/sheet.png（可核对 1/2）\u003c/td>\u003ctd>约 380px 宽的深灰卡片：左上角 60px 橙色方形应用图标，右上角四个重叠头像 + 「+246」；标题行 YC Autumn Conference（白色 16px 中粗）下一行日期 Nov 20, 11:00 AM（灰 13px），同一行右侧两个 48px 方形图标按钮（票 / 定位）；下面插入一条白色高亮行：三枚头像 + 「8 potential linkups」，整张卡只有这一行是浅色；最后两行键值「Category → Technology（绿色）」「Location → Southaven（带小图标）」用深色分隔条隔开。层级靠「唯一反白行」而不是字号差做出来。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：局卡→详情的展开的中间态：展开后多出的「可能认识的人 / 已报名好友」用唯一一条反白行强调；分类、地点用键值行排在下方；快捷动作（票、位置）用方形图标按钮贴在日期行右侧。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF26\u003c/td>\u003ctd>USDO Mobile App Design（Dribbble 原作者上传）\u003c/td>\u003ctd>Cuberto · 2024\u003c/td>\u003ctd>ui\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://dribbble.com/shots/25072893-USDO-Mobile-App-Design\" target=\"_blank\" rel=\"noopener\">https://dribbble.com/shots/25072893-USDO-Mobile-Ap…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>cuberto-usdo/still.png（可核对 0/1）\u003c/td>\u003ctd>深色钱包首页：顶部一行「Wallet 1 ⌄」居中，下方灰色胶囊里是截断的地址 + 复制图标，余额 $189.50 用约 44px 大字；两枚并排的全圆胶囊按钮分色——荧光黄绿「Send ↗」与蓝紫「Receive ↓」，高约 56px；之后是资产列表，每行 = 圆形币种图标 + 名称（白）+ 数量（灰小字）+ 右侧美元值 / 百分比变化（绿色小字）。左侧另一屏「Please choose asset to send.」列表用相同的「图标 + 名称 / 数量」两行结构，行高约 64px。两个主动作用互补色对比，而非主次灰阶。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：局详情底部的「报名 / 分享」或管理面板的「改期 / 取消」：两枚全圆胶囊并排、用两种对比色而非主次灰；名单行采用「头像 + 名字（白）/ 角色（灰小字）+ 右侧状态」的双行结构。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF27\u003c/td>\u003ctd>iOS App Store: Layout animation（Motion 官方示例）\u003c/td>\u003ctd>Motion（Matt Perry）/ motion.dev examples · 2025\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://motion.dev/examples/js-app-store-layout\" target=\"_blank\" rel=\"noopener\">https://motion.dev/examples/js-app-store-layout…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>motion-app-store-layout/open/sheet.png；motion-app-store-layout/open/f00.png；motion-app-store-layout/open/f02.png；_probe/appstore.png（可核对 2/4）\u003c/td>\u003ctd>在 390×844 移动视口点击『Capture the Night…』卡片：f00（点击后约120ms）卡片已从两列网格中的半宽卡放大到约 86% 视口宽（左缘贴 0，右缘约 668/780），圆角仍保留，正文两段已经在图片下方出现并与图片底部重叠，其余三张卡被压暗成灰阶留在底层；f02（约360ms）卡片铺满全宽，头图从 330px 高拉到约 560px（y 325→890），正文块下移到图片之外并加大内边距；f04–f07 停住：标题『Today』与头像变灰退后，整个过程中封面图、分类小字与标题是同一对象持续放大位移，没有淡入替换。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：局卡→详情的展开：局卡封面与中文局名作为同一图层连续放大到全宽，详情正文从卡片底部『长出来』而不是另开页面；列表里其它局卡压暗留在底层作为返回线索。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF28\u003c/td>\u003ctd>Family-style dialog（Motion 官方示例）\u003c/td>\u003ctd>Motion（Matt Perry）/ motion.dev examples · 2025\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://motion.dev/examples/react-family-dialog\" target=\"_blank\" rel=\"noopener\">https://motion.dev/examples/react-family-dialog…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>motion-family-dialog/open/sheet.png；motion-family-dialog/open/f00.png；_probe/family-dialog.png（可核对 1/3）\u003c/td>\u003ctd>点击底部通栏薄荷绿『Receive』胶囊按钮，以 20ms 间隔连拍：f00 对话框容器高度只到最终的约 75%，标题『Confirm』和说明文字已就位但透明度偏低，而『Receive』按钮仍是原来那条宽胶囊的形状、停在右下、宽度正在从通栏收缩到半宽，左侧『Cancel』位置只有一块暗底还没有文字；f01（约100ms后）容器到达最终高度（约占视口底部 220/844），按钮并排分成『Cancel』『Receive』各占一半，之后 f02–f07 完全静止。按钮是从页面上原有的那颗按钮变形进对话框，而不是对话框从空白淡入。\u003c/td>\u003ctd>按钮本身长成确认卡、位置连续 → 危险操作就地展开确认（SC02、SC09）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF29\u003c/td>\u003ctd>Sheet Modal（Motion 官方示例）\u003c/td>\u003ctd>Motion（Matt Perry）/ motion.dev examples · 2025\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://motion.dev/examples/react-sheet-modal\" target=\"_blank\" rel=\"noopener\">https://motion.dev/examples/react-sheet-modal…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>motion-sheet-modal/open/sheet.png；motion-sheet-modal/open/f00.png；motion-sheet-modal/open/f01.png；motion-sheet-modal/open/f03.png（可核对 2/4）\u003c/td>\u003ctd>点击页面中央的『Share』按钮：f00（+120ms）底部面板只升起到顶缘 y≈965/1688，底部的『Save to Files』一行被视口裁掉，面板顶部有一条 80px 宽的灰色拖拽把手、右上角圆形关闭钮，而背景里的『Share』按钮仍是全亮度；f01（+240ms）面板顶缘到达 y≈850 并停住，面板上缘压在『Share』按钮的下半截上，按钮被半透明遮罩压暗；f02–f07 静止。面板内容在上升过程中就已完整排版（标题『Share』、四个头像、分隔线、四行动作），没有内容滞后淡入；上升路径只有位移，没有缩放。\u003c/td>\u003ctd>面板一出现就排好版、250ms 停住、背景只压暗 → 导览板抽屉（SC08）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF30\u003c/td>\u003ctd>Pokopia: Modal（Motion 官方示例）\u003c/td>\u003ctd>Motion（Matt Perry）/ motion.dev examples · 2025\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://motion.dev/examples/react-pokopia-modal\" target=\"_blank\" rel=\"noopener\">https://motion.dev/examples/react-pokopia-modal…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>motion-pokopia-modal/load/sheet.png；motion-pokopia-modal/load/f02.png；_probe/pokopia.png（可核对 2/3）\u003c/td>\u003ctd>页面载入后以 150ms 间隔连拍：f00–f01 全黑；f02 背景出现一张被高斯模糊的游戏场景图，画面正中只有一个约 300×300 的红色圆角方块（白描边，中心一枚精灵球图标）；f03 这个红方块已经放大成几乎占满视口的竖向弹层（红色外框约 60px 厚、内部白色面板、外侧还有一圈白描边），精灵球图标消失；f04–f07 静止。弹层是从一个图标大小的红色『种子』按比例长出来的，边框厚度与圆角在放大过程中保持视觉一致，背景模糊在弹层出现前先到位。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：局详情里的『核销／签到』弹层可以从票面角上的局徽章长出来：先模糊背景，再让一个徽章大小的色块放大成整张面板；红色厚边框＋白描边的游戏感可用于『成局』『到场』这类庆祝态面板。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF31\u003c/td>\u003ctd>Events app – tickets &amp; payment animation\u003c/td>\u003ctd>Kohut Piotr for 10Clouds（设计师本人 Dribbble 上传） · 2017\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://dribbble.com/shots/3765504-Events-app-tickets-payment-animation\" target=\"_blank\" rel=\"noopener\">https://dribbble.com/shots/3765504-Events-app-tick…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>dribbble-10clouds-events-tickets/play/sheet.png；dribbble-10clouds-events-tickets/play/f01.png（可核对 1/2）\u003c/td>\u003ctd>Shot 视频以 600ms 间隔抽 8 帧：f00 是深色活动详情（大图上压『URBAN ZOO』、日期『14 June 2017』、『Add to calendar』按钮）；f01 一块黄色面板从底部升起盖住下半屏，标题『URBAN ZOO』被顶到面板上沿之上，面板内每种票是一张白色小票：左右两侧各切出半圆缺口（撕票线），左侧是『0 ×』『1 ×』数量滚轮，上下露出半透明的相邻数字；f02–f03 数量从 1 滚到 2；f04–f05 面板内容换成银行卡（VISA、四组卡号、持卡人、04/24）和『Your receipt』小票（Standard 2 €25 / Balcony 2 €39）；f06 是八个支付方式的 logo 网格；f07 是卡号数字键盘。整个流程始终在同一块黄色面板内换内容，面板本身不离开。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：票根与报名流程：局详情下方升起一块有色面板，票以『两侧带半圆缺口的小票』呈现；人数选择用上下露出邻位数字的滚轮；『付款／确认』步骤在同一面板里换内容，而不是跳页。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF32\u003c/td>\u003ctd>Ticket Animation（Knife and Fox）\u003c/td>\u003ctd>Zac Bistline for Knife and Fox（设计师本人 Dribbble 上传） · 2016\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://dribbble.com/shots/2474928-Ticket-Animation\" target=\"_blank\" rel=\"noopener\">https://dribbble.com/shots/2474928-Ticket-Animatio…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>dribbble-bistline-ticket-animation/play/sheet.png；dribbble-bistline-ticket-animation/play/f02.png（可核对 1/2）\u003c/td>\u003ctd>Shot 视频以 600ms 间隔抽 8 帧：f00–f01 顶部是叠在一起的三张票，最上面是登机牌『SEA ✈ JFK』，下方列表依次是 Flight（LAX → John Wayne）、Hotel；f02–f03 顶部换成金色丽思卡尔顿酒店卡（Suite / Emily Berg / 01/22/16–01/25/16），列表第一行同步变成 Hotel；f04–f05 顶部换成电影票『The Hateful Eight』，列表第一行变成 Movie；f06 整张卡出现明显运动模糊，f07 画面只剩灰色底。票堆每张票只露出上沿约 20px 作为层叠线索，当前票的边缘有撕票锯齿，顶部卡片切换时下方列表的首行同步重排，两者是同一次切换。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：『我加入的局』票夹：多张局票叠放只露上沿，翻到下一张时列表首行同步换成对应的局；撕票锯齿边作为票面材质线索；切换时允许短暂运动模糊强调『翻』的速度。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF33\u003c/td>\u003ctd>The Magic of Clip Path — Theme switch 演示\u003c/td>\u003ctd>Emil Kowalski（个人站 emilkowal.ski） · 2024\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://emilkowal.ski/ui/the-magic-of-clip-path\" target=\"_blank\" rel=\"noopener\">https://emilkowal.ski/ui/the-magic-of-clip-path…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>emil-clip-path/theme/sheet.png；emil-clip-path/theme/f01.png（可核对 1/2）\u003c/td>\u003ctd>点击演示卡里的『Switch theme』按钮，以 60ms 间隔连拍：f00 卡片仍是浅色，只在顶缘出现一条约 2px 的深色线；f01 深色图层从顶部向下露出约 35px（刚盖住标题的上半截，标题文字因此被裁成上深下浅两截）；f02 深色已盖到约 85%，只剩按钮下方一条浅色；f03 整张卡变成深色、按钮翻成白底黑字，之后静止。页面同时给出实现：\u003ccode>clip-path: inset(0 0 100% 0)\u003c/code> → \u003ccode>inset(0 0 0 0)\u003c/code>，1s，cubic-bezier(0.77,0,0.175,1)。深色版是叠在原卡上的一份复制，文字位置完全不动，只有裁切边在走。\u003c/td>\u003ctd>新面叠在原面上、用一条移动的边露出 → 拉链沿齿线露出袋内（SC06）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF34\u003c/td>\u003ctd>Success Tick for Housy（Rive 社区文件）\u003c/td>\u003ctd>akshaysharmaw（Rive community 作者页） · 2021-08\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://rive.app/community/files/725-1428-success-tick-for-housy\" target=\"_blank\" rel=\"noopener\">https://rive.app/community/files/725-1428-success-…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>rive-success-tick/play/sheet.png；rive-success-tick/play/f00.png（可核对 1/2）\u003c/td>\u003ctd>文件页自动播放，以 300ms 间隔连拍：粉色画布上是一团由 6–8 个半透明蓝色圆重叠出来的『团块』，中央一枚珊瑚红粗对勾。f00 团块整体偏向左上、右下露出淡蓝残影；f02–f03 团块向右移动、残影换到左侧；f04–f07 继续小幅漂移。对勾本身在所有帧里位置和角度不变，只有背后那组圆在做缓慢的相位漂移，残影由透明度递减的同心圆叠出，没有描边。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：签到／出席确认的成功态：对勾静止不动，背后的色团用多层半透明圆做缓慢漂移，给『已确认』一个持续但不抢戏的活体感，可用于到场打卡后的票根印章。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF35\u003c/td>\u003ctd>!Boring Software 官网（滚动叙事）\u003c/td>\u003ctd>Not Boring Software（Andy Allen） · 2025\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://notboring.software\" target=\"_blank\" rel=\"noopener\">https://notboring.software…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>notboring-site/scroll-sheet.png；notboring-site/f04.png；notboring-site/f08.png；notboring-site/f12.png（可核对 2/4）\u003c/td>\u003ctd>录屏滚动 10 秒按 1fps 抽帧：f00 只有导航和空白，f01 出现紫色『!BORING』大字；f02–f03 灰底区块里只有『Playful software for life's boring routines.』和一行『Most apps help you save time.』，f06–f08 同一区块多出第二行『We help you savor it 😊』——文案是分行按滚动进度追加的；f06 到 f07 『Let's Play』下的三个 App 图标从左到右依次入场（f06 第一个图标只露出一半），f08 三个图标到位；再往下 f09–f10 出现线框 3D 球体，f14–f15 出现超大 3D 数字。页面没有一次性铺满内容，每个区块都留出整屏空白等滚动到位再出现。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：历史区／归档区的构图：已结束的局按滚动进度逐段出现，每个月份区块先出标题再追加说明行；局卡以左到右的错峰入场而不是整屏同时淡入。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF36\u003c/td>\u003ctd>Boarding Pass Scroll-up\u003c/td>\u003ctd>Helen Zhou（设计师本人 Dribbble 上传） · 2015\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://dribbble.com/shots/1938317-Boarding-Pass-Scroll-up\" target=\"_blank\" rel=\"noopener\">https://dribbble.com/shots/1938317-Boarding-Pass-S…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>dribbble-helenzhou-boarding-pass-scrollup/play/sheet.png；dribbble-helenzhou-boarding-pass-scrollup/play/f00.png；dribbble-helenzhou-boarding-pass-scrollup/play/f01.png（可核对 2/3）\u003c/td>\u003ctd>Shot 动图以 600ms 间隔抽 8 帧：画面是斜放的手机上一张白色登机牌（DELTA，PEK→SFO，DL0128，Gate A25 T3，登机时间 07:45PM 用红色超大字）。f00 在出发地『PEK』右上方贴着一枚红色圆角胶囊『DELAYED』，旁边有小字『1h 15m』；f01 同一位置胶囊消失只剩一个红点；f05 胶囊再次出现。其余版式（航班号、条形码、登机区『3』）在所有帧里完全不动，状态变化只靠这一枚贴在地点码旁边的红色标签在原位弹出/收回表达。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：改期弹层与局卡上的状态提示：局被改期／延误时，在时间旁原位弹出一枚红色小胶囊（如『已改期』『+2天』），票面其它字段不重排；时间用对比强烈的红色大字，地点码用黑色大字。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF37\u003c/td>\u003ctd>three.js example — Ammo.js softbody cloth（physics_ammo_cloth）\u003c/td>\u003ctd>three.js（mrdoob 与贡献者，官方示例） · 2018→（three.js 官方示例，当前版本在线）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://threejs.org/examples/physics_ammo_cloth.html\" target=\"_blank\" rel=\"noopener\">https://threejs.org/examples/physics_ammo_cloth.ht…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>threejs-ammo-cloth/arm/sheet.png；threejs-ammo-cloth/arm/f00.png；threejs-ammo-cloth/arm/f01.png；threejs-ammo-cloth/arm/f03.png（可核对 2/4）\u003c/td>\u003ctd>f00（静止）：一块约 40×30 格网的白布挂在横臂下，下摆搭在彩色砖墙顶部，布面有两道从挂点垂下的大褶皱和若干小皱纹；连按 Q 转动横臂后 f01 横臂已转约 60°，布被拉离墙面，布面被拉直成一条斜向的紧绷带，褶皱集中到两侧；f02 横臂转到约 120°，布悬空垂挂、下摆向左甩出；f03 横臂接近 180°，布整体飘到立柱后方、下摆呈甩动的弧形；f04 以后横臂继续转动，布离开画面。布的位移总是滞后于横臂：先是挂点被拉动，褶皱再沿布面传播到下摆，静止前有一次甩动回摆；地面投影随之同步变形。\u003c/td>\u003ctd>牵引点先动、下摆滞后回摆 → 拉牌摆动（SC10）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF38\u003c/td>\u003ctd>Folding the DOM — 3D 折纸式图片展开演示\u003c/td>\u003ctd>Josh W. Comeau · 2019-05-19（2024-09-13 更新）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://www.joshwcomeau.com/react/folding-the-dom/\" target=\"_blank\" rel=\"noopener\">https://www.joshwcomeau.com/react/folding-the-dom/…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>joshwcomeau-folding-the-dom/pagedown/sheet.png；joshwcomeau-folding-the-dom/pagedown/f00.png；joshwcomeau-folding-the-dom/pagedown/f01.png；joshwcomeau-folding-the-dom/pagedown/f07.png（可核对 2/4）\u003c/td>\u003ctd>演示区是一张竖幅霓虹照片，被横向切成上下两半，滑块「Folded Percentage」控制下半片绕中线折起的角度。逐步按 PageDown（每帧 −10%）：f00（65%）下半片折起并盖住上半片下沿，看到的是它的背面——一片半透明的白色薄面，透出照片，透视使它上宽下窄；f01（55%）下半片接近与视线齐平，压成一条高约 60px 的白色扁梯形，上半片几乎完整露出；f02（45%）越过水平线后看到的是正面照片本身、因透视上宽下窄且略暗；f03（35%）→f06（5%）下半片逐渐放平、宽度向上半片对齐；f07（0%）两半严丝合缝成一张平整照片。折痕处没有阴影，厚度感只靠「背面白色薄面」与透视缩放表达。\u003c/td>\u003ctd>翻折先露半透明背面、过中线才显内容 → 翻页透印（SC04）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF39\u003c/td>\u003ctd>BookBlock — A Content Flip Plugin（Demo 1）\u003c/td>\u003ctd>Mary Lou（Manoela Ilic），Codrops · 2012-09-03（仓库最后更新 2016-01）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://github.com/codrops/BookBlock\" target=\"_blank\" rel=\"noopener\">https://github.com/codrops/BookBlock…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>codrops-bookblock/flip/sheet.png；codrops-bookblock/flip/f00.png；codrops-bookblock/flip/f01.png；codrops-bookblock/flip/f02.png（可核对 2/4）\u003c/td>\u003ctd>（演示原址 tympanus.net/Development/BookBlock/ 在本网络不可达，本次从作者仓库克隆后本地运行截图。）一张约 400×300 的插画「书页」，底部四个翻页按钮。点击 next 后每 110ms 一帧：f00 第一页（橙底大象）完整平铺；f01 翻页进行中——页面从左右中线处被折起，左半是第一页的右半正在立起、右半已露出第二页左半，中缝处是一条约 25px 宽、带深棕渐变的立起页边，页边顶端比页面顶边高出约 20px（透视），新页右侧有一条浅灰阴影；f02 起第二页（棕色大象）完全平铺、页边阴影消失。整个翻动约 1 秒，中间只有一两帧能看到「立起的页边」，翻页的厚度感全靠那条带渐变的竖条和顶端凸出。\u003c/td>\u003ctd>中缝立起的渐变页边 → 书脊轴翻页（SC04）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF40\u003c/td>\u003ctd>Card Stack Effects（Yuda / Krisna 演示）\u003c/td>\u003ctd>Mary Lou（Manoela Ilic），Codrops · 2015-10（仓库 2015-10-28）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://github.com/codrops/CardStackEffects\" target=\"_blank\" rel=\"noopener\">https://github.com/codrops/CardStackEffects…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>codrops-cardstack/accept/sheet.png；codrops-cardstack/accept/f00.png；codrops-cardstack/accept/f01.png（可核对 2/3）\u003c/td>\u003ctd>（演示原址 tympanus.net/Development/CardStackEffects/ 不可达，本次从作者仓库本地运行。）一叠约 6 张的方卡（每张比上一张向上偏 4px、露出彩色边）配一对「×／✓」按钮。点击 ✓ 后每 120ms 一帧：f00 顶卡已脱离牌叠向下方滑出并带约 10° 旋转、透明度降到约 50%，同时背景从黄变绿——绿色以一个从左上角长出的圆形扩散（f00 里圆的半径约为面板的 70%，右下角仍是黄色），牌叠第二张正往上顶替到顶位；f01 圆已铺满、顶卡消失、新顶卡就位；f02–f07 面板回到黄底（绿只是「接受」的一次闪色），牌叠保持排列。右侧 Krisna 版在左侧点击时完全不动。节奏上「卡离开」与「背景扩圆」同时开始，卡先消失、圆后铺满。\u003c/td>\u003ctd>顶卡滑出半透明化、下一张顶上 → 袋子插回与顶上（SC03）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF41\u003c/td>\u003ctd>Tearable Cloth（ES2015 重写版）\u003c/td>\u003ctd>dissimulate（@abro_oks） · 2013 原版；2016-05 ES2015 版\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://github.com/Dissimulate/Tearable-Cloth\" target=\"_blank\" rel=\"noopener\">https://github.com/Dissimulate/Tearable-Cloth…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>tearable-cloth/drag2/sheet.png；tearable-cloth/drag2/f00.png；tearable-cloth/drag2/f01.png；tearable-cloth/drag2/f03.png（可核对 2/4）\u003c/td>\u003ctd>（原发布于 CodePen，本网络被 Cloudflare 拦截；本次用作者仓库的 Cloth.js 本地运行。）一块 54×32 格、格距 8px 的线框布由顶边固定悬挂。鼠标从布上半部向下拖（5 步、每步 200ms）：f00 布是整齐的矩形网格；f01 拖点把布向下拉出一个倒 V 形尖囊，囊底的格子被拉成两条紧贴的平行线，囊中央撕开一个约 100×150px 的洞，洞缘是一圈拉长、歪斜的四边形而不是直线；f02–f03 洞继续扩大，撕下的碎片（三五格的小网片）和单根线段脱离主体、在画面下方自由下落；f04–f06 拉力消失后布回弹成一条下垂的 U 形，两侧各留一条拉长的「撕边」挂带；f07 碎片基本落出画面，布停在 U 形。撕裂按单根约束超过阈值即断开，所以撕边总是参差的锯齿而非平滑曲线。\u003c/td>\u003ctd>沿虚线逐格断开、碎片下落、主体回弹 → 拿起传单的拖尾 / 剪绳落牌（SC05、SC10）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF42\u003c/td>\u003ctd>Ticket loading（Rive 社区文件）\u003c/td>\u003ctd>WinnieQ（Rive Marketplace 上传者） · 2023-11-15\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://rive.app/marketplace/6754-13024-ticket-loading/\" target=\"_blank\" rel=\"noopener\">https://rive.app/marketplace/6754-13024-ticket-loa…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>rive/6754-13024-ticket-loading/sheet.png；rive/6754-13024-ticket-loading/f00.png；rive/6754-13024-ticket-loading/f01.png；rive/6754-13024-ticket-loading/f03.png（可核对 2/4）\u003c/td>\u003ctd>画面是一条深灰色出票口横杆（宽约 280px、两端圆头），下方一张白票带条码和「2023 YEAR-END RECOLLECTION」。每 400ms 一帧：f00 票整张在外但整体压暗（约 40% 灰），像「上一张未取走」；f01 票从杆下只露出约 1/4 高度，票的上缘被横杆遮住、条码被截断；f02–f03 票面全部露出且变纯白，底边两角圆角；f04 回到只露出约 8px 的白边（新一张开始出票）；f05 露出一半（条码上半可见、文字只剩上半）；f06 全出；f07 再回到一半。票是从横杆后方「向下长出」的——出票口在上、票向下推出，露出的永远是票的上半，被遮住的是下半。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：我的局报名成功后的「票根打印」：出票口放在票上方、票被一条横杆遮挡着向下推出，上半先出现；已出过的旧票用压暗表示、新票以纯白区分；一次出票分 3–4 个停顿（露边、半张、整张）。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF43\u003c/td>\u003ctd>Card Shuffle（Rive 社区文件）\u003c/td>\u003ctd>cwthrs（Rive Marketplace 上传者） · 2024-02-01\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://rive.app/marketplace/7905-15241-card-shuffle/\" target=\"_blank\" rel=\"noopener\">https://rive.app/marketplace/7905-15241-card-shuff…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>rive/7905-15241-card-shuffle/sheet.png；rive/7905-15241-card-shuffle/f00.png；rive/7905-15241-card-shuffle/f01.png；rive/7905-15241-card-shuffle/f02.png（可核对 2/4）\u003c/td>\u003ctd>五张白底红字「HOOK」的扑克牌，边缘带约 3px 粉色描边与圆角。每 400ms 一帧：f00 五张完全叠成一张（只在右下露出一点错位的角）；f01 牌向左以共同的右下角为支点扇开，相邻两张夹角约 12°、总张角约 50°，最左一张转得最多；f02 收拢到只剩三张可见的半扇；f03–f04 再次扇开、角度与 f01 相同；f05 完全收拢；f06 扇开；f07 收拢。扇开与收拢各约 400ms；旋转中心在牌的右下角而不是中心，所以牌头画的是圆弧轨迹；每张牌保持整张可见（不裁切），靠层级遮挡表达厚度。\u003c/td>\u003ctd>以角为支点扇开约 12° → 拉标签时袋子先扇出再前移（SC03）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF44\u003c/td>\u003ctd>Printing（Rive 社区文件）\u003c/td>\u003ctd>ekasetiawans（Rive Marketplace 上传者） · 2021-11-08\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://rive.app/marketplace/1395-2731-printing/\" target=\"_blank\" rel=\"noopener\">https://rive.app/marketplace/1395-2731-printing/…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>rive/1395-2731-printing/sheet.png；rive/1395-2731-printing/f00.png；rive/1395-2731-printing/f01.png；rive/1395-2731-printing/f03.png（可核对 2/4）\u003c/td>\u003ctd>一台蓝灰色扁平打印机（上盖带绿色指示灯、前方一条深色出纸槽）。每 400ms 一帧：f00 一张已打印的纸（灰色文字条＋一个灰色图块）从前槽完全推出，纸的顶边仍被槽口压着；f01 上方进纸口升起一张白纸、前槽的纸只剩下半截；f02 上方白纸升到最高（整张露在机身后方）、前槽只剩一小段；f03 上方白纸完整、前方无纸；f04–f05 前槽再次推出整张打印好的纸；f06 上下同时有纸；f07 前槽纸只出一半。进纸（白纸从机身后升起再沉入机身）与出纸（带内容的纸从前槽向下推出）是两个错开约半个周期的动作，内容只出现在「出纸」那张上，白纸始终空白。\u003c/td>\u003ctd>出纸槽遮挡到完整露出 → 字牌从槽口滑入轨道（SC08）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF45\u003c/td>\u003ctd>FigJam-like Stamp Tool – Radial Menu, Stamp Spawner Script（Rive 社区文件）\u003c/td>\u003ctd>nickyinprogress（Rive Marketplace 上传者） · 2026-09-04\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://rive.app/marketplace/28735-54435-figjam-like-stamp-tool-radial-menu-stamp-spawner-script/\" target=\"_blank\" rel=\"noopener\">https://rive.app/marketplace/28735-54435-figjam-li…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>rive/28735-54435-figjam-like-stamp-tool-radial-menu-stamp-spawner-script/click/f00.png；rive/28735-54435-figjam-like-stamp-tool-radial-menu-stamp-spawner-script/click/f07.png；rive/28735-54435-figjam-like-stamp-tool-radial-menu-stamp-spawner-script/click/sheet.png（可核对 2/3）\u003c/td>\u003ctd>一块点阵背景的白板，上面贴着带白描边的 emoji 贴纸和几张便利贴，左下有「垃圾桶／盖章」两个按钮。每 200ms 点击一次、每次向右移 25px：f00 第一次点击处（左上角）出现一枚带白色描边的绿色「👍」贴纸，约 40px 见方；f07 同一行出现 8 枚 👍，彼此部分重叠，后盖的在上层，每枚都有约 ±8° 的随机倾斜，描边交叠处白边清晰可见；右侧面板的 cursorPosX 从 183 递增到 557，证明贴纸落点跟随点击位置。贴纸是瞬时出现（相邻帧间没有缩放过渡），用「随机倾斜＋白描边＋后者压前者」表达一枚枚盖上去的实物感。\u003c/td>\u003ctd>章落在点击位置、后盖压先盖、略随机倾斜 → 盖章开关 / 磁贴落点（SC01、SC05）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF46\u003c/td>\u003ctd>Receipt Animation（LottieFiles 作者上传页）\u003c/td>\u003ctd>Jaehan Park（LottieFiles） · n.d.（LottieFiles 免费动画页，未标日期）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://lottiefiles.com/free-animation/receipt-M9ay7kwD9c\" target=\"_blank\" rel=\"noopener\">https://lottiefiles.com/free-animation/receipt-M9a…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>lottie/receipt-M9ay7kwD9c/sheet.png；lottie/receipt-M9ay7kwD9c/f00.png；lottie/receipt-M9ay7kwD9c/f01.png；lottie/receipt-M9ay7kwD9c/f04.png（可核对 2/4）\u003c/td>\u003ctd>一个浅灰色圆角「封套」方块（约 130×130px）和一张珊瑚红的收据方块（带白色「₩」符号和两行白色横线）。每 300ms 一帧：f00 红色收据从封套右下方斜向露出约 70%，封套压在它的左上方；f01 收据完全滑出并盖在封套前面，₩ 左上角出现一粒黄色小火花；f02 收据静止；f03 火花换位置；f04 收据退回封套后方只露出右下角；f05 露出一半；f06–f07 再次完全滑出并带火花。收据沿封套对角线（左上→右下）进出，进入时它在封套「后面」、出来后在封套「前面」，中途有一次层级交换。\u003c/td>\u003ctd>票沿对角抽出并翻到上层 → 便签揭下（SC05）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF47\u003c/td>\u003ctd>AnimatedTicket — ticket &amp; receipt with barcode（Framer Marketplace 组件）\u003c/td>\u003ctd>Hamim Reza（Framer @hreza） · n.d.（组件页未标日期；票面示例日期 2024-08-15）\u003c/td>\u003ctd>motion\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://www.framer.com/marketplace/components/animatedticket/\" target=\"_blank\" rel=\"noopener\">https://www.framer.com/marketplace/components/anim…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>framer-animatedticket-hamim/hover/sheet.png；framer-animatedticket-hamim/hover/f01.png；framer-animatedticket-hamim/hover/f05.png（可核对 1/3）\u003c/td>\u003ctd>深蓝星空底上一张白色竖票（约 220×370px）：顶部勾选图标＋「Thank you!」、两条虚线分隔、票号／金额／时间、持卡人，底部条码。鼠标移到预览上后每 400ms 一帧：f00–f03 彩色纸屑（约 3×8px 的小长条、多色）从票面上方洒下、覆盖整张票，数量在 f01 最多、f03 开始稀疏；f04 只剩零星几片落到票下缘；f05–f07 纸屑全部消失，票面回到静态。纸屑在票的前面一层、不被票遮挡，票本身没有位移或缩放。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：我的局报名成功「票根」生成那一刻的庆祝：纸屑只洒一次、约 1.5 秒内由密到疏落尽，在票的上层飘落而不改变票的位置；之后票面保持可读。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF48\u003c/td>\u003ctd>A Magazine Curated By A#22 — Grace Wales Bonner《Rhapsody in the Street》期号页\u003c/td>\u003ctd>A Magazine Curated By（A Publications, Antwerp） · 2021-10（期号页，2026-10 访问） ss-ss97/top.png；cdg-body-meets-dress-ss97/cov1.png（可核对 1/2）\u003c/td>\u003ctd>页面标题块三行居中：「COMME DES GARÇONS」约 34px 粗几何无衬线大写、「SPRING 1997 READY-TO-WEAR」约 20px 细体大写、「By Rei Kawakubo」约 17px 斜体衬线（≈1.7:1.2:1）；一条通栏 hairline 下左侧小号大写日期「AUGUST 20, 2015」，右侧三个布局切换图标。正文衬线约 19px、首字母「M」下沉 3 行，栏宽约 370px；右侧看次网格 3 列、每格约 244×362px、缝 8px，编号「01」「02」「03」为约 11px 白色大写贴在图的左下角，右下角是一个书签图标。看到 6 个看次后出现「SUBSCRIBE TO VIEW ALL」（画廊页标「Look 1 / 57」）。看次本身：01 白色透视 T 恤 + 白色球状填充裙；02 红白格纹弹力筒裙，髋部一侧鼓起一团；03 粉格纹小西装，肩背处隆起；04–06 是背面——蓝格纹裙\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：票根撕票/局卡形变：票面底纹用等距细格纹（而不是纯色或渐变），撕票、折角、卡片被按压时让格纹随形变弯曲，变形量就有了刻度；局卡的编号与收藏位：编号小字固定贴左下、收藏/书签固定贴右下，两角分工；中文局名与时间的比例参照标题块约 1.7:1.2:1 三级（局名/时间/发起人）；名单的角色分层：主理人像“鼓包”一样作为对称\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF69\u003c/td>\u003ctd>Junya Watanabe Fall 2000「Techno Couture」（Vogue Runway 秀页）\u003c/td>\u003ctd>Junya Watanabe（Comme des Garçons） · 2000-03 发布的 FW00（Vogue Runway 存档页 2016-04-25，2026-10 访问）\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.vogue.com/fashion-shows/fall-2000-ready-to-wear/junya-watanabe\" target=\"_blank\" rel=\"noopener\">https://www.vogue.com/fashion-shows/fall-2000-read…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>junya-watanabe-techno-couture-fw00/top.png；junya-watanabe-techno-couture-fw00/cov1.png（可核对 1/2）\u003c/td>\u003ctd>同一套 Vogue Runway 骨架（三行居中标题、带头像的署名行「BY LAIRD BORRELLI-PERSSON / APRIL 25, 2016」、首字母「J」下沉、3 列看次网格、6 个看次后「SUBSCRIBE TO VIEW ALL」，画廊页标「Look 1 / 31」）。看次：01 天蓝色层叠荷叶边聚酯欧根纱茧形裙，裙摆蓬到膝上；02 钴蓝色蜂窝状纹理的茧形连衣裙，领口把头部包到下巴；03 品红色、同样蜂窝单元的球形上衣 + 短裙；04 灰蓝色、按层排布的褶裥长裙；05、06 近白色、像缠绕的薄纱卷成的筒形与伞形。结构上每个体量都由同一种小单元（荷叶边 / 蜂窝格 / 褶）成千次重复铺满而成，表面即结构，看不到缝线分割；每个看次只有一种饱和单色；轮廓是从颈部向外“充气”的茧，头在顶端显得很小。背景是蜂窝纹拼花地面和黑衣观众。\u003c/td>\u003ctd>从中心充气膨胀、头部固定 → 膨胀时标题固定（SC09）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF70\u003c/td>\u003ctd>Chalayan Spring 2007「One Hundred and Eleven」机械变形裙系列（Vogue Runway 秀页）\u003c/td>\u003ctd>Hussein Chalayan · 2006-10-03 巴黎 SS07（Vogue Runway 存档，2026-10 访问）\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.vogue.com/fashion-shows/spring-2007-ready-to-wear/chalayan\" target=\"_blank\" rel=\"noopener\">https://www.vogue.com/fashion-shows/spring-2007-re…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>chalayan-one-hundred-eleven-ss07/top.png；chalayan-one-hundred-eleven-ss07/cov1.png（可核对 1/2）\u003c/td>\u003ctd>标题块「CHALAYAN / SPRING 2007 READY-TO-WEAR / By Hussein Chalayan」，署名 Sarah Mower、OCTOBER 3, 2006；正文首段描述模特站定后衣服自行“抽动、移动、重组”：单胸式上衣打开、外套退去、裙摆上升，一分钟内从 1895 年的高领维多利亚长裙变成二十年代的水晶珠片 flapper 裙（六件机械变形作品）。页面能看到的是变形后的终态静照：01 灰紫色短裙 + 蘑菇/伞形的大帽，帽檐像一片薄膜罩住头部；02 同系列浅紫短裙 + 同款帽，裙摆下沿斜切；03 浅灰色落肩外套连衣裙 + 宽檐帽；04–06 是局部特写——脸被皱纸般的浅色面料包住、带金属扣的裸色高跟凉鞋、洒满闪片的地面。场景是深蓝渐变背景 + 闪粉地面。页面之后是「LATEST FROM CHALAYAN」六格与同季其他品牌横排。注意：变形过程本身只在文字里，页面没有视频或序列帧。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：改期弹层旧→新对照：把旧时间与新时间做成同一张票的两个状态，弹层打开时票面自行“变形”（时间字段滑动、票长收缩、旧值褪成珠片般的小字）而不是两张票左右并列；局卡→详情的展开：展开的机械感来自“结构内藏”——卡片边缘先微抽动再展开，提示里面有机构；票根撕票：撕开后露出的内层用更亮的闪片质感（与外层哑光对比）。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF71\u003c/td>\u003ctd>Maison Martin Margiela Spring 2009 二十周年系列（Vogue Runway 秀页）\u003c/td>\u003ctd>Martin Margiela / Maison Martin Margiela · 2008-09-28 巴黎 SS09（Vogue Runway 存档，2026-10 访问）\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.vogue.com/fashion-shows/spring-2009-ready-to-wear/maison-martin-margiela\" target=\"_blank\" rel=\"noopener\">https://www.vogue.com/fashion-shows/spring-2009-re…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>margiela-20th-anniversary-ss09/top.png；margiela-20th-anniversary-ss09/cov0.png（可核对 1/2）\u003c/td>\u003ctd>标题块「MAISON MARGIELA / SPRING 2009 READY-TO-WEAR / By Martin Margiela」，Sarah Mower 的正文首段写明这是 Margiela 二十周年、四十个系列的回顾场。能看到 3 个看次（之后即订阅墙）：01 背面——白色窄肩长西装连衣裙，肩线被削窄拉高、后中一道竖缝，裸色后缝长袜，模特头发盘成光头状；02 一块银色方形金属感布片被模特双手从两肩提起、像举着一面旗，布片只在肩点受力、下摆自由垂落成短裙；03 白色高垫肩西装 + 裸身下装，脸被肉色的面罩完全覆盖（匿名）。T 台是黑色亮面地板，中央一条光带向远处收束。三件都只用白 / 银 / 肉色三种“未着色”的材料，剪裁动作各不相同：削肩、提角、垫肩。\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：名单的角色分层：未公开身份/未确认的成员用统一的“素面”占位（肉色无脸），和已确认成员的真实头像区分，而不是默认灰色人形图标；票根撕票：票面像 02 那块方形布片一样“被两角提起”——撕票动效先提起两角再脱落；票根只用白 / 银 / 肉三种无彩色材料，用剪裁（切角、削边）做区分而非配色；历史区的归档构图：周年/回顾类的\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF72\u003c/td>\u003ctd>Helmut Lang Spring 1998（Vogue Runway 秀页）\u003c/td>\u003ctd>Helmut Lang · 1997-10 纽约 SS98（Vogue Runway 存档页 2016-03-22，2026-10 访问）\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.vogue.com/fashion-shows/spring-1998-ready-to-wear/helmut-lang\" target=\"_blank\" rel=\"noopener\">https://www.vogue.com/fashion-shows/spring-1998-re…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>helmut-lang-ss98/top.png；helmut-lang-ss98/cov0.png（可核对 1/2）\u003c/td>\u003ctd>标题块「HELMUT LANG / SPRING 1998 READY-TO-WEAR / By Helmut Lang」，Laird Borrelli-Persson 署名，正文只有一段约 7 行（提到 Rothko 蓝到知更鸟蛋蓝、折纸般的条带、平底中式布鞋、花苞状腰包）。视口里看到 6 个看次：01 黑开衫 + 白背心 + 黑裙，白背心下摆是毛边的一道白；02 黑长开衫 + 白 T + 黑皮裙 + 黑布鞋；03 黑西装 + 白 T + 黑腰带，白 T 只露出一条横带；04 男装黑大衣 + 白 T；05 白衬衫；06 白衬衫 + 黑裤。场地是过曝的白色工作室（白墙、浅地面），人物边缘几乎与背景融合。所有看次都是窄而长、贴身而平的轮廓，颜色只有黑与白，而且黑与黑之间总夹着一条白（背心、T 恤、衬衫领）——一道白线组织了整套的层次；没有装饰、没有图案，差异只在白线的宽度与位置。\u003c/td>\u003ctd>一条白 hairline 组织、窄长排版 → 墨水屏 hairline 与版心（SC07）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF73\u003c/td>\u003ctd>Ann Demeulemeester Spring 2014（Ann 本人任内最后一季；Vogue Runway 秀页）\u003c/td>\u003ctd>Ann Demeulemeester · 2013-09-25 巴黎 SS14（Vogue Runway 存档，2026-10 访问）\u003c/td>\u003ctd>designer\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.vogue.com/fashion-shows/spring-2014-ready-to-wear/ann-demeulemeester\" target=\"_blank\" rel=\"noopener\">https://www.vogue.com/fashion-shows/spring-2014-re…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>ann-demeulemeester-ss14/top.png；ann-demeulemeester-ss14/cov0.png（可核对 1/2）\u003c/td>\u003ctd>标题块「ANN DEMEULEMEESTER / SPRING 2014 READY-TO-WEAR / By Ann Demeulemeester」，Tim Blanks 署名，正文开头专写邀请函：“一个昂贵的信封，没有地址，秀的细节印在信封的内翻口上，完全向内（Totally interior）”。看次 01–03 获奖 app）\u003c/td>\u003ctd>Things, Inc.（美国） · ADA 2024 Visuals &amp; Graphics winner；Rooms 4.0 发布公告 2026-08-05\u003c/td>\u003ctd>award\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://news.rooms.xyz/rooms4.html\" target=\"_blank\" rel=\"noopener\">https://news.rooms.xyz/rooms4.html…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>ada-rooms/ada-2024-visuals-winners.png；ada-rooms/home.png；ada-rooms/news-s0.png；ada-rooms/news-s1.png（可核对 2/4）\u003c/td>\u003ctd>ADA 2024 页「Visuals and Graphics › Winners」第一位：Rooms（Things Inc., USA · iPhone/iPad），评语「a social space that lets you interact with thousands of other people's creations」。Rooms 4.0 公告页（rooms.xyz 自家新闻站，白色文稿卡浮在彩虹渐变上）的手机截图：首页顶栏「Rooms®」+ 铃铛 + 菜单；第一张满幅深色卡「Today's Picks For You / Featured, trending and recent」，左上角蓝色小胶囊「For You」，卡底一行两端对齐的「0 seen」「30 left」（每天固定 30 个、看完即止）；「Following ⟨4 new⟩」标题右侧蓝字「✓ Mark all seen」，下方三张方形缩略图每张左\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：我的局首页顶卡用「已看 N / 剩 N」的有限集合代替无限流；关注的人新开的局用「NEW」角标 + 头像行；局卡沿用 Challenge 卡的四角布局：左上状态胶囊（报名中 / 已满）、左下「剩余 2d 0h」、右下「加入」白胶囊；局详情信息面板：拖拽条 + 主办头像 + 计数 + 描述 + 状态标 + 四枚图标操作（\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF92\u003c/td>\u003ctd>Thomas Gertenbach 作品集「石膏桌上的拍立得」（FWA of the Day · 2026-10-10）\u003c/td>\u003ctd>Thomas Gertenbach（Creative Developer） · FWA of the Day 2026-10-10（82 分 / 6 天）；站点 2026\u003c/td>\u003ctd>award\u003c/td>\u003ctd>已看动效\u003c/td>\u003ctd>\u003ca href=\"https://thomasgertenbach.com/\" target=\"_blank\" rel=\"noopener\">https://thomasgertenbach.com/…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>fwa-thomas-gertenbach/fwa-home-oct10.png；fwa-thomas-gertenbach/fwa-case.png；fwa-thomas-gertenbach/vid1/sheet.png；fwa-thomas-gertenbach/drag/sheet.png；fwa-thomas-gertenbach/drag/f05.png；fwa-thomas-gertenbach/drag/f06.png；fwa-thomas-gertenbach/drag2/sheet.png（可核对 4/7）\u003c/td>\u003ctd>FWA 首页与案例页都标「10 OCTOBER · FWA OF THE DAY · Thomas Gertenbach portfolio」，作者自述「My portfolio is one sunlit plaster table, seen from above. Projects are polaroids you can pick up, toss and blow around」。实际打开站点（软件 WebGL，加载慢）：加载态是一块暖灰底（约 #a8a394）上的取景框——四角「⌜ ⌝ ⌞ ⌟」+ 中央一条黑色横线，左下角「ISO 100 · F/8 · 1/125」相机参数，右下角百分比；百分比从 0% → 33% → 53% → 78% → 94% 逐帧递增时，四角取景框同步向中心收拢、横线变长（vid1/sheet f03→f13、drag/f00→f04）。加载完成后（drag/f05）切成俯视的混凝土质感\u003c/td>\u003ctd>随机轻旋的拍立得 + 拿走留投影 → 门上传单错落与取下留影（SC05）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF93\u003c/td>\u003ctd>Reposaku（レポサク）智慧农业平台 — Good Design Gold Award 2025（Web-based service）\u003c/td>\u003ctd>Ezowin Inc.（北海道）· 设计 Ayana Yamazaki · 2025 Good Design Gold Award（Award No. 25G181414）；服务 2020/04 上线\u003c/td>\u003ctd>award\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.g-mark.org/en/gallery/winners/33628\" target=\"_blank\" rel=\"noopener\">https://www.g-mark.org/en/gallery/winners/33628…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>gmark-ezowin/page.png；gmark-ezowin/hero.png；gmark-ezowin/outline.png（可核对 2/3）\u003c/td>\u003ctd>G-Mark 2025 结果页 Gold Award 19 项中唯一的数字服务（「Web-based service / Ezowin Inc.」）。奖项 Gallery 页主图三台手机：左一是航拍底图上按地块着色（绿 / 蓝 / 橙）的多边形，每块压一枚带编号的圆形图钉（「2」「7」）；中间手机的一块田里铺满平行彩色细线（作业轨迹），线上一枚带拖拉机插画的圆形头像标当前位置，屏幕外散落黄色铲车、蓝色卡车等小车辆插画，用虚线连向屏幕；右侧手机 UI 为日文：左上「←トップ」返回胶囊、顶部日期区间胶囊「今日 06/01(月)〜06/05(月)」、右侧竖排一列圆形图标按钮「掲示板 / 道具箱 / 一括選択」，底图仍是地块地图。页面下方表格：分类 System &amp; Service、Companies Ezowin Inc.、Award No. 25G181414；Outline 写「Visualizes the real-time m\u003c/td>\u003ctd>继承 · 本轮未映射到具体方案；原转译（我的局）：局详情的「到场 / 位置」层：地图上每位成员一枚带头像的圆形图钉，主办者的移动画成彩色细线；我的局顶部日期条照抄「今日 06/01(月)〜06/05(月)」的区间胶囊写法（中文可写「本周 10/13(一)〜10/19(日)」）；主办管理面板用右侧竖排的圆形图标按钮（公告板 / 工具箱 / 批量选择）对应「公告 / 物料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REF94\u003c/td>\u003ctd>My Japan Railway / TRAIN TRIP 数字站章 — D&amp;AD Black Pencil 2024（Art Direction）\u003c/td>\u003ctd>Dentsu Inc. Tokyo（ECD 八木義博、AD 加藤寛之）for JR Group · 活动 2022（铁道 150 周年）起持续；D&amp;AD 2024 Black Pencil + Yellow + 2 Graphite + 2 Wood；Cannes Lions 2023 Industry Craft Grand Prix\u003c/td>\u003ctd>award\u003c/td>\u003ctd>仅核验静态\u003c/td>\u003ctd>\u003ca href=\"https://www.dandad.org/awards/professional/2024/238082/my-japan-railway\" target=\"_blank\" rel=\"noopener\">https://www.dandad.org/awards/professional/2024/23…\u003c/a>\u003c/td>\u003ctd>2026-10-10\u003c/td>\u003ctd>dandad-my-japan-railway/full-s0.png；dandad-my-japan-railway/entry-s3.png；dandad-my-japan-railway/railway150-home.png；dandad-my-japan-railway/railway150-phone.png；dandad-my-japan-railway/dentsu-s1.png；dandad-my-japan-railway/dentsu-s2.png（可核对 3/6）\u003c/td>\u003ctd>D&amp;AD 条目页：标题「My Japan Railway」，Awards 行依次 1 枚黑铅笔 + 1 黄 + 2 灰 + 2 木 + 3 个空六边形（shortlist）；Categories 标签 Art Direction / Illustration / Branding / Graphic Design / Digital Experience Design / Typography / Digital Marketing，Countries Japan，Year 2024；Credits Entrant/Advertising/Design Agency 均为 Dentsu Inc. Tokyo，Client JR Group。Hero 图是手机打开 railway150.jp：浅灰地图上站点为灰色小圆点、最近站为红色定位针，旁白「Touch to collect stamp of nearest station」。\u003c/td>\u003ctd>单色粗糙边章 + 汉字 + 日期 → 状态章 / 已核实章 / 密排局章（SC01、SC04、SC07、SC10）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>三、访问失败／未立案（本轮新增批次）\u003c/h2>\n\u003ch3>draft-ui-settings.md\u003c/h3>\n\u003cul>\n\u003cli>\u003ca href=\"https://blog.bear.app/2020/02/bear-101-pro-is-closing-in-on-20-themes/｜403\" target=\"_blank\" rel=\"noopener\">https://blog.bear.app/2020/02/bear-101-pro-is-closing-in-on-20-themes/｜403\u003c/a> Cloudflare「Checking your browser...」挑战页，Bear 主题／外观设置未取证\u003c/li>\n\u003cli>\u003ca href=\"https://support.signal.org/hc/en-us/articles/360007059792-Signal-Profile｜HTTP\" target=\"_blank\" rel=\"noopener\">https://support.signal.org/hc/en-us/articles/360007059792-Signal-Profile｜HTTP\u003c/a> 403（Zendesk 帮助中心拒绝），改用 signal.org 博客原文（SU08）\u003c/li>\n\u003cli>\u003ca href=\"https://telegram.org/blog/power-saving-and-more｜slug\" target=\"_blank\" rel=\"noopener\">https://telegram.org/blog/power-saving-and-more｜slug\u003c/a> 不存在，跳转到 telegram.org 首页；改用博客列表里的两篇现行文章（SU06、SU07）\u003c/li>\n\u003cli>\u003ca href=\"https://telegram.org/blog/themes-accounts｜可达（2017-12-30「Them li>\n\u003c/ul>\n\u003ch3>draft-motion-settings.md\u003c/h3>\n\u003cul>\n\u003cli>\u003ca href=\"https://developer.apple.com/design/human-interface-guidelines/toggles\" target=\"_blank\" rel=\"noopener\">https://developer.apple.com/design/human-interface-guidelines/toggles\u003c/a> 、/segmented-controls 、/pickers 、/settings — 页面仅静态插图、无 video 元素，无动态证据，未立案。\u003c/li>\n\u003cli>\u003ca href=\"https://developer.apple.com/design/human-interface-guidelines/sheets\" target=\"_blank\" rel=\"noopener\">https://developer.apple.com/design/human-interface-guidelines/sheets\u003c/a> — 仅一段 visionOS 模态面板视频（visionos-modal-sheet.mp4），非手机界面，未立案。\u003c/li>\n\u003cli>\u003ca href=\"https://emilkowal.ski/ui\" target=\"_blank\" rel=\"noopener\">https://emilkowal.ski/ui\u003c/a> — 404；emilkowal.ski 文章索引可达，但 clip-path 主题切换／toast／drawer 已分别为 REF33／18／17，其余文章本轮未逐一核验，未立案。\u003c/li>\n\u003cli>\u003ca href=\"https://animations.dev\" target=\"_blank\" rel=\"noopener\">https://animations.dev\u003c/a> — 课程落地页只有报名入口（enrollment closed），无可操作演示，未立案。\u003c/li>\n\u003cli>\u003ca href=\"https://www.uilabs.dev\" target=\"_blank\" rel=\"noopener\">https://www.uilabs.dev\u003c/a> — 首页无可抓取的链接与视频元素（Elastic Card 已为 REF19），未立案。\u003c/li>\n\u003cli>\u003ca href=\"https://jakub.kr/writing/details-that-make-interfaces-feel-better\" target=\"_blank\" rel=\"noopener\">https://jakub.kr/writing/details-that-make-interfaces-feel-better\u003c/a> — 有「Make your animations interruptible」的 Rotate／Menu 演示，但为抽象示例而非设置控件，未立案（可作「可中断动画」原则的补证）。\u003c/li>\n\u003cli>\u003ca href=\"https://rauno.me/craft\" target=\"_blank\" rel=\"noopener\">https://rauno.me/craft\u003c/a> — 索引 19 个 craft，除已立案的 exclusion-tabs／logo-carousel 外无开关／面板类条目，未立案。\u003c/li>\n\u003cli>\u003ca href=\"https://arc.net（theme-picker.mp4，3.0s，3300×2200）—\" target=\"_blank\" rel=\"noopener\">https://arc.net（theme-picker.mp4，3.0s，3300×2200）—\u003c/a> 已抽帧概览：桌面浏览器侧栏与窗口底色随调色板点选每 0.5s 交叉淡变一次；属桌面界面且无取消路径，本轮未立案。\u003c/li>\n\u003cli>Dribbble 搜索「settings toggle animation」「dark mode switch mobile」— 结果页为静态缩略图、无 video，需逐个进入 shot 页核验，本轮未取得可核验的 MP4，未立案。\u003c/li>\n\u003cli>\u003ca href=\"https://lottiefiles.com/free-animation/toggle-dark-mode-light-mode-themes-61Il1QB9We（alifia）与\" target=\"_blank\" rel=\"noopener\">https://lottiefiles.com/free-animation/toggle-dark-mode-light-mode-themes-61Il1QB9We（alifia）与\u003c/a> …/day-and-night-toggle-tUzZELBsdB（Amanda）— 已录屏核验（约 1s 的插画式日／夜开关：白色圆柄横移时轨道在浅蓝与黑之间交叉变色、日／月图标被圆柄遮露），因「插画而非界面」且名额已满未立案。\u003c/li>\n\u003cli>\u003ca href=\"https://rive.app/marketplace/2795-5761-toggle-switch/（ashishb，2022-06-23）—\" target=\"_blank\" rel=\"noopener\">https://rive.app/marketplace/2795-5761-toggle-switch/（ashishb，2022-06-23）—\u003c/a> 已录屏核验：点击后柄在约 300ms 内拉伸成椭圆横移、轨道随后由白变黑、柄到位后回圆；因 8 例上限未立案，可作 SM01 的「表现型拉伸」补充参考。\u003c/li>\n\u003cli>\u003ca href=\"https://rive.app/marketplace/6762-13034-theme-toggle/（Thommik，2023-11-15）—\" target=\"_blank\" rel=\"noopener\">https://rive.app/marketplace/6762-13034-theme-toggle/（Thommik，2023-11-15）—\u003c/a> 可点击，但动效为灰闪 + 圆形擦除 + 表情变化的艺术化演示，语义不清，未立案。\u003c/li>\n\u003cli>\u003ca href=\"https://rive.app/marketplace/858-1665-switch-for-dark-and-light-mode-transitions/\" target=\"_blank\" rel=\"noopener\">https://rive.app/marketplace/858-1665-switch-for-dark-and-light-mode-transitions/\u003c/a> — 画布被放大裁切、点击无响应，未立案。\u003c/li>\n\u003cli>M3 已下载核验但因上限未立案：Lists guidelines「To expand a list item, display a parent-child transition」（分组展开约 250ms，子项容器从父行长出）；Snackbar guidelines「Snackbars with actions should remain on the screen until the user takes an action」（撤销窗口）；Menus guidelines「A menu expands when opened, and has a ripple when an item is selected」。列为下一轮候选。\u003c/li>\n\u003cli>Telegram 已抽帧核验但因上限未立案：\u003ca href=\"https://telegram.org/blog/crafting-android-design-and-more\" target=\"_blank\" rel=\"noopener\">https://telegram.org/blog/crafting-android-design-and-more\u003c/a> 「Massive Redesign」视频（2026-02-09；资料页→设置页约 300ms 缩放淡入、设置页大头像页头随滚动收缩进「Settings」标题栏）；\u003ca href=\"https://telegram.org/blog/profile-music r\">https://www.macguffinmagazine.com/issues/macguffin-the-mirror｜可访问（Nº1\u003c/a> The Bed → Nº16 The Mirror 的「一期一物」封面网格 + A–Z 撰稿人索引），为控制在 9 例内未立案，列为候补\u003c/li>\n\u003cli>\u003ca href=\"https://www.vogue.com/fashion-shows/fall-2017-menswear/junya-watanabe｜可访问（The\" target=\"_blank\" rel=\"noopener\">https://www.vogue.com/fashion-shows/fall-2017-menswear/junya-watanabe｜可访问（The\u003c/a> North Face / Levi's / Carhartt 等联名多袋夹克，看次 01–03），无 DETAILS 栏，为控制在 9 例内未立案，列为候补\u003c/li>\n\u003cli>\u003ca href=\"https://www.vogue.com/fashion-shows/spring-2010-ready-to-wear/ann-demeulemeester｜可访问（皮革腰封、拉链做翻领），仅\" target=\"_blank\" rel=\"noopener\">https://www.vogue.com/fashion-shows/spring-2010-ready-to-wear/ann-demeulemeester｜可访问（皮革腰封、拉链做翻领），仅\u003c/a> 3 看次无细节栏，未立案\u003c/li>\n\u003cli>\u003ca href=\"https://www.vogue.com/fashion-shows/fall-2006-ready-to-wear/ann-demeulemeester、…/fall-2000-ready-to-wear/yohji-yamamoto、…/fall-2011-menswear/junya-watanabe｜探测可访问，观察价值低于已选季，未立案\" target=\"_blank\" rel=\"noopener\">https://www.vogue.com/fashion-shows/fall-2006-ready-to-wear/ann-demeulemeester、…/fall-2000-ready-to-wear/yohji-yamamoto、…/fall-2011-menswear/junya-watanabe｜探测可访问，观察价值低于已选季，未立案\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://www.emigre.com/Magazine/64\" target=\"_blank\" rel=\"noopener\">https://www.emigre.com/Magazine/64\u003c/a> 的「Free PDF Download」｜按钮是购物车动作（data-invid PDEM0000064），需走结账流程，未下载 PDF；改用 Emigre 页面链接的 Letterform Archive 扫描页（SE02）\u003c/li>\n\u003c/ul>\n\u003ch2>四、可复用原则（本轮新增批次提炼）\u003c/h2>\n\u003ch3>draft-ui-settings.md\u003c/h3>\n\u003col>\n\u003cli>总览页直接露出当前值：行尾灰色「Detail ›」（HIG）、行尾短词「High」「ON」（Android、Larussa）、或标签下一行摘要「Medium quality, auto-play on, PiP」（Android）；进入子页的入口文字必须与子页标题逐字一致。\u003c/li>\n\u003cli>分组 = 容器 + 小标题 + 组脚：组头写分组名，组脚承担解释——Signal 用组脚写「这组字段谁能看见」，飞书把说明段落放在卡片外的灰字；只解释不跳转的行用 ⓘ，不用 chevron。\u003c/li>\n\u003cli>即时生效与需保存分开：开关一律即时生效、不配保存钮（M3）；多选一次确认用复选框 + 保存（M3）；带校验的单字段用「取消 | 字段名 | 完成」模态或底部「关闭／保存」等宽双钮（Signal、Creliq）；邮箱变更走「新增 → 验证码 → 设为主 → 移除旧」而不是直接改字段（Notion）。\u003c/li>\n\u003cli>通知分三层并各自写状态：应用内偏好（单选 + 开关）→ 系统权限状态卡（标题 + 状态说明 + 「去设置 ›」）→「收不到通知？」诊断入口（飞书）；依赖关系用父开关禁用子项并写明原因（Android Dependency）；开关带来的可见变化用一枚预览小卡示范（飞书横幅预览）。\u003c/li>\n\u003cli>隐私可见性要给「我看到的 vs 对方看到的」双视图对照（Strava、Notion）：自己视角灰显 + 「仅自己可见」小标签，对方视角直接不渲染；默认值在首次保存后明文写出；单条记录可覆盖全局默认并标「已单独设置」。\u003c/li>\n\u003cli>资料字段行式：小标签在上、值在下、右端辅助动作（二维码／复制／铅笔）（Telegram iOS、Signal）；头像编辑用头像角上的小徽标（Creliq）或头像下方「Edit Photo」胶囊（Signal）；资料页编辑入口放页头右上角胶囊（Telegram）。\u003c/li>\n\u003cli>破坏性账号操作：红色文字钮独立于所有分组之外的末尾（Larussa），或确认弹层中最后一枚唯一填色的红钮，弹层给替代方案 + 加粗关键名词与期限的后果说明（Telegram）。\u003c/li>\n\u003cli>控件选择规则：二值 → 开关；对立二选一 → 分段按钮；&gt;2 互斥 → 单选列表；多选 → 复选框 + 保存；范围 → 滑杆；状态差异不能只靠颜色，开态加勾号或形状差异（HIG Toggles、M3 Switch、Android）。\u003c/li>\n\u003c/ol>\n\u003ch3>draft-motion-settings.md\u003c/h3>\n\u003col>\n\u003cli>开关：颜色先于位移、图标最后落定，三层节奏总时长 80–100ms；开态柄放大并带对勾、关态柄小无图标；表现型过冲只给开态且 ≤ 2px（SM01）。\u003c/li>\n\u003cli>分段控件：新旧两段同时交叉变化，图标在原位变成对勾、文字不动，100–150ms 完成；按压涟漪独立于选中态，可持续到 250ms（SM08）。\u003c/li>\n\u003cli>底部面板拖拽：拖动中用「下一状态才有的控件淡入」预览结果；过阈值或甩动 ≤ 200ms 直接离场；取消 = 控件淡出 + 面板回位、不弹跳；背景只压暗不缩放；面板与附属控件的消失可错开约 300ms（SM02）。\u003c/li>\n\u003cli>列表行滑动：动作区按「色条 → 图标 → 文字」渐进露出，或按 44／88px 逐个淡入动作钮（scale 0.75→1）；58px 或行宽约 55% 为提交阈值，到阈值时图标涟漪 + 动作区换色；关闭动量、松手只落在吸附点；未过阈值回弹允许 2–3px 过冲；执行后行高收缩消失 + 目标分组同步更新 + toast 携带撤销（SM05、SM07）。\u003c/li>\n\u003cli>保存序列：父页内容先更新，编辑面板再用 150–250ms 下滑离场，用内容变化代替成功 toast；主按钮只在存在未应用更改时出现；二级页按同一节奏层层退回（SM04、SM06）。\u003c/li>\n\u003cli>主题／外观：选择即整页（或页头 + 示例卡）预览，不等应用；应用后在页面内留下可点的确认记录；取消回滚到进入时状态（SM04）。\u003c/li>\n\u003cli>推入／返回：iOS 新页右入 + 父页左退 1/3 并压暗，返回从 −1/3 亮起滑回；Android 用 fade-through；返回 200–300ms 且不长于推入；父页滚动位置与高亮行保持（SM03）。\u003c/li>\n\u003cli>撤销窗口：本轮未取得专门动态证据；暂按 SM05 的 toast 停留 ≥ 1.5s 与 M3 snackbar「带动作的 snackbar 应等待用户操作」规则，建议撤销 toast 3–5s 且不自动叠加（下一轮补证）。\u003c/li>\n\u003c/ol>\n\u003ch3>draft-editorial-designer-settings.md\u003c/h3>\n\u003col>\n\u003cli>层级靠记号不靠缩进：IDEA 的「Chapter 标签 → 章题 → 条目 → 署名」、字誌的「▌／【】／[ ]」——设置的三级分组用小标签、方头括号、方括号区分，同一列表里不缩进。\u003c/li>\n\u003cli>元数据写进条目本身，不做时间分组标题：Eye 索引 110 期每格自带「Summer 2026」；记录归档每条自带日期，不加「2026 年」分隔行。\u003c/li>\n\u003cli>状态只用三个词、只给状态词上色：Eye 的 Buy issue / Low stock / sold out；Helmut Lang 的橙色只出现在闭合件上——设置页只有开态与编辑态用品牌色。\u003c/li>\n\u003cli>标签 = 固定方式而非文字：Margiela 的空白标与四针白线——「已归档／已固定」用四角钉点表示，识别信息写在旁边；边缘循环小字「产地 ✕ 原料 ✕ 品质」做卡片边缘的元数据。\u003c/li>\n\u003cli>二级层每层都能独立成立：Yohji SS99 层层脱下仍是完整一件；折叠面板收起时露一条里层的边（1 行预览）。\u003c/li>\n\u003cli>口袋是外挂箱体：Rick Owens 的箱形袋挂在腰带上、Craig Green 的布袋吊在木框上——可折叠区块做成挂在父级上的独立模块，由一条「带子」（标题行）固定；多个开关用同一种控件形状。\u003c/li>\n\u003cli>版权页十行 = 「关于」页：Emigre 版权页的编辑／校对／地址／印数／印次行／ISBN 对应版本／构建号／团队／邮箱／备案号；目录「页码左、标题常规、作者斜体缩进」对应设置条目三段式。\u003c/li>\n\u003cli>长说明段的展开控件放段末：字誌的「展開／收合」在段末，V&amp;A 的「Read more ⊕」在截断处——权限、隐私说明用段末展开，不在标题行放箭头。\u003c/li>\n\u003c/ol>\n\u003ch2>五、每套映射\u003c/h2>\n\u003cp>见 \u003ccode>settings/spec/concept-refs.md\u003c/code>（每套 5–8 例，跨 ≥3 类）。\u003c/p>","limits":"\u003cp>（本次构建未包含）\u003c/p>"};window.__JUS_BUILT="2026-10-17T19:17:58.147Z";</script>

<body>
<header class="top">
  <div class="brand"><span class="brand-ju">JU</span><span class="brand-t">设置 · 十套视觉与动效方案</span></div>
  <nav class="tabs" aria-label="评审视图">
    <button type="button" class="tab on" data-view="overview">总览</button>
    <button type="button" class="tab" data-view="concept">方案</button>
    <button type="button" class="tab" data-view="compare">对比</button>
    <button type="button" class="tab" data-view="appendix">附录</button>
  </nav>
  <div class="top-right"><span class="hint">同一位用户 · 同一组活动与记录 · 每套数据独立 · 面板在手机画面外</span></div>
</header>
<main>
  <section class="view view-overview on" id="v-overview">
    <p class="lead">十套方案的真实首屏（左：设置首页 · 右：一处信息较密的二级页），按同一业务状态渲染。点击任意一套进入全尺寸操作。</p>
    <div class="ov-grid" id="ov-grid"></div>
  </section>
  <section class="view view-concept" id="v-concept">
    <aside class="rail" id="rail"></aside>
    <div class="stage-wrap" id="stage-wrap"></div>
  </section>
  <section class="view view-compare" id="v-compare">
    <div class="cmp-bar">
      <label>方案 A <select id="cmp-a"></select></label>
      <label>方案 B <select id="cmp-b"></select></label>
      <label>方案 C <select id="cmp-c"><option value="">（无）</option></select></label>
      <label>同一状态 <select id="cmp-state"></select></label>
      <button type="button" class="btn" id="cmp-apply">同时跳转</button>
      <button type="button" class="btn" id="cmp-reset">全部重置</button>
      <span class="sep"></span>
      <button type="button" class="btn" id="cmp-speed1">1×</button>
      <button type="button" class="btn" id="cmp-speed05">0.5×</button>
      <label class="chk"><input type="checkbox" id="cmp-panels"> 显示各套面板</label>
    </div>
    <div class="cmp-stages" id="cmp-stages"></div>
  </section>
  <section class="view view-appendix" id="v-appendix">
    <nav class="apx-nav">
      <button type="button" class="apx-tab on" data-doc="matrix">十套差异矩阵</button>
      <button type="button" class="apx-tab" data-doc="motions">核心动效分段</button>
      <button type="button" class="apx-tab" data-doc="coverage">功能与状态覆盖</button>
      <button type="button" class="apx-tab" data-doc="functions">功能归属表</button>
      <button type="button" class="apx-tab" data-doc="contract">跨模块状态契约</button>
      <button type="button" class="apx-tab" data-doc="mapping">参考映射</button>
      <button type="button" class="apx-tab" data-doc="ledger">研究台账</button>
      <button type="button" class="apx-tab" data-doc="limits">限制与证据</button>
    </nav>
    <article class="apx-doc" id="apx-doc"></article>
  </section>
</main>
<script>(function () {
  'use strict';
  var SRC = window.__JUS_SOURCES, META = window.__JUS_META, DOCS = window.__JUS_DOCS;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var views = { overview: $('#v-overview'), concept: $('#v-concept'), compare: $('#v-compare'), appendix: $('#v-appendix') };
  var mounts = { preview: {}, stage: {}, compare: {} };
  function mountConcept(kind, code, host, props) {
    var key = kind + ':' + code + ':' + (props && props.preset || '');
    if (mounts[kind][key]) return mounts[kind][key];
    var m = DCMini.mount(host, SRC[code], Object.assign({ panel: kind === 'stage' }, props || {}));
    mounts[kind][key] = m; return m;
  }
  function show(view) {
    Object.keys(views).forEach(function (k) { views[k].classList.toggle('on', k === view); });
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('on', t.dataset.view === view); });
    if (view === 'overview') buildOverview(); if (view === 'compare') buildCompare(); if (view === 'appendix') showDoc(currentDoc);
    try { history.replaceState(null, '', '#' + view + (view === 'concept' ? '/' + currentCode : '')); } catch (e) { }
  }
  document.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.view); }); });
  var ovBuilt = false;
  function buildOverview() {
    if (ovBuilt) return; ovBuilt = true;
    var grid = $('#ov-grid');
    if (!META.length) { grid.innerHTML = '<p class="lead">（本次构建不含任何方案源文件）</p>'; return; }
    META.forEach(function (c) {
      var card = document.createElement('div'); card.className = 'ov-card';
      card.innerHTML = '<div class="ov-head"><span class="ov-code">' + c.code + '</span><span class="ov-name">' + c.name + '</span></div><p class="ov-line">' + c.line + '</p>' +
        '<div class="ov-phones"><div class="ov-ph"><div class="ph-host" data-preset="home"></div><span class="ph-label">设置首页</span></div><div class="ov-ph"><div class="ph-host" data-preset="dense"></div><span class="ph-label">二级页</span></div></div>' +
        '<div class="ov-foot"><span>' + (c.motions || []).slice(0, 3).map(function (m) { return m.split('：')[0]; }).join(' · ') + '</span><button type="button" class="btn">进入操作</button></div>';
      card.addEventListener('click', function () { openConcept(c.code); });
      grid.appendChild(card);
      card.querySelectorAll('.ph-host').forEach(function (h) { h.classList.add('preview'); mountConcept('preview', c.code, h, { preset: h.dataset.preset, idle: true, panel: false, persist: false }); });
    });
  }
  var currentCode = META.length ? META[0].code : '';
  var rail = $('#rail'), stageWrap = $('#stage-wrap');
  META.forEach(function (c) { var b = document.createElement('button'); b.type = 'button'; b.innerHTML = '<span class="c">' + c.code + '</span>' + c.name; b.dataset.code = c.code; b.addEventListener('click', function () { openConcept(c.code); }); rail.appendChild(b); });
  function openConcept(code) {
    currentCode = code;
    rail.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.code === code); });
    var host = stageWrap.querySelector('[data-code="' + code + '"]');
    if (!host) { host = document.createElement('div'); host.className = 'stage-host'; host.dataset.code = code; stageWrap.appendChild(host); mountConcept('stage', code, host, { panel: true }); }
    stageWrap.querySelectorAll('.stage-host').forEach(function (h) { h.classList.toggle('on', h.dataset.code === code); });
    show('concept');
  }
  var cmpBuilt = false;
  function buildCompare() {
    if (cmpBuilt) return; cmpBuilt = true;
    ['cmp-a', 'cmp-b', 'cmp-c'].forEach(function (id, i) { var sel = $('#' + id); META.forEach(function (c) { var o = document.createElement('option'); o.value = c.code; o.textContent = c.code + ' ' + c.name; sel.appendChild(o); }); if (i < 2 && META[i]) sel.value = META[i].code; });
    var st = $('#cmp-state'); var idx = (window.JUS && JUS.INDEX) || [];
    idx.forEach(function (e) { var o = document.createElement('option'); o.value = e.key; o.textContent = e.group + ' · ' + e.label; st.appendChild(o); });
    function stages() { return Array.prototype.slice.call($('#cmp-stages').querySelectorAll('.cmp-host')); }
    function render() {
      var codes = ['cmp-a', 'cmp-b', 'cmp-c'].map(function (id) { return $('#' + id).value; }).filter(Boolean);
      var wrap = $('#cmp-stages'); wrap.innerHTML = '';
      codes.forEach(function (code) { var h = document.createElement('div'); h.className = 'cmp-host' + ($('#cmp-panels').checked ? '' : ' nopanel'); h.dataset.code = code; wrap.appendChild(h); var m = DCMini.mount(h, SRC[code], { panel: $('#cmp-panels').checked, persist: false }); h.__m = m; });
    }
    ['cmp-a', 'cmp-b', 'cmp-c', 'cmp-panels'].forEach(function (id) { $('#' + id).addEventListener('change', render); });
    $('#cmp-apply').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.jumpTo) i.jumpTo(st.value); }); });
    $('#cmp-reset').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.reset) i.reset(); }); });
    $('#cmp-speed1').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.setSpeed) i.setSpeed(1); }); });
    $('#cmp-speed05').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.setSpeed) i.setSpeed(0.5); }); });
    render();
  }
  var currentDoc = 'matrix';
  function showDoc(k) { currentDoc = k; document.querySelectorAll('.apx-tab').forEach(function (t) { t.classList.toggle('on', t.dataset.doc === k); }); $('#apx-doc').innerHTML = DOCS[k] || ''; }
  document.querySelectorAll('.apx-tab').forEach(function (t) { t.addEventListener('click', function () { showDoc(t.dataset.doc); }); });
  var hash = (location.hash || '').slice(1).split('/');
  if (hash[0] === 'concept' && SRC[hash[1]]) openConcept(hash[1]); else if (hash[0] && views[hash[0]]) show(hash[0]); else show('overview');
  window.JUShell = { openConcept: openConcept, show: show, mounts: mounts };
})();
</script>
