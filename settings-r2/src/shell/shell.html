<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JU 设置 R2 · 十个艺术指导方向</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style id="ju-fonts">/*@fonts*/</style>
<style>/*@shell-css*/</style>
<script>/*@preact*/</script>
<script>/*@runtime*/</script>
<script>/*@data*/</script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-ju">JU</span><span class="brand-t">设置 R2 · 十个艺术指导方向</span></div>
  <nav class="tabs" aria-label="评审视图">
    <button type="button" class="tab on" data-view="overview">总览</button>
    <button type="button" class="tab" data-view="concept">方案</button>
    <button type="button" class="tab" data-view="compare">对比</button>
    <button type="button" class="tab" data-view="appendix">附录</button>
  </nav>
  <div class="top-right"><span class="hint">同一位用户 · 同一组活动与记录 · 每套数据独立 · 评审工具都在手机画面外</span></div>
</header>
<main>
  <section class="view view-overview on" id="v-overview">
    <p class="lead">十套方案的真实画面，按同一业务状态渲染：设置首页 · 资料编辑 · 收藏列表 · 记录详情 · 保存失败。点击任意一套进入全尺寸操作（评审面板在手机外）。</p>
    <div class="ov-grid" id="ov-grid"></div>
  </section>
  <section class="view view-concept" id="v-concept">
    <aside class="rail" id="rail"></aside>
    <div class="stage-wrap" id="stage-wrap"></div>
  </section>
  <section class="view view-compare" id="v-compare">
    <div class="cmp-bar">
      <label>范围 <select id="cmp-scope"><option value="all">全部十套</option><option value="pick">挑选三套</option></select></label>
      <label class="pick">A <select id="cmp-a"></select></label>
      <label class="pick">B <select id="cmp-b"></select></label>
      <label class="pick">C <select id="cmp-c"><option value="">（无）</option></select></label>
      <label>同一状态 <select id="cmp-state"></select></label>
      <button type="button" class="btn" id="cmp-apply">同时跳转</button>
      <button type="button" class="btn" id="cmp-reset">全部重置</button>
      <span class="sep"></span>
      <label>尺寸 <select id="cmp-size"><option value="390,844">390×844</option><option value="375,812">375×812</option><option value="430,932">430×932</option></select></label>
      <button type="button" class="btn" id="cmp-speed1">1×</button>
      <button type="button" class="btn" id="cmp-speed05">0.5×</button>
      <label class="chk"><input type="checkbox" id="cmp-anon" checked> 隐去名称</label>
      <label class="chk"><input type="checkbox" id="cmp-gray"> 灰度检查</label>
      <label class="chk"><input type="checkbox" id="cmp-rm"> 减少动态</label>
      <label class="chk"><input type="checkbox" id="cmp-panels"> 显示各套面板</label>
    </div>
    <p class="lead cmp-lead">差异三道检查：同尺寸、同数据、隐去名称并排；临时灰度确认差异不只来自颜色；用「同一状态」切到同一段流程比较空间与编排。</p>
    <div class="cmp-stages" id="cmp-stages"></div>
  </section>
  <section class="view view-appendix" id="v-appendix">
    <nav class="apx-nav">
      <button type="button" class="apx-tab on" data-doc="matrix">十套差异矩阵</button>
      <button type="button" class="apx-tab" data-doc="refs">真实参考与转译</button>
      <button type="button" class="apx-tab" data-doc="mapping">功能状态对照</button>
      <button type="button" class="apx-tab" data-doc="verification">实际验收记录</button>
      <button type="button" class="apx-tab" data-doc="observations">基准实看记录</button>
      <button type="button" class="apx-tab" data-doc="contract">跨模块状态契约</button>
      <button type="button" class="apx-tab" data-doc="ledger">研究台账</button>
      <button type="button" class="apx-tab" data-doc="limits">限制与未验证项</button>
    </nav>
    <article class="apx-doc" id="apx-doc"></article>
  </section>
</main>
<script>/*@shell-js*/</script>
</body>
</html>
