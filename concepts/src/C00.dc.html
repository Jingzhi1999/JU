<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C00 管线测试</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
/* @panel-css */
.app{position:absolute;inset:0;background:#f4f1ea;font-family:"Noto Sans SC",sans-serif;padding:60px 20px 20px;--k:1}
.app h1{margin:0 0 12px;font-size:26px;font-weight:500}
.seg{display:flex;gap:6px;margin-bottom:16px}
.seg button{flex:1;padding:10px;border:1px solid #ccc;background:#fff;border-radius:10px;font:inherit}
.seg button.on{background:#141416;color:#fff}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;transition:transform calc(500ms * var(--k)) cubic-bezier(.2,.8,.2,1);display:block;width:100%;text-align:left;border:0;font:inherit}
.card.open{transform:translateY(-6px) scale(1.03)}
.app.rm *{transition-duration:1ms!important;animation-duration:1ms!important}
.fxlab{margin-top:14px}
.fxrow{display:flex;gap:6px;margin-bottom:8px}.fxrow button{padding:6px 10px;border:1px solid #999;background:#fff;border-radius:8px;font:inherit}
.slot{height:6px;border-radius:3px;background:linear-gradient(#5a554d,#2b2824);box-shadow:0 1px 0 #fff}
.tk-printer{height:190px;margin-top:-2px}
.tk{position:absolute;left:12px;right:12px;top:0;height:180px;border-radius:6px;--fx-reach:420px}
.tk.printing{animation:fx-print calc(var(--fx-dur) * var(--k,1)) linear forwards;--fx-dur:2000ms;-webkit-mask:linear-gradient(#000 var(--fx-ink),transparent calc(var(--fx-ink) + 8%));mask:linear-gradient(#000 var(--fx-ink),transparent calc(var(--fx-ink) + 8%))}
.tk.printing .fx-side,.tk.printing .fx-edge{pointer-events:none}
.face{position:absolute;inset:0;background:#fbf7ee;border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.12),0 6px 14px -8px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;font-size:13px}
.face-main{padding:14px 16px;display:flex;flex-direction:column;gap:4px}.face-main b{font-size:17px}.face-main .code{font-family:"DM Mono",monospace;color:#666;font-size:12px}
.face-stub{height:46px;border-top:1px dashed #b9b1a3;display:flex;align-items:center;padding:0 16px;color:#7a7268;font-size:12px}
.tk.torn .fx-side.keep .face-stub{opacity:0}
.fxinfo{font-size:12px;color:#777}
.app{overflow:hidden}
.backdrop{position:absolute;inset:0;background:rgba(20,18,14,0);transition:background calc(380ms * var(--k,1)) ease}
.backdrop.in{background:rgba(20,18,14,.35)}
.detail{position:absolute;left:0;top:0;width:350px;height:120px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 20px 40px -20px rgba(0,0,0,.5);transform-origin:0 0;transition:transform calc(420ms * var(--k,1)) cubic-bezier(.2,.8,.2,1),border-radius calc(420ms * var(--k,1)),opacity calc(240ms * var(--k,1));overflow:hidden;display:flex;flex-direction:column}
.detail-head{padding:14px;display:flex;flex-direction:column;gap:4px;font-size:14px;flex:0 0 auto}
.detail-head b{font-size:20px;line-height:1.3}
.detail-body{padding:14px;opacity:0;transition:opacity calc(240ms * var(--k,1)) ease calc(160ms * var(--k,1))}
.detail.in .detail-body{opacity:1}
.detail.in{border-radius:0}
.detail-body .back{margin-top:12px;padding:8px 14px;border:1px solid #999;border-radius:8px;background:#fff;font:inherit}
</style>
</helmet>
<div class="ju-stage">
  <div class="ju-phone">
    <div class="app{{panel.rootCls}}" style="--k:{{panel.k}}" ref="{{rootRef}}">
      <h1>我的局 · {{roleLabel}}</h1>
      <div class="seg"><button type="button" class="{{joinedOn}}" onClick="{{toJoined}}">我参加的</button><button type="button" class="{{hostedOn}}" onClick="{{toHosted}}">我发起的</button></div>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><p>还没有局。</p></sc-if>
      <sc-for list="{{events}}" as="e" hint-placeholder-count="2"><button type="button" class="card {{e.cls}}" data-id="{{e.id}}" onClick="{{e.open}}"><b>{{e.title}}</b><br>{{e.when}} · {{e.place}}</button></sc-for>
      <sc-if value="{{detail.on}}" hint-placeholder-val="{{false}}">
        <div class="backdrop {{detail.phase}}" onClick="{{detail.close}}"></div>
        <div class="detail {{detail.phase}}" style="{{detail.style}}" onTransitionEnd="{{detail.settled}}">
          <div class="detail-head"><b>{{detail.title}}</b><span>{{detail.when}} · {{detail.place}}</span></div>
          <div class="detail-body"><p>这里是局内详情：成员、约定、票件……</p><button type="button" class="back" onClick="{{detail.close}}">返回</button></div>
        </div>
      </sc-if>
      <div class="fxlab">
        <div class="fxrow"><button type="button" onClick="{{doPrint}}">出票</button><button type="button" onClick="{{doBurn}}">燃烧</button><button type="button" onClick="{{doReset}}">复位</button></div>
        <div class="slot"></div>
        <div class="fx-printer tk-printer">
          <div class="tk fx-tear fx-burn {{tkCls}}" style="--fx-dur:{{burnDur}}ms;--p:{{tear.p}};--fx-mask:url(#hole-c00)">
            <div class="fx-side keep" style="clip-path:{{tear.keep}}"><div class="face"><div class="face-main"><b>法拉盛饺子局</b><span>周六 12.19 · 20:30 · 法拉盛</span><span class="code">JU-0427 · 第 5 席</span></div><div class="face-stub">存根 · 撕下联系局主</div></div></div>
            <div class="fx-edge keep" style="clip-path:{{tear.edge}}"></div>
            <svg class="fx-burn-svg" viewBox="0 0 342 180" preserveAspectRatio="none" aria-hidden="true"><defs><mask id="hole-c00" maskUnits="userSpaceOnUse" x="0" y="0" width="342" height="180"><rect width="342" height="180" fill="#fff"></rect><circle class="fx-hole" cx="100" cy="130" r="0" fill="#000" filter="url(#fx-rough-strong)"></circle></mask></defs><circle class="fx-ember" cx="100" cy="130" r="0" fill="none" stroke="url(#fx-ember-lin)" filter="url(#fx-rough-strong)"></circle></svg>
            <div class="fx-side stub {{stubCls}}" style="clip-path:{{tear.stub}};transform:{{tear.stubTf}}" onPointerDown="{{tearDown}}" onPointerMove="{{tearMove}}" onPointerUp="{{tearUp}}" onPointerCancel="{{tearUp}}"><div class="face"><div class="face-main"><b>法拉盛饺子局</b><span>周六 12.19 · 20:30 · 法拉盛</span><span class="code">JU-0427 · 第 5 席</span></div><div class="face-stub">存根 · 撕下联系局主</div></div></div>
          </div>
        </div>
        <p class="fxinfo">{{fxInfo}}</p>
      </div>
    </div>
    <!-- @fx-svg -->
  </div>
  <!-- @panel -->
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"panel":{"editor":"boolean","default":true},"preset":{"editor":"enum","options":["joined","hosted"],"default":"joined"},"idle":{"editor":"boolean","default":false},"$preview":{"width":780,"height":884}}'>
/* @core */
class Component extends DCLogic {
  constructor(p) { super(p); this.reviewInit(CONCEPT); if (p.preset === 'hosted') this.state.role = 'hosted'; }
  initialState(variant) { return { variant: variant, role: 'joined', section: 'current', data: JU.data(variant), view: { name: 'list' }, openId: null, fx: 'idle', tearP: 0, tearDrag: null, detail: null }; }
  /* FLIP: detail layer starts at the card's rect (scale/translate from full size), then transitions to the phone's full rect */
  openDetail(ev, e) {
    const root = this.rootRef.current; const r = JU.fx.rectIn(ev.currentTarget, root);
    const W = root.clientWidth, Hh = root.clientHeight;
    this.setState({ detail: { id: e.id, phase: 'start', from: r } });
    this.after(16, () => this.setState(s => ({ detail: Object.assign({}, s.detail, { phase: 'in' }) })));
  }
  closeDetail() {
    const root = this.rootRef.current; const card = root.querySelector('.card[data-id="' + this.state.detail.id + '"]');
    const r = card ? JU.fx.rectIn(card, root) : null;
    this.setState(s => ({ detail: Object.assign({}, s.detail, { phase: 'out', from: r || s.detail.from }) }));
    this.after(430, () => this.setState({ detail: null }));
  }
  detailVals() {
    const d = this.state.detail; if (!d) return { on: false };
    const root = this.rootRef.current; const W = root ? root.clientWidth : 390, Hh = root ? root.clientHeight : 844;
    const row = JU.derive.joined(this.state.data).current.find(x => x.id === d.id) || { event: {}, when: {}, place: {} };
    const full = 'transform:translate(0px,0px) scale(1,1);width:' + W + 'px;height:' + Hh + 'px';
    const at = 'transform:translate(' + d.from.x + 'px,' + d.from.y + 'px) scale(' + (d.from.w / W) + ',' + (d.from.h / Hh) + ');width:' + W + 'px;height:' + Hh + 'px';
    return { on: true, phase: d.phase, style: d.phase === 'in' ? full : at, title: row.event.title, when: row.when.zh, place: row.place.hood, close: () => this.closeDetail(), settled: () => {} };
  }
  tearVals() {
    const W = 342, H = 180, Y = 134, prof = this._prof || (this._prof = JU.fx.tearProfile(28, 4, 11));
    const p = this.state.tearP, done = this.state.fx === 'torn' || this.state.fx === 'burning' || this.state.fx === 'burnt';
    const prog = done ? 1 : p, gap = done ? 0 : p * 10;
    // the seam is at Y: keep = main (above), stub = bottom part; use vertical orientation flipped: compute with H-Y trick by mirroring
    const keep = JU.fx.tearClip({ w: W, h: H, y: Y, profile: prof, progress: prog, side: 'stub' });   // top part (main face) keeps
    const stub = JU.fx.tearClip({ w: W, h: H, y: Y, profile: prof, progress: prog, gap: 0, side: 'keep' }); // bottom stub
    const edge = JU.fx.tearClip({ w: W, h: H, y: Y, profile: prof, progress: prog, side: 'edge', edge: 1.5 });
    const ang = done ? 0 : -p * 9, dy = done ? 0 : p * 6;
    return { p, keep, stub, edge, stubTf: 'rotate(' + ang + 'deg) translate(' + (-p * 4) + 'px,' + dy + 'px)' };
  }
  renderVals() {
    const s = this.state;
    const panel = this.panelVals(); panel.show = this.props.panel !== false;
    const tear = this.tearVals();
    return {
      panel, roleLabel: s.role === 'joined' ? '我参加的' : '我发起的', joinedOn: s.role === 'joined' ? 'on' : '', hostedOn: s.role === 'hosted' ? 'on' : '',
      toJoined: () => this.setState({ role: 'joined' }), toHosted: () => this.setState({ role: 'hosted' }),
      empty: JU.derive.joined(s.data).current.length === 0,
      events: JU.derive.joined(s.data).current.slice(0, 4).map(r => ({ id: r.id, title: r.event.title, when: r.when.zh, place: r.place.hood, cls: s.detail && s.detail.id === r.id ? 'open' : '', open: (ev) => this.motion('open-card', () => this.openDetail(ev, r)) })),
      detail: this.detailVals(), rootRef: this.rootRef,
      tear, tkCls: (s.fx === 'printing' ? 'printing ' : '') + (s.fx === 'burning' ? 'burning ' : '') + (s.fx === 'burnt' ? 'burnt ' : '') + (s.fx === 'torn' ? 'torn' : ''),
      stubCls: s.fx === 'torn' || s.fx === 'burning' || s.fx === 'burnt' ? 'off' : '',
      burnDur: 2600, fxInfo: 'fx=' + s.fx + ' tearP=' + s.tearP.toFixed(2),
      doPrint: () => this.motion('print', () => { this.setState({ fx: 'printing', tearP: 0 }); this.after(2000, () => this.setState({ fx: 'printed' })); }),
      doBurn: () => this.motion('burn', () => { this.setState({ fx: 'burning' }); this.after(2600, () => this.setState({ fx: 'burnt' })); }),
      doReset: () => this.setState({ fx: 'idle', tearP: 0 }),
      tearDown: (ev) => { if (s.fx === 'printing' || s.fx === 'torn') return; ev.currentTarget.setPointerCapture && ev.currentTarget.setPointerCapture(ev.pointerId); this.setState({ tearDrag: { x: ev.clientX, y: ev.clientY } }); },
      tearMove: (ev) => { const d = this.state.tearDrag; if (!d) return; const p = Math.max(0, Math.min(1, ((ev.clientX - d.x) * -1 + (ev.clientY - d.y) * 1.2) / 160)); this.setState({ tearP: p }); },
      tearUp: () => { const d = this.state.tearDrag; if (!d) return; if (this.state.tearP >= 0.55) this.motion('tear', () => this.setState({ fx: 'torn', tearDrag: null, tearP: 1 })); else this.setState({ tearDrag: null, tearP: 0 }); }
    };
  }
}
JU.mixin(Component);
</script>
</body>
</html>
