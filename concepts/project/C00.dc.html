<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C00 管线测试</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
/* shared review panel — lives outside the phone frame, never inside the product UI */
.ju-stage{display:flex;align-items:flex-start;gap:28px;padding:20px;box-sizing:border-box;background:#e9e9ec;font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;width:780px;min-height:884px}
.ju-phone{width:390px;height:844px;flex:0 0 390px;position:relative;overflow:hidden;border-radius:38px;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 20px 50px -24px rgba(0,0,0,.45);background:#000;contain:layout paint}
.ju-panel{flex:1 1 auto;min-width:0;max-height:844px;overflow:auto;background:#f6f6f7;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:14px 14px 18px;color:#1c1c1e;font-size:12px;line-height:1.5;box-sizing:border-box}
.ju-panel-head{display:flex;align-items:baseline;gap:8px}
.ju-panel-code{font:600 11px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.08em;color:#6b6b70}
.ju-panel-name{font-size:15px;font-weight:600}
.ju-panel-line{margin:4px 0 10px;color:#55555a}
.ju-panel-sec{font:600 10px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.12em;color:#8a8a90;margin:14px 0 6px;text-transform:uppercase}
.ju-panel-row{display:flex;flex-wrap:wrap;gap:6px}
.ju-btn{appearance:none;border:1px solid rgba(0,0,0,.14);background:#fff;color:#1c1c1e;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;line-height:1.2;cursor:pointer;min-height:30px}
.ju-btn.on{background:#1c1c1e;color:#fff;border-color:#1c1c1e}
.ju-btn-mini{padding:4px 8px;min-height:24px}
.ju-btn-replay{border-style:dashed}
.ju-btn-reset{border-color:#c2364c;color:#c2364c}
.ju-scrub{display:flex;align-items:center;gap:8px;margin-top:8px;color:#55555a}
.ju-scrub input{flex:1 1 auto;min-width:0}
.ju-idx-group{margin-bottom:8px}
.ju-idx-title{font-size:11px;color:#8a8a90;margin-bottom:4px}
.ju-idx-list{display:flex;flex-wrap:wrap;gap:4px}
.ju-idx{appearance:none;border:1px solid rgba(0,0,0,.1);background:#fff;border-radius:6px;padding:4px 8px;font:inherit;font-size:11.5px;line-height:1.3;cursor:pointer;color:#2c2c30;min-height:26px}
.ju-idx.on{background:#4a5ad6;border-color:#4a5ad6;color:#fff}
.ju-motions{margin:0;padding-left:18px;color:#2c2c30}
.ju-motions li{margin-bottom:4px}
.ju-panel-notes{margin:10px 0 0;color:#55555a;white-space:pre-line}

/* ju-fx.css — shared effect primitives. Concepts override colours, edges, durations and composition.
   All durations multiply by --k (1 = normal, 2 = 0.5× speed); .scrub holds animations at --frame (0..1). */
@property --fx-r { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
@property --fx-ink { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
/* ---- burn (v2): the face is masked by an SVG hole whose edge is roughened by feTurbulence (text stays crisp);
   an SVG overlay strokes the ember ring just outside the hole. Markup pattern (ids must be unique per ticket):
   <div class="fx-burn burning" style="--fx-mask:url(#hole-ID)"> …face…
     <svg class="fx-burn-svg" viewBox="0 0 W H" preserveAspectRatio="none"><defs><mask id="hole-ID" maskUnits="userSpaceOnUse" x="0" y="0" width="W" height="H"><rect width="W" height="H" fill="#fff"/><circle class="fx-hole" cx="X" cy="Y" r="0" fill="#000" filter="url(#fx-rough-strong)"/></mask></defs>
       <circle class="fx-ember" cx="X" cy="Y" r="0" fill="none" stroke="url(#fx-ember-grad)" filter="url(#fx-rough-strong)"/></svg></div>
   W/H in px of the face; --fx-reach = the radius that clears the whole face (≈ diagonal). ---- */
.fx-burn{position:relative;--fx-dur:2600ms;--fx-reach:520px}
.fx-burn .fx-burn-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.fx-burn .fx-hole,.fx-burn .fx-ember{r:0}
.fx-burn.burning{-webkit-mask:var(--fx-mask);mask:var(--fx-mask)}
.fx-burn.burning .fx-hole{animation:fx-hole calc(var(--fx-dur) * var(--k,1)) cubic-bezier(.3,.05,.55,1) forwards}
.fx-burn.burning .fx-ember{stroke-width:14px;animation:fx-hole calc(var(--fx-dur) * var(--k,1)) cubic-bezier(.3,.05,.55,1) forwards,fx-ember-fade calc(var(--fx-dur) * var(--k,1)) linear forwards}
.fx-burn.burnt{opacity:0;visibility:hidden}
@keyframes fx-hole{0%{r:0}10%{r:calc(var(--fx-reach) * .05)}100%{r:var(--fx-reach)}}
@keyframes fx-ember-fade{0%{opacity:1}85%{opacity:1}100%{opacity:0}}
.scrub .fx-burn.burning .fx-hole,.scrub .fx-burn.burning .fx-ember{animation-play-state:paused!important;animation-delay:calc(-1 * var(--frame,0) * var(--fx-dur) * var(--k,1))!important}
/* ---- print: paper emerges from a slot in roller steps; ink is revealed slightly behind the leading edge ---- */
.fx-printer{position:relative;overflow:hidden}
.fx-print-paper{--fx-dur:2000ms;transform:translateY(-102%);animation:fx-print calc(var(--fx-dur) * var(--k,1)) linear forwards;-webkit-mask:linear-gradient(#000 var(--fx-ink),transparent calc(var(--fx-ink) + 8%));mask:linear-gradient(#000 var(--fx-ink),transparent calc(var(--fx-ink) + 8%))}
@keyframes fx-print{0%{transform:translateY(-102%);--fx-ink:0%}14%{transform:translateY(-86%);--fx-ink:12%}22%{transform:translateY(-84%);--fx-ink:16%}40%{transform:translateY(-52%);--fx-ink:46%}48%{transform:translateY(-50%);--fx-ink:50%}70%{transform:translateY(-12%);--fx-ink:84%}78%{transform:translateY(-10%);--fx-ink:88%}92%{transform:translateY(1.5%);--fx-ink:100%}100%{transform:translateY(0);--fx-ink:110%}}
.scrub .fx-print-paper{animation-play-state:paused!important;animation-delay:calc(-1 * var(--frame,0) * var(--fx-dur) * var(--k,1))!important}
/* ---- stamp: ink lands from above with a small overshoot; a bleed blur settles ---- */
.fx-stamp{--fx-dur:520ms;animation:fx-stamp calc(var(--fx-dur) * var(--k,1)) cubic-bezier(.2,1.2,.3,1) both;transform-origin:50% 50%}
@keyframes fx-stamp{0%{transform:scale(1.8) rotate(-8deg);opacity:0;filter:blur(2px)}55%{transform:scale(.96) rotate(1deg);opacity:1;filter:blur(0)}100%{transform:scale(1) rotate(0)}}
/* ---- tear: two copies of the same face, each clipped by the seam polygon; the stub pivots on its attached end ---- */
.fx-tear{position:relative}
.fx-tear .fx-side{position:absolute;inset:0;will-change:clip-path,transform}
.fx-tear .fx-side.stub{transform-origin:100% 0}
.fx-tear .fx-edge{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:.9;filter:blur(.4px)}
.fx-tear .fx-side.stub.off{transition:transform calc(700ms * var(--k,1)) cubic-bezier(.4,0,.8,.4),opacity calc(500ms * var(--k,1)) ease-in calc(250ms * var(--k,1));transform:translate(-36px,140px) rotate(-28deg);opacity:0}
/* ---- ash / fragments ---- */
.fx-ash{position:absolute;width:6px;height:6px;border-radius:40% 60% 50% 50%;background:#3b2a20;opacity:0;pointer-events:none}
.fx-ash.fall{animation:fx-ash calc(1400ms * var(--k,1)) ease-in forwards}
@keyframes fx-ash{0%{opacity:.9;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx,0),var(--dy,80px)) rotate(var(--rot,90deg))}}
/* ---- global review states ---- */
.rm *,.rm *::before,.rm *::after{transition-duration:1ms!important;animation-duration:1ms!important;animation-delay:0ms!important}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}

.app{position:absolute;inset:0;background:#f4f1ea;font-family:"Noto Sans SC",sans-serif;padding:60px 20px 20px;--k:1}
.app h1{margin:0 0 12px;font-size:26px;font-weight:500}
.seg{display:flex;gap:6px;margin-bottom:16px}
.seg button{flex:1;padding:10px;border:1px solid #ccc;background:#fff;border-radius:10px;font:inherit}
.seg button.on{background:#141416;color:#fff}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;transition:transform calc(500ms * var(--k)) cubic-bezier(.2,.8,.2,1);display:block;width:100%;text-align:left;border:0;font:inherit}
.card.open{transform:translateY(-6px) scale(1.03)}
.app.rm *{transition-duration:1ms!important;animation-duration:1ms!important}
.fxlab{margin-top:14px}
.fxrow{display:flex;gap:6px;margin-bottom:8px}.fxrow button{padding:6px 10px;border:1px solid #999;background:#fff;border-radius:8px;font:inherit}
.slot{height:6px;border-radius:3px;background:linear-gradient(#5a554d,#2b2824);box-shadow:0 1px 0 #fff}
.tk-printer{height:190px;margin-top:-2px}
.tk{position:absolute;left:12px;right:12px;top:0;height:180px;border-radius:6px;--fx-reach:420px}
.tk.printing{animation:fx-print calc(var(--fx-dur) * var(--k,1)) linear forwards;--fx-dur:2000ms;-webkit-mask:linear-gradient(#000 var(--fx-ink),transparent calc(var(--fx-ink) + 8%));mask:linear-gradient(#000 var(--fx-ink),transparent calc(var(--fx-ink) + 8%))}
.tk.printing .fx-side,.tk.printing .fx-edge{pointer-events:none}
.face{position:absolute;inset:0;background:#fbf7ee;border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.12),0 6px 14px -8px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;font-size:13px}
.face-main{padding:14px 16px;display:flex;flex-direction:column;gap:4px}.face-main b{font-size:17px}.face-main .code{font-family:"DM Mono",monospace;color:#666;font-size:12px}
.face-stub{height:46px;border-top:1px dashed #b9b1a3;display:flex;align-items:center;padding:0 16px;color:#7a7268;font-size:12px}
.tk.torn .fx-side.keep .face-stub{opacity:0}
.fxinfo{font-size:12px;color:#777}
</style>
</helmet>
<div class="ju-stage">
  <div class="ju-phone">
    <div class="app{{panel.rootCls}}" style="--k:{{panel.k}}">
      <h1>我的局 · {{roleLabel}}</h1>
      <div class="seg"><button type="button" class="{{joinedOn}}" onClick="{{toJoined}}">我参加的</button><button type="button" class="{{hostedOn}}" onClick="{{toHosted}}">我发起的</button></div>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><p>还没有局。</p></sc-if>
      <sc-for list="{{events}}" as="e" hint-placeholder-count="2"><button type="button" class="card {{e.cls}}" onClick="{{e.open}}"><b>{{e.title}}</b><br>{{e.when}} · {{e.place}}</button></sc-for>
      <div class="fxlab">
        <div class="fxrow"><button type="button" onClick="{{doPrint}}">出票</button><button type="button" onClick="{{doBurn}}">燃烧</button><button type="button" onClick="{{doReset}}">复位</button></div>
        <div class="slot"></div>
        <div class="fx-printer tk-printer">
          <div class="tk fx-tear fx-burn {{tkCls}}" style="--fx-dur:{{burnDur}}ms;--p:{{tear.p}};--fx-mask:url(#hole-c00)">
            <div class="fx-side keep" style="clip-path:{{tear.keep}}"><div class="face"><div class="face-main"><b>法拉盛饺子局</b><span>周六 12.19 · 20:30 · 法拉盛</span><span class="code">JU-0427 · 第 5 席</span></div><div class="face-stub">存根 · 撕下联系局主</div></div></div>
            <div class="fx-edge keep" style="clip-path:{{tear.edge}}"></div>
            <svg class="fx-burn-svg" viewBox="0 0 342 180" preserveAspectRatio="none" aria-hidden="true"><defs><mask id="hole-c00" maskUnits="userSpaceOnUse" x="0" y="0" width="342" height="180"><rect width="342" height="180" fill="#fff"></rect><circle class="fx-hole" cx="100" cy="130" r="0" fill="#000" filter="url(#fx-rough-strong)"></circle></mask></defs><circle class="fx-ember" cx="100" cy="130" r="0" fill="none" stroke="url(#fx-ember-lin)" filter="url(#fx-rough-strong)"></circle></svg>
            <div class="fx-side stub {{stubCls}}" style="clip-path:{{tear.stub}};transform:{{tear.stubTf}}" onPointerDown="{{tearDown}}" onPointerMove="{{tearMove}}" onPointerUp="{{tearUp}}" onPointerCancel="{{tearUp}}"><div class="face"><div class="face-main"><b>法拉盛饺子局</b><span>周六 12.19 · 20:30 · 法拉盛</span><span class="code">JU-0427 · 第 5 席</span></div><div class="face-stub">存根 · 撕下联系局主</div></div></div>
          </div>
        </div>
        <p class="fxinfo">{{fxInfo}}</p>
      </div>
    </div>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="fx-rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="fx-rough-strong" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="fx-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2" result="g"/><feColorMatrix in="g" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0 .12 .18"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
<filter id="fx-ink"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
<radialGradient id="fx-ember-grad"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#2a1710"/></radialGradient>
<linearGradient id="fx-ember-lin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".45" stop-color="#ff5a1f"/><stop offset="1" stop-color="#2a1710"/></linearGradient>
</defs></svg>

  </div>
  <sc-if value="{{panel.show}}" hint-placeholder-val="{{true}}">
<aside class="ju-panel" aria-label="评审面板">
  <div class="ju-panel-head"><span class="ju-panel-code">{{panel.code}}</span><span class="ju-panel-name">{{panel.name}}</span></div>
  <p class="ju-panel-line">{{panel.line}}</p>
  <div class="ju-panel-sec">动效</div>
  <div class="ju-panel-row">
    <button type="button" class="ju-btn {{panel.speed1}}" onClick="{{panel.setSpeed1}}">1×</button>
    <button type="button" class="ju-btn {{panel.speedHalf}}" onClick="{{panel.setSpeedHalf}}">0.5×</button>
    <button type="button" class="ju-btn {{panel.pausedOn}}" onClick="{{panel.togglePause}}">暂停</button>
    <button type="button" class="ju-btn {{panel.rmOn}}" onClick="{{panel.toggleRM}}">减少动态</button>
    <button type="button" class="ju-btn ju-btn-replay" onClick="{{panel.replay}}">重播上一动效</button>
  </div>
  <label class="ju-scrub"><span>关键帧</span><input type="range" min="0" max="100" value="{{panel.scrub}}" onInput="{{panel.onScrub}}" onChange="{{panel.onScrub}}"><button type="button" class="ju-btn ju-btn-mini" onClick="{{panel.endScrub}}">释放</button></label>
  <div class="ju-panel-sec">状态索引</div>
  <sc-for list="{{panel.groups}}" as="g" hint-placeholder-count="3">
    <div class="ju-idx-group">
      <div class="ju-idx-title">{{g.title}}</div>
      <div class="ju-idx-list">
        <sc-for list="{{g.items}}" as="e" hint-placeholder-count="4"><button type="button" class="ju-idx {{e.cls}}" onClick="{{e.go}}">{{e.label}}</button></sc-for>
      </div>
    </div>
  </sc-for>
  <div class="ju-panel-sec">演示数据</div>
  <div class="ju-panel-row">
    <sc-for list="{{panel.variants}}" as="v" hint-placeholder-count="4"><button type="button" class="ju-btn {{v.cls}}" onClick="{{v.go}}">{{v.label}}</button></sc-for>
    <button type="button" class="ju-btn ju-btn-reset" onClick="{{panel.reset}}">重置本套</button>
  </div>
  <div class="ju-panel-sec">三个核心动作</div>
  <ol class="ju-motions"><sc-for list="{{panel.motions}}" as="m" hint-placeholder-count="3"><li>{{m}}</li></sc-for></ol>
  <p class="ju-panel-notes">{{panel.notes}}</p>
</aside>

</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"panel":{"editor":"boolean","default":true},"preset":{"editor":"enum","options":["joined","hosted"],"default":"joined"},"idle":{"editor":"boolean","default":false},"$preview":{"width":780,"height":884}}'>
