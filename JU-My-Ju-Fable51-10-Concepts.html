<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JU 我的局 · 十套视觉动效方案</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>:root{--bg:#ececef;--ink:#141416;--muted:#6b6b72;--line:rgba(0,0,0,.1);--paper:#fff;--accent:#4a5ad6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:24px;padding:10px 20px;background:rgba(236,236,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-ju{font:700 20px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.06em}
.brand-t{font-weight:500}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.06);padding:3px;border-radius:10px}
.tab{appearance:none;border:0;background:transparent;padding:6px 14px;border-radius:8px;font:inherit;cursor:pointer;color:var(--muted)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.top-right{margin-left:auto;color:var(--muted);font-size:12px}
main{min-height:calc(100vh - 54px)}
.view{display:none}.view.on{display:block}
.lead{margin:0;padding:18px 24px 6px;color:var(--muted);max-width:1100px}
/* overview */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:18px;padding:16px 24px 40px}
.ov-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s}
.ov-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px -18px rgba(0,0,0,.4)}
.ov-head{display:flex;align-items:baseline;gap:10px}
.ov-code{font:500 11px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--muted)}
.ov-name{font-size:17px;font-weight:600}
.ov-line{color:var(--muted);font-size:12.5px;margin:0}
.ov-phones{display:flex;gap:12px;justify-content:center}
.ov-ph{position:relative;width:195px;height:422px;overflow:hidden;border-radius:19px;background:#000;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.ov-ph .ph-host{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.ov-ph .ph-label{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px;pointer-events:none}
.ov-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.ov-foot .btn{padding:6px 12px}
/* concept view */
.view-concept{display:none;grid-template-columns:200px 1fr}
.view-concept.on{display:grid}
.rail{position:sticky;top:54px;align-self:start;height:calc(100vh - 54px);overflow:auto;padding:14px 10px;border-right:1px solid var(--line);background:rgba(255,255,255,.5)}
.rail button{display:block;width:100%;text-align:left;appearance:none;border:0;background:transparent;padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;color:var(--ink)}
.rail button .c{font:500 10px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--muted);display:block;margin-bottom:2px}
.rail button.on{background:var(--ink);color:#fff}.rail button.on .c{color:#bbb}
.stage-wrap{padding:16px 20px 40px;overflow:auto}
.stage-host{display:none}.stage-host.on{display:block}
/* compare */
.cmp-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.5)}
.cmp-bar label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.cmp-bar select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;max-width:260px}
.sep{width:1px;height:22px;background:var(--line)}
.btn{appearance:none;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cmp-stages{display:flex;gap:20px;padding:20px 24px 40px;overflow:auto;align-items:flex-start}
.cmp-host{flex:0 0 auto}
.cmp-host.nopanel{width:430px;overflow:hidden}
/* appendix */
.apx-nav{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px;border-bottom:1px solid var(--line)}
.apx-tab{appearance:none;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
.apx-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.apx-doc{max-width:1400px;padding:20px 24px 60px;font-size:13.5px}
.apx-doc h1{font-size:22px;margin:18px 0 10px}.apx-doc h2{font-size:18px;margin:26px 0 8px}.apx-doc h3{font-size:15px;margin:20px 0 6px}.apx-doc h4{font-size:14px;margin:16px 0 4px}
.apx-doc table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:12.5px;background:#fff}
.apx-doc th,.apx-doc td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.apx-doc th{background:#f3f3f5}
.apx-doc code{font-family:"DM Mono",ui-monospace,monospace;font-size:12px;background:rgba(0,0,0,.05);padding:1px 4px;border-radius:4px}
.apx-doc pre{background:#fff;border:1px solid var(--line);padding:10px;border-radius:8px;overflow:auto;font-size:12px}
.apx-doc a{color:var(--accent)}
.apx-doc p{margin:6px 0}
@media (max-width:900px){.view-concept.on{display:block}.rail{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}.rail button{width:auto}.top{gap:10px;flex-wrap:wrap}.top-right{display:none}}
</style>

<script>window.__JU_SOURCES={};window.__JU_META=[];window.__JU_DOCS={"ledger":"\u003cp>（本次构建未包含）\u003c/p>","matrix":"\u003ch1>「我的局」十套方向卡 · 差异矩阵\u003c/h1>\n\u003cp>每套先回答六件事：① 构图与信息组织 ② 字体与比例 ③ 组件构造 ④ 材质与光影 ⑤ 空间过渡 ⑥ 三个核心动作。任意两套至少在四个维度上有可见、可操作的区别。共享：同一份演示数据与业务引擎（\u003ccode>src/core/ju-data.js\u003c/code>）、同一评审面板。\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>编号\u003c/th>\u003cth>名称\u003c/th>\u003cth>一句话\u003c/th>\u003cth>灵感来源类型\u003c/th>\u003cth>信息组织\u003c/th>\u003cth>展开方式\u003c/th>\u003cth>票件形态\u003c/th>\u003cth>作废表现\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>C01\u003c/td>\u003ctd>票据卷\u003c/td>\u003ctd>整卷热敏纸上按时间打印出来的局，撕下来就是票\u003c/td>\u003ctd>真实物件（收据卷）\u003c/td>\u003ctd>一条连续纸带，按「要你回应→就快见面→还在等」顺序打印\u003c/td>\u003ctd>纸带原地走纸，详情接着打印出来\u003c/td>\u003ctd>热敏纸条，沿齿孔撕\u003c/td>\u003ctd>纸卷从起火点焦卷\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C02\u003c/td>\u003ctd>站牌\u003c/td>\u003ctd>车站翻牌显示板 + 过闸卡，状态翻一下就换\u003c/td>\u003ctd>机械物件（翻牌板 / 闸机）\u003c/td>\u003ctd>行式翻牌板：时间 · 局名 · 状态三栏\u003c/td>\u003ctd>行翻开成面板，牌面逐格翻出内容\u003c/td>\u003ctd>磁条卡（MetroCard 式）\u003c/td>\u003ctd>卡片过热焦黑、磁条断裂\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C03\u003c/td>\u003ctd>刊\u003c/td>\u003ctd>一本关于你周末的杂志：目录、跨页、撕下来的优惠券\u003c/td>\u003ctd>编辑设计（时装杂志）\u003c/td>\u003ctd>目录页：页码 + 大标题 + 眉注\u003c/td>\u003ctd>翻页：列表页翻到跨页\u003c/td>\u003ctd>杂志角上的撕角券（齿孔虚线）\u003c/td>\u003ctd>页角从一点烧穿、纸灰飘落\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C04\u003c/td>\u003ctd>夜玻璃\u003c/td>\u003ctd>夜里的层叠玻璃，近的清楚远的失焦\u003c/td>\u003ctd>原生数字（深度 / 折射）\u003c/td>\u003ctd>纵深堆叠的玻璃板，近 = 紧急\u003c/td>\u003ctd>玻璃板向前抬起，其余后退失焦\u003c/td>\u003ctd>全息通行证（光扫）\u003c/td>\u003ctd>玻璃裂纹扩散、碎片坠落\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C05\u003c/td>\u003ctd>缝线\u003c/td>\u003ctd>白坯布上的裁片、粉线与四针白标\u003c/td>\u003ctd>设计师作品（Margiela / Yohji / Ann D）\u003c/td>\u003ctd>裁片平铺在工作台，粉笔标记状态\u003c/td>\u003ctd>裁片沿折线翻开\u003c/td>\u003ctd>布标吊牌（线栓）\u003c/td>\u003ctd>布边烧焦起毛、灰线\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C06\u003c/td>\u003ctd>桌面\u003c/td>\u003ctd>摊在桌上的票、拍立得、便签，拿起来看\u003c/td>\u003ctd>真实空间（桌面物件）\u003c/td>\u003ctd>俯视桌面，物件重叠，最上面的最急\u003c/td>\u003ctd>物件被拿起、摆正、放大\u003c/td>\u003ctd>票根 + 回形针\u003c/td>\u003ctd>烟灰缸里烧成灰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C07\u003c/td>\u003ctd>格盘\u003c/td>\u003ctd>方格仪表盘：急的格子大，处理完就缩\u003c/td>\u003ctd>原生数字（模块网格）\u003c/td>\u003ctd>网格：格子大小 = 任务权重\u003c/td>\u003ctd>格子撑满网格，内部再分格\u003c/td>\u003ctd>通行证格（二维码）\u003c/td>\u003ctd>像素格逐块脱落\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C08\u003c/td>\u003ctd>时间尺\u003c/td>\u003ctd>一把竖着的时间尺，局是尺上的块\u003c/td>\u003ctd>原生数字（日程轴）\u003c/td>\u003ctd>时间轴 + 当前线，块长 = 时长\u003c/td>\u003ctd>块横向展开成详情，尺不动\u003c/td>\u003ctd>尺上的票块（打孔）\u003c/td>\u003ctd>块沿尺焦化、刻度留痕\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C09\u003c/td>\u003ctd>影印贴纸\u003c/td>\u003ctd>影印机的黑、荧光贴纸的亮，自己做的票\u003c/td>\u003ctd>青年印刷（zine / 贴纸）\u003c/td>\u003ctd>一页一页的 zine，贴纸标状态\u003c/td>\u003ctd>页面贴纸撕起露出下一层\u003c/td>\u003ctd>订书钉 DIY 票\u003c/td>\u003ctd>影印纸烧黑卷边\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C10\u003c/td>\u003ctd>胶片\u003c/td>\u003ctd>暗房里的底片条，显影出来才算数\u003c/td>\u003ctd>摄影物件（接触印样 / 暗房）\u003c/td>\u003ctd>横向胶片条，每格一局，曝光 = 状态\u003c/td>\u003ctd>格放大，像相纸显影\u003c/td>\u003ctd>底片格 + 红蜡笔\u003c/td>\u003ctd>胶片受热起泡熔穿\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>---\u003c/p>\n\u003ch2>C01 票据卷 Receipt Roll\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图与信息组织\u003c/strong>：整屏是一条 ~340px 宽的热敏纸带，从顶部出纸口打印出来。纸带按「要你回应 / 就快见面 / 还在等」分段，每段之间一条齿孔虚线。第一眼看纸带顶部的粗体局名与大号时间；第二眼看每条下方的一行状态（点阵字）。身份切换 = 两卷纸（参加 / 发起），切换时当前卷收回、另一卷走出。\u003c/li>\n\u003cli>\u003cstrong>字体与比例\u003c/strong>：局名 Noto Sans SC 500 20px；时间 DM Mono 28px（纸带上最大的字）；地点 14px；状态 12px 点阵感（DM Mono + letter-spacing）。纸宽固定，长标题自动折行，不缩小。\u003c/li>\n\u003cli>\u003cstrong>组件构造\u003c/strong>：局条 = 纸带上的一段打印（无边框，只有墨与齿孔）；票 = 纸带上有加粗边框的一截，可沿齿孔撕；名单 = 打印的表格（点线对齐）；弹层 = 另一小截纸从纸带侧面「贴」上去（便签）；按钮 = 打印的反白方块。\u003c/li>\n\u003cli>\u003cstrong>材质与光影\u003c/strong>：热敏纸 #f3efe6 带轻微横向纸纹，墨色 #1a1a1a 略有打印不均（filter: url(#fx-ink)）；出纸口有阴影与滚轴高光；撕下的纸有真实卷曲。\u003c/li>\n\u003cli>\u003cstrong>空间过渡\u003c/strong>：进入详情 = 纸带继续走纸，详情内容在该条下方被「打印」出来（上方内容不动，下方让位）；返回 = 纸带回卷。管理界面 = 局主的「工单」，同样是打印。\u003c/li>\n\u003cli>\u003cstrong>核心动作\u003c/strong>：① 出票：纸带走纸打印一张加粗边框的票（分三段走纸，有停顿）；② 撕票：从齿孔右端按住拖，渐进断裂，副券卷曲落下成「存根」堆在底部；③ 取消：局主确认后，纸带从该条起火，焦卷推进，剩余纸灰落入底栏，历史区出现一张焦边条目。\u003c/li>\n\u003c/ol>\n\u003ch2>C02 站牌 Departure Board\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：深色机械板，每局一行翻牌：左列 HH:MM（大），中列局名，右列状态牌（黄 / 白 / 红字）。顶部是两块身份牌「参加 / 发起」，切换时整板翻一遍。第一眼：时间列和黄牌状态；第二眼：局名。\u003c/li>\n\u003cli>\u003cstrong>字体\u003c/strong>：Unbounded 700（数字）+ Noto Sans SC 700（局名，翻牌内）；状态 Archivo Narrow 大写 + 中文。翻牌格字号统一 18px，行高固定 44px。\u003c/li>\n\u003cli>\u003cstrong>组件\u003c/strong>：翻牌行 = 一串分格翻片，每格可翻；票 = 磁条卡（圆角、磁条、打孔）；名单 = 侧板上的座位灯（亮 = 已确认，闪 = 预留，灭 = 空）；弹层 = 从板下方升起的操作面板（金属拨杆与按钮）。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：板面 #121417 带细噪点，翻片 #1d2024 有上下两半的受光差，字是喷漆白 / 黄；卡片是磨砂塑料。\u003c/li>\n\u003cli>\u003cstrong>空间过渡\u003c/strong>：行被点选后其他行翻成空白，该行向下「展开」成多行牌面显示详情；返回时牌面翻回列表。管理 = 侧面拉出的操作盘。\u003c/li>\n\u003cli>\u003cstrong>核心动作\u003c/strong>：① 状态翻牌：审核通过 / 改期 / 取消时，相应格一格格翻（带机械节奏与声感的抖动）；② 过闸撕票：把卡插入读卡槽，卡被吞入一半、读卡灯亮、吐出已撕（打孔）卡；③ 作废：取消后卡片在读卡槽里过热，磁条处焦黑、塑料起泡，最后牌面翻成「取消」。\u003c/li>\n\u003c/ol>\n\u003ch2>C03 刊 Editorial Spread\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：一本杂志。首屏是目录页：左上眉注「我的局 · 12 月」，大号局名纵列成目录条目，右侧页码。身份 = 两期（参加刊 / 发起刊）。第一眼：最大的那条目录（lead）；第二眼：页码与一行小字状态。\u003c/li>\n\u003cli>\u003cstrong>字体\u003c/strong>：Noto Serif SC 700（局名 26–34px）+ Noto Sans SC（正文 14px）+ Instrument Serif（页码、英文眉注）。严格的 4 列网格、字行对齐。\u003c/li>\n\u003cli>\u003cstrong>组件\u003c/strong>：目录条目 = 标题 + 引导点 + 页码；详情 = 跨页（左页图版：局卡；右页文字：时间地点成员）；票 = 页角的撕角券；名单 = 版面里的人物小传列表；弹层 = 夹在页间的纸条（校对条）。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：哑光铜版纸 #f7f5f0，墨 #111，一个红（校对红 #c8102e）；页面有书脊阴影与纸厚的边；翻页时有真实的折弯与背面透印。\u003c/li>\n\u003cli>\u003cstrong>空间过渡\u003c/strong>：从目录条目翻到对应跨页（3D 翻页，折线在书脊）；返回 = 翻回目录并落在原条目。管理 = 「编辑部」页面：申请是来稿，审核 = 红笔批注。\u003c/li>\n\u003cli>\u003cstrong>核心动作\u003c/strong>：① 翻页展开：目录条目被点时该行变成书签，页面从右向左翻开到跨页；② 撕券：从页角虚线撕下券（纸角翻起、撕裂、券飘落到页底「夹页」里）；③ 烧页：取消时跨页从一点烧穿，焦洞扩大、灰屑飘落，剩下焦边的页框留在目录里（历史 · 已取消）。\u003c/li>\n\u003c/ol>\n\u003ch2>C04 夜玻璃 Night Glass\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：深蓝黑夜色背景（静止，不循环），局是一块块层叠的毛玻璃板，按纵深排列：最近最清楚（要你回应），远的缩小并失焦。身份切换 = 两叠玻璃左右平移。第一眼：最前的玻璃板上的局名和倒计时；第二眼：后面的模糊板。\u003c/li>\n\u003cli>\u003cstrong>字体\u003c/strong>：Sora 600（数字、倒计时）+ Noto Sans SC 500（局名 22px）；中文用较大字距；状态用小号大写拉丁 + 中文并置。\u003c/li>\n\u003cli>\u003cstrong>组件\u003c/strong>：玻璃板（边缘高光、内部折射的背景色）；票 = 全息通行证（倾斜时光带扫过）；名单 = 玻璃板内的头像珠串；弹层 = 从底部升起的一块更厚的玻璃（更强的模糊）。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：backdrop-filter 模糊 + 边缘 1px 高光 + 内阴影；背景是几片静止的色彩光斑（不循环动画）。\u003c/li>\n\u003cli>\u003cstrong>空间过渡\u003c/strong>：点选的玻璃板向前抬起并放大到全屏，其余板后退并更模糊（景深）；返回 = 反向。管理 = 一块宽玻璃上的「控制台」胶囊。\u003c/li>\n\u003cli>\u003cstrong>核心动作\u003c/strong>：① 景深展开：板前移时其他板退后、模糊、变暗，有真实的视差；② 通行证撕票：通行证的副券部分是一层薄玻璃，拖动时裂开（裂纹沿齿孔），分离后碎片化消失；③ 玻璃作废：取消时通行证从一点起裂纹，裂纹扩散、碎片一块块坠落，剩下空框和裂缝，列表里的板变成暗色薄片归档。\u003c/li>\n\u003c/ol>\n\u003ch2>C05 缝线 Muslin &amp; Seams\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：白坯布工作台，局是摊开的裁片（不规则但克制的轮廓：直角 + 一处斜边），每片上有粉线划的局名与时间；状态是白布标（四针白线缝在角上）。身份 = 两张台（参加 / 发起）。第一眼：粉线写的局名；第二眼：布标上的小字。\u003c/li>\n\u003cli>\u003cstrong>字体\u003c/strong>：Noto Serif SC 300/500（局名 24px，疏朗）+ Cormorant（数字、英文）+ 手写粉线用 Zhi Mang Xing（仅标注）。留白比例大，但信息完整。\u003c/li>\n\u003cli>\u003cstrong>组件\u003c/strong>：裁片 = 米白布块（有布纹和轻微起伏的投影）；票 = 吊牌（硬卡纸 + 棉线 + 金属扣眼）；名单 = 粉笔画的记号表；弹层 = 一块翻起来的布角下面的内容。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：坯布纹理（feTurbulence 极细）、粉线（白色半透明笔触）、缝线（虚线 + 针脚阴影）、吊牌卡纸与棉线。只有一束光，从左上。\u003c/li>\n\u003cli>\u003cstrong>空间过渡\u003c/strong>：裁片沿折线翻开（3D 折），露出里面的内容；返回 = 折回。管理 = 「裁缝的订单簿」。\u003c/li>\n\u003cli>\u003cstrong>核心动作\u003c/strong>：① 翻开裁片：从点按点起折线，布料有重量地翻开并落平；② 剪线撕票：吊牌靠棉线栓在裁片上，拖动把线拉紧、绷断（线断口回弹），吊牌落到「存根袋」；③ 布面烧焦：取消时从一角烧起，布边起毛、焦黑、最后剩一圈灰线轮廓归档到历史。\u003c/li>\n\u003c/ol>\n\u003ch2>C06 桌面 Desk Objects\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：俯视一张桌面（深色木或毛毡），局是摊在上面的物件：票根、拍立得、便签、纸杯垫，物件之间有真实重叠与阴影；最急的在最上面且摆正，其他微微旋转。身份 = 桌面左右两半（或推开一叠换另一叠）。第一眼：摆正的那张；第二眼：下面露出一角的。\u003c/li>\n\u003cli>\u003cstrong>字体\u003c/strong>：Noto Sans SC 700（局名，手写标签感用 Ma Shan Zheng 只做批注）+ Space Mono（时间）。\u003c/li>\n\u003cli>\u003cstrong>组件\u003c/strong>：物件各有形态：票根（齿孔）、拍立得（白边 + 影像区）、便签（纸胶带贴着）、杯垫（圆形）；名单 = 一张名片堆；弹层 = 一张从桌边推进来的纸。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：桌面纹理、每个物件有厚度边与接触阴影；纸胶带半透明。\u003c/li>\n\u003cli>\u003cstrong>空间过渡\u003c/strong>：点物件 = 把它拿起来（阴影变大、摆正、放大到屏幕中央），其他物件退到桌面并变暗；放下 = 回到原位。管理 = 一块夹板（clipboard）。\u003c/li>\n\u003cli>\u003cstrong>核心动作\u003c/strong>：① 拿起 / 放下：带旋转校正与阴影变化的 FLIP；② 撕票：双指感：按住票根一角拖，沿齿孔撕开，副券落在桌面上留着（真实的「桌面上多了一片纸」）；③ 烟灰缸：取消时票根被丢进桌角烟灰缸，从角起燃，焦边推进，烧到最后只剩一撮灰和一片未燃尽的角，归档。\u003c/li>\n\u003c/ol>\n\u003ch2>C07 格盘 Bento Grid\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：方格仪表盘（浅灰底），每局一格，格子尺寸由任务权重决定：要你回应 = 2×2，就快见面 = 2×1，还在等 = 1×1；局主的待处理格最大并有数字。身份 = 两块盘横向滑动。第一眼：最大的格子里的局名与倒计时；第二眼：小格。\u003c/li>\n\u003cli>\u003cstrong>字体\u003c/strong>：Noto Sans SC 600（局名）+ DM Mono（数字、计数）；格内文字按格大小变级。\u003c/li>\n\u003cli>\u003cstrong>组件\u003c/strong>：格子（圆角 18px，纯色或双色）；票 = 通行证格（二维码 + 条）；名单 = 头像格阵；弹层 = 一个格子膨胀到底部的「操作盘」。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：平面但有层：格子有 1px 边与极浅的底影；颜色按分区（要你回应 = 暖橙、就快见面 = 青绿、还在等 = 灰蓝）。\u003c/li>\n\u003cli>\u003cstrong>空间过渡\u003c/strong>：格子 FLIP 膨胀到整盘并在内部分成子格（详情、成员、动作），其他格缩入边缘成导航条；返回 = 收回原格。管理 = 子格盘。\u003c/li>\n\u003cli>\u003cstrong>核心动作\u003c/strong>：① 格子重排：状态变化后格子尺寸改变，所有格子 FLIP 到新位置；② 像素撕票：通行证格的副券一列像素格被「刮」下来（拖动），格子一块块脱落；③ 像素作废：取消时通行证从一角开始逐块脱落、落下、变灰，剩下的格子碎片合成历史里的一个灰格。\u003c/li>\n\u003c/ol>\n\u003ch2>C08 时间尺 Timeline Ruler\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：一把竖直时间尺占左侧 56px（日期刻度 + 当前线），局是尺右侧的块：块的高度 = 时长，块的 y = 时间；今天的块更亮；状态用块的描边与填充区分（虚线 = 待审核，实线 = 已预留，填充 = 已确认，票状 = 已出票）。身份 = 两条尺并排切换。第一眼：当前线附近最近的块；第二眼：更远的块。\u003c/li>\n\u003cli>\u003cstrong>字体\u003c/strong>：Archivo Narrow（刻度数字）+ Noto Sans SC 500（局名 18px）；时间用尺上的刻度读，不重复写。\u003c/li>\n\u003cli>\u003cstrong>组件\u003c/strong>：时间块；票 = 块变成打孔的票（尺上的「打卡」）；名单 = 块内的座位格；弹层 = 块向右拉出的抽屉。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：扁平但有尺的物理感（刻度压印、当前线是红色细线）；块有极轻的投影。\u003c/li>\n\u003cli>\u003cstrong>空间过渡\u003c/strong>：点块 = 块横向展开占满右侧并向下伸展成详情，尺上的其他块缩成小标记；返回 = 收回。管理 = 块内展开的多层抽屉。\u003c/li>\n\u003cli>\u003cstrong>核心动作\u003c/strong>：① 改期滑动：接受新时间时，块沿尺滑到新位置，旧位置留一个淡影，新票在新位置打印；② 打卡撕票：块的右端有副券，向右拖出撕开；③ 尺上作废：取消时块从中间焦化（像烧过的尺子），残留一道焦痕刻在尺上，块本身滑入历史尺。\u003c/li>\n\u003c/ol>\n\u003ch2>C09 影印贴纸 Zine &amp; Stickers\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：一本 A5 zine，每页一局（可上下翻页，也可缩略为页阵）；页面是高反差影印质感，局名是大号黑体贴在页上，状态是荧光贴纸（撕得起来）。身份 = 两本 zine。第一眼：荧光贴纸与大字；第二眼：页脚手写时间地点。\u003c/li>\n\u003cli>\u003cstrong>字体\u003c/strong>：ZCOOL QingKe HuangYou（局名 36px）+ Noto Sans SC（正文）+ Liu Jian Mao Cao（手写批注）；荧光粉 #ff4fa3 / 荧光黄 #f1ff3b 贴纸。\u003c/li>\n\u003cli>\u003cstrong>组件\u003c/strong>：页面、贴纸（有白边与微微翘起的角）、订书钉 DIY 票、纸胶带；弹层 = 一张贴上去的便签贴纸。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：影印黑有颗粒与不均（fx-grain），贴纸有光泽，纸胶带半透明。\u003c/li>\n\u003cli>\u003cstrong>空间过渡\u003c/strong>：贴纸被撕起露出下一层（详情页）；返回 = 贴回去。管理 = 一张贴纸纸（sticker sheet），审核 = 撕下贴纸贴到人名旁。\u003c/li>\n\u003cli>\u003cstrong>核心动作\u003c/strong>：① 撕贴纸：从角起拖，贴纸翻起露出背胶与下面内容；② 剪票：票上印着剪刀线，拖动沿线剪开（锯齿），副券掉进页脚口袋；③ 影印烧：取消时页面被打火机从一角烧，影印纸发黑卷边，最后剩一页焦边空白，贴纸烧成一个黑点归档。\u003c/li>\n\u003c/ol>\n\u003ch2>C10 胶片 Film Strip\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>构图\u003c/strong>：暗房：横向滚动的 35mm 底片条（齿孔、帧号），每帧一局；帧的曝光程度 = 状态（待审核 = 几乎透明、已预留 = 淡、已确认 = 显影、已出票 = 满格），当前帧在灯箱光下最亮。身份 = 两卷胶片。第一眼：灯箱里的那一帧（局名、时间）；第二眼：旁边的暗帧。\u003c/li>\n\u003cli>\u003cstrong>字体\u003c/strong>：Noto Sans SC 500（局名 20px）+ Space Mono（帧号、时间）；红蜡笔批注用 Long Cang。\u003c/li>\n\u003cli>\u003cstrong>组件\u003c/strong>：帧、底片条、放大镜；票 = 一张相纸（显影出来）；名单 = 接触印样的小格；弹层 = 暗房的红灯面板。\u003c/li>\n\u003cli>\u003cstrong>材质\u003c/strong>：底片的橙棕基底、齿孔透光、灯箱白光、相纸的厚边；红灯模式下的色偏。\u003c/li>\n\u003cli>\u003cstrong>空间过渡\u003c/strong>：帧被点选后从灯箱放大成相纸（像显影：先空白再逐渐显出）；返回 = 相纸缩回帧。管理 = 灯箱 + 红蜡笔（审核 = 圈选）。\u003c/li>\n\u003cli>\u003cstrong>核心动作\u003c/strong>：① 显影出票：相纸从显影盘里升起，影像从无到有逐渐显出（打印的替代形式）；② 剪底片：撕票 = 用裁刀沿帧边剪下副券帧（拖动裁刀）；③ 胶片熔穿：取消时帧受热，从中心起泡、熔穿、边缘卷曲，最后帧框变黑归档。\u003c/li>\n\u003c/ol>\n\u003cp>---\u003c/p>\n\u003ch2>差异矩阵（任意两套 ≥ 4 维不同）\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>构图\u003c/th>\u003cth>字体\u003c/th>\u003cth>组件\u003c/th>\u003cth>材质\u003c/th>\u003cth>过渡\u003c/th>\u003cth>核心动作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>C01\u003c/td>\u003ctd>连续纸带\u003c/td>\u003ctd>Sans + Mono 大时间\u003c/td>\u003ctd>打印段 / 齿孔\u003c/td>\u003ctd>热敏纸 / 墨\u003c/td>\u003ctd>走纸原地展开\u003c/td>\u003ctd>走纸 · 撕 · 焦卷\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C02\u003c/td>\u003ctd>翻牌行\u003c/td>\u003ctd>Unbounded + 粗黑\u003c/td>\u003ctd>翻片 / 磁条卡 / 灯\u003c/td>\u003ctd>金属板 / 塑料\u003c/td>\u003ctd>行翻开成面板\u003c/td>\u003ctd>翻牌 · 过闸 · 过热\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C03\u003c/td>\u003ctd>目录 → 跨页\u003c/td>\u003ctd>宋体大标题 + 页码\u003c/td>\u003ctd>条目 / 跨页 / 撕角券\u003c/td>\u003ctd>铜版纸 / 校对红\u003c/td>\u003ctd>3D 翻页\u003c/td>\u003ctd>翻页 · 撕券 · 烧页\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C04\u003c/td>\u003ctd>纵深玻璃叠\u003c/td>\u003ctd>Sora + 宽字距\u003c/td>\u003ctd>玻璃板 / 全息证\u003c/td>\u003ctd>毛玻璃 / 高光\u003c/td>\u003ctd>景深前移\u003c/td>\u003ctd>景深 · 裂开 · 碎裂\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C05\u003c/td>\u003ctd>裁片平铺\u003c/td>\u003ctd>细宋 + Cormorant\u003c/td>\u003ctd>裁片 / 吊牌 / 粉线\u003c/td>\u003ctd>坯布 / 棉线\u003c/td>\u003ctd>折线翻开\u003c/td>\u003ctd>翻开 · 断线 · 烧焦\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C06\u003c/td>\u003ctd>俯视物件堆\u003c/td>\u003ctd>粗黑 + 手写批注\u003c/td>\u003ctd>票根 / 拍立得 / 便签\u003c/td>\u003ctd>木桌 / 纸胶带\u003c/td>\u003ctd>拿起放大\u003c/td>\u003ctd>拿起 · 撕 · 烟灰缸\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C07\u003c/td>\u003ctd>权重网格\u003c/td>\u003ctd>黑体 + DM Mono\u003c/td>\u003ctd>格 / 通行证格\u003c/td>\u003ctd>平面分层色\u003c/td>\u003ctd>格膨胀分格\u003c/td>\u003ctd>重排 · 刮落 · 脱落\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C08\u003c/td>\u003ctd>时间尺 + 块\u003c/td>\u003ctd>Narrow 刻度 + 黑体\u003c/td>\u003ctd>块 / 抽屉 / 打孔\u003c/td>\u003ctd>刻度压印\u003c/td>\u003ctd>块横向展开\u003c/td>\u003ctd>滑动 · 拖出 · 焦痕\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C09\u003c/td>\u003ctd>zine 页 + 贴纸\u003c/td>\u003ctd>黄油体 + 手写\u003c/td>\u003ctd>页 / 贴纸 / 订书钉票\u003c/td>\u003ctd>影印颗粒 / 荧光\u003c/td>\u003ctd>贴纸撕起\u003c/td>\u003ctd>撕贴纸 · 剪 · 烧黑\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C10\u003c/td>\u003ctd>横向胶片\u003c/td>\u003ctd>黑体 + Space Mono\u003c/td>\u003ctd>帧 / 相纸 / 蜡笔\u003c/td>\u003ctd>底片 / 灯箱\u003c/td>\u003ctd>显影放大\u003c/td>\u003ctd>显影 · 剪 · 熔穿\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>物件 / 数字之分：真实物件启发 C01 C02 C03 C05 C06 C09 C10；原生数字 C04 C07 C08。第一眼鲜明：C02 C04 C09 C10；靠构造与细节成立：C01 C03 C05 C08；介于其间：C06 C07。\u003c/p>","motions":"\u003cp>（本次构建未包含）\u003c/p>","coverage":"\u003cp>（本次构建未包含）\u003c/p>","inventory":"\u003cp>（本次构建未包含）\u003c/p>","limits":"\u003cp>（本次构建未包含）\u003c/p>","mapping":"\u003cp>（本次构建未包含）\u003c/p>"};window.__JU_BUILT="2026-10-10T16:30:03.791Z";</script>

<script>(function () {
  'use strict';
  var SRC = window.__JU_SOURCES, META = window.__JU_META, DOCS = window.__JU_DOCS;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var views = { overview: $('#v-overview'), concept: $('#v-concept'), compare: $('#v-compare'), appendix: $('#v-appendix') };
  var mounts = { preview: {}, stage: {}, compare: {} };
  function mountConcept(kind, code, host, props) {
    var key = kind + ':' + code + ':' + (props && props.preset || '');
    if (mounts[kind][key]) return mounts[kind][key];
    var m = DCMini.mount(host, SRC[code], Object.assign({ panel: kind === 'stage' }, props || {}));
    mounts[kind][key] = m; return m;
  }
  /* ---- tabs ---- */
  function show(view) {
    Object.keys(views).forEach(function (k) { views[k].classList.toggle('on', k === view); });
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('on', t.dataset.view === view); });
    if (view === 'overview') buildOverview(); if (view === 'compare') buildCompare(); if (view === 'appendix') showDoc(currentDoc);
    try { history.replaceState(null, '', '#' + view + (view === 'concept' ? '/' + currentCode : '')); } catch (e) { }
  }
  document.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.view); }); });
  /* ---- overview ---- */
  var ovBuilt = false;
  function buildOverview() {
    if (ovBuilt) return; ovBuilt = true;
    var grid = $('#ov-grid');
    META.forEach(function (c) {
      var card = document.createElement('div'); card.className = 'ov-card';
      card.innerHTML = '<div class="ov-head"><span class="ov-code">' + c.code + '</span><span class="ov-name">' + c.name + '</span></div><p class="ov-line">' + c.line + '</p>' +
        '<div class="ov-phones"><div class="ov-ph"><div class="ph-host" data-preset="joined"></div><span class="ph-label">我参加的</span></div><div class="ov-ph"><div class="ph-host" data-preset="hosted"></div><span class="ph-label">我发起的</span></div></div>' +
        '<div class="ov-foot"><span>' + (c.motions || []).slice(0, 3).map(function (m) { return m.split('：')[0]; }).join(' · ') + '</span><button type="button" class="btn">进入操作</button></div>';
      card.addEventListener('click', function () { openConcept(c.code); });
      grid.appendChild(card);
      card.querySelectorAll('.ph-host').forEach(function (h) { h.classList.add('preview'); mountConcept('preview', c.code, h, { preset: h.dataset.preset, idle: true, panel: false }); });
    });
  }
  /* ---- concept view ---- */
  var currentCode = META[0].code;
  var rail = $('#rail'), stageWrap = $('#stage-wrap');
  META.forEach(function (c) { var b = document.createElement('button'); b.type = 'button'; b.innerHTML = '<span class="c">' + c.code + '</span>' + c.name; b.dataset.code = c.code; b.addEventListener('click', function () { openConcept(c.code); }); rail.appendChild(b); });
  function openConcept(code) {
    currentCode = code;
    rail.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.code === code); });
    var host = stageWrap.querySelector('[data-code="' + code + '"]');
    if (!host) { host = document.createElement('div'); host.className = 'stage-host'; host.dataset.code = code; stageWrap.appendChild(host); mountConcept('stage', code, host, { panel: true }); }
    stageWrap.querySelectorAll('.stage-host').forEach(function (h) { h.classList.toggle('on', h.dataset.code === code); });
    show('concept');
  }
  /* ---- compare ---- */
  var cmpBuilt = false;
  function buildCompare() {
    if (cmpBuilt) return; cmpBuilt = true;
    ['cmp-a', 'cmp-b', 'cmp-c'].forEach(function (id, i) { var sel = $('#' + id); META.forEach(function (c) { var o = document.createElement('option'); o.value = c.code; o.textContent = c.code + ' ' + c.name; sel.appendChild(o); }); if (i < 2 && META[i]) sel.value = META[i].code; });
    var st = $('#cmp-state'); var idx = (window.JU && JU.INDEX) || [];
    var any = null; Object.keys(mounts.stage).some(function (k) { any = mounts.stage[k]; return true; });
    idx.forEach(function (e) { var o = document.createElement('option'); o.value = e.key; o.textContent = e.group + ' · ' + e.label; st.appendChild(o); });
    function stages() { return Array.prototype.slice.call($('#cmp-stages').querySelectorAll('.cmp-host')); }
    function render() {
      var codes = ['cmp-a', 'cmp-b', 'cmp-c'].map(function (id) { return $('#' + id).value; }).filter(Boolean);
      var wrap = $('#cmp-stages'); wrap.innerHTML = '';
      codes.forEach(function (code) { var h = document.createElement('div'); h.className = 'cmp-host' + ($('#cmp-panels').checked ? '' : ' nopanel'); h.dataset.code = code; wrap.appendChild(h); var m = DCMini.mount(h, SRC[code], { panel: $('#cmp-panels').checked }); h.__m = m; });
    }
    ['cmp-a', 'cmp-b', 'cmp-c', 'cmp-panels'].forEach(function (id) { $('#' + id).addEventListener('change', render); });
    $('#cmp-apply').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.jumpTo) i.jumpTo(st.value); }); });
    $('#cmp-reset').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.reset) i.reset(); }); });
    $('#cmp-speed1').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.setSpeed) i.setSpeed(1); }); });
    $('#cmp-speed05').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.setSpeed) i.setSpeed(0.5); }); });
    render();
  }
  /* ---- appendix ---- */
  var currentDoc = 'matrix';
  function showDoc(k) { currentDoc = k; document.querySelectorAll('.apx-tab').forEach(function (t) { t.classList.toggle('on', t.dataset.doc === k); }); $('#apx-doc').innerHTML = DOCS[k] || ''; }
  document.querySelectorAll('.apx-tab').forEach(function (t) { t.addEventListener('click', function () { showDoc(t.dataset.doc); }); });
  /* ---- boot ---- */
  var hash = (location.hash || '').slice(1).split('/');
  if (hash[0] === 'concept' && SRC[hash[1]]) openConcept(hash[1]); else if (hash[0] && views[hash[0]]) show(hash[0]); else show('overview');
  window.JUShell = { openConcept: openConcept, show: show, mounts: mounts };
})();
</script>
