<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JU 我的局 · 十套视觉动效方案</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>:root{--bg:#ececef;--ink:#141416;--muted:#6b6b72;--line:rgba(0,0,0,.1);--paper:#fff;--accent:#4a5ad6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:24px;padding:10px 20px;background:rgba(236,236,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-ju{font:700 20px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.06em}
.brand-t{font-weight:500}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.06);padding:3px;border-radius:10px}
.tab{appearance:none;border:0;background:transparent;padding:6px 14px;border-radius:8px;font:inherit;cursor:pointer;color:var(--muted)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.top-right{margin-left:auto;color:var(--muted);font-size:12px}
main{min-height:calc(100vh - 54px)}
.view{display:none}.view.on{display:block}
.lead{margin:0;padding:18px 24px 6px;color:var(--muted);max-width:1100px}
/* overview */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:18px;padding:16px 24px 40px}
.ov-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s}
.ov-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px -18px rgba(0,0,0,.4)}
.ov-head{display:flex;align-items:baseline;gap:10px}
.ov-code{font:500 11px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--muted)}
.ov-name{font-size:17px;font-weight:600}
.ov-line{color:var(--muted);font-size:12.5px;margin:0}
.ov-phones{display:flex;gap:12px;justify-content:center}
.ov-ph{position:relative;width:195px;height:422px;overflow:hidden;border-radius:19px;background:#000;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.ov-ph .ph-host{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.ov-ph .ph-label{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px;pointer-events:none}
.ov-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.ov-foot .btn{padding:6px 12px}
/* concept view */
.view-concept{display:none;grid-template-columns:200px 1fr}
.view-concept.on{display:grid}
.rail{position:sticky;top:54px;align-self:start;height:calc(100vh - 54px);overflow:auto;padding:14px 10px;border-right:1px solid var(--line);background:rgba(255,255,255,.5)}
.rail button{display:block;width:100%;text-align:left;appearance:none;border:0;background:transparent;padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;color:var(--ink)}
.rail button .c{font:500 10px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--muted);display:block;margin-bottom:2px}
.rail button.on{background:var(--ink);color:#fff}.rail button.on .c{color:#bbb}
.stage-wrap{padding:16px 20px 40px;overflow:auto}
.stage-host{display:none}.stage-host.on{display:block}
/* compare */
.cmp-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.5)}
.cmp-bar label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.cmp-bar select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;max-width:260px}
.sep{width:1px;height:22px;background:var(--line)}
.btn{appearance:none;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cmp-stages{display:flex;gap:20px;padding:20px 24px 40px;overflow:auto;align-items:flex-start}
.cmp-host{flex:0 0 auto}
.cmp-host.nopanel{width:430px;overflow:hidden}
/* appendix */
.apx-nav{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px;border-bottom:1px solid var(--line)}
.apx-tab{appearance:none;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
.apx-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.apx-doc{max-width:1400px;padding:20px 24px 60px;font-size:13.5px}
.apx-doc h1{font-size:22px;margin:18px 0 10px}.apx-doc h2{font-size:18px;margin:26px 0 8px}.apx-doc h3{font-size:15px;margin:20px 0 6px}.apx-doc h4{font-size:14px;margin:16px 0 4px}
.apx-doc table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:12.5px;background:#fff}
.apx-doc th,.apx-doc td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.apx-doc th{background:#f3f3f5}
.apx-doc code{font-family:"DM Mono",ui-monospace,monospace;font-size:12px;background:rgba(0,0,0,.05);padding:1px 4px;border-radius:4px}
.apx-doc pre{background:#fff;border:1px solid var(--line);padding:10px;border-radius:8px;overflow:auto;font-size:12px}
.apx-doc a{color:var(--accent)}
.apx-doc p{margin:6px 0}
@media (max-width:900px){.view-concept.on{display:block}.rail{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}.rail button{width:auto}.top{gap:10px;flex-wrap:wrap}.top-right{display:none}}
</style>

      <button type="button" class="apx-tab" data-doc="mapping">参考映射</button>
      <button type="button" class="apx-tab" data-doc="ledger">研究台账</button>

    Object.keys(views).forEach(function (k) { views[k].classList.toggle('on', k === view); });
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('on', t.dataset.view === view); });
    if (view === 'overview') buildOverview(); if (view === 'compare') buildCompare(); if (view === 'appendix') showDoc(currentDoc);
    try { history.replaceState(null, '', '#' + view + (view === 'concept' ? '/' + currentCode : '')); } catch (e) { }
  }
  document.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.view); }); });
  /* ---- overview ---- */
  var ovBuilt = false;
  function buildOverview() {
    if (ovBuilt) return; ovBuilt = true;
    var grid = $('#ov-grid');
    META.forEach(function (c) {
      var card = document.createElement('div'); card.className = 'ov-card';
      card.innerHTML = '<div class="ov-head"><span class="ov-code">' + c.code + '</span><span class="ov-name">' + c.name + '</span></div><p class="ov-line">' + c.line + '</p>' +
        '<div class="ov-phones"><div class="ov-ph"><div class="ph-host" data-preset="joined"></div><span class="ph-label">我参加的</span></div><div class="ov-ph"><div class="ph-host" data-preset="hosted"></div><span class="ph-label">我发起的</span></div></div>' +
        '<div class="ov-foot"><span>' + (c.motions || []).slice(0, 3).map(function (m) { return m.split('：')[0]; }).join(' · ') + '</span><button type="button" class="btn">进入操作</button></div>';
      card.addEventListener('click', function () { openConcept(c.code); });
      grid.appendChild(card);
      card.querySelectorAll('.ph-host').forEach(function (h) { mountConcept('preview', c.code, h, { preset: h.dataset.preset, idle: true, panel: false }); });
    });
  }
  /* ---- concept view ---- */
  var currentCode = META[0].code;
  var rail = $('#rail'), stageWrap = $('#stage-wrap');
  META.forEach(function (c) { var b = document.createElement('button'); b.type = 'button'; b.innerHTML = '<span class="c">' + c.code + '</span>' + c.name; b.dataset.code = c.code; b.addEventListener('click', function () { openConcept(c.code); }); rail.appendChild(b); });
  function openConcept(code) {
    currentCode = code;
    rail.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.code === code); });
    var host = stageWrap.querySelector('[data-code="' + code + '"]');
    if (!host) { host = document.createElement('div'); host.className = 'stage-host'; host.dataset.code = code; stageWrap.appendChild(host); mountConcept('stage', code, host, { panel: true }); }
    stageWrap.querySelectorAll('.stage-host').forEach(function (h) { h.classList.toggle('on', h.dataset.code === code); });
    show('concept');
  }
  /* ---- compare ---- */
  var cmpBuilt = false;
  function buildCompare() {
    if (cmpBuilt) return; cmpBuilt = true;
    ['cmp-a', 'cmp-b', 'cmp-c'].forEach(function (id, i) { var sel = $('#' + id); META.forEach(function (c) { var o = document.createElement('option'); o.value = c.code; o.textContent = c.code + ' ' + c.name; sel.appendChild(o); }); if (i < 2 && META[i]) sel.value = META[i].code; });
    var st = $('#cmp-state'); var idx = (window.JU && JU.INDEX) || [];
    var any = null; Object.keys(mounts.stage).some(function (k) { any = mounts.stage[k]; return true; });
    idx.forEach(function (e) { var o = document.createElement('option'); o.value = e.key; o.textContent = e.group + ' · ' + e.label; st.appendChild(o); });
    function stages() { return Array.prototype.slice.call($('#cmp-stages').querySelectorAll('.cmp-host')); }
    function render() {
      var codes = ['cmp-a', 'cmp-b', 'cmp-c'].map(function (id) { return $('#' + id).value; }).filter(Boolean);
      var wrap = $('#cmp-stages'); wrap.innerHTML = '';
      codes.forEach(function (code) { var h = document.createElement('div'); h.className = 'cmp-host' + ($('#cmp-panels').checked ? '' : ' nopanel'); h.dataset.code = code; wrap.appendChild(h); var m = DCMini.mount(h, SRC[code], { panel: $('#cmp-panels').checked }); h.__m = m; });
    }
    ['cmp-a', 'cmp-b', 'cmp-c', 'cmp-panels'].forEach(function (id) { $('#' + id).addEventListener('change', render); });
    $('#cmp-apply').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.jumpTo) i.jumpTo(st.value); }); });
    $('#cmp-reset').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.reset) i.reset(); }); });
    $('#cmp-speed1').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.setSpeed) i.setSpeed(1); }); });
    $('#cmp-speed05').addEventListener('click', function () { stages().forEach(function (h) { var i = h.__m && h.__m.instance; if (i && i.setSpeed) i.setSpeed(0.5); }); });
    render();
  }
  /* ---- appendix ---- */
  var currentDoc = 'matrix';
  function showDoc(k) { currentDoc = k; document.querySelectorAll('.apx-tab').forEach(function (t) { t.classList.toggle('on', t.dataset.doc === k); }); $('#apx-doc').innerHTML = DOCS[k] || ''; }
  document.querySelectorAll('.apx-tab').forEach(function (t) { t.addEventListener('click', function () { showDoc(t.dataset.doc); }); });
  /* ---- boot ---- */
  var hash = (location.hash || '').slice(1).split('/');
  if (hash[0] === 'concept' && SRC[hash[1]]) openConcept(hash[1]); else if (hash[0] && views[hash[0]]) show(hash[0]); else show('overview');
  window.JUShell = { openConcept: openConcept, show: show, mounts: mounts };
})();
</script>
</body>
</html>
