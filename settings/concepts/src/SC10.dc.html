<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SC10 吊牌</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
body{margin:0}
/* @panel-css */
/* ============ SC10 吊牌 · card-stock hang tags on rails, cotton string, metal eyelets ============ */
.app{position:absolute;inset:0;overflow:hidden;font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;color:var(--ink);--k:1;
  --serif:"Noto Serif SC","Songti SC",serif;--num:"Instrument Serif","Times New Roman",serif;
  --ink:#2a2622;--mute:#776d60;--line:rgba(60,45,25,.16);--red:#b8322a;--green:#3d7a4e;--accent:#3b5b8c;
  --stock:#f7f2e8;--stock2:#efe8da;--edge:#d6ccb9;--edge2:#bfb39d;--wall:#e4dcd7;--light:#fffdf6;--string:#ddd2bf;--string2:#b9ab92;--brass:#b08d57;--brass2:#6e5530;--steel:#8f8a83;--steel2:#4b4844;
  --glow:none;--shadow:70,50,25;-webkit-font-smoothing:antialiased}
.app.rm *,.app.rm *::before,.app.rm *::after,.app.rm-user *,.app.rm-user *::before,.app.rm-user *::after{transition-duration:1ms!important;animation-duration:1ms!important;animation-delay:0ms!important}
/* three card-stock tints = the three R3 backgrounds in this material (stock + wall + ink) */
.app[data-skin="cotton"]{--stock:#f8f3ea;--stock2:#f0e9dc;--edge:#d9cfbe;--edge2:#c2b6a0;--wall:#e6dfdd;--glow:radial-gradient(120% 70% at 12% 0%,rgba(251,225,236,.9),transparent 60%),radial-gradient(90% 55% at 100% 100%,rgba(211,237,243,.85),transparent 62%);--ink:#263936;--mute:#5f6d5e;--accent:#4a6a5a}
.app[data-skin="halo"]{--stock:#fcf7ee;--stock2:#f3ecdf;--edge:#dfd3c0;--edge2:#c7b89f;--wall:#eee4d8;--glow:radial-gradient(70% 48% at 78% 6%,rgba(255,120,40,.38),transparent 62%),radial-gradient(60% 42% at 8% 100%,rgba(208,188,225,.5),transparent 60%);--ink:#362e3c;--mute:#6d5e6c;--accent:#69516c}
.app[data-skin="sunset"]{--stock:#f3e4cc;--stock2:#e9d6b8;--edge:#cdb892;--edge2:#ab9470;--wall:#e8d8c8;--glow:linear-gradient(180deg,rgba(255,122,51,.28) 0%,rgba(255,197,61,.18) 48%,rgba(51,160,255,.26) 100%);--ink:#3b352d;--mute:#6f5f4d;--accent:#8a5a3a;--light:#fff6e4}
/* ---- wall ---- */
.wall{position:absolute;inset:0;background:var(--wall);transition:background calc(650ms * var(--k,1)) cubic-bezier(.22,1,.36,1),transform calc(420ms * var(--k,1)) cubic-bezier(.2,.8,.2,1),filter calc(420ms * var(--k,1)) ease}
.wall::before{content:"";position:absolute;inset:0;background:var(--glow);transition:opacity calc(650ms * var(--k,1)) ease;pointer-events:none}
.wall::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 22%,rgba(0,0,0,0) 80%,rgba(0,0,0,.06));pointer-events:none}
.wall.dim{transform:scale(.985);filter:brightness(.86) saturate(.92)}
.topline{position:absolute;left:18px;right:18px;top:22px;display:flex;align-items:baseline;justify-content:space-between;font-family:var(--serif);font-weight:500;font-size:13px;letter-spacing:.14em;color:var(--mute)}
.topline b{font-weight:600;color:var(--ink);font-size:15px;letter-spacing:.2em}
.topline .n{font-family:var(--num);font-size:13px;letter-spacing:.04em}
/* ---- rails ---- */
.rail{position:absolute;left:14px;right:14px;height:5px;border-radius:3px;background:linear-gradient(180deg,#cfc9bf 0%,#9d968b 45%,#6f6a62 100%);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 2px 2px rgba(var(--shadow),.25),0 6px 8px -5px rgba(var(--shadow),.5)}
.rail::before,.rail::after{content:"";position:absolute;top:-4px;width:9px;height:13px;border-radius:2px;background:linear-gradient(180deg,#b9b2a7,#7a746b);box-shadow:0 1px 1px rgba(0,0,0,.25)}
.rail::before{left:-3px}.rail::after{right:-3px}
.rail.spring{animation:sc10-railspring calc(520ms * var(--k,1)) cubic-bezier(.2,.9,.3,1.04)}
@keyframes sc10-railspring{0%{transform:translateY(0)}30%{transform:translateY(-2.5px)}60%{transform:translateY(1.2px)}100%{transform:translateY(0)}}
.raillab{position:absolute;left:18px;font-family:var(--serif);font-weight:500;font-size:11px;letter-spacing:.12em;color:var(--mute);appearance:none;border:0;background:transparent;padding:0;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.raillab .n{font-family:var(--num);font-size:12px;letter-spacing:0;color:var(--ink)}
.raillab .more{font-size:10px;letter-spacing:.06em;color:var(--mute);border-bottom:1px solid var(--line)}
/* ---- hanging unit: string + tag, pivot at the rail hook ---- */
.hang{position:absolute;transform-origin:50% 0;transition:transform calc(380ms * var(--k,1)) cubic-bezier(.2,.9,.3,1.04),opacity calc(300ms * var(--k,1)) ease;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.hang.pulling{transition:none}
.hang.swing{animation:sc10-swing calc(1100ms * var(--k,1)) cubic-bezier(.2,.6,.3,1) both}
.hang.swing .tag{animation:sc10-swing-lag calc(1100ms * var(--k,1)) cubic-bezier(.2,.6,.3,1) both}
@keyframes sc10-swing{0%{transform:rotate(0)}16%{transform:rotate(-5deg)}46%{transform:rotate(3.4deg)}74%{transform:rotate(-1.4deg)}100%{transform:rotate(0)}}
@keyframes sc10-swing-lag{0%{transform:rotate(0)}24%{transform:rotate(2.6deg)}54%{transform:rotate(-1.9deg)}82%{transform:rotate(.7deg)}100%{transform:rotate(0)}}
.hang.hung{animation:sc10-hung calc(1100ms * var(--k,1)) cubic-bezier(.2,.6,.3,1) both}
.hang.hung .tag{animation:sc10-swing-lag calc(1100ms * var(--k,1)) cubic-bezier(.2,.6,.3,1) both}
@keyframes sc10-hung{0%{transform:translateY(-26px) rotate(-7deg);opacity:0}14%{opacity:1}22%{transform:translateY(0) rotate(5deg)}50%{transform:rotate(-3.2deg)}76%{transform:rotate(1.3deg)}100%{transform:translateY(0) rotate(0)}}
.hang.ghost{opacity:0;pointer-events:none}
.str{position:relative;display:block;width:100%;overflow:visible}
.str path{fill:none;stroke:var(--string);stroke-width:1.7;stroke-linecap:round;transition:stroke calc(160ms * var(--k,1)) ease}
.str path.sh{stroke:rgba(var(--shadow),.22);stroke-width:2.4;transform:translate(.6px,1px)}
.hang.over .str path{stroke:var(--red)}
.scis{position:absolute;left:50%;top:0;width:22px;height:22px;margin-left:-11px;color:var(--red);opacity:0;transform:scale(.4) rotate(-20deg);transition:transform calc(220ms * var(--k,1)) cubic-bezier(.18,1.5,.36,1),opacity calc(160ms * var(--k,1)) ease;pointer-events:none;z-index:4}
.hang.over .scis{opacity:1;transform:scale(1) rotate(0)}
.scis svg{width:22px;height:22px;display:block}
/* ---- the tag ---- */
.tag{position:relative;background:var(--stock);border-radius:3px;transform-origin:50% 9px;box-sizing:border-box;cursor:pointer;color:var(--ink);text-align:left;appearance:none;border:0;padding:0;font:inherit;display:block;width:100%;
  box-shadow:0 1px 0 var(--edge),0 2px 0 var(--edge2),0 1px 1px rgba(var(--shadow),.08),0 10px 14px -9px rgba(var(--shadow),.6);
  transition:transform calc(380ms * var(--k,1)) cubic-bezier(.2,.9,.3,1.04),box-shadow calc(380ms * var(--k,1)) ease}
.tag::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 26%,rgba(0,0,0,0) 84%,rgba(0,0,0,.035)),repeating-linear-gradient(93deg,rgba(0,0,0,.018) 0 2px,transparent 2px 5px)}
.tag.flat{cursor:default}
.hang.pulling .tag{transition:none;box-shadow:0 1px 0 var(--edge),0 2px 0 var(--edge2),0 2px 2px rgba(var(--shadow),.1),0 24px 30px -14px rgba(var(--shadow),.75)}
.eye{position:absolute;left:50%;top:5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e8d3a4 0,#c7a76a 30%,#8f7142 62%,#5b4322 100%);box-shadow:0 1px 1px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.25);z-index:2}
.eye::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--wall);box-shadow:inset 0 1px 2px rgba(0,0,0,.55)}
.eye.steel{background:radial-gradient(circle at 40% 35%,#f0eeea 0,#b8b4ad 30%,#75716a 62%,#3f3c38 100%)}
.selv{position:absolute;font-family:var(--num);font-size:7.5px;letter-spacing:.22em;color:rgba(var(--shadow),.42);white-space:nowrap;overflow:hidden;pointer-events:none;line-height:1}
.selv.r{right:2px;top:26px;bottom:8px;width:9px;writing-mode:vertical-rl;text-orientation:mixed}
.selv.b{left:10px;right:10px;bottom:3px;height:9px;text-align:center}
.vname{font-family:var(--serif);font-weight:500;writing-mode:vertical-rl;text-orientation:mixed;line-height:1.15;letter-spacing:.08em;color:var(--ink)}
.vname.sec{font-size:13px;letter-spacing:.14em;color:var(--mute)}
/* big 「我」tag */
.tag.me{height:228px;padding:26px 14px 12px 14px}
.tag.me .who{position:absolute;left:14px;top:30px;bottom:88px;font-size:32px;letter-spacing:.06em;line-height:1.1;overflow:hidden}
.tag.me .who.long{font-size:20px;letter-spacing:.04em;line-height:1.12;bottom:96px}
.tag.me .sec{position:absolute;right:14px;top:28px;font-size:12px}
.tag.me .vals{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mute);line-height:1.35}
.tag.me .vals b{font-weight:500;color:var(--ink);font-family:var(--num);font-size:14px;letter-spacing:.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.me .vals b.cn{font-family:inherit;font-size:13px}
.tag.me .vals .st{font-size:10.5px;color:var(--mute)}
.tag.me .vals .st.ok{color:var(--green)}.tag.me .vals .st.warn{color:var(--red)}
/* medium tags (记录 / 举报) and preference tags */
.tag.mid{height:132px;padding:24px 10px 10px 10px}
.tag.mid .sec{position:absolute;left:10px;top:26px;bottom:12px;font-size:15px;letter-spacing:.16em}
.tag.mid .val{position:absolute;left:34px;right:10px;top:28px;display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mute);line-height:1.35}
.tag.mid .val b{font-family:var(--num);font-size:24px;line-height:1;color:var(--ink);font-weight:400;letter-spacing:.01em}
.tag.mid .val b small{font-family:inherit;font-size:11.5px;color:var(--mute);margin-left:2px}
.tag.mid .val .cur{font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);line-height:1.3}
.tag.mid .val .warn{color:var(--red);font-weight:500}
.tag.mid .val .ok{color:var(--green)}
.tag.pref{height:116px;padding:24px 8px 8px}
.tag.pref .sec{position:absolute;left:8px;top:24px;bottom:10px;font-size:14px;letter-spacing:.14em}
.tag.pref .val{position:absolute;left:30px;right:8px;top:30px;bottom:8px;display:flex;flex-direction:column;justify-content:flex-start;gap:3px;font-size:11px;color:var(--mute);line-height:1.35}
.tag.pref .val b{font-size:14px;font-weight:500;color:var(--ink);line-height:1.3;font-family:inherit}
.tag.pref .val b.num{font-family:var(--num);font-size:22px;font-weight:400;line-height:1}
.tag.pref .val b.num small{font-family:"Noto Sans SC",sans-serif;font-size:11px;color:var(--mute)}
.tag.pref .val .warn{color:var(--red)}
/* small event tags (favorites rail) */
.tag.ev{height:126px;padding:22px 8px 12px}
.tag.ev .t{font-size:11.5px;font-weight:500;line-height:1.35;color:var(--ink);max-height:47px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;text-wrap:balance}
.tag.ev .d{position:absolute;left:8px;right:8px;bottom:14px;font-family:var(--num);font-size:12px;color:var(--mute);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.ev .d i{font-style:normal;font-family:"Noto Sans SC",sans-serif;font-size:10px;letter-spacing:.06em}
.tag.ev .d .city{font-family:"Noto Sans SC",sans-serif;font-size:10px}
.tag.ev .st{position:absolute;right:6px;top:6px;font-size:9px;letter-spacing:.06em;padding:1px 4px;border-radius:2px;color:var(--green);background:rgba(61,122,78,.1)}
.tag.ev .st.off{color:var(--mute);background:rgba(0,0,0,.06)}
.tag.ev .rel{position:absolute;left:8px;bottom:3px;font-size:9px;color:var(--accent);letter-spacing:.04em;white-space:nowrap;overflow:hidden;max-width:calc(100% - 16px)}
/* bottom rail small tags */
.tag.sm{height:84px;padding:20px 6px 6px}
.tag.sm .sec{position:absolute;left:50%;top:22px;bottom:8px;margin-left:-8px;font-size:15px;letter-spacing:.2em;color:var(--ink)}
.tag.sm .dot{position:absolute;right:6px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--red)}
/* empty rail note */
.railnote{position:absolute;font-size:11.5px;color:var(--mute);line-height:1.5;padding:8px 10px;border:1px dashed rgba(var(--shadow),.3);border-radius:3px;background:rgba(255,255,255,.25)}
.railnote b{display:block;font-family:var(--serif);font-weight:500;color:var(--ink);font-size:12.5px;margin-bottom:2px}
.favrail{position:absolute;left:0;right:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.favrail::-webkit-scrollbar{display:none}
.favrail .lane{position:relative;height:100%}
/* ---- navigation ledge ---- */
.ledge{position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(180deg,#d8d1c6,#bdb4a6);box-shadow:0 -1px 0 rgba(255,255,255,.55),0 -8px 14px -10px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:space-around;padding:0 8px 6px;box-sizing:border-box;z-index:5}
.ledge button{appearance:none;border:0;background:transparent;font:inherit;font-size:12px;color:#5a5347;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px;min-width:64px;cursor:pointer;letter-spacing:.06em}
.ledge button .hook{width:14px;height:14px;border-radius:0 0 7px 7px;border:2px solid #857c6e;border-top:0;box-sizing:border-box;opacity:.55}
.ledge button.on{color:var(--ink);font-weight:500}
.ledge button.on .hook{border-color:var(--red);opacity:1;background:rgba(184,50,42,.12)}
.ledge button.inert{opacity:.6}
/* ---- opened page = the pulled tag, enlarged, still on its string ---- */
.dimmer{position:absolute;inset:0;background:rgba(40,28,12,0);transition:background calc(380ms * var(--k,1)) ease;z-index:10}
.dimmer.in{background:rgba(40,28,12,.34)}
.sheet{position:absolute;z-index:11;background:var(--stock);border-radius:4px;overflow:visible;display:flex;flex-direction:column;box-sizing:border-box;
  box-shadow:0 1px 0 var(--edge),0 3px 0 var(--edge2),0 2px 2px rgba(var(--shadow),.12),0 34px 54px -26px rgba(var(--shadow),.8);
  transition:left calc(440ms * var(--k,1)) cubic-bezier(.2,.9,.3,1.02),top calc(440ms * var(--k,1)) cubic-bezier(.2,.9,.3,1.02),width calc(440ms * var(--k,1)) cubic-bezier(.2,.9,.3,1.02),height calc(440ms * var(--k,1)) cubic-bezier(.2,.9,.3,1.02),transform calc(440ms * var(--k,1)) cubic-bezier(.2,.9,.3,1.02),opacity calc(240ms * var(--k,1)) ease}
.sheet::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 14%,rgba(0,0,0,0) 90%,rgba(0,0,0,.03)),repeating-linear-gradient(93deg,rgba(0,0,0,.016) 0 2px,transparent 2px 5px)}
.sheet.in{left:14px;top:40px;width:362px;height:732px;transform:rotate(0)}
.sheet.in.half{top:396px;height:376px}
.sheet.out{opacity:.98}
.sheet .eye{top:7px;z-index:12}
.sheet .selv.r{top:30px;bottom:14px}
.sheetstr{position:absolute;left:50%;top:-42px;width:30px;height:50px;margin-left:-15px;overflow:visible;pointer-events:none}
.sheetstr path{fill:none;stroke:var(--string);stroke-width:1.8;stroke-linecap:round}
.sheet.in.half .sheetstr{top:-60px;height:68px}
.carry{position:absolute;left:0;top:0;right:0;bottom:0;padding:22px 14px 12px;opacity:1;transition:opacity calc(160ms * var(--k,1)) ease;pointer-events:none;z-index:3;overflow:hidden;border-radius:inherit}
.sheet.in .carry{opacity:0;transition-delay:calc(60ms * var(--k,1))}
.carry .cv{position:absolute;left:14px;top:30px;bottom:14px;font-size:30px;letter-spacing:.06em}
.carry .cv.mid{font-size:16px;letter-spacing:.16em;color:var(--mute)}
.carry .ch{position:absolute;left:46px;right:12px;top:30px;font-size:14px;font-weight:500;line-height:1.35;color:var(--ink)}
.carry .ch.sm{left:14px;right:14px;top:96px;font-size:12.5px;color:var(--mute);font-weight:400}
.shead{display:flex;align-items:center;gap:10px;padding:26px 16px 0 14px;flex:0 0 auto;opacity:0;transition:opacity calc(240ms * var(--k,1)) ease calc(200ms * var(--k,1))}
.sheet.in .shead{opacity:1}
.shead h2{margin:0;font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:.06em;flex:1 1 auto;line-height:1.3}
.shead .sub{font-size:11.5px;color:var(--mute);letter-spacing:.04em;white-space:nowrap}
.backbtn{appearance:none;border:0;background:transparent;font:inherit;display:flex;align-items:center;gap:4px;padding:6px 8px 6px 2px;cursor:pointer;color:var(--ink);flex:0 0 auto;font-size:12.5px;letter-spacing:.08em;border-radius:6px}
.backbtn:active{transform:translateY(1px)}
.backbtn svg{width:18px;height:18px}
.sbody{flex:1 1 auto;min-height:0;overflow:auto;padding:14px 16px 24px 16px;box-sizing:border-box;opacity:0;transition:opacity calc(260ms * var(--k,1)) ease calc(240ms * var(--k,1));scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.sheet.in .sbody{opacity:1}
.pg{animation:sc10-pushin calc(320ms * var(--k,1)) cubic-bezier(.2,.9,.3,1) both}
.pg.pop{animation-name:sc10-popin}
@keyframes sc10-pushin{from{transform:translateX(42px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes sc10-popin{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}
/* ---- printed content primitives ---- */
.lead{font-size:13px;color:var(--mute);line-height:1.65;margin:0 0 12px}
.note{font-size:12px;color:var(--mute);line-height:1.6;margin:8px 0 0}
.grp{margin:0 0 16px}
.grp h4{margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:12px;color:var(--mute);letter-spacing:.16em;display:flex;align-items:baseline;gap:6px}
.grp h4 .n{font-family:var(--num);font-size:13px;letter-spacing:0;color:var(--ink)}
.field{display:grid;grid-template-columns:22px 1fr;gap:0 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.field .l{font-family:var(--serif);font-weight:500;font-size:12px;letter-spacing:.12em;color:var(--mute);writing-mode:vertical-rl;text-orientation:mixed;line-height:1.2;padding-top:2px}
.field .v{font-size:16px;font-weight:500;word-break:break-all;line-height:1.4;padding-top:1px}
.field .v.num{font-family:var(--num);font-size:17px;font-weight:400;letter-spacing:.01em}
.field .v.sm{font-size:14px}
.field .v .hint{display:block;font-size:11.5px;color:var(--mute);font-weight:400;margin-top:3px;line-height:1.5}
.mark{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:2px;background:rgba(61,122,78,.12);color:var(--green);margin-left:6px;vertical-align:2px;letter-spacing:.04em;font-family:"Noto Sans SC",sans-serif;font-weight:500}
.mark.off{background:rgba(0,0,0,.07);color:var(--mute)}
.mark.warn{background:rgba(184,50,42,.12);color:var(--red)}
.btn{appearance:none;border:0;font:inherit;font-size:14px;font-weight:500;padding:0 16px;height:44px;border-radius:3px;background:var(--ink);color:var(--stock);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.06em;box-shadow:0 1px 0 rgba(0,0,0,.25),0 8px 12px -8px rgba(0,0,0,.5)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(var(--shadow),.3)}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.42;cursor:default;box-shadow:none}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.sm{height:36px;font-size:13px;padding:0 12px}
.btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
.inp{display:flex;flex-direction:column;gap:6px;padding:6px 0 10px}

/* reprint: a roller sweeps the face while the new values appear */
.reprint{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:4;overflow:hidden;border-radius:inherit}
.reprint::before{content:"";position:absolute;left:-10%;right:-10%;top:-40px;height:40px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(var(--shadow),.14) 48%,rgba(255,255,255,.55) 52%,rgba(255,255,255,0));animation:sc10-roll calc(640ms * var(--k,1)) cubic-bezier(.4,0,.3,1) both}

/* ---- punch toggle: hole (on) vs patch sticker (off) ---- */
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow .tx{flex:1 1 auto;min-width:0}
.trow .tx b{display:block;font-size:14.5px;font-weight:500}
.trow .tx span{display:block;font-size:11.5px;color:var(--mute);line-height:1.45;margin-top:2px}
.punch{appearance:none;border:0;background:transparent;padding:0;width:66px;height:44px;position:relative;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:6px;font:inherit}
.punch .spot{position:relative;width:26px;height:26px;flex:0 0 auto}
.punch .hole{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--light);box-shadow:inset 0 1.5px 3px rgba(0,0,0,.42),inset 0 -1px 0 rgba(255,255,255,.7),0 0 0 1px rgba(var(--shadow),.18),0 0 8px 1px rgba(255,255,255,.65);transform:scale(1);transition:transform calc(200ms * var(--k,1)) cubic-bezier(.2,.9,.3,1.04)}
.punch.off .hole{transform:scale(.001)}
.punch .patch{position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:2px;background:linear-gradient(180deg,#e2d2ad,#cbb98f);box-shadow:0 1px 1px rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.35);transform:rotate(7deg) scale(1);opacity:1;transition:transform calc(260ms * var(--k,1)) cubic-bezier(.18,1.4,.36,1),opacity calc(160ms * var(--k,1)) ease;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 1px,transparent 1px 4px),linear-gradient(180deg,#e2d2ad,#cbb98f)}
.punch.on .patch{opacity:0;transform:rotate(-10deg) scale(.6) translateY(-6px)}
.punch .die{position:absolute;left:-2px;top:-2px;width:30px;height:30px;border-radius:50%;border:3px solid var(--steel2);box-sizing:border-box;opacity:0;transform:scale(1.7);pointer-events:none}
.punch.punching .die{animation:sc10-die calc(340ms * var(--k,1)) cubic-bezier(.3,.9,.3,1) both}
@keyframes sc10-die{0%{opacity:0;transform:scale(1.7)}35%{opacity:.85;transform:scale(1)}60%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.punch .chad{position:absolute;left:5px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--stock2);opacity:0;pointer-events:none;box-shadow:0 1px 1px rgba(0,0,0,.2)}
.punch.punching .chad{animation:sc10-chad calc(520ms * var(--k,1)) ease-in calc(120ms * var(--k,1)) both}
@keyframes sc10-chad{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(6px,26px) rotate(70deg)}}
.punch.patching .patch{animation:sc10-patch calc(300ms * var(--k,1)) cubic-bezier(.18,1.4,.36,1) both}
@keyframes sc10-patch{0%{opacity:0;transform:rotate(14deg) scale(1.3) translateY(-10px)}100%{opacity:1;transform:rotate(7deg) scale(1) translateY(0)}}
.punch .lab{font-family:var(--serif);font-weight:500;font-size:12px;letter-spacing:.14em;color:var(--mute);width:16px;text-align:right}
.punch.on .lab{color:var(--ink)}
.punch:disabled{opacity:.45;cursor:default}
/* ---- selection: hang one of several small tags on a mini rail ---- */
.minirail{position:relative;padding-top:4px}
.minirail .rail{position:relative;left:0;right:0;margin:0 2px}
.minirail .rail::before,.minirail .rail::after{display:none}
.opts{display:flex;gap:10px;flex-wrap:wrap;padding:0 2px;margin-top:0}
.opt{appearance:none;border:0;background:transparent;padding:0;font:inherit;width:calc((100% - 20px) / 3);flex:0 0 auto;position:relative;cursor:pointer;color:var(--ink);text-align:left;height:120px}
.opt .ostr{position:absolute;left:50%;top:0;width:20px;height:20px;margin-left:-10px;overflow:visible;opacity:0;transition:opacity calc(200ms * var(--k,1)) ease}
.opt .ostr path{fill:none;stroke:var(--string);stroke-width:1.6;stroke-linecap:round}
.opt .otag{position:absolute;left:0;right:0;top:44px;height:70px;background:var(--stock2);border-radius:3px;box-shadow:0 1px 0 var(--edge),0 1px 1px rgba(var(--shadow),.1);padding:16px 8px 6px;box-sizing:border-box;transition:transform calc(380ms * var(--k,1)) cubic-bezier(.2,.9,.3,1.04),background calc(300ms * var(--k,1)) ease,box-shadow calc(300ms * var(--k,1)) ease;transform-origin:50% 8px}

.opt .otag small{display:block;font-family:var(--num);font-size:11px;color:var(--mute);margin-top:2px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt.hung .ostr{opacity:1}
.opt.hung .otag{transform:translateY(-24px);background:var(--stock);box-shadow:0 1px 0 var(--edge),0 2px 0 var(--edge2),0 10px 14px -9px rgba(var(--shadow),.6)}
.opt.hung.swing .otag{animation:sc10-optswing calc(900ms * var(--k,1)) cubic-bezier(.2,.6,.3,1) both}
@keyframes sc10-optswing{0%{transform:translateY(-24px) rotate(0)}18%{transform:translateY(-24px) rotate(-4deg)}50%{transform:translateY(-24px) rotate(2.6deg)}78%{transform:translateY(-24px) rotate(-1deg)}100%{transform:translateY(-24px) rotate(0)}}
.opt.sw .otag{padding:0;overflow:hidden}
.opt.sw .otag .face{position:absolute;inset:0;padding:16px 8px 6px;box-sizing:border-box}
